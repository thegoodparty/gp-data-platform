[project]
name = "anthropic-analytics-loader"
version = "0.1.0"
description = "Loads Claude Enterprise Analytics API data (usage, cost, adoption) into Delta tables for the Sigma Claude spend dashboard."
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32",
    "databricks-sdk>=0.128.0",
    "pydantic>=2.8",
    "typer>=0.27.1",
    "structlog>=26.1.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.14",
    "ruff>=0.16.3",
    "ty==0.0.75",
]

[project.scripts]
anthropic-analytics-loader = "loader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loader"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
