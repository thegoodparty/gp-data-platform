version: 2

seeds:
  - name: fips_codes
    description: >
      Federal Information Processing System (FIPS) Codes for States and Counties

      FIPS codes are numbers which uniquely identify geographic areas.  The number of
      digits in FIPS codes vary depending on the level of geography.  State-level FIPS
      codes have two digits, county-level FIPS codes have five digits of which the
      first two are the FIPS code of the state to which the county belongs.  When
      using the list below to look up county FIPS codes, it is advisable to first look
      up the FIPS code for the state to which the county belongs.  This will help you
      identify the right section of the list while scrolling down, which can be
      important since there are over 3000 counties and county-equivalents (e.g.
      independent cities, parishes, boroughs) in the United States.

      see https://transition.fcc.gov/oet/info/maps/census/fips/fips.txt
    columns:
      - name: fips_code
        tests:
          - unique
          - not_null
      - name: place_name
        tests:
          - not_null
          - dbt_expectations.expect_column_distinct_values_to_equal_set:
              arguments:
                value_set: "{{ get_us_states_list(include_DC=true, include_US=false, include_territories=false) }}"
              row_condition: "level = 'state'"

      - name: level
        tests:
          - not_null
    tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["fips_code", "place_name"]

  - name: clean_states
    description: "Clean state names, postal codes, and FIPS codes for US states and territories"
    columns:
      - name: state_raw
        description: "Raw state name"
        tests:
          - not_null
          - unique
      - name: state_cleaned_postal_code
        description: "Clean state name"
        tests:
        - dbt_expectations.expect_column_distinct_values_to_equal_set:
            arguments:
              value_set: "{{ get_us_states_list(include_DC=true, include_US=false, include_territories=true) }}"
  - name: us_states
    description: "One row per U.S. state/territory mapping postal code to human-readable name"
    columns:
      - name: state_postal_code
        description: "2-letter state postal code"
        data_tests:
          - unique
          - not_null
          - is_state_abbreviation
      - name: state_name
        description: "Human-readable state name"
        data_tests:
          - unique
          - not_null

  - name: nicknames
    description: >
      Mapping of given names to their common nicknames/aliases.
      Used by int__er_prematch_candidacy_stages to build first_name_aliases arrays
      for Splink entity resolution nickname matching.
    columns:
      - name: name1
        description: The canonical/full given name
        data_tests:
          - not_null
      - name: relationship
        description: Relationship type (always 'has_nickname')
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - has_nickname
      - name: name2
        description: The nickname/alias for name1
        data_tests:
          - not_null

  - name: l2_manual_district_assignments
    description: >
      Assigns voters to a district L2 does not carry, keyed on a sparse match
      tuple where a null column means "do not constrain". Applied by
      int__l2_nationwide_uniform, the view over
      int__l2_nationwide_uniform_raw_districts that coalesces the
      assignment into the named district column so L2 stays authoritative
      wherever it supplies a value. Editing this seed does not bump voter
      loaded_at, so the loaded_at-incremental consumers
      (int__zip_code_to_l2_district, m_election_api__district,
      int__l2_district_aggregations) need a --full-refresh afterwards;
      assert_manual_district_assignments_resolve.sql fails until they get one.
      int__l2_district_universe is a plain table rather than an incremental, so
      it needs an ordinary rebuild instead, and the l2_br_match_overrides tuple
      test fails until it gets one.
      The people chain is gated the same way: rebuild m_people_api__voter (a
      full-rebuild table) and --full-refresh m_people_api__districtvoter, or
      the assignment reaches the people DB only when the state's next L2 load
      bumps loaded_at.
      Pair each new district with an l2_br_match_overrides row so the BR
      position resolves to it.
    config:
      column_types:
        precinct: string
    columns:
      - name: state
        data_tests:
          - not_null
          - is_state_abbreviation
      - name: l2_district_type
        description: L2 district column the assignment writes into
        data_tests:
          - not_null
      - name: l2_district_name
        description: District value to assign
        data_tests:
          - not_null
      - name: source
        description: Published boundary source the assignment was transcribed from
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - state
              - county
              - city
              - precinct
              - l2_district_type

  - name: l2_br_match_overrides
    description: >
      Manual overrides for LLM-generated L2-to-BallotReady district matches.
      When the Gemini string matcher maps a BR position to the wrong L2
      district, add a row here with the correct l2_district_type and
      l2_district_name. These take precedence over the LLM match in the
      election-api position mart. A row is also honored when its BR position has
      no LLM match row at all (e.g. positions added after the static match
      snapshot): the position mart injects the match directly from this seed.
      A standalone dbt seed does not build dependent models, so build
      int__zip_code_to_br_office afterwards for the change to reach the office
      picker; it no longer needs a --full-refresh.
    columns:
      - name: br_database_id
        description: BallotReady position database ID to override
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int__enhanced_position')
                field: br_database_id
      - name: br_position_name
        description: Human-readable BR position name (for documentation only, not used in joins)
        data_tests:
          - not_null
      - name: state
        data_tests:
          - not_null
          - is_state_abbreviation
      - name: l2_district_type
        description: Corrected L2 district type
        data_tests:
          - not_null
      - name: l2_district_name
        description: Corrected L2 district name
        data_tests:
          - not_null
      - name: reason
        description: Why this override is needed
        data_tests:
          - not_null
    data_tests:
      # Both memberships, because they fail differently. The universe says the
      # district is live in the newest L2 delivery, which the district mart
      # cannot say since it retains everything it ever held. The mart says the
      # district is reachable by the consumer that actually joins it, which the
      # universe cannot say since the mart's L2 leg is an incremental that can
      # lag a delivery. An override satisfying only one of them resolves to
      # nothing in production.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              concat(state, '|', l2_district_type, '|', l2_district_name) in (
                select concat(state_postal_code, '|', district_type, '|', district_name)
                from {{ ref('int__l2_district_universe') }}
              )
              and concat(state, '|', l2_district_type, '|', l2_district_name) in (
                select concat(state, '|', l2_district_type, '|', l2_district_name)
                from {{ ref('m_election_api__district') }}
              )

  - name: election_api_race_filing_address_overrides
    description: >
      Manual overrides for the filing office address shown on election-api race
      pages. BallotReady sometimes supplies the wrong filing address for a
      position; add a row here keyed on the race br_database_id with the correct
      address and it takes precedence over the BallotReady value in the
      election-api race mart. Keyed at race grain (one row per BallotReady race)
      to match the mart and the displayed page; a future election for the same
      office gets a new br_database_id and would need its own row.
    columns:
      - name: br_database_id
        description: BallotReady race database ID to override
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int__enhanced_race')
                field: br_database_id
      - name: slug
        description: election-api race slug (for documentation only, not used in joins)
        data_tests:
          - not_null
      - name: filing_office_address
        description: Corrected filing office address
        data_tests:
          - not_null
      - name: reason
        description: Why this override is needed
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              br_database_id in (
                select br_database_id
                from {{ ref('m_election_api__race') }}
              )

  - name: election_api_race_filing_date_overrides
    description: >
      Manual overrides for the candidate filing window shown on election-api race
      pages. BallotReady stores a filing period per race and can populate a whole
      state from a rolled-forward template that was never a real window, so a
      single bad value reaches thousands of races at once. Keyed at the grain the
      filing window is actually set at (a class of offices in a state for one
      election date) rather than per race, so one row corrects every affected
      race and any BallotReady adds later. Takes precedence over the BallotReady
      value in the election-api race mart.
    config:
      column_types:
        election_date: date
        filing_date_start: date
        filing_date_end: date
    columns:
      - name: state
        description: Two-letter state of the races to override
        data_tests:
          - not_null
          - is_state_abbreviation
      - name: election_date
        description: Election date of the races to override
        data_tests:
          - not_null
      - name: position_level
        description: BallotReady position level the statutory window applies to
        data_tests:
          - not_null
      - name: partisan_type
        description: >
          BallotReady partisan type. Part of the key because partisan and
          nonpartisan candidates for the same office often file in different
          windows.
        data_tests:
          - not_null
      - name: filing_date_start
        description: Corrected first day of the filing window
        data_tests:
          - not_null
      - name: filing_date_end
        description: Corrected last day of the filing window
        data_tests:
          - not_null
      - name: reason
        description: Why this override is needed, with a citation
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - state
              - election_date
              - position_level
              - partisan_type
      - dbt_utils.expression_is_true:
          arguments:
            expression: filing_date_end >= filing_date_start

  - name: br_position_place_overrides
    description: >
      Points a BallotReady position geography at the Place it should resolve to,
      for geographies BallotReady carries on a position but publishes no Place
      row for. int__enhanced_race resolves place by geo_id and
      m_election_api__race inner-joins the place mart (Race.placeId is a
      required FK and supplies the race slug), so a position whose geography has
      no Place loses every one of its races and the office becomes unselectable
      in the picker. Keyed at geography grain rather than position, so every
      position sharing the geography is fixed by one row, including ones
      BallotReady adds later.
    config:
      column_types:
        position_geo_id: string
        place_geo_id: string
    columns:
      - name: position_geo_id
        description: geo_id BallotReady puts on the position
        data_tests:
          - not_null
      - name: position_mtfcc
        description: >
          MTFCC BallotReady puts on the position. Part of the key because a
          geo_id is only unique within an MTFCC.
        data_tests:
          - not_null
      - name: place_geo_id
        description: geo_id of the Place the position's races should resolve to
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int__enhanced_place')
                field: geo_id
      - name: place_name
        description: Name of that place (for documentation only, not used in joins)
        data_tests:
          - not_null
      - name: reason
        description: Why this override is needed
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - position_geo_id
              - position_mtfcc
      # The override is a silent no-op if it never reaches the race grain, so
      # assert the races it targets actually carry a place.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              position_geo_id in (
                select position_geo_id
                from {{ ref('int__enhanced_race') }}
                where place_id is not null
              )

  - name: icp_normalized_position_names
    description: >
      BallotReady normalized position names that qualify for ICP flags.
      The serve_eligible column controls whether a position qualifies for
      Serve ICP (false for school board positions, which are Win-only).
    columns:
      - name: name
        description: BallotReady normalized position name
        data_tests:
          - unique
          - not_null
      - name: branch
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - legislative
                  - executive
      - name: serve_eligible
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: win_effective_date
        description: >
          Earliest election date for which the Win ICP flag applies.
          Null means always eligible; non-null gates the win flag to
          elections on or after this date (used for school board positions).
        data_tests:
          - not_null:
              config:
                where: "category = 'school_board'"

  - name: hubspot_call_dispositions
    description: >
      Maps HubSpot `hs_call_disposition` GUIDs to human-readable outcome labels.
      The Airbyte HubSpot connector ingests the raw GUID but not the label
      mapping, which lives in HubSpot Settings (Objects > Activities > Calls >
      "Call and meeting outcomes"). This seed exists so downstream models
      can join the GUID to a readable label.

      `source` records how each row was populated:
        - `hubspot_docs`: documented default outcome (stable across HubSpot
          accounts), from
          https://developers.hubspot.com/docs/api-reference/legacy/crm/activities/calls/guide
        - `inferred_from_title`: custom outcome whose label was extracted from
          the Nooks Call title pattern `[Nooks Call] - <label> - <name> - by <rep>`.
        - `unknown`: GUID is present in the data but its label could not be
          inferred. Fill manually from HubSpot Settings.

      Maintaining this seed (updating or adding labels):
        - The authoritative GUID -> label binding is NOT in the warehouse, and
          the HubSpot Settings "Edit call outcomes" panel lists labels but not
          their GUIDs. Only the HubSpot API property options for
          `hs_call_disposition` expose the GUID behind each label:
          `GET /crm/v3/properties/calls/hs_call_disposition` (option `value` is
          the GUID, `label` is the human-readable outcome).
        - `inferred_from_title` labels are a best-effort proxy and CAN be wrong.
          The disposition GUID (a dropdown the rep selects) and the free-text
          call title are set independently, so a single GUID may carry more than
          one title. Treat the dominant title as a hint only, confirm the label
          against HubSpot's call outcomes, and fall back to `unknown` when the
          titles for a GUID disagree.
        - New disposition GUIDs that appear in the calls data are flagged by the
          warn-severity `relationships` test
          (`warn_unmapped_hs_call_disposition_guid`) on
          `int__hubspot_calls.hs_call_disposition`. When it warns, add the new
          GUID here. `int__hubspot_calls` coalesces any GUID missing from this
          seed to `disposition_label_source = 'unknown'` /
          `outcome_family = 'unmapped'`, so a missing row never breaks the build.
    columns:
      - name: guid
        description: "HubSpot internal GUID for the call disposition (hs_call_disposition)"
        data_tests:
          - unique
          - not_null
      - name: disposition_label
        description: "Human-readable outcome label as shown in the HubSpot UI"
      - name: source
        description: "How this row was populated (see seed description)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - hubspot_docs
                  - inferred_from_title
                  - unknown
      - name: notes
        description: "Free-text notes, e.g. derivation method or TODO markers"
      - name: outcome_family
        description: >
          Coarse outcome category for this disposition. One of: connected_pledge,
          connected_reject, connected_other, not_connected, unmapped.
          unmapped is used for rows where the disposition label is not yet known
          (source = 'unknown'). null_disposition is coalesced at the model level
          for calls with no disposition GUID at all.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - connected_pledge
                  - connected_reject
                  - connected_other
                  - not_connected
                  - unmapped
              config:
                severity: warn

  - name: states_zip_code_range
    description: "States and their zip code ranges. Sourced from https://zipcodes.org/us-zip-codes"
    columns:
      - name: state_postal_code
        tests:
          - not_null
          - unique
      - name: zip_code_range
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: ^\\[([0-9]{5},[0-9]{5})\\]$

  - name: hubspot_contact_property_columns
    description: >
      Registry of the HubSpot contact properties surfaced as columns on
      stg_airbyte_source__hubspot_api_contacts (and therefore on
      mart_analytics.hubspot_contacts, the Sigma-readable passthrough).
      One row per OUTPUT COLUMN: a property that feeds two columns (e.g.
      pledge_status -> is_pledged + pledge_status, or the *_raw pairs) has
      two rows sharing internal_name, so internal_name is intentionally
      not unique; column_name is.

      Every property-derived column is generated by a Jinja loop in the
      staging model as a typed get_json_object extraction of the raw
      `properties` JSON (see hubspot_contact_property_expression); the model
      itself keeps only the Airbyte record columns (id, companies,
      created_at, updated_at) hand-written. To surface another HubSpot
      property, add a status=generated row with a collision-free column_name
      and the right cast_type; no SQL change is needed. The seed doubles as
      the warehouse-queryable HubSpot-property -> column dictionary.

      HubSpot sends '' rather than null for unset values, so the generating
      macro wraps typed extractions in nullif(..., ''). boolean rows may
      carry a custom word-to-boolean value map (boolean_true_value /
      boolean_false_value, e.g. partisan/nonpartisan); blank means the
      default true/yes/1/y map.
    config:
      # drop-and-recreate on every run: keeps seed schema changes (like this
      # migration's two new columns) self-executing in every environment
      # instead of erroring a truncate+insert against the old table shape.
      # The table is a few hundred rows; a full refresh per run is free.
      full_refresh: true
      column_types:
        internal_name: STRING
        label: STRING
        hubspot_type: STRING
        hubspot_group: STRING
        status: STRING
        column_name: STRING
        cast_type: STRING
        sort_order: INT
        description: STRING
        boolean_true_value: STRING
        boolean_false_value: STRING
        cast_loss_expected: BOOLEAN
    columns:
      - name: internal_name
        description: >
          HubSpot internal property name (the key inside the raw properties
          JSON). Not unique: dual-output properties have one row per output
          column.
        data_tests:
          - not_null
      - name: label
        description: HubSpot display label for the property.
        data_tests:
          - not_null
      - name: hubspot_type
        description: Property type as exported from HubSpot.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bool, number, date, datetime, enumeration, string]
      - name: hubspot_group
        description: HubSpot property group the property belongs to.
        data_tests:
          - not_null
      - name: status
        description: >
          generated = column is emitted by the staging-model loop;
          existing is reserved for documenting columns exposed outside the
          loop (none today).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [existing, generated]
      - name: column_name
        description: >
          Output column name on stg_airbyte_source__hubspot_api_contacts.
          Must be a valid lowercase SQL identifier (enforced below); a
          collision with a hand-written column fails the view creation
          loudly at build time.
        data_tests:
          - unique
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: ^[a-z][a-z0-9_]*$
      - name: cast_type
        description: >
          Target type emitted by hubspot_contact_property_expression.
          Migrated legacy columns keep their exact pre-registry type: int
          (not bigint) where the hand-written cast was int, decimal(38,10)
          where Airbyte had typed the flattened source column, int_via_float
          for the float round-trip that tolerates decimal-formatted number
          strings.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - boolean
                  - double
                  - bigint
                  - int
                  - int_via_float
                  - "decimal(38,10)"
                  - date
                  - timestamp
                  - string
      - name: sort_order
        description: Stable output order for generated columns.
        data_tests:
          - unique
          - not_null
      - name: description
        description: HubSpot's own property description, where one exists.
      - name: boolean_true_value
        description: >
          For boolean rows only: source word mapped to TRUE (e.g. partisan,
          uncontested). Blank = cast_to_boolean's default map.
      - name: boolean_false_value
        description: >
          For boolean rows only: source word mapped to FALSE (e.g.
          nonpartisan, contested). Set exactly when boolean_true_value is.
      - name: cast_loss_expected
        description: >
          True on typed columns whose source property legitimately carries
          non-conforming values (free-text ids, out-of-map enum words) that
          the cast nulls out by design — the same behavior the hand-written
          expressions had before the registry migration.
          assert_hubspot_generated_casts_lossless skips these columns; every
          other typed column is strictly zero-loss-tested. Leave blank for
          new rows unless the property is known free-form.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "status = 'existing' or cast_type is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: >-
              (boolean_true_value is null) = (boolean_false_value is null)
      - dbt_utils.expression_is_true:
          arguments:
            expression: >-
              boolean_true_value is null or cast_type = 'boolean'
      - dbt_utils.expression_is_true:
          arguments:
            expression: >-
              cast_loss_expected is not true or cast_type != 'string'

  - name: haystaq_issue_tags
    description: >
      Per-issue metadata used by m_election_api__district_top_issues. One row
      per Haystaq issue column with the user-facing label and four
      jurisdictional flags (is_local, is_regional, is_state, is_federal)
      indicating where the issue is actionable. Flags are not mutually
      exclusive. Regional is tagged conservatively (only where a regional
      body has meaningful authority). Sort rows alphabetically by `issue`
      when editing.


      Column-name constraint: the `issue` values here must match the upstream
      `hs_*` column names on int__l2_nationwide_uniform_w_haystaq verbatim,
      including pre-existing L2 typos. The mart references each value as a
      live SQL identifier in an AVG aggregation, so renaming an `issue` in
      this seed without renaming the upstream column would break the mart
      compile (column-not-found) and the `relationships` test on
      m_election_api__district_top_issues.issue (mart values would no longer
      be a subset of seed values). Two known typos currently present:
      `hs_aliens_governenment_hiding_much` (should be `government`) and
      `hs_mass_deporations_support` (should be `deportations`). Keep both
      as-is; if L2 ever fixes them upstream, update the seed, the inline
      `issue_columns` list in the mart SQL, and rebuild.
    config:
      column_types:
        issue: STRING
        issue_label: STRING
        is_local: BOOLEAN
        is_regional: BOOLEAN
        is_state: BOOLEAN
        is_federal: BOOLEAN
    columns:
      - name: issue
        description: >
          Haystaq score column name on int__l2_nationwide_uniform_w_haystaq.
        data_tests:
          - not_null
          - unique
      - name: issue_label
        description: Human-readable label for product display.
        data_tests:
          - not_null
      - name: is_local
        description: Issue is actionable at the local level (city, township, county).
        data_tests:
          - not_null
      - name: is_regional
        description: >
          Issue is actionable at the regional level (MPO, transit authority,
          regional planning council, air quality district, regional health
          district).
        data_tests:
          - not_null
      - name: is_state
        description: Issue is actionable at the state level.
        data_tests:
          - not_null
      - name: is_federal
        description: Issue is actionable at the federal level.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_local or is_regional or is_state or is_federal"

  - name: seed_civics_election_2025_position_nullouts
    description: >
      One-time resolution of 2025-archive br_position_database_id collisions.
      Each row is a gp_election_id whose br_position_database_id
      must be nulled in int__civics_election_2025 because the contest's office
      does not match the tagged BallotReady position (office_mismatch). The
      seed now carries office_mismatch rows only; same-office duplicate
      collapse is handled in-model (the `collapsed` CTE in
      int__civics_election_2025.sql), not via the seed. The 2025 archive is a
      frozen 2026-01-22 snapshot, so these gp_election_ids are stable.
    columns:
      - name: gp_election_id
        description: Archive election id whose position tag is nulled.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int__civics_election_2025')
                field: gp_election_id
              config:
                severity: warn
      - name: br_position_database_id
        description: >
          BR position the row was tagged to. Load-bearing beyond documentation:
          the viability seats fallback rejects on this position plus
          election_date, which is how it reaches seeded candidacies that carry
          no election link for the gp_election_id key to match.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_airbyte_source__ballotready_api_position')
                field: database_id
              config:
                severity: warn
      - name: election_date
        description: >
          General election date of the nulled contest. Load-bearing beyond
          documentation: the viability seats fallback's position + date
          rejection key reads it.
        data_tests:
          - not_null
      - name: reason
        description: Why the tag is nulled.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["office_mismatch"]
      - name: br_position_name
        description: Human-readable BR position name (documentation only).

  - name: proposed_district_ignored_values
    description: >
      Proposed_District values that are known and deliberately not minted as
      districts. The column is a catch-all for district changes, so alongside
      the congressional and state senate maps it carries county-commissioner
      rows and local annexation records that are not seats at all.

      This exists so the drift guard can tell "known and ignored" from "new
      shape nobody has looked at". Removing a row makes the build fail rather
      than silently changing behaviour, which is the point: every value in the
      column has either a decision or a red build behind it.
    columns:
      - name: proposed_district
        description: The exact vendor value, matched literally.
        data_tests:
          - not_null
          - unique
      - name: state
        description: State the value appears in, for orientation only.
        data_tests:
          - not_null
          - is_state_abbreviation
      - name: reason
        description: >
          Why it is not a seat. Each was located by voter geography and then
          verified against the jurisdiction's own records.
        data_tests:
          - not_null

  - name: district_map_adoption
    description: >
      Which map is legally in force for an upcoming election, per (state,
      district type). L2 ships a proposed map in Proposed_District, but a
      proposed value is not evidence of adoption: it can be rejected,
      superseded, or struck down, and L2 lags on removing dead maps. Virginia
      is the standing example, its remap was struck down in May 2026 and the
      vendor still carries a proposal that moves half the state's voters.
      So adoption is a human decision recorded here with a citation, never
      inferred from the presence of a value.

      This seed is the decision record only. Nothing consumes it yet: it
      gates the districts a later change mints from the proposed column, so
      that an unadopted or unchecked map never becomes bindable. Absence of a
      row means current, which is conservative but not automatically right:
      for a redistricted state, current is the stale map. Every
      (state, district type) carrying a proposed value must therefore be
      listed explicitly, which assert_proposed_district_seed_coverage
      enforces for both handled types.

      Editing this seed does not bump voter loaded_at, so the incremental
      consumers need a --full-refresh afterwards, same as
      l2_manual_district_assignments.
    config:
      column_types:
        district_number: string
    data_tests:
      # The gate is an exists, so a second contradictory row for the same
      # scope has no veto: adding a proposed row beside a current one opens
      # the gate rather than conflicting with it.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - state
              - district_type
              - district_number
      # The invariant is_verified's description only described. Without it a
      # current or needs_boundary row can carry is_verified = true, and the gate
      # opens the moment adopted_source is flipped to proposed - skipping the
      # re-verification that flip is supposed to require. Seed-level rather than
      # on the column, because a column-level expression_is_true prepends the
      # column name and cannot express a cross-column rule.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "adopted_source = 'proposed' or not is_verified"
    columns:
      - name: state
        description: Two-letter state code the decision applies to.
        data_tests:
          - not_null
          - is_state_abbreviation
      - name: district_type
        description: >
          L2 district column the decision governs. Both handled types are
          accepted so a decision can be recorded for either, but only
          congressional rows exist so far: MI is the one state carrying a
          proposed state senate map and its adoption is still unresearched.
          Municipal maps live in a different vendor column and are out of
          scope entirely.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["US_Congressional_District", "State_Senate_District"]
      - name: district_number
        description: >
          Sparse key, same convention as l2_manual_district_assignments: empty
          means the decision covers every district in the state, a value
          narrows it to that district. Adoption is a state-wide legal fact so
          empty is the norm. Per-district rows exist so a district can be
          rolled out as it is verified against the enacted map without holding
          the rest of the state back. A district left out simply behaves as it
          does today rather than getting worse, so a partial rollout is safe.
      - name: adopted_source
        description: >
          current = the current typed column is the correct map for the
          upcoming election. proposed = L2's proposed value is the adopted
          map. needs_boundary = the state redistricted but neither L2 column
          holds the adopted map, so it cannot be resolved from L2 alone and
          needs boundary data.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["current", "proposed", "needs_boundary"]
      - name: is_verified
        description: >
          Whether someone confirmed L2's proposed value equals the legally
          adopted map for this state. Only proposed AND is_verified states
          mint bindable rows, so an unverified state stays on the current map
          rather than going live on an unchecked one.

          Meaningful only on a proposed row, and false everywhere else — not
          because current and needs_boundary states went unresearched, but
          because that research answered a different question and must not be
          mistaken for this one. Otherwise flipping a state to proposed, the
          natural one-field edit when a struck-down map is reinstated, would
          carry a stale true along with it and put the state live without the
          single human check this column exists to force.
        data_tests:
          - not_null
      - name: source_url
        description: Citation for the adoption decision. Required, so a flip is auditable.
        data_tests:
          - not_null
      - name: notes
        description: Short prose on the map's legal status and any caveat.
