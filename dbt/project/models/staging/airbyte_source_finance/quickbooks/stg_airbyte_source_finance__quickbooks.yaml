version: 2

models:
  - name: stg_airbyte_source_finance__quickbooks_accounts
    description: >
      Ephemeral staging for QuickBooks Online chart-of-accounts entries. Renames the source's
      PascalCase columns to snake_case and passes types through; nested
      QuickBooks objects stay JSON strings for the mart to parse.
    columns:
      - name: account_id
        description: QuickBooks Online identifier for the account, unique within the company file.
        data_tests:
          - not_null
          - unique
      - name: _airbyte_raw_id
        description: Airbyte's per-record identifier for this row.
        data_tests:
          - not_null
          - unique
      - name: _airbyte_extracted_at
        description: When Airbyte extracted the record from the QuickBooks API.
        data_tests:
          - not_null

