  - name: airflow_source
    schema: airflow_source
    description: Raw tables landed by the Airflow DAGs owned by the data platform
    config:
      loaded_at_field: loaded_at
      # These tables only gain rows when something changes upstream at BallotReady;
      # a quiet day with zero new rows is normal, not a pipeline failure. Freshness
      # here is a dead-pipeline backstop, not a daily heartbeat.
      freshness:
        warn_after: { count: 14, period: day }
        error_after: { count: 30, period: day }

    tables:
      - name: ballotready_candidacy_raw
        description: Raw CivicEngine GraphQL Candidacy nodes landed by the extract_ballotready DAG
        columns: &ballotready_raw_columns
          - name: requested_id
            description: The BallotReady integer id this row was fetched for
          - name: payload
            description: Raw JSON of the returned node; null when the API returned no node
      - name: ballotready_endorsement_raw
        description: Raw CivicEngine GraphQL Candidacy nodes landed by the extract_ballotready DAG, selected for the nested `endorsements` array on each Candidacy (there is no standalone Endorsement node)
        columns: *ballotready_raw_columns
      - name: ballotready_filing_period_raw
        description: Raw CivicEngine GraphQL FilingPeriod nodes landed by the extract_ballotready DAG
        columns: *ballotready_raw_columns
      - name: ballotready_geofence_raw
        description: Raw CivicEngine GraphQL Geofence nodes landed by the extract_ballotready DAG
        columns: *ballotready_raw_columns
      - name: ballotready_measure_raw
        description: Raw CivicEngine GraphQL Measure nodes landed by the extract_ballotready DAG, listed whole (upcoming measures) each run rather than fetched by id
        columns: *ballotready_raw_columns
      - name: ballotready_issue_raw
        description: Raw CivicEngine GraphQL Issue nodes landed by the extract_ballotready DAG
        # issue has no cursor: the worklist is an anti-join of issue ids referenced
        # by landed stances but not yet landed, so it can legitimately return zero
        # rows for months once the issue universe is captured. No threshold fits.
        config:
          freshness: null
        columns: *ballotready_raw_columns
      - name: ballotready_normalized_position_raw
        description: Raw CivicEngine GraphQL NormalizedPosition nodes landed by the extract_ballotready DAG
        columns: *ballotready_raw_columns
      - name: ballotready_party_raw
        description: Raw CivicEngine GraphQL Candidacy nodes landed by the extract_ballotready DAG, selected for the nested `parties` array on each Candidacy (there is no standalone Party node)
        columns: *ballotready_raw_columns
      - name: ballotready_person_raw
        description: Raw CivicEngine GraphQL Person nodes landed by the extract_ballotready DAG, fetched by the Candidate id carried on each landed Candidacy
        columns: *ballotready_raw_columns
      - name: ballotready_position_election_frequency_raw
        description: Raw CivicEngine GraphQL PositionElectionFrequency nodes landed by the extract_ballotready DAG
        columns: *ballotready_raw_columns
      - name: ballotready_stance_raw
        description: Raw CivicEngine GraphQL Candidacy nodes landed by the extract_ballotready DAG, selected for the nested `stances` array on each Candidacy (there is no standalone Stance node)
        columns: *ballotready_raw_columns
      - name: bifrost_request_log
        description: >
          One row per Bifrost gateway request, landed from the workbench
          account's daily Parquet export of the gateway's own `logs` table. Cost
          columns are the gateway's own computed cost, not invoiced provider
          cost. Append-only: each export re-emits a trailing window, so a request
          appears once per export that covered it.
        # The only table here that a daily job appends to, so the source-level
        # 14/30-day backstop would hide a dead loader for a fortnight.
        config:
          freshness:
            warn_after: { count: 1, period: day }
            error_after: { count: 3, period: day }

  - name: lakeflow_source
    schema: "{{ var('lakeflow_hubspot_schema', 'lakeflow_source_dev') }}"
    description: >
      Tables landed by Databricks Lakeflow Connect. Managed pipelines, not dbt, and
      a full refresh of one clears it first, so anything HubSpot has dropped or
      linked must live in our own layer. The schema is a var so production can
      point at its own once slice D decides it; until then every target reads the
      dev schema. No loaded_at_field or freshness, because there is no loader
      timestamp column. The activity tables carry no associations at all.

      contacts, companies and owners are current state only, so a merged-away or
      deleted record is absent; int__hubspot_contacts_history and
      int__hubspot_owners_history keep what HubSpot drops.
    tables:
      - name: calls
        description: >
          HubSpot calls, current state. Call properties are flat columns named
          by HubSpot's own internal property name, not Airbyte's
          `properties_`-prefixed form. `hs_call_callee_object_id` is populated
          for a few percent of rows only, so it is not a substitute for the
          association the feed omits.
        columns:
          - name: hs_call_body
            config:
              meta:
                sensitive: confidential
          - name: hs_body_preview
            config:
              meta:
                sensitive: confidential
          - name: hs_body_preview_html
            config:
              meta:
                sensitive: confidential
          - name: hs_call_summary
            config:
              meta:
                sensitive: confidential
          - name: hs_call_to_number
            config:
              meta:
                sensitive: identifier
          - name: hs_call_from_number
            config:
              meta:
                sensitive: identifier
          - name: hs_call_recording_url
            config:
              meta:
                sensitive: confidential
          - name: hs_call_video_recording_url
            config:
              meta:
                sensitive: confidential
      - name: emails
        description: >
          HubSpot email engagements, current state. `hs_email_direction`
          carries EMAIL, INCOMING_EMAIL and FORWARDED_EMAIL, the same
          engagement_type labels the frozen feed uses, so the model reads
          direction off that column rather than inferring it from the table.
          `hs_email_associated_contact_id` reaches a contact for nearly every
          row but is a single id, so it cannot stand in for a multi-contact
          association.
        columns:
          - name: hs_email_text
            config:
              meta:
                sensitive: confidential
          - name: hs_email_html
            config:
              meta:
                sensitive: confidential
          - name: hs_body_preview
            config:
              meta:
                sensitive: confidential
          - name: hs_body_preview_html
            config:
              meta:
                sensitive: confidential
          - name: hs_email_from_email
            config:
              meta:
                sensitive: identifier
          - name: hs_email_to_email
            config:
              meta:
                sensitive: identifier
          - name: hs_email_cc_email
            config:
              meta:
                sensitive: identifier
          - name: hs_email_bcc_email
            config:
              meta:
                sensitive: identifier
      - name: meetings
        description: >
          HubSpot meetings, current state. No contact id: only attendee and
          organizer email addresses, and deriving ids from those would be a
          join on a person's own address rather than an association.
        columns:
          - name: hs_meeting_body
            config:
              meta:
                sensitive: confidential
          - name: hs_internal_meeting_notes
            config:
              meta:
                sensitive: confidential
          - name: hs_body_preview
            config:
              meta:
                sensitive: confidential
          - name: hs_body_preview_html
            config:
              meta:
                sensitive: confidential
          - name: hs_meeting_recording_url
            config:
              meta:
                sensitive: confidential
          - name: hs_all_attendee_emails
            config:
              meta:
                sensitive: identifier
          - name: hs_organizer_email
            config:
              meta:
                sensitive: identifier
          - name: hs_guest_emails
            config:
              meta:
                sensitive: identifier
      - name: notes
        description: >
          HubSpot notes, current state. No contact column at all, not even a
          sparse one, so the note's person is only ever known from the frozen
          feed.
        columns:
          - name: hs_note_body
            config:
              meta:
                sensitive: confidential
          - name: hs_body_preview
            config:
              meta:
                sensitive: confidential
          - name: hs_body_preview_html
            config:
              meta:
                sensitive: confidential
      - name: tasks
        description: >
          HubSpot tasks, current state. Carries materially fewer rows than the
          frozen feed, concentrated in open tasks older than the current year,
          and `hs_task_assigned_contacts` is empty on every row, so this table
          is not yet a substitute for the frozen task stream.
        columns:
          - name: hs_task_body
            config:
              meta:
                sensitive: confidential
          - name: hs_task_subject
            config:
              meta:
                sensitive: confidential
          - name: hs_body_preview
            config:
              meta:
                sensitive: confidential
          - name: hs_body_preview_html
            config:
              meta:
                sensitive: confidential
          - name: hs_task_contact_phone
            config:
              meta:
                sensitive: identifier
      - name: contacts
        description: >
          HubSpot contacts as Lakeflow mirrors them: current state only, so a
          merged-away or deleted contact is absent. The frozen history it lacks
          lives in int__hubspot_contacts_history.
        columns:
          # Copied from the airbyte_source HubSpot entries and mapped to Lakeflow's
          # column names; `properties` does not exist here. Inert until the
          # source-tag hook's schema scope covers this source.
          - name: email
            config:
              meta:
                sensitive: identifier
          - name: phone
            config:
              meta:
                sensitive: identifier
          - name: firstname
            config:
              meta:
                sensitive: confidential
          - name: lastname
            config:
              meta:
                sensitive: confidential
          - name: full_name
            config:
              meta:
                sensitive: confidential
          - name: address
            config:
              meta:
                sensitive: confidential
          - name: birth_date
            config:
              meta:
                sensitive: confidential
      - name: companies
        description: HubSpot companies, current state only.
        columns:
          - name: candidate_name
            config:
              meta:
                sensitive: confidential
          - name: candidate_email
            config:
              meta:
                sensitive: identifier
          - name: phone
            config:
              meta:
                sensitive: identifier
          - name: address
            config:
              meta:
                sensitive: confidential
      - name: owners
        description: >
          HubSpot owners, current state only, batch-refreshed each run. Returns
          no archived owners; int__hubspot_owners_history keeps those.
        columns:
          # Owner emails are GoodParty colleagues, so personnel data. Declared
          # here as the same classification the airbyte_source owners entries
          # carry, but this source is inert until the source-tag hook's schema
          # scope covers it: it lists specific schemas and this one is not among
          # them, so nothing is stamped and the declaring column is never
          # checked against prod.
          - name: email
            config:
              meta:
                sensitive: identifier

