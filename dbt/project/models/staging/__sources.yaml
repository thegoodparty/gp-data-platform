          the staging model `stg_airbyte_source__hubspot_api_engagements_calls`
          strips the prefix.
      # Owner emails are GoodParty colleagues, so this is personnel data rather
      # than contact data. Tagged on both streams because an archived owner's
      # address is as personal as an active one's.
      - name: hubspot_api_owners_archived
        description: raw data load from HubSpot data model
        columns:
          - name: email
            config:
              meta:
                sensitive: identifier
      - name: hubspot_api_owners
        description: raw data load from HubSpot data model
        columns:
          - name: email
            config:
              meta:
                sensitive: identifier
      - name: hubspot_api_tickets
        columns:
          - name: properties
            config:
              meta:
                sensitive: confidential
          - name: properties_content
            config:
              meta:
                sensitive: confidential
          - name: properties_notes
            config:
              meta:
                sensitive: confidential
          - name: properties_hs_last_email_details
            config:
              meta:
                sensitive: confidential
          - name: properties_hs_all_associated_contact_emails
            config:
              meta:
                sensitive: confidential
          - name: properties_hs_all_associated_contact_phones
            config:
              meta:
                sensitive: confidential
          - name: properties_hs_all_associated_contact_mobilephones
            config:
              meta:
                sensitive: confidential
          - name: properties_hs_all_associated_contact_firstnames
            config:
              meta:
                sensitive: confidential
          - name: properties_hs_all_associated_contact_lastnames
            config:
              meta:
                sensitive: confidential
        description: raw data load from HubSpot data model
      - name: hubspot_api_feedback_submissions
        columns:
          - name: properties
            config:
              meta:
                sensitive: confidential
        description: >
          HubSpot Feedback Survey submissions ingested via custom Airbyte
          Connector Builder source. Contains responses from all feedback
          surveys (PMF, user satisfaction, research compensation, etc.).
      - name: techspeed_gdrive_candidates
        columns:
          - name: date_of_birth_mmddyyyy
            config:
              meta:
                sensitive: confidential
          - name: date_of_birth_mm_dd_yyyy_
            config:
              meta:
                sensitive: confidential
        description: raw data load from Techspeed Google Drive
      - name: techspeed_gdrive_officeholders
        description: raw data load from Techspeed Google Drive
        # Loaded once, on 2026-03-02, while the sibling candidates feed keeps
        # syncing. Left warning rather than nulled so the gap stays visible to
        # the civics models that read it.
        config:
          freshness:
            warn_after: { count: 180, period: day }
            error_after: { count: 365, period: day }
        columns:
          # Contact details and the home street address, on the same rule as the
          # rest of the file. Names and birth dates stay as they are: this feed
          # is state candidate filings and county clerk directories, so the
          # names are public record, and it carries no birth date column.
          - name: email
            config:
              meta:
                sensitive: identifier
          - name: phone
            config:
              meta:
                sensitive: identifier
          - name: street_address
            config:
              meta:
                sensitive: confidential
          - name: is_incumbent
            data_tests:
              # Techspeed adds values and staging already nulls unknowns, so a new
              # one is not a defect worth failing the build over.
              - accepted_values:
                  arguments:
                    values: ["", "FALSE", "False", "TRUE", "True"]
                  config:
                    severity: warn
          - name: is_uncontested
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["", "No", "Yes"]
                  config:
                    severity: warn
      - name: techspeed_gdrive_marketing_data_enrichment
        description: raw data load from Techspeed Google Drive
        # Last loaded 2025-12-02; the feed is no longer syncing and has no
        # downstream consumers, so freshness is disabled to stop the source
        # from going STALE. Source is retained in dbt for now.
        config:
          freshness: null

