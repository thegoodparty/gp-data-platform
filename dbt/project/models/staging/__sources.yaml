  - name: archives
    schema: archives
    description: >
      Point-in-time copies of tables that are no longer written, kept under a
      dated name so the original can be dropped. No freshness check on purpose.
    tables:
      - name: airbyte_internal__airbyte_source_raw__stream_gp_api_db_campaign_20260918
        columns:
          - name: _airbyte_data
            config:
              meta:
                sensitive: confidential
        description: >
          Archive of Airbyte's insert-only raw stream for the gp_api_db campaign
          table, copied after the Databricks destination's Direct-Load upgrade
          froze it. Holds every state Airbyte extracted until then, including
          campaign versions the product later overwrote in place.

  - name: er_source
    schema: er_source
    description: >
      Output tables from the Splink-based entity resolution pipeline (gp-data-matcha).
      Contains cross-source matching results for candidacy stages and elected officials,
      using probabilistic record linkage (Fellegi-Sunter model trained via EM) to identify
      which records from each source refer to the same real-world entity.

    tables:
      - name: clustered_candidacy_stages
        description: >
          Cluster assignments produced by Splink's connected-components clustering
          (threshold: 0.95 match probability). Each row is a single candidacy-stage record
          from either BallotReady or TechSpeed, annotated with a cluster_id that groups
          records believed to represent the same real-world candidacy-stage. Clusters that
          span both sources form the BR↔TS crosswalk; single-record clusters indicate
          unmatched records.
        columns:
          - name: first_name
            config:
              meta:
                sensitive: confidential
          - name: last_name
            config:
              meta:
                sensitive: confidential
          - name: last_name_variants
            config:
              meta:
                sensitive: confidential
          - name: first_name_aliases
            config:
              meta:
                sensitive: confidential
          - name: first_name_tokens
            config:
              meta:
                sensitive: confidential
          - name: email
            config:
              meta:
                sensitive: identifier
          - name: phone
            config:
              meta:
                sensitive: identifier

      - name: clustered_people
        # Jinja so a dated vintage can be built and audited in dev before the
        # matcha_er DAG swaps it live:
        #   dbt build --vars '{clustered_people_identifier: clustered_people_20261007}'
        identifier: "{{ var('clustered_people_identifier', 'clustered_people') }}"
        description: >
          Person clusters from matcha's person lane. One row per prematch
          record with cluster_id (connected components over dbt's
          deterministic links and the scored pairs at 0.95) and identity_id
          (the components over the links alone); no cluster holds two
          BallotReady people. Canonical person identity.
        columns:
          - name: first_name
            config:
              meta:
                sensitive: confidential
          - name: first_name_aliases
            config:
              meta:
                sensitive: confidential
          - name: first_name_tokens
            config:
              meta:
                sensitive: confidential
          - name: last_name
            config:
              meta:
                sensitive: confidential
          - name: last_name_tokens
            config:
              meta:
                sensitive: confidential
          - name: suffix_token
            config:
              meta:
                sensitive: confidential
          - name: email
            config:
              meta:
                sensitive: identifier
          - name: phone
            config:
              meta:
                sensitive: identifier
          - name: phone_surname_groups
            config:
              meta:
                sensitive: confidential
          - name: birth_date
            config:
              meta:
                sensitive: confidential

      - name: pairwise_people
        description: >
          Scored person pairs from Splink prediction (threshold: 0.01 match
          probability), after the post-prediction filters. Audit input.
        columns:
          - name: last_name_l
            config:
              meta:
                sensitive: confidential
          - name: last_name_r
            config:
              meta:
                sensitive: confidential
          - name: first_name_l
            config:
              meta:
                sensitive: confidential
          - name: first_name_r
            config:
              meta:
                sensitive: confidential
          - name: first_name_aliases_l
            config:
              meta:
                sensitive: confidential
          - name: first_name_aliases_r
            config:
              meta:
                sensitive: confidential
          - name: first_name_tokens_l
            config:
              meta:
                sensitive: confidential
          - name: first_name_tokens_r
            config:
              meta:
                sensitive: confidential
          - name: email_l
            config:
              meta:
                sensitive: identifier
          - name: email_r
            config:
              meta:
                sensitive: identifier
          - name: phone_l
            config:
              meta:
                sensitive: identifier
          - name: phone_r
            config:
              meta:
                sensitive: identifier
          - name: birth_date_l
            config:
              meta:
                sensitive: confidential
          - name: birth_date_r
            config:
              meta:
                sensitive: confidential
          - name: last_name_tokens_l
            config:
              meta:
                sensitive: confidential
          - name: last_name_tokens_r
            config:
              meta:
                sensitive: confidential
          - name: suffix_token_l
            config:
              meta:
                sensitive: confidential
          - name: suffix_token_r
            config:
              meta:
                sensitive: confidential
          - name: phone_surname_groups_l
            config:
              meta:
                sensitive: confidential
          - name: phone_surname_groups_r
            config:
              meta:
                sensitive: confidential

      - name: pairwise_candidacy_stages
        description: >
          Scored candidate pairs from Splink prediction (threshold: 0.01 match probability),
          after post-prediction filters for person identity, race-level agreement, and
          race ID consistency. Each row is a pair of candidacy-stage records with Splink
          match weights, match probabilities, per-comparison gamma levels, Bayes factors,
          and term-frequency adjustments. Useful for auditing match quality and investigating
          edge cases.
        columns:
          - name: last_name_l
            config:
              meta:
                sensitive: confidential
          - name: last_name_r
            config:
              meta:
                sensitive: confidential
          - name: last_name_variants_l
            config:
              meta:
                sensitive: confidential
          - name: last_name_variants_r
            config:
              meta:
                sensitive: confidential
          - name: first_name_l
            config:
              meta:
                sensitive: confidential
          - name: first_name_r
            config:
              meta:
                sensitive: confidential
          - name: first_name_aliases_l
            config:
              meta:
                sensitive: confidential
          - name: first_name_aliases_r
            config:
              meta:
                sensitive: confidential
          - name: first_name_tokens_l
            config:
              meta:
                sensitive: confidential
          - name: first_name_tokens_r
            config:
              meta:
                sensitive: confidential
          - name: email_l
            config:
              meta:
                sensitive: identifier
          - name: email_r
            config:
              meta:
                sensitive: identifier
          - name: phone_l
            config:
              meta:
                sensitive: identifier
          - name: phone_r
            config:
              meta:
                sensitive: identifier

      - name: clustered_elected_officials
        description: >
          Cluster assignments from the elected officials entity resolution pipeline.
          Match groups bridging gp-api elected-office records to BR+TS terms and DDHQ
          general winners. Cluster grain is term (one row per BR+TS term, gp-api
          elected-office record, or DDHQ winning result). Mart owns person rollup via
          br_candidate_id, and term selection within a multi-term cluster via
          sworn_in_date proximity to term_start_date. DDHQ rows carry ddhq_votes (the
          official's own winning votes) and use election_date as term_start_date so the
          date comparison links them to the right cycle. Uses 0.95 match probability
          threshold with post-prediction filters for office compatibility.
        columns:
          - name: first_name
            config:
              meta:
                sensitive: confidential
          - name: last_name
            config:
              meta:
                sensitive: confidential
          - name: first_name_aliases
            config:
              meta:
                sensitive: confidential
          - name: first_name_tokens
            config:
              meta:
                sensitive: confidential
          - name: email
            config:
              meta:
                sensitive: identifier
          - name: phone
            config:
              meta:
                sensitive: identifier

      - name: pairwise_elected_officials
        description: >
          Scored elected official pairs from Splink prediction (threshold: 0.01 match
          probability), after post-prediction filters for office compatibility. Each row is a
          pair of elected official records with Splink match weights, match probabilities,
          per-comparison gamma levels (including office_type, office_level,
          ballotready_position_id, and the term_start_date election-cycle comparison), and
          Bayes factors. Includes 12 comparisons vs 9 for candidacy stages (adds
          office_type, office_level, ballotready_position_id, and a term_start_date date
          comparison that links DDHQ winners to the correct office cycle).
        columns:
          - name: last_name_l
            config:
              meta:
                sensitive: confidential
          - name: last_name_r
            config:
              meta:
                sensitive: confidential
          - name: first_name_l
            config:
              meta:
                sensitive: confidential
          - name: first_name_r
            config:
              meta:
                sensitive: confidential
          - name: first_name_aliases_l
            config:
              meta:
                sensitive: confidential
          - name: first_name_aliases_r
            config:
              meta:
                sensitive: confidential
          - name: first_name_tokens_l
            config:
              meta:
                sensitive: confidential
          - name: first_name_tokens_r
            config:
              meta:
                sensitive: confidential
          - name: email_l
            config:
              meta:
                sensitive: identifier
          - name: email_r
            config:
              meta:
                sensitive: identifier
          - name: phone_l
            config:
              meta:
                sensitive: identifier
          - name: phone_r
            config:
              meta:
                sensitive: identifier

      - name: clustered_election_stages
        description: >
          Cluster assignments from the election-stage entity resolution pipeline
          (gp-data-matcha election_stage entity). Each row is a race-level record from
          BallotReady, DDHQ, or TechSpeed, annotated with a cluster_id grouping records
          believed to represent the same real-world election stage (race). Cross-source
          clusters form the race-level crosswalk; single-record clusters are unmatched
          races. 0.95 match-probability threshold; post-prediction filters enforce state +
          election_date + election_stage agreement and office identity (no person fields).

      - name: pairwise_election_stages
        description: >
          Scored race pairs from the election-stage Splink prediction (threshold: 0.01),
          after post-prediction filters. Each row is a pair of election-stage records with
          match weights, match probabilities, and per-comparison gamma levels. For auditing
          election-stage match quality.
  - name: nhgis
    schema: sandbox
    description: >
      NHGIS extracts of the 2020 decennial census, staged by the research team. The 2020
      frame is static: these tables are a one-time load, not a refreshing feed, so
      downstream tests pin exact totals.
    tables:
      - name: blocks_to_pop_a
        description: >
          First of the two files of the 2020 census block population extract. The a/b
          split is by row count, not state boundary (Missouri spans both files), so both
          tables are required for a complete national frame. All columns are strings, and
          the first data row is an embedded descriptive header that must be filtered out.
      - name: blocks_to_pop_b
        description: >
          Second of the two files of the 2020 census block population extract. Columns
          are typed; GEOCODE is stored as a number, which drops leading zeros, so always
          zero-pad to the 15-character block GEOID on read.

  - name: census_acs
    schema: sandbox
    description: >
      Census Bureau ACS 2020-2024 5-year table-based Summary File, loaded one time
      from the public bulk directory
      (https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF/data/5YRData/,
      files acsdt5y2024-<table>.dat) by dbt/scripts/load_acs_summary_file.py on
      2026-07-20 (see the committed manifest beside the script for hashes and row
      counts). Tables are raw all-string: GEO_ID plus interleaved estimate/margin
      columns (<TABLE>_E###/<TABLE>_M###) for every published summary level and
      geographic component. Values still carry the raw negative jam-code sentinels
      (insufficient sample, not applicable, not computable, controlled-to-total,
      and the median-specific codes); they are mapped once, in staging. This is a
      one-time load for the 2020-2024 vintage, not a refreshing feed: re-run the
      documented loader for a future vintage, which verifies sha256 and row counts
      against the manifest before replacing anything. Dollar-denominated tables are
      2024 inflation-adjusted dollars.
    tables:
      - name: acs5y2024_b01001
        description: >
          Sex by age (B01001), universe total population. 49 estimate columns and
          their margins. Feeds total population and the under-18 / 65-plus
          bracket combinations.
      - name: acs5y2024_b03002
        description: >
          Hispanic or Latino origin by race (B03002), universe total population.
          Feeds the non-Hispanic race shares and the Hispanic-or-Latino share.
      - name: acs5y2024_b15002
        description: >
          Sex by educational attainment for the population 25 years and over
          (B15002). Chosen over the collapsed single-sex-axis education table
          because this one is in the Census variance-replicate program, keeping
          exact margins reachable later; identical derived estimates from more
          bracket components.
      - name: acs5y2024_b19001
        description: >
          Household income brackets in the past 12 months (B19001), universe
          households, 2024 inflation-adjusted dollars. Staged for future
          bracket-interpolated medians and possible income-band shares; not
          shipped to any mart yet.
      - name: acs5y2024_b19013
        description: >
          Median household income (B19013), 2024 inflation-adjusted dollars.
          Staged for published-geography surfaces only: medians are not additive
          and are never allocated to districts.
      - name: acs5y2024_b19025
        description: >
          Aggregate household income (B19025), universe households, 2024
          inflation-adjusted dollars. An additive dollar total: the safe
          allocation primitive behind mean household income.
      - name: acs5y2024_b23025
        description: >
          Employment status for the population 16 years and over (B23025).
          Feeds civilian labor force and unemployed counts.
      - name: acs5y2024_b25003
        description: >
          Housing tenure (B25003), universe occupied housing units (households).
          Feeds households and owner-occupied households.
      - name: acs5y2024_b25008
        description: >
          Total population in occupied housing units by tenure (B25008). Feeds
          the average-household-size numerator.
      - name: acs5y2024_b25077
        description: >
          Median home value of owner-occupied housing units (B25077). Staged for
          published-geography surfaces only; never allocated.
      - name: acs5y2024_b28002
        description: >
          Presence and types of internet subscriptions in household (B28002),
          universe households. Feeds the broadband-subscription share (note:
          subscription, not availability).
      - name: acs5y2024_c17002
        description: >
          Ratio of income to poverty level in the past 12 months (C17002),
          universe population for whom poverty status is determined (excludes
          institutionalized group quarters, military quarters, and college
          dormitories). Feeds the below-poverty share.
      - name: census_ct_block_to_planning_region_2022
        description: >
          State-republished (CTData) copy of the Census 2022 Connecticut
          county-equivalent-change block-level equivalency mapping. Not a
          Census-hosted file: the Census publishes the change but no block-level
          relationship file at a stable public URL, so the state data
          collaborative's republication is loaded instead (URL and hash pinned
          in the loader manifest; loaded 2026-07-20 by the same loader), and
          its CONTENT is verified against the decennial block staging and the
          published code structure by singular tests. One row per 2020 Connecticut
          census block: block_fips_2020 carries the legacy-county block geoid,
          block_fips_2022 the planning-region-coded geoid whose first 12
          characters are the recoded block group. Contract: unique on
          block_fips_2020; each block maps to exactly one planning-region block
          group (many-to-one, never one-to-many). The republication omits
          unpopulated water-only blocks, so the contract tests bind populated
          geographies bidirectionally and separately prove that any block group
          the mapping cannot reach carries no ACS population or households. The
          2020-2024 ACS codes all CT geography under planning regions, so this
          mapping (never string surgery on geoid suffixes) is what joins
          legacy-coded decennial blocks to ACS block groups downstream.
        columns:
          - name: block_fips_2020
            description: 2020 census block geoid under legacy CT county codes (15 characters).
            data_tests:
              - not_null
              - unique
          - name: block_fips_2022
            description: >
              The same block re-coded under 2022 planning-region county codes
              (15 characters); first 12 characters are the ACS-era block group.
            data_tests:
              - not_null

  - name: dbt_hugh
    schema: dbt_hugh
    description: >
      L2 early and absentee voter (EAV) lists, downloaded by hand from L2 DataMapping
      (Atlas) and uploaded by the data team. Each upload is cumulative and overwrites
      the table, so a drop in row count means a partial file, not voters un-voting.
      Lives in a personal dev schema for now, because no restricted raw schema accepts
      manual uploads; move it before that schema is cleaned up.
    tables:
      - name: l2_eav_general_2026
        identifier: eav_20261103
        description: >
          LALVOTERIDs L2 reports as having voted early or returned an absentee ballot
          in the 2026-11-03 General. States that do not report to L2 are absent (as
          of 2026-10-26: AL, HI, KY, MO, MS, NY, SC), so absence does not mean the
          voter has not voted.
        columns:
          - name: LALVOTERID
            data_tests:
              - not_null
              - unique

  - name: airbyte_source_finance
    schema: airbyte_source_finance
    description: >
      Raw QuickBooks Online and Stripe data landed by Airbyte for the finance mart.
      Airbyte creates and owns this schema on first sync, so unlike the mart schemas
      it is not Terraform-managed. Held apart from the shared `airbyte_source` schema
      because these streams carry the general ledger, payments, and vendor and
      customer PII. The staging models over it are ephemeral, so in production the
      full rows are materialized only in `mart_finance`. The analytics revenue
      models also read Stripe through that staging, and publish charge,
      checkout-session and per-user revenue rows (ids, amounts and purchase types,
      no contact or card fields) in the shared `dbt` schema.
    config:
      loaded_at_field: "_airbyte_extracted_at"
      freshness:
        warn_after: { count: 10, period: day }
        error_after: { count: 31, period: day }

