version: 2

sources:
  - name: airbyte_source
    schema: airbyte_source
    description: Raw data loaded from Airbyte
    config:
      loaded_at_field: "_airbyte_extracted_at"
      freshness:
        warn_after: { count: 10, period: day }
        error_after: { count: 31, period: day }

    tables:
      - name: amplitude_api_active_users
        description: raw data load from amplitude api active users
      - name: amplitude_api_annotations
        description: raw data load from amplitude api annotations
      - name: amplitude_api_average_session_length
        description: raw data load from amplitude api average session length
      - name: amplitude_api_cohorts
        description: raw data load from amplitude api cohorts
      - name: amplitude_api_events
        columns:
          - name: ip_address
            config:
              meta:
                sensitive: identifier
          - name: location_lat
            config:
              meta:
                sensitive: confidential
          - name: location_lng
            config:
              meta:
                sensitive: confidential
          - name: adid
            config:
              meta:
                sensitive: confidential
          - name: idfa
            config:
              meta:
                sensitive: confidential
          - name: user_properties
            config:
              meta:
                sensitive: confidential
          - name: event_properties
            config:
              meta:
                sensitive: confidential
        description: raw data load from amplitude api events
      - name: amplitude_api_events_list
        description: raw data load from amplitude api events list
      - name: amplitude_taxonomy_event_type
        description: >
          raw data load from the amplitude govern taxonomy api
          (GET /api/2/taxonomy/event, showDeleted=true). one row per event_type
          with human-curated metadata (category, description, is_active,
          is_hidden_*, tags, owner).
      # Claude Enterprise Analytics API via a custom Airbyte Builder source, synced
      # daily at 20:00 UTC; tighter freshness than the block default to match.
      # Amounts land as the API's fractional-cent decimal strings.
      - name: anthropic_api_cost_report
        description: >
          One row per daily bucket of org-wide Claude cost from
          `/v1/organizations/analytics/cost_report`; `results` is a JSON array with
          one entry per product, model, cost_type and token_type.
        config:
          freshness:
            warn_after: { count: 2, period: day }
            error_after: { count: 5, period: day }
      - name: anthropic_api_usage_report
        description: >
          One row per daily bucket of org-wide Claude token usage from
          `/v1/organizations/analytics/usage_report`; `results` is a JSON array with
          one entry per product and model.
        config:
          freshness:
            warn_after: { count: 2, period: day }
            error_after: { count: 5, period: day }
      - name: anthropic_api_user_cost_report
        columns:
          - name: actor
            config:
              meta:
                sensitive: confidential
        description: >
          One row per seat user per day of Claude cost from
          `/v1/organizations/analytics/user_cost_report` (bucket_width=1d, ungrouped).
        config:
          freshness:
            warn_after: { count: 2, period: day }
            error_after: { count: 5, period: day }
      - name: anthropic_api_users
        columns:
          - name: user
            config:
              meta:
                sensitive: confidential
        description: >
          One row per seat user per day of Claude activity from
          `/v1/organizations/analytics/users`; the connector stamps the requested
          day onto each row as `activity_date`. Metric blocks are nested JSON.
        config:
          freshness:
            warn_after: { count: 2, period: day }
            error_after: { count: 5, period: day }
      - name: anthropic_api_summaries
        description: >
          One row per day of org-wide active-user and seat counts from
          `/v1/organizations/analytics/summaries`.
        config:
          freshness:
            warn_after: { count: 2, period: day }
            error_after: { count: 5, period: day }
      - name: ballotready_api_election
        description: raw data scan from [`elections` query](https://developers.civicengine.com/docs/api/graphql/reference/queries/elections)
      - name: ballotready_api_issue
        description: raw data scan from [`issues` query](https://developers.civicengine.com/docs/api/graphql/reference/queries/issues)
      - name: ballotready_api_mtfcc
        description: raw data scan from [`mtfcc` query](https://developers.civicengine.com/docs/api/graphql/reference/queries/mtfcc). Note that the documentation is incorrect and `createdAt` nor `updatedAt` are not present in the data.
      - name: ballotready_api_place
        description: raw data scan from [`places` query](https://developers.civicengine.com/docs/api/graphql/reference/queries/places)
      - name: ballotready_api_position
        description: raw data scan from [`positions` query](https://developers.civicengine.com/docs/api/graphql/reference/queries/positions)
      - name: ballotready_api_position_to_place
        description: raw data scan from [`positions` query](https://developers.civicengine.com/docs/api/graphql/reference/queries/positions)
      - name: ballotready_api_race
        description: raw data scan from [`races` query](https://developers.civicengine.com/docs/api/graphql/reference/queries/races)
      - name: ballotready_s3_candidacies_v3
        description: raw data load from s3 data dump sent from ballotready
        columns:
          - name: is_primary
            data_tests:
              - accepted_values:
                  arguments:
                    values:
                      - 'true'
                      - 'false'
          - name: is_runoff
            data_tests:
              - accepted_values:
                  arguments:
                    values:
                      - 'true'
                      - 'false'
      - name: ballotready_s3_office_holders_v3
        description: raw data load from s3 data dump sent from ballotready
      - name: ballotready_s3_recruitment_v1
        description: raw data load from s3 data dump sent from ballotready
      - name: ballotready_s3_uscities_v1_77
        description: raw data load from s3 data dump sent from ballotready
      - name: ballotready_s3_uscounties_v1_73
        description: raw data load from s3 data dump sent from ballotready
      - name: ddhq_gdrive_election_results
        description: raw data load from ddhq google drive for election results
        columns:
          - name: race_name
            data_tests:
              - dbt_expectations.expect_column_values_to_match_regex:
                  arguments:
                    regex: "^[A-Z]{2} "
                  config:
                    where: "race_name is not null"
      - name: ddhq_gdrive_election_results_master
        description: >
          One-off consolidated backfill (2026-07-01) re-stating all results
          through DDHQ's horizon; identical schema to ddhq_gdrive_election_results.
          Merged under the live feed via the ddhq_gdrive_election_results_merged
          macro. Not updated going forward.
        config:
          # never re-synced; suppress inherited airbyte_source freshness
          freshness: null
        columns:
          - name: race_name
            data_tests:
              - dbt_expectations.expect_column_values_to_match_regex:
                  arguments:
                    regex: "^[A-Z]{2} "
                  config:
                    where: "race_name is not null"
      - name: ddhq_elections_gsheet_reported_races
        description: >
