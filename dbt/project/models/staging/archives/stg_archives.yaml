models:
  - name: stg_archives__raw_gp_api_db_campaign
    description: >
      Parsed rows of the archived Airbyte raw stream for campaigns: one row per
      record Airbyte extracted before the destination's Direct-Load upgrade,
      including states the product later overwrote in place. Not deduplicated;
      versioning happens downstream.
    columns:
      - name: _airbyte_raw_id
        description: Airbyte record id, unique per extracted record.
        data_tests:
          - unique
          - not_null
      - name: id
        description: Campaign id from the product database. Repeats across extracted states.
        data_tests:
          - not_null
