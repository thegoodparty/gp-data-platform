models:
  - name: stg_source_dsar__suppressed_identifiers
    description: >
      Identifiers of people who asked for their data to be deleted. Presence means
      suppress: staging models filter every row here through `dsar_not_suppressed`.
      Only the identifier columns are exposed so the requester's name stays in the
      source table.
    columns:
      - name: request_id
        description: Tracking ticket for the request
        data_tests:
          - not_null
      - name: identifier_type
        description: Which key this identifier is. Only types some filter matches on are accepted.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ dsar_identifier_types() }}"
      - name: identifier_value
        description: >
          Normalized identifier: emails lowercased and trimmed, phones digits only,
          everything else trimmed. A blank would match every row whose identifier
          normalizes to empty, so the table's CHECK constraint is repeated here.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
      - name: received_at
        description: Date the request was received, which starts the 45-day response clock
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - request_id
              - identifier_type
              - identifier_value
