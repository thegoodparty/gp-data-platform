      - name: urls
        data_tests: [not_null]

  - name: stg_airflow_source__ballotready_stance_raw
    description: One row per candidacy, carrying that candidacy's stances as a nested array.
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 300000
      # asserts no candidacy repeats a stance id within its own stances array
      # (requested_id/candidacy_id is already unique per row, so a combination-of-
      # columns test on candidacy_id + stances.databaseId would be vacuous at this
      # grain and would never catch a repeated id inside one row's array).
      - dbt_utils.expression_is_true:
          arguments:
            expression: "size(stances) = size(array_distinct(transform(stances, x -> x.databaseId)))"
    columns:
      - name: requested_id
        data_tests: [not_null, unique]
      - name: candidacy_id
        data_tests: [not_null]
      - name: stances
        data_tests: [not_null]
      - name: created_at
        data_tests: [not_null]
      - name: updated_at
        data_tests: [not_null]

  - name: stg_airflow_source__ballotready_endorsement_raw
    description: One row per candidacy, carrying that candidacy's endorsements as a nested array.
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 300000
      # asserts no candidacy repeats an endorsement id within its own endorsements
      # array; see stance for why this must check inside the array rather than
      # across rows.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "size(endorsements) = size(array_distinct(transform(endorsements, x -> x.databaseId)))"
    columns:
      - name: requested_id
        data_tests: [not_null, unique]
      - name: candidacy_id
        data_tests: [not_null]
      - name: endorsements
        data_tests: [not_null]
