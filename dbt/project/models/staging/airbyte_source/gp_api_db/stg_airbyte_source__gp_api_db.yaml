        description: "Status of the outreach campaign (e.g., active, completed, paused)"
        tests:
          - not_null
      - name: message
        description: "Message content for the outreach campaign"
      - name: createdAt
        description: "Timestamp when the outreach campaign was created"
        tests:
          - not_null
      - name: did_state
        description: "State information for the outreach campaign"
      - name: image_url
        description: "URL of the image associated with the outreach campaign"
      - name: updatedAt
        description: "Timestamp when the outreach campaign was last updated"
        tests:
          - not_null
      - name: campaignId
        description: >
          Foreign key reference to the campaign. Null for Serve outreach, which
          the product scopes by organization alone; see organization_slug.
        tests:
          - relationships:
              arguments:
                to: ref('stg_airbyte_source__gp_api_db_campaign')
                field: id
      - name: organization_slug
        description: >
          Organization the outreach belongs to. A Serve organization runs
          outreach with no campaign, so this is the only owner on those rows.
      - name: project_id
        description: "Project ID associated with the outreach campaign"
      - name: identity_id
        description: "Identity ID of the user who created the outreach campaign"
      - name: outreach_type
        description: "Type of outreach (e.g., phone, text, email, door-to-door)"
        tests:
          - not_null
      - name: phone_list_id
        description: "ID of the phone list used for the outreach campaign"
      - name: audience_request
        description: "Audience request parameters for the outreach campaign"
      - name: voter_file_filter_id
        description: "ID of the voter file filter applied to the outreach campaign"
      - name: denied_at
        description: "Timestamp when an admin denied the outreach"
      - name: denied_by
        description: "Admin who denied the outreach"
      - name: text_count
        description: "Number of texts the outreach sent"
      - name: approved_at
        description: "Timestamp when an admin approved the outreach"
      - name: approved_by
        description: "Admin who approved the outreach"
      - name: archived_at
        description: "Timestamp when the outreach was archived"
      - name: canceled_at
        description: "Timestamp when the outreach was canceled"
      - name: canceled_by
        description: "User who canceled the outreach"
      - name: denied_reason
        description: "Reason given when the outreach was denied"
      - name: did_npa_subset
        description: "Area-code subset requested for the outreach's sending numbers"
      - name: admin_edited_at
        description: "Timestamp when an admin last edited the outreach"
      - name: admin_edited_by
        description: "Admin who last edited the outreach"
      - name: canceled_by_admin
        description: "Whether the cancellation came from an admin rather than the user"
      - name: billable_text_count
        description: "Number of texts billed for the outreach, which can differ from text_count"
      - name: campaign_outreach_id
        description: "ID of the campaign outreach record this outreach belongs to"
      - name: canvass_requested_at
        description: "Timestamp when a canvass was requested for the outreach"
      - name: scheduled_local_date
        description: "Send date in the recipient's local time, stored as text"
      - name: scheduled_local_time
        description: "Send time in the recipient's local time, stored as text"
      - name: phone_banking_list_id
        description: >
          Foreign key to the frozen phone banking call list. Non-null only on
          nativePhoneBanking rows, which is how an in-product call list joins
          back to its campaign.
      - name: door_knocking_turf_id
        description: >
          Foreign key to the drawn door knocking turf. Stops hang off the turf
          rather than the route, and a turf can exist before a route is
          generated, so this is the more complete anchor for door knocking
          activity than door_knocking_route_id.
      - name: campaign_plan_due_date
        description: "Due date for the associated campaign plan, stored as text"
      - name: door_knocking_route_id
        description: >
          Foreign key to the frozen door knocking route. Non-null only on
          nativeDoorKnocking rows, which is how an in-product walk route joins
          back to its campaign.
      - name: stripe_checkout_session_id
        description: "Stripe checkout session backing a paid outreach"
    data_tests:
      # The product scopes an outreach by campaign (Win) or by organization alone
      # (Serve). A row with neither has no owner and should still fail loudly.
      - dbt_utils.expression_is_true:
          arguments:
            expression: campaignId is not null or organization_slug is not null
