models:
  - name: stg_airbyte_source__ballotready_api_election
    description: Election data scan from [`elections` query](https://developers.civicengine.com/docs/api/graphql/reference/queries/elections)
    columns:
      - name: database_id
        description: Identifies the primary key from the database.
        data_tests:
          - not_null
          - unique
      - name: id
        description: Identifies the primary key from the database.
        data_tests:
          - not_null
          - unique
      - name: race_count
        description: >
          Number of races in this election. Special elections consistently
          have very low race counts (1-6 observed).
        data_tests:
          - dbt_utils.expression_is_true:
              # Guard against false positives in special election detection.
              # BallotReady special elections in 2026+ have 1-6 races; a
              # match with >10 races likely indicates a regular election
              # whose name coincidentally contains "special".
              arguments:
                expression: "<= 10"
              config:
                where: "is_special and election_day >= '2026-01-01'"
      - name: is_special
        description: >
          True when the election is a special election. Derived from
          `lower(name) like '%special%'`; BallotReady's editorial team
          consistently embeds "Special" in the election name for special
          elections.
        data_tests:
          - not_null
  - name: stg_airbyte_source__ballotready_api_issue
    description: Issue data scan from [`issues` query](https://developers.civicengine.com/docs/api/graphql/reference/queries/issues)
    columns:
      - name: databaseId
        description: Identifies the primary key from the database.
        data_tests:
          - not_null
          - unique
      - name: id
        description: Identifies the primary key from the database.
        data_tests:
          - not_null
          - unique
  - name: stg_airbyte_source__ballotready_api_mtfcc
    description: MTFCC data scan from [`mtfcc` query](https://developers.civicengine.com/docs/api/graphql/reference/queries/mtfcc). Note that the documentation is incorrect and `createdAt` nor `updatedAt` are not present in the data.
    columns:
      - name: databaseId
        description: Identifies the primary key from the database.
        data_tests:
          - not_null
          - unique
      - name: id
        description: Identifies the primary key from the database.
        data_tests:
          - not_null
          - unique
  - name: stg_airbyte_source__ballotready_api_place
    description: Place data scan from [`places` query](https://developers.civicengine.com/docs/api/graphql/reference/queries/places)
    columns:
      - name: database_id
        description: Identifies the primary key from the database.
        data_tests:
          - not_null
          - unique
      - name: id
        description: Identifies the primary key from the database.
        data_tests:
          - not_null
          - unique
  - name: stg_airbyte_source__ballotready_api_position
    description: Position data scan from [`positions` query](https://developers.civicengine.com/docs/api/graphql/reference/queries/positions)
    columns:
      - name: database_id
        description: Identifies the primary key from the database.
        data_tests:
          - not_null
          - unique
      - name: id
        description: Identifies the primary key from the database.
        data_tests:
          - not_null
          - unique
      - name: level
        description: The level of the position.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - CITY
                  - COUNTY
                  - FEDERAL
                  - LOCAL
                  - REGIONAL
                  - STATE
                  - TOWNSHIP
      - name: is_judicial
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_appointed
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_retention
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_partisan
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: has_primary
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_staggered_term
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: must_be_resident
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: has_unknown_boundaries
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: must_be_registered_voter
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: has_majority_vote_primary
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: has_ranked_choice_general
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: has_ranked_choice_primary
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: must_have_professional_experience
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
  - name: stg_airbyte_source__ballotready_api_position_to_place
    description: Position data scan from [`positions` query](https://developers.civicengine.com/docs/api/graphql/reference/queries/positions)
    columns:
      - name: database_id
        description: Identifies the primary key from the database.
        data_tests:
          - not_null
          - unique
      - name: id
        description: Identifies the primary key from the database.
        data_tests:
          - not_null
          - unique
  - name: stg_airbyte_source__ballotready_api_race_with_superseded
    description: >
      Every race the Airbyte `races` stream has landed, including copies BallotReady
      has since deleted. The stream is incremental, so a race BallotReady deletes and
      re-creates for the same position, election and stage lands twice.
      `is_superseded` flags the extra copies. Most consumers want
      `stg_airbyte_source__ballotready_api_race`, which excludes them.
    columns:
      - name: database_id
        data_tests:
          - not_null
          - unique
      - name: is_superseded
        description: >
          True for every race but one in its position, election, primary, runoff,
          recall and unexpired-term group. The kept race is one with candidacies if
          any has them, then the newest. A race with candidacies is never flagged.
        data_tests:
          - not_null
      - name: superseded_by_database_id
        description: >
          For a superseded race, the race kept in its place. Null otherwise.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_airbyte_source__ballotready_api_race')
                field: database_id
  - name: stg_airbyte_source__ballotready_api_race
    description: >
      Race data scan from [`races` query](https://developers.civicengine.com/docs/api/graphql/reference/queries/races),
      one race per stage: copies BallotReady deleted and re-created are excluded
      (see `stg_airbyte_source__ballotready_api_race_with_superseded`).
    columns:
      - name: database_id
        description: Identifies the primary key from the database.
        data_tests:
          - not_null
          - unique
      - name: id
        description: Identifies the primary key from the database.
        data_tests:
          - not_null
          - unique
