  - name: stg_airbyte_source__stripe_api_charges
    description: >
      Every payment attempt against the Stripe account, successful or not.

      This is the only stream that sees all the money. Stripe raises an invoice
      for the recurring subscription and for nothing else, so one-off purchases
      (domain registrations, text outreach, sales-led checkout) arrive here as
      a bare charge and never appear in the invoice stream at all.

      Times arrive as epoch seconds and amounts as integer cents; both are
      converted here. Internal only.
    columns:
      - name: charge_id
        description: Stripe charge id. Primary key.
        data_tests:
          - unique
          - not_null
      - name: stripe_customer_id
        description: >
          Customer the charge was taken against. Null on a small number of
          charges taken with no customer, where product_user_id is the only
          route back to a person.
      - name: invoice_id
        description: >
          Invoice this charge settled, if any. Present only for subscription
          billing, and unreliable after 2026-02-16 even there.
      - name: payment_intent_id
        description: >
          Payment intent behind the charge. Not ingested as its own stream,
          which is why the product metadata below goes dark once checkout moved
          behind it.
      - name: balance_transaction_id
        description: Ledger entry for the charge.
      - name: charge_status
        description: Stripe charge status. Money moved only on succeeded.
        data_tests:
          - not_null
      - name: is_paid
        description: Stripe's own paid flag for the charge.
      - name: is_captured
        description: >
          Funds were captured. An authorised but uncaptured charge took no
          money, so revenue reads succeeded and captured together.
      - name: is_fully_refunded
        description: The whole charge was refunded.
      - name: is_disputed
        description: The charge is under dispute.
      - name: is_livemode
        description: >
          The charge was taken in live mode. A couple of hundred test-mode
          charges exist and are excluded from any revenue figure.
      - name: currency
        description: Currency of the charge. Every row to date is usd.
      - name: amount_usd
        description: Amount of the charge.
      - name: amount_captured_usd
        description: Amount actually captured, which is what was collected.
      - name: amount_refunded_usd
        description: How much of the capture has since been refunded.
      - name: created_at
        description: When the charge was created.
        data_tests:
          - not_null
      - name: updated_at
        description: When the charge record last changed.
      - name: description
        description: >
          Stripe's own description. Localised for a handful of rows, so it is a
          weak classifier on its own.
      - name: receipt_email
        description: Address the receipt was sent to.
      - name: failure_code
        description: Stripe decline code on a failed charge.
      - name: failure_message
        description: Human-readable decline reason on a failed charge.
      - name: payment_method_type
        description: Card, link, cashapp, bank account and so on.
      - name: payment_type
        description: >
          What the product says was bought: outreach_purchase,
          domain_registration, poll. Null on every charge after 2026-02-16,
          when checkout moved behind a payment intent and the metadata went
          with it.
      - name: purchase_type
        description: The product's coarser label for the same purchase.
      - name: product_user_id
        description: >
          gp-api user the product stamped on the charge. The only link to a
          person for charges taken with no Stripe customer.
      - name: product_campaign_id
        description: Campaign the purchase was made for.
      - name: product_website_id
        description: Website a domain registration belongs to.
      - name: domain_name
        description: Domain bought, on a domain registration.
      - name: outreach_type
        description: Channel bought, on an outreach purchase.
      - name: outreach_contact_count
        description: Contacts bought, on an outreach purchase.
      - name: hs_checkout_session_id
        description: >
          HubSpot commerce checkout session behind the charge. These keep their
          metadata throughout and are how sales-led purchases are told apart
          from self-serve ones.
      - name: hs_portal_id
        description: HubSpot portal that took the payment.
      - name: _airbyte_extracted_at
        description: When the record was extracted from the Stripe API.
        data_tests:
          - not_null

