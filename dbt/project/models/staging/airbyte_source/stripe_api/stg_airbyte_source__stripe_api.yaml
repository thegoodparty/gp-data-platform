  - name: stg_airbyte_source__stripe_api_invoices
    description: >
      Stripe invoices, which for this account means the recurring subscription
      and nothing else. One-off purchases never raise one, so an invoice-only
      revenue figure is subscription revenue rather than total revenue. Times
      arrive as epoch seconds and amounts as integer cents; both are converted
      here. Internal only.
    columns:
      - name: invoice_id
        description: Stripe invoice id. Primary key.
        data_tests:
          - unique
          - not_null
      - name: stripe_customer_id
        description: Customer the invoice was raised against.
      - name: subscription_id
        description: Subscription the invoice bills.
      - name: charge_id
        description: Charge that settled the invoice.
      - name: invoice_number
        description: Human-facing invoice number.
      - name: invoice_status
        description: >
          draft, open, paid, void or uncollectible. Only paid moved money;
          open is an unpaid attempt and void a cancelled one.
        data_tests:
          - not_null
      - name: is_paid
        description: The invoice was paid in full.
      - name: billing_reason
        description: >
          Why the invoice was raised: subscription_create for the first period,
          subscription_cycle for each renewal.
      - name: is_deleted
        description: Airbyte's deletion marker for the record.
      - name: is_livemode
        description: The invoice was raised in live mode.
      - name: currency
        description: Currency of the invoice. Every row to date is usd.
      - name: total_usd
        description: Invoice total.
      - name: amount_due_usd
        description: Amount billed.
      - name: amount_paid_usd
        description: Amount collected.
      - name: amount_remaining_usd
        description: Amount still outstanding.
      - name: created_at
        description: When the invoice was created.
        data_tests:
          - not_null
      - name: updated_at
        description: When the invoice record last changed.
      - name: effective_at
        description: Date the invoice takes accounting effect.
      - name: period_start_at
        description: Start of the billing period covered.
      - name: period_end_at
        description: End of the billing period covered.
      - name: paid_at
        description: >
          When the money actually arrived, as against when the invoice was
          raised. The two differ whenever a payment retried.
      - name: voided_at
        description: When the invoice was voided, if it was.
      - name: _airbyte_extracted_at
        description: When the record was extracted from the Stripe API.
        data_tests:
          - not_null

