  - name: stg_airbyte_source__stripe_api_subscriptions
    description: >
      Stripe subscriptions for the Pro plan, one row per subscription.

      Two traps this layer does not paper over. is_deleted marks a cancellation
      event rather than a row to drop: it is true for well under half the
      cancelled subscriptions, so filtering on it silently loses the rest. And
      a subscription set to cancel at period end is still active while already
      carrying a cancellation date, so churn keys on subscription_status and
      never on canceled_at. Internal only.
    columns:
      - name: subscription_id
        description: Stripe subscription id. Primary key.
        data_tests:
          - unique
          - not_null
      - name: stripe_customer_id
        description: Customer the subscription belongs to.
      - name: schedule_id
        description: Subscription schedule, where one drives the subscription.
      - name: latest_invoice_id
        description: Most recent invoice raised against the subscription.
      - name: subscription_status
        description: >
          Stripe subscription status. incomplete_expired means a checkout that
          was never active, so counting it as churn overstates churn.
        data_tests:
          - not_null
      - name: will_cancel_at_period_end
        description: >
          Cancellation is scheduled for the end of the current period. The
          subscription is still active until then.
      - name: is_deleted
        description: >
          Airbyte's deletion marker. Set on some cancelled subscriptions and
          not others, so it is not a filter.
      - name: is_livemode
        description: The subscription was created in live mode.
      - name: currency
        description: Currency of the subscription. Every row to date is usd.
      - name: quantity
        description: Units of the plan subscribed to.
      - name: plan_id
        description: Stripe plan the subscription bills.
      - name: plan_nickname
        description: Human-facing plan name.
      - name: plan_interval
        description: Billing interval of the plan.
      - name: plan_amount_usd
        description: Recurring amount of the plan.
      - name: created_at
        description: When the subscription record was created.
        data_tests:
          - not_null
      - name: updated_at
        description: When the subscription record last changed.
      - name: started_at
        description: When the subscription began billing.
      - name: trial_started_at
        description: Start of the trial, where there was one.
      - name: trial_ends_at
        description: End of the trial, where there was one.
      - name: current_period_start_at
        description: Start of the current billing period.
      - name: current_period_end_at
        description: End of the current billing period.
      - name: cancel_at
        description: Scheduled cancellation date, where one is set.
      - name: canceled_at
        description: >
          When cancellation was requested. Present on active subscriptions set
          to cancel at period end, which is why it does not define churn.
      - name: ended_at
        description: When the subscription actually ended.
      - name: _airbyte_extracted_at
        description: When the record was extracted from the Stripe API.
        data_tests:
          - not_null

