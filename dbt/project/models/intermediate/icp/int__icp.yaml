version: 2

models:
  - name: int__icp_offices
    description: "ICP offices with voter counts and census population per district (state, district type, and district name)"
    columns:
      - name: br_database_position_id
        description: "BallotReady database position ID"
        tests:
          - not_null
          - unique
      - name: br_position_id
        description: "BallotReady position ID"
        tests:
          - not_null
          - unique
      - name: state
        description: "State"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ get_us_states_list(include_DC=true, include_US=false) }}"
      - name: br_position_name
        description: "BallotReady position name"
        tests:
          - not_null
      - name: normalized_position_type
        description: "Normalized position type"
      - name: l2_district_name
        description: "L2 district name"
      - name: l2_district_type
        description: "L2 district type"
      - name: is_matched
        description: "Flag indicating if position is matched to L2 district"
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: district_population
        description: >
          Census constituents in the district, from int__district_population.
          Carried for sizing and market analysis; no ICP gate reads it. Null
          where the district's type falls outside the allocation's curated
          type set, so it is not yet a drop-in replacement for voter_count.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
              row_condition: "district_population is not null"
      - name: voter_count
        description: >
          L2 registered voters in the matched district, and the input to all
          three ICP gates. Resolved on the exact district name first, falling
          back to the normalized name (case, whitespace, trailing "(EST.)") when
          the exact name finds nothing, since the match snapshot carries naming
          drift the aggregations table does not. NULL only where neither
          spelling resolves, which leaves the ICP gates NULL rather than false.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
              row_condition: "voter_count is not null"
      - name: judicial
        description: "Flag indicating if position is judicial"
      - name: appointed
        description: "Flag indicating if position is appointed"
      - name: icp_office_win
        description: "ICP-Office-Win flag (true for districts with 500-100,000 voters)"
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: icp_office_serve
        description: "ICP-Office-Serve flag (true for districts with 1,000-100,000 voters)"
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: icp_win_supersize
        description: "ICP-Win-Supersize flag (true for offices meeting all ICP criteria but with >100,000 voters, needing separate consideration)"
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
