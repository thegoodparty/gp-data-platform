version: 2

models:
  - name: int__user_resolved_keys
    description: >
      The keys that reach each downstream source, at gp-api user grain. One row
      per user in the civics users mart.

      Grain: one row per user_id. Deliberately not person grain. Collapsing the
      about 1,120 humans who hold more than one account would cost an aggregation
      rule per activity column, one of which (distinct active days) cannot be
      summed at all, and would do nothing for team accounts, where several
      different humans work one campaign. The person key is carried instead, so
      an account-spanning view is a group by rather than a rebuild.

      Read this rather than the scalar gp_api_user_id and hs_contact_id columns
      on the people mart: both go null exactly when the person group holds more
      than one such record, so a scalar join drops the ambiguous rows without
      saying so.
    columns:
      - name: user_id
        description: gp-api user id. Primary key.
        data_tests:
          - unique
          - not_null
      - name: gp_person_id
        description: >
          Canonical person for this account, from the civics person graph.
          Null only for a user who signed up between the person-graph rebuild
          and this build, so a handful of the very newest accounts can lack one
          until the next run. Not a durable external identifier either: it
          retires when two person groups merge and the other group's minting
          record is earlier, and election-api's PersonMerge is the forwarding
          address.
        data_tests:
          - not_null:
              config:
                severity: error
                warn_if: ">0"
                error_if: ">100"
      - name: account_count
        description: >
          gp-api accounts in this row's person group. Greater than one means
          the same human signed up more than once. Counted over the accounts
          present in this table, which can be a strict subset of the person
          graph's gp-api membership.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 50
                inclusive: true
      - name: is_primary_account
        description: >
          Earliest gp-api record in the person group by first_seen_at, tie
          broken by user_id. Exactly one account per person carries it, so
          filtering on it yields one row per person. Deliberately not the
          record that minted the person id: only 61% of user persons are minted
          by a gp-api record, so a mint-based flag would be false for every
          account of the remainder.
        data_tests:
          - not_null
      - name: hubspot_contact_id
        description: >
          The HubSpot contact for this user, resolved through the person graph.
          Null when the person group reaches no live contact, which is 11.7% of
          users. Never read the user row's own hubspot_contact_id instead: it is
          carried by more users but 5,241 of those ids point at a contact that
          no longer exists, so it resolves fewer live contacts than this does.
      - name: hubspot_contact_count
        description: >
          Live HubSpot contacts the person group reaches, floored at one whenever
          a contact was named, because a contact can resolve through the user's
          own id while the person graph does not hold that contact. Kept at the
          full count otherwise, so a consumer can see the fan-out. Greater than
          one for about 1,480 persons.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: hubspot_key_source
        description: >
          How the contact was reached. own_live_id means the user's own id
          pointed at a contact that still exists. person_group means it did not
          and the graph supplied one. none means no live contact was reachable,
          and hubspot_contact_id is null.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["own_live_id", "person_group", "none"]
      - name: stripe_customer_id
        description: >
          Stripe customer for this account, the user staging model's
          stripe_customer_id. A native foreign key our product writes at
          checkout, so this is a join rather than a match, and Stripe is
          deliberately not a person-graph source. Null for the large majority
          of users, who have never paid.
      - name: stripe_customer_count
        description: >
          User accounts carrying this row's Stripe customer id. Greater than one
          for about 41 ids, where one human paid from two accounts. Lifetime
          revenue must sum over distinct customer ids or it double counts those.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: owns_organization
        description: >
          The user owns at least one organization, Win or Serve. Carried partly
          so the size of the team-accounts problem stays measurable: a user who
          owns nothing is either an abandoned signup or an invited team member,
          and today those two cannot be told apart.
        data_tests:
          - not_null
      - name: team_member_count
        description: >
          Always null. Team membership is not ingested, so a staffer cannot be
          distinguished from an abandoned signup. Null rather than zero, because
          a zero meaning "unknown" cannot be told from a real zero. Populate it
          when the membership stream lands.
    # An empty build of this model passes every ratio-based test in this file,
    # coverage tests included: count(x) * 100.0 / count(*) is 0/0 -> null, and
    # a `where pct < N` filter on null is false, so zero rows means PASS. A row
    # count floor is what actually catches an empty build.
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 60000

  - name: int__key_resolution_exceptions
    description: >
      Source records that should reach a gp-api user and do not, so "resolves to
      nobody" is counted rather than dropped.

      Grain: one row per source record. Stripe only today; the shape allows more
      sources later.

      HubSpot contributes nothing here on purpose. A contact with no user is a
      prospect, not an exception, and at 362,299 contacts against about 72,200
      users those rows would bury the few hundred that matter. HubSpot
      non-coverage is counted from the user side, on hubspot_key_source.
    columns:
      - name: source_name
        description: Source system the unresolved record came from.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["stripe"]
      - name: source_id
        description: Native identifier within that source.
        data_tests:
          - not_null
      - name: reason_code
        description: Why the record did not resolve.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["stripe_customer_no_user"]
      - name: first_seen_at
        description: >
          Source-native created timestamp for the record. Converted from the
          Stripe epoch-seconds integer, which the connector lands unmodified and
          the customers staging model passes through without casting.
      - name: has_subscription
        description: The customer holds any Stripe subscription.
        data_tests:
          - not_null
      - name: has_active_subscription
        description: >
          The customer holds an active, trialing or past_due subscription. True
          here means live revenue with no product account, which is the case
          worth acting on rather than merely counting.
        data_tests:
          - not_null
      - name: lifetime_paid_usd
        description: >
          Everything this unreachable customer has paid, over succeeded and
          captured charges. Roughly a quarter of all money the account has
          collected sits on rows here, which is the measure of what a revenue
          column at user grain cannot see.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: payment_count
        description: Succeeded, captured charges against the customer.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: email_match_available
        description: >
          The customer's Stripe email exactly matches a gp-api user's, which
          holds for about three quarters of these rows and most of the stranded
          money. Measured, not acted on: closing it is entity resolution work.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_name, source_id]

  - name: int__user_hubspot_touches
    description: >
      Sales and marketing contact history at gp-api user grain. One row per
      user per HubSpot engagement, across calls, emails, meetings, SMS, tasks,
      notes and chat sessions.

      Grain: one row per user_id and touch_id. A single engagement appears
      more than once when it reaches two users, which is what happens when one
      human holds two accounts or when a thread names two people. It is
      deliberately not duplicated when two contacts in the same person group
      share it.

      Touch history follows every HubSpot contact the user's person group
      reaches, not only the contact named on user_resolved_keys. Following the
      named contact alone leaves 665 users with no history at all and drops
      13% of touches, while the extra contacts are overwhelmingly the same
      human under a second email address.

      Calls are read from int__hubspot_calls, which dedupes the call stream and
      attaches the disposition. The generic engagement stream carries the same
      call ids without it and is filtered to exclude them, so a call is never
      counted twice.
    columns:
      - name: user_id
        description: gp-api user this touch reaches.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int__user_resolved_keys')
                field: user_id
      - name: touch_id
        description: HubSpot engagement id.
        data_tests:
          - not_null
      - name: contact_id
        description: >
          The HubSpot contact the touch was reached through. Where two contacts
          in the person group share an engagement, the lower id is kept so the
          touch counts once.
        data_tests:
          - not_null
      - name: channel
        description: >
          Normalized engagement type. A HubSpot type we have not mapped lands
          as other rather than disappearing.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  [
                    "call",
                    "email",
                    "inbound_email",
                    "meeting",
                    "sms",
                    "task",
                    "note",
                    "conversation",
                    "other",
                  ]
      - name: is_outbound_touch
        description: >
          We reached out to the person: a call, email, meeting or SMS. Tasks,
          notes, inbound mail and chat sessions are carried as history and are
          never counted as contact made, which is what touch_count_total sums.
        data_tests:
          - not_null
      - name: is_connected_call
        description: >
          The call reached a human, from the disposition's outcome family. Null
          for every channel but calls.
      - name: touch_at
        description: >
          When the activity happened, not when HubSpot recorded it. Meetings
          and tasks can be in the future: a booked meeting and a task due date
          are both legitimate rows here.
        data_tests:
          - not_null
      - name: hubspot_owner_id
        description: >
          Owner on the engagement, which is the rep who made the touch. Null on
          activity logged without one.
      - name: call_outcome_family
        description: >
          Disposition family from the hubspot_call_dispositions seed. Null for
          every channel but calls.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, touch_id]

  - name: int__user_hubspot_profile
    description: >
      The HubSpot slice of the end-to-end user view: how we acquired a user and
      how much sales contact they have had, at gp-api user grain. One row per
      user whether or not they reach a HubSpot contact.

      Only facts HubSpot originates are read here. A field being present in
      HubSpot does not make HubSpot its system of record: the contact's
      utm_source is populated on 60 of 362k contacts while product telemetry
      carries the real thing for everyone, so UTMs are deliberately absent.

      Counts are zero where we can see HubSpot and nothing happened, and null
      where we cannot see it at all. Reading one as the other reports an
      unresolved user as an uncontacted one.
    columns:
      - name: user_id
        description: gp-api user id. Primary key.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int__user_resolved_keys')
                field: user_id
      - name: has_hubspot_contact
        description: >
          The user reaches a live HubSpot contact. False for about 8,400
          users, whose every other column here is null by construction rather
          than zero.
        data_tests:
          - not_null
      - name: hubspot_unmatched_reason
        description: >
          Why the user reaches no contact. Null when they do. A native id that
          no longer resolves is kept apart from never having had one, because
          the first is a broken link and the second is an absent record.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  ["dangling_contact_id", "email_match_unresolved", "no_contact_found"]
      - name: hubspot_email_match_available
        description: >
          An exact email edge would reach a live contact for this unmatched
          user, which is true for about 4,100 of them. Null for users who
          already resolve. Closing the gap is entity resolution work, not this
          model's.
      - name: hubspot_contact_count
        description: Live HubSpot contacts in the user's person group.
      - name: hs_owner_id
        description: HubSpot owner assigned to the contact, which is the salesperson.
      - name: hs_lifecycle_stage
        description: HubSpot's own lifecycle stage for the contact.
      - name: hs_win_lifecycle_stage
        description: Win-specific lifecycle stage, maintained separately in HubSpot.
      - name: hs_serve_lifecycle_stage
        description: Serve-specific lifecycle stage, maintained separately in HubSpot.
      - name: hs_analytics_source
        description: >
          HubSpot's account of how the contact arrived. OFFLINE means the
          contact was put into HubSpot by an import or integration rather than
          arriving through its own web session.
      - name: hs_analytics_source_detail
        description: >
          The drill-down under that source: the landing page for a web source,
          IMPORT or INTEGRATION for an offline one.
      - name: hs_conversion_source
        description: Source of the session in which the contact converted.
      - name: hs_contact_created_at
        description: When the HubSpot contact record was created.
      - name: hs_first_analytics_at
        description: First web session HubSpot attributes to the contact.
      - name: hs_last_contacted_at
        description: HubSpot's own last-contacted stamp, across channels.
      - name: first_touch_at
        description: >
          Earliest moment of contact we know of, from HubSpot contact creation,
          HubSpot's first analytics timestamp or signup, whichever is first.
          Falls back to signup for a user with no contact.
        data_tests:
          - not_null
      - name: first_touch_is_signup
        description: >
          The first touch is the signup itself, so there was no earlier
          marketing contact. True for roughly two thirds of the table, which
          is why no lead-time average should be computed without filtering on
          it: the population it means anything for is about 25,000, not the
          64,000 who reach a contact.
        data_tests:
          - not_null
      - name: acquisition_motion
        description: >
          Whether sales or marketing sourced the user. Sales-sourced is an
          OFFLINE analytics source, meaning we put the contact into HubSpot;
          all but a few hundred of those are list imports. Two independent
          signals agree with the split, and neither is an input to it: 91% of
          offline-sourced contacts predate signup by a day or more against 12%
          of web-sourced ones, and 93% of them have been contacted against
          29%. Owner assignment is deliberately not part of the rule, since
          91% of matched users carry an owner and it separates nothing.

          Unknown covers two states, and the second is defensive: a user who
          reaches no contact, and a resolved contact carrying no analytics
          source. No matched contact is in the second state today, so unknown
          is in practice the no-contact population. If that changes, the split
          is worth a fourth value rather than a silent merge.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["marketing_sourced", "sales_sourced", "unknown"]
      - name: call_count
        description: Calls logged against the user.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: connected_call_count
        description: Of those, the ones that reached a human.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: email_count
        description: Sales emails sent to the user. Inbound replies are counted separately.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: meeting_count
        description: >
          Meetings booked with the user, which includes meetings still in the
          future.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: sms_count
        description: SMS sent to the user.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: inbound_email_count
        description: >
          Emails the user sent us. A reply is engagement, not contact made, so
          this stays out of touch_count_total.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: task_count
        description: >
          Internal tasks logged against the contact. Work we planned rather
          than contact the person received, so it stays out of
          touch_count_total.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: note_count
        description: Internal notes on the contact. Also not contact made.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: touch_count_total
        description: Calls plus emails plus meetings plus SMS.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: first_call_at
        description: First logged call.
      - name: last_call_at
        description: Most recent logged call.
      - name: first_email_at
        description: First sales email.
      - name: last_email_at
        description: Most recent sales email.
      - name: first_meeting_at
        description: First meeting booked.
      - name: last_meeting_at
        description: Most recent meeting booked, which can be in the future.
      - name: first_sms_at
        description: First SMS.
      - name: last_sms_at
        description: Most recent SMS.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              touch_count_total = call_count + email_count + meeting_count
              + sms_count
          config:
            where: has_hubspot_contact
      - dbt_utils.expression_is_true:
          arguments:
            expression: connected_call_count <= call_count
          config:
            where: has_hubspot_contact

  - name: int__user_revenue_profile
    description: >
      The revenue slice of the end-to-end user view: what a user has paid us
      and what state their subscription is in, at gp-api user grain. One row
      per user whether or not they ever paid.

      Money is read from charges, not invoices. Stripe raises an invoice for
      the Pro subscription and for nothing else, so an invoice-only total
      reports a user who bought a domain, a text-outreach package or a
      sales-led plan as having paid nothing. Subscription revenue is about a
      third of what this account has collected from users who reach a row here.

      Amounts are gross of refunds unless the column says otherwise, and are
      zero rather than null for a user who never paid: no Stripe customer means
      they paid us nothing, which is a fact and not an absence. Internal only.
    columns:
      - name: user_id
        description: gp-api user id. Primary key.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int__user_resolved_keys')
                field: user_id
      - name: is_pro
        description: >
          The user holds Pro on at least one campaign. Campaign state, which is
          a different question from whether they paid: the flag and the Stripe
          customer disagree in both directions and neither corrects the other.
        data_tests:
          - not_null
      - name: pro_campaign_count
        description: How many of the user's campaigns carry the Pro flag.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: pro_since
        description: >
          When the user became Pro, as best it can be dated. Null for a user
          who is not Pro, and null for a Pro user neither route reaches.
      - name: pro_since_source
        description: >
          Which route dated it. The first Stripe subscription payment covers
          about half the Pro population. It is deliberately the subscription
          payment and not the first payment of any kind: a Pro user who bought
          a domain months earlier would otherwise be dated to that purchase,
          and a domain purchase is not a Pro signal. The campaign archive begins 2026-04-13, so it only
          contributes users who flipped while under observation; a user already
          Pro at first sighting would otherwise be dated to the day the archive
          opened. The rest are undated, and the column says so rather than
          leaving the reason to be guessed from a null.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  [
                    "stripe_first_subscription_payment",
                    "campaign_version_change",
                    "undated",
                  ]
      - name: has_stripe_customer
        description: The user row carries a Stripe customer id.
        data_tests:
          - not_null
      - name: shared_stripe_customer_user_count
        description: >
          How many user rows share this Stripe customer id. A handful sit on
          two.
      - name: is_primary_stripe_customer_row
        description: >
          True for a user whose Stripe customer is theirs alone, and for one of
          each shared pair. Both rows of a shared pair carry the customer's
          real total, because both accounts belong to the payer who made the
          charge; what that breaks is a sum across the table. Filter on this
          when totalling any money column, or the total overstates collections
          by about 1%.
        data_tests:
          - not_null
      - name: payment_count
        description: Succeeded, captured charges reaching the user.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: lifetime_paid_usd
        description: Everything the user has paid us, gross of refunds.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: lifetime_refunded_usd
        description: How much of that has been refunded.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: lifetime_net_usd
        description: Paid less refunded. The figure finance recognises.
        data_tests:
          - not_null
      - name: subscription_paid_usd
        description: The Pro subscription leg, charges that raised an invoice.
        data_tests:
          - not_null
      - name: one_off_paid_usd
        description: >
          Named one-off purchases: domain registrations, text outreach, polls.
          Only charges carrying the product's own checkout metadata land here.
        data_tests:
          - not_null
      - name: sales_led_paid_usd
        description: >
          Purchases taken through HubSpot commerce rather than the product.
          The largest single revenue line and almost invisible from the Pro
          flag, since most of these buyers never held it.
        data_tests:
          - not_null
      - name: unclassified_paid_usd
        description: >
          Own-product one-offs taken after 2026-02-16, when checkout moved
          behind a payment intent this connector does not ingest and its
          metadata went with it. The dollars are the user's and are counted in
          the lifetime total; only the purchase line is unknown. Kept as its
          own column so the gap is visible rather than folded into a named
          line.
        data_tests:
          - not_null
      - name: first_payment_at
        description: The user's first succeeded payment. Null if they never paid.
      - name: last_payment_at
        description: Their most recent succeeded payment.
      - name: first_subscription_payment_at
        description: >
          Their first succeeded subscription payment, which is what dates Pro.
          Null for a payer who only ever bought one-offs or bought through
          sales, of whom there are a few dozen.
      - name: subscription_status
        description: >
          Stripe status of the user's current subscription, which is the live
          one where there is one and otherwise the most recent, so a churned
          user keeps the subscription they churned out of. Churn keys on this,
          never on subscription_canceled_at, because a subscription set to
          cancel at period end is still active and already carries a date.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  [
                    "active",
                    "past_due",
                    "unpaid",
                    "canceled",
                    "incomplete",
                    "incomplete_expired",
                    "trialing",
                    "paused",
                  ]
      - name: subscription_count
        description: Subscriptions ever held against the user's Stripe customer.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: has_active_subscription
        description: >
          The current subscription is active, trialing or past_due. False, not
          null, for a user who never had one.
        data_tests:
          - not_null
      - name: subscription_started_at
        description: When the current subscription began.
      - name: subscription_canceled_at
        description: >
          When cancellation was requested. Present on some active
          subscriptions, which is why it does not define churn.
      - name: subscription_ended_at
        description: When the subscription actually ended.
      - name: subscription_period_end_at
        description: End of the current billing period.
      - name: subscription_will_cancel_at_period_end
        description: Cancellation is scheduled for the end of the current period.
      - name: subscription_plan_amount_usd
        description: Recurring amount of the plan on the current subscription.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              subscription_paid_usd + one_off_paid_usd + sales_led_paid_usd
              + unclassified_paid_usd = lifetime_paid_usd
      - dbt_utils.expression_is_true:
          arguments:
            expression: lifetime_net_usd <= lifetime_paid_usd
      - dbt_utils.expression_is_true:
          arguments:
            expression: last_payment_at >= first_payment_at
          config:
            where: first_payment_at is not null
      - dbt_utils.expression_is_true:
          arguments:
            expression: payment_count > 0
          config:
            where: lifetime_paid_usd > 0

  - name: int__user_product_activity
    description: >
      The product slice of the end-to-end user view: when a user first and last
      used the product, whether they ever made anything with it, and whether
      they were active in each of the last three calendar months. One row per
      user whether or not they ever appeared in Amplitude.

      Machine-emitted events are excluded from every activity read here, and the
      exclusion is not cosmetic: the dispatch schedulers alone name roughly 1,800
      users a month who did nothing, which was more than doubling the monthly
      active count.

      Activity columns are null, not zero, for a user with no telemetry. Product
      instrumentation starts in April 2025 and most of this table registered
      before that or never used the product; reading a null as a zero reports
      about half our users as inactive when we simply cannot see them.
      has_amplitude_data is the column that tells the two apart. The rolling
      window is the exception and is zero rather than null, because anyone active
      in the last three months is instrumented, so a zero there is a real zero.

      Internal only.
    columns:
      - name: user_id
        description: gp-api user id. Primary key.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int__user_resolved_keys')
                field: user_id
      - name: has_amplitude_data
        description: >
          Any non-machine product event was recorded for this user. False means
          we cannot see them, not that they were inactive. Roughly half the
          table.
        data_tests:
          - not_null
      - name: first_activity_at
        description: Their first recorded product event. Null where we have no telemetry.
      - name: last_activity_at
        description: Their most recent product event.
      - name: total_events
        description: All non-machine product events, all time.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: active_days_total
        description: Distinct days with product activity, all time.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: dashboard_view_count
        description: >
          Dashboard views across all three instrumentation eras, de-duplicated
          for the co-fire between the page event and whichever named surface
          event was live. An era-three-only read recovers about two thirds of
          this.
      - name: first_dashboard_viewed_at
        description: First candidate-dashboard view.
      - name: last_dashboard_viewed_at
        description: Most recent candidate-dashboard view.
      - name: onboarding_started_at
        description: >
          When they entered the onboarding flow: the earliest of each flow
          version's start event (Onboarding - Registration Completed, Onboarding
          - Welcome Completed, Onboarding V2 - Welcome Viewed). In the oldest
          version the start event is registration itself, so the gap from signup
          is near zero there.
      - name: onboarding_completed_at
        description: >
          When they finished the onboarding flow: the earliest of each flow
          version's pledge-completion event (onboarding_complete, Onboarding -
          Candidate Pledge Completed, Onboarding - Pledge Completed, Onboarding V2
          - Pledge Completed). No single event spans the 2026-05-07 and
          2026-06-08 rebuilds; the legacy onboarding_complete alone read 1 of
          4,122 post-May signups as onboarded. The pledge is the last step of every
          version so far; an explicit completion event is requested separately.
          Not users_win_base.is_onboarded, a dashboard view within 14 days.
      - name: is_onboarded
        description: They finished the onboarding flow, in any of its versions.
        data_tests:
          - not_null
      - name: product_output_at
        description: >
          When they first made something with the product that left it. Null for
          a user who never has.
      - name: has_product_output
        description: >
          They made something with the product that left it: a published
          website, a completed outreach send, an exported voter list, a
          downloaded call sheet. Broader than users_win_base.is_activated, which
          asks only whether we reached voters for them, and a different question
          rather than a better version of the same one. Never report one as the
          other. Definition owned by the win_product_output_users metric's
          anchored_on declaration.

          Three of its legs went live between July and September 2026, so any
          series reaching back before 2026-07 carries an instrumentation step
          that must not be read as growth.
        data_tests:
          - not_null
      - name: free_product_output_at
        description: When they first produced output through a leg that is not paywalled.
      - name: has_free_product_output
        description: >
          The paywall-free subset of has_product_output. Any model predicting
          engagement must use this as its label: most output legs sit behind Pro,
          so a model trained on the full column learns who paid and reports it as
          who engaged.
        data_tests:
          - not_null
      - name: serve_first_activity_at
        description: >
          First Serve product event, machine events excluded. Directional until
          the Serve activity spine is rebuilt.
      - name: serve_last_activity_at
        description: Most recent Serve product event, machine events excluded.
      - name: active_m0
        description: >
          At least one non-machine product event in the current calendar month.
          A deliberately low bar, chosen so this agrees with the MAU figures
          already in circulation rather than introducing a quieter second
          definition of the same word.
        data_tests:
          - not_null
      - name: active_m1
        description: The same, for the previous calendar month.
        data_tests:
          - not_null
      - name: active_m2
        description: The same, for the month before that.
        data_tests:
          - not_null
      - name: activity_days_m0
        description: Distinct active days in the current calendar month.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: activity_days_m1
        description: Distinct active days in the previous calendar month.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: activity_days_m2
        description: Distinct active days in the month before that.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: growth_state
        description: >
          The new / retained / resurrected / churned bucket diagram as a column:
          the current month's state from int__user_activity_monthly, which
          defines it. Null where we have no telemetry at all, because an unseen
          user belongs in no bucket.

          The current month is partial. On the 1st it reads zero new and zero
          retained until that day's events load, so compare it across builds
          with care.

          'dormant' is the fourth live value and covers most rows: active in none
          of the three months and not active in either of the two most recent.
          It is kept apart from 'churned' because calling an unseen signup
          churned claims we lost someone we may never have had.
        data_tests:
          - accepted_values:
              arguments:
                values: ["new", "retained", "resurrected", "churned", "dormant"]
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: last_activity_at >= first_activity_at
      # Free output is a subset of output, so it can never reach a user the
      # broader column does not. A failure here means the paywalled markers and
      # the leg list have drifted apart.
      - dbt_utils.expression_is_true:
          arguments:
            expression: has_product_output
          config:
            where: has_free_product_output
      - dbt_utils.expression_is_true:
          arguments:
            expression: has_amplitude_data
          config:
            where: active_m0 or active_m1 or active_m2

  - name: int__user_activity_monthly
    description: >
      Each user's product activity month by month: one row per user per
      calendar month, from their first active month to the current one. The
      single monthly activity definition. int__user_product_activity reads its
      rolling flags and growth_state from here, and the cohort history exposes
      it, so the two cannot disagree.

      Same activity rule as the profile row: at least one non-machine product
      event in the month. Users with no telemetry have no rows. Events and
      calendar both start at the product_telemetry_start var (2025-04).

      Internal only.
    columns:
      - name: user_id
        description: gp-api user id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int__user_resolved_keys')
                field: user_id
      - name: activity_month
        description: First day of the calendar month.
        data_tests:
          - not_null
      - name: activity_days
        description: >
          Distinct days with a non-machine product event in the month. Zero for
          a month after the user's first in which they did nothing.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: growth_state
        description: >
          new: active, and this is their first active month. retained: active
          this month and last. resurrected: active this month, not last, but
          active at some point before. churned: inactive this month but active
          in one of the two before. dormant: inactive for three months or more.

          The current month is partial. On the 1st it reads zero new and zero
          retained until that day's events load; filter on is_partial_month to
          exclude it from a trend.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["new", "retained", "resurrected", "churned", "dormant"]
      - name: is_partial_month
        description: The month is the current one and still filling.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["user_id", "activity_month"]
      # Every user's grid starts on a month they were active.
      - dbt_utils.expression_is_true:
          arguments:
            expression: activity_days > 0
          config:
            where: growth_state = 'new'

  - name: int__user_election_anchor
    description: >
      The one election each user's row speaks for, and the six-month window
      running up to it. One row per user whether or not an election date
      reaches them.

      Calendar windows are the wrong frame for a candidate. Win-side activity
      is shaped by proximity to the election, not by the month, so anything
      measuring how hard someone campaigned has to be anchored on their own
      election date. Six months is measured rather than assumed: across all
      seven outreach sources the 90th percentile of days between a send and the
      election is at or under 180 for every channel, and the medians run 15 to
      55 days.

      Anchor rule, matching the candidacy columns on the wide user row: the
      latest non-demo campaign version, preferring the earliest election still
      ahead of the user, falling back to the most recent one behind them. Only
      about 70 users hold more than one campaign, so the rule is cheap, but it
      is fully ordered so a row cannot change basis between builds.
    columns:
      - name: user_id
        description: gp-api user id. Primary key.
        data_tests:
          - unique
          - not_null
      - name: anchor_campaign_id
        description: >
          The campaign whose election date this row uses. Null for a user with
          no non-demo campaign.
      - name: anchor_campaign_version_id
        description: Latest version of the anchor campaign.
      - name: election_date
        description: >
          Election date of the anchor campaign, or null. Restricted to a
          plausible range; the campaigns mart carries a few dozen rows outside
          it, including a year 24 and a year 275760, and unguarded date
          arithmetic on the latter overflows rather than returning a window.
      - name: election_date_status
        description: >
          Why a window is or is not computable, so a null count downstream is
          never read as a zero. About 43k of 72k users reach a usable election
          date.

          'upcoming' and 'past' are the two cases with a window. 'no_campaign'
          is a user who never started a run, 'no_election_date' is a run whose
          office never resolved to an election, and 'invalid_date' is a
          campaign carrying a date outside the plausible range. The last three
          are kept apart because they are different problems with different
          owners.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  ["upcoming", "past", "no_campaign", "no_election_date", "invalid_date"]
      - name: outreach_window_start
        description: Six months before the election date. Null without a window.
      - name: outreach_window_end
        description: The election date itself. Null without a window.
      - name: outreach_window_is_open
        description: >
          True when the election is still ahead, meaning the window is still
          filling. This is the trap the model exists to flag: a candidate two
          weeks into their six months has a low count because the window is
          young, not because they are quiet, and nothing about the count itself
          says so.

          False, never null, for a user with no window at all. Not having an
          open window is a fact rather than an unknown, and a null would drop
          all 29k of them out of `where not outreach_window_is_open`.
        data_tests:
          - not_null
      - name: outreach_window_days_total
        description: Length of the window in days. 181 to 184, depending on which months it spans.
      - name: outreach_window_days_elapsed
        description: >
          Days of the window that have already passed. Clamped at both ends:
          zero before the window opens, full length once the election is by. An
          unclamped difference goes negative for an election more than six
          months out and would divide the wrong way in any rate.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: outreach_window_end > outreach_window_start
          config:
            where: outreach_window_start is not null
      # A window exists for exactly the two statuses that have one, and every
      # window-derived column agrees about it. Covered as one expression rather
      # than per column because the failure is always the same: a windowless
      # user picking up a value, which then reads as a real zero downstream.
      #
      # days_elapsed is the one that has already gone wrong. greatest() skips
      # nulls in Spark rather than propagating them, so the guard in the model
      # is the only thing standing between 29k users and a spurious zero, and
      # the guard is easy to drop by accident.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              (election_date_status in ('upcoming', 'past'))
              = (
                election_date is not null
                and outreach_window_start is not null
                and outreach_window_end is not null
                and outreach_window_days_total is not null
                and outreach_window_days_elapsed is not null
              )

  - name: int__user_outreach_sends
    description: >
      Every voter-outreach send we can see, one row each, tagged with the
      channel it went out on and the source that knows about it.

      Read from two systems on purpose, because each is blind where the other
      sees. The product database holds the texting volume: half a million
      billable texts on the peer-to-peer flow, none of which reached Amplitude
      until the terminal event landed in late September 2026. Amplitude holds
      the legacy product-executed sends and the phone-banking sessions, whose
      product rows never had a terminal status written back and so sit at
      'pending' forever. Counted from either source alone the number is short
      by roughly the size of the other: about 1,280 users against 340,
      overlapping on 216.

      Where both sources see the same send the product database wins, since it
      is the one that knows the channel and the volume. The v2 terminal event
      carries an outreach id and every id it has emitted matches a product row,
      so that leg collapses exactly; the legacy events carry no id and fall
      back to same user, same day, matched per channel.

      Grain: one row per send, unique on send_key. Not unique on user_id.
    columns:
      - name: user_id
        description: gp-api user id. Not unique in this model.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int__user_resolved_keys')
                field: user_id
      - name: channel
        description: >
          The channel the send went out on.

          'unattributed' is not a channel but an honest gap, and it is about
          three quarters of the historical count. The legacy product-executed
          send fired without naming a channel and predates the property that
          would have, so guessing would put most of 2025 in whichever bucket we
          picked.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  [
                    "texting",
                    "robocall",
                    "social",
                    "door_knocking",
                    "phone_banking",
                    "unattributed",
                  ]
      - name: send_at
        description: >
          When the send went out. The scheduled send date where the candidate
          chose one, else when the row or event appeared. Legitimately in the
          future: a scheduled campaign is dated when it will go, not when it
          was booked.
        data_tests:
          - not_null
      - name: source
        description: Which system this row was read from.
        data_tests:
          - accepted_values:
              arguments:
                values: ["gp_api_outreach", "amplitude"]
      - name: basis
        description: >
          'committed' is a send we know went out. 'requested' is one we only
          know was asked for: the 2025-era text and robocall rows carry a
          script, a message and a date but never a terminal status, because ops
          fulfilled them through an external vendor that did not write back.
          Dropping them loses most of the pre-2026 history and calling them
          sends asserts a delivery nobody confirmed, so they are counted
          separately downstream.
        data_tests:
          - accepted_values:
              arguments:
                values: ["committed", "requested"]
      - name: recipient_count
        description: >
          How many people the send reached, where the channel counts it. Null,
          never zero, everywhere else: a robocall to an unknown number of
          people is not a robocall to nobody.

          Reads the recipient count property only. The sibling voter-contacts
          property is the size of the audience the candidate selected, not the
          number reached: it is the only count the phone-banking event carries
          and its median there is over two thousand, so coalescing the two would
          report completing one call session as contacting a whole call list.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: send_key
        description: >
          Stable identity for one send. Primary key.

          The legacy leg carries no outreach id and fires several times in the
          same millisecond when a candidate commits a batch, so the fallback key
          needs a row discriminator. Those copies are distinct sends rather than
          echoes, and carry different recipient counts, 1,200 against 55,000 in
          one case; without the discriminator 107 real sends collapse into 50.
        data_tests:
          - unique
          - not_null

  - name: int__user_outreach_intensity
    description: >
      How hard a candidate campaigned in the six months running up to their own
      election. The outreach slice of the end-to-end user view, one row per
      user.

      Every count is anchored on the user's election date, never on the
      calendar. Two candidates who each sent four campaigns are not comparable
      if one was six weeks out and the other eighteen months out, and a
      calendar quarter mixes those together.

      Counts are zero where we can see the window and nothing happened in it,
      and null where there is no window to look at. About 29k of 72k users have
      no usable election date, and a zero there would report a missing office
      match as a candidate who did nothing.

      Two names deliberately differ from columns already in circulation. The
      lifetime total_campaigns_sent on the Win user base is an Amplitude-union
      count with no window; outreach_sent_count is windowed and routes each
      channel to the source that knows it. They will not match and are not
      meant to. outreach_first_sent_at is likewise not first_campaign_sent_at.

      There is no Serve equivalent, deliberately. A term is not an election, so
      an election-anchored window has no meaning for an elected official, and
      forcing a Serve number into one would be a quietly wrong column.
      Constituent outreach is real and measurable, but it needs its own event
      name and its own anchor.
    columns:
      - name: user_id
        description: gp-api user id. Primary key.
        data_tests:
          - unique
          - not_null
      - name: election_date
        description: Election date of the anchor campaign. Null without one.
      - name: election_date_status
        description: >
          Carried from the anchor model so a consumer can tell a real zero from
          an unknown without a second join.
        data_tests:
          - not_null
      - name: outreach_window_start
        description: Six months before the election date.
      - name: outreach_window_end
        description: The election date itself.
      - name: outreach_window_is_open
        description: >
          True when the election is still ahead. About 280 of the senders here
          are counted over a window that is still filling, so their counts are
          floors rather than totals.
      - name: outreach_window_days_total
        description: Length of the window in days.
      - name: outreach_window_days_elapsed
        description: >
          Days of the window already passed. Divide a count by this to compare
          an open window against a closed one, rather than comparing the raw
          counts.
      - name: outreach_sent_count
        description: >
          Committed sends inside the window. The headline intensity number.
          Zero inside a known window, null without one.
      - name: outreach_requested_count
        description: >
          Sends inside the window we only know were requested, from the 2025
          era whose terminal status was never written back. Kept separate so
          the headline count never asserts an unconfirmed delivery.
      - name: outreach_recipient_count
        description: >
          People reached by committed sends inside the window, where the
          channel counts them. Null even inside a window when no send carried a
          count, since a zero would claim a send reached nobody rather than
          that we cannot tell.
      - name: outreach_channel_count
        description: Distinct channels used inside the window.
      - name: outreach_first_sent_at
        description: First committed send inside the window. Not the lifetime first send.
      - name: outreach_last_sent_at
        description: Last committed send inside the window.
      - name: outreach_texting_count
        description: Committed texting sends inside the window.
      - name: outreach_robocall_count
        description: Committed robocall sends inside the window.
      - name: outreach_social_count
        description: Committed social sends inside the window.
      - name: outreach_door_knocking_count
        description: Completed door-knocking walks inside the window.
      - name: outreach_phone_banking_count
        description: Completed phone-banking sessions inside the window.
      - name: outreach_unattributed_count
        description: >
          Committed sends inside the window whose channel the instrumentation
          never recorded. About three quarters of the total, so it is published
          rather than folded into a channel it might not belong to. A channel
          breakdown that ignores this column will look far more complete than
          it is.
      - name: outreach_before_window_count
        description: >
          Committed sends earlier than six months before the election. Small by
          construction, since the 90th percentile of send timing sits inside the
          window.
      - name: outreach_after_election_count
        description: >
          Committed sends after the election date. Non-zero for a few dozen
          users and usually a signal about the anchor rather than the candidate:
          it means they have moved on to a cycle the anchor has not picked up.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: outreach_last_sent_at >= outreach_first_sent_at
          config:
            where: outreach_first_sent_at is not null
      # The null discipline this model turns on. A count must be null exactly
      # when there is no window, and a zero otherwise. Getting this backwards
      # reports 29k users with no election date as candidates who did nothing,
      # which is the single most likely way to misread the column.
      #
      # Every guarded count, not just the headline: they share one guard, so
      # they fail together, and a per-column test would only ever catch
      # whichever one someone edited.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              (election_date_status in ('upcoming', 'past'))
              = (
                outreach_sent_count is not null
                and outreach_requested_count is not null
                and outreach_channel_count is not null
                and outreach_texting_count is not null
                and outreach_robocall_count is not null
                and outreach_social_count is not null
                and outreach_door_knocking_count is not null
                and outreach_phone_banking_count is not null
                and outreach_unattributed_count is not null
                and outreach_before_window_count is not null
                and outreach_after_election_count is not null
              )
      # A channel breakdown that does not sum to the headline means a channel
      # was added to the send model and never given a column here.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              outreach_sent_count = outreach_texting_count + outreach_robocall_count
              + outreach_social_count + outreach_door_knocking_count
              + outreach_phone_banking_count + outreach_unattributed_count
          config:
            where: outreach_sent_count is not null

  - name: int__user_candidacy_profile
    description: >
      The run each user is on now, how it ended, and what they have run before.
      One row per user.

      Every candidacy_* column reads from the single anchor campaign version
      int__user_election_anchor picks, never assembled from several campaigns.
      A usable election date is what makes a candidacy: anchor campaigns with
      no date are empty shells, so their columns stay null with the prospects.

      Outcome comes from the civics candidacy for the anchor run, matched on the
      anchor date being one of its stage dates. A candidacy from another cycle
      never supplies this run's result.
    columns:
      - name: user_id
        description: gp-api user id. Primary key.
        data_tests:
          - unique
          - not_null
      - name: has_candidacy
        description: >
          The user has an anchor campaign with a usable election date. False
          means a prospect who never started a dated run, not missing data.
        data_tests:
          - not_null
      - name: candidacy_campaign_id
        description: The anchor campaign every candidacy_* column describes.
      - name: candidacy_office
        description: The office as entered in the product.
      - name: candidacy_normalized_position_name
        description: The office normalized against BallotReady.
      - name: candidacy_state
        description: State of the race.
      - name: candidacy_party
        description: >
          Party as entered, raw. Its casing and " Party" suffix vary by signup
          flow, which makes it a source tell; group by candidacy_party_normalized.
      - name: candidacy_party_normalized
        description: >
          Party through parse_party_affiliation, the macro the civics candidacy
          models apply to the same field: Independent, Nonpartisan, Democrat,
          Republican, Libertarian, Green, or Other. Blank reads null. Parties
          the macro does not name (Forward, Reform, Working Families) read Other.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Independent
                  - Nonpartisan
                  - Democrat
                  - Republican
                  - Libertarian
                  - Green
                  - Other
      - name: candidacy_partisan_type
        description: >
          Whether the race is partisan, as entered: nonpartisan, partisan, or
          partisan for primary only. Blank reads null.
      - name: candidacy_election_date
        description: >
          Election date of the anchor run. Every election-anchored duration
          measures to this.
      - name: candidacy_election_level
        description: City, county, state or federal.
      - name: candidacy_filing_deadline
        description: >
          Filing deadline, through the BallotReady position and the election
          date. Sparse by civics coverage, not by defect: the position, election
          and deadline links each narrow the population.
      - name: candidacy_position_id
        description: BallotReady position id for the race.
      - name: candidacy_office_category
        description: >
          The kind of office in plain terms (City Council, School Board, Mayor,
          County Supervisor, Special District Board, Judge and so on), from
          int__civics_position_office_type.office_category on the anchor
          campaign's BallotReady position. Null when the campaign has no
          position.
      - name: candidacy_office_level
        description: >
          Office level from the corroborated civics candidacy, raw: several
          casings and a few non-level labels. Group by
          candidacy_office_level_normalized instead.
      - name: candidacy_office_level_normalized
        description: >
          One of federal, state, county, city, township, local (school boards and
          special districts) or regional. BallotReady's level wins, cleaned of
          casing and stray labels (Presidential to federal, Statewide to state,
          junk such as N/A or Ballot Initiative dropped); the product's
          election_level fills the gaps. Null only when neither has a level.
        data_tests:
          - accepted_values:
              arguments:
                values: [federal, state, county, city, township, local, regional]
      - name: candidacy_is_pledged
        description: The anchor campaign took the GoodParty pledge.
      - name: candidacy_is_verified
        description: The anchor campaign passed verification.
      - name: candidacy_has_external_match
        description: >
          The anchor run is linked to a ballot data vendor (BallotReady, DDHQ or
          TechSpeed) through a civics candidacy on the anchor election date.
          Third-party evidence the run is real, unlike candidacy_is_verified,
          which is the product's own flag. Vendor-sourced candidacies only exist
          from 2026, so this is false for every earlier run by construction;
          never_filed is the era-safe ballot check. Null when there is no
          candidacy.
      - name: candidacy_is_pro
        description: The anchor campaign is on Pro.
      - name: candidacy_is_win_icp
        description: >
          The race is in the Win target market, with the ICP effective-date rule
          already applied.
      - name: candidacy_voter_count
        description: Registered voters in the district.
      - name: candidacy_voter_count_bucket
        description: >
          candidacy_voter_count in ranges whose edges are the ICP cutoffs: Win
          covers 500 to 100,000 voters, Serve 1,000 to 100,000, and over 100,000
          is supersize. Each range includes its lower edge, except that 100,000
          itself sits in "7. 50K to 100K" because the ICP includes it. Registered
          voters, not census population. Covers only the ICP's size rule; the
          office rules (no judicial, appointed or non-ICP positions) are in
          candidacy_is_win_icp, so an in-range bucket is not proof of ICP. The number prefix keeps the ranges in
          order. Null where there is no candidacy or the district is unsized.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  [
                    "1. under 500",
                    "2. 500 to 999",
                    "3. 1K to 5K",
                    "4. 5K to 10K",
                    "5. 10K to 25K",
                    "6. 25K to 50K",
                    "7. 50K to 100K",
                    "8. over 100K",
                  ]
      - name: candidacy_result
        description: >
          How the run ended at the deepest stage reached, from the civics
          candidacy's latest_stage_result. Always read with
          candidacy_latest_stage_reached. Filter to Won and Lost for any rate.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Won", "Lost", "Runoff", "Withdrew", "Not on Ballot"]
      - name: candidacy_latest_stage_reached
        description: The stage candidacy_result belongs to.
      - name: is_still_running
        description: >
          The anchor election is today or later, so no outcome exists yet.
          Never null: a user with no candidacy is not running.
        data_tests:
          - not_null
      - name: never_filed
        description: >
          The anchor election has passed and no civics candidacy with any
          source beyond gp-api exists for it. A gp-api-only candidacy is our
          own campaign echoed back and is not evidence the run reached a
          ballot. Never null.
        data_tests:
          - not_null
      - name: candidacy_is_incumbent
        description: >
          They already hold the office, from the civics candidacy or else the
          office-holder derivation.
      - name: candidacy_viability_score
        description: Modelled viability of the run, from the civics scorer.
      - name: candidacy_win_number
        description: Votes needed to win.
      - name: candidacy_legitimacy_score
        description: >
          The anchor campaign's legitimacy score from the candidate legitimacy
          predictor, 0 to 1: the expected rate at which a campaign like this is
          corroborated by a ballot data vendor. Close to but not the same as the
          person being real. Null for campaigns the model has not scored.
      - name: candidacy_legitimacy_bucket
        description: The score's band, p_under_5 to p_60_plus.
      - name: candidacy_legitimacy_label
        description: >
          6. confirmed when candidacy_has_external_match is true, whether or
          not the model scored the campaign. Otherwise the score band in words
          with its range, from 1. [0-5%] very unlikely to 5. [60-100%] likely,
          or null when unscored. The number prefix makes it sort in order.
          candidacy_legitimacy_score and _bucket stay the model's raw output.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - "1. [0-5%] very unlikely"
                  - "2. [5-15%] unlikely"
                  - "3. [15-35%] possible"
                  - "4. [35-60%] toss-up"
                  - "5. [60-100%] likely"
                  - "6. confirmed"
      - name: candidacy_legitimacy_scored_at
        description: >
          The date the score was produced. A snapshot, currently one run on
          2026-08-14, so campaigns created after it are unscored until a re-run.
      - name: prior_election_count
        description: >
          Distinct election years before the anchor's in which this person ran,
          from both the product and the civics record. Null without a
          candidacy.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: has_run_before
        description: >
          prior_election_count is above zero. Misses re-runners whose anchor is
          their earliest run; use election_year_count for "came back to run
          again".
      - name: election_year_count
        description: >
          Distinct election years this person has run in, in either direction
          from the anchor. The anchor is often a stale product campaign while
          the civics record shows the same person running again later, so this
          is the column for whether candidates come back. Null without a
          candidacy.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: ever_won
        description: >
          This person won at least one race, in any cycle, on any account.
          Person grain on purpose.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref("int__user_election_anchor")
      - dbt_utils.expression_is_true:
          arguments:
            expression: not (is_still_running and never_filed)

  - name: int__user_engagement_days
    description: >
      One row per user per day on which they viewed their campaign dashboard or
      reached voters through the product. Views read the governed
      dashboard-view union and drop staff viewing on the candidate's behalf
      (marked from 2026-03-24). Sends read the same legs as is_activated.
    columns:
      - name: user_id
        description: gp-api user id.
        data_tests:
          - not_null
      - name: activity_date
        description: The UTC date of the activity.
        data_tests:
          - not_null
      - name: has_dashboard_view
        description: They viewed their dashboard that day, not as staff impersonating them.
        data_tests:
          - not_null
      - name: has_activation_event
        description: They did something that counts toward is_activated that day.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, activity_date]

  - name: int__power_user_bar
    description: >
      The power-user viewing bar at each distance from the election, 0 to 365
      days out, measured on completed races from six months after telemetry
      began. At each distance the raw bar is the power-user report's rule: the
      85th percentile of view-days among users who had viewed by then, rounded
      up. The published bar never rises with distance, and days with fewer than
      500 viewers carry the last bar measured on enough. Reproduces the report's
      two bars: 6 at the election and 4 at 96 days out.
    columns:
      - name: days_out
        description: Days before the election, 0 to 365. Primary key.
        data_tests:
          - unique
          - not_null
      - name: reference_user_count
        description: Completed-race candidates the bar is measured on.
      - name: viewer_count
        description: Of those, how many had viewed their dashboard by this distance.
      - name: raw_view_day_bar
        description: The rounded-up 85th percentile before smoothing.
      - name: is_measured
        description: At least 500 viewers, so this day's own percentile is used.
      - name: view_day_bar
        description: The bar the flag compares against.
        data_tests:
          - not_null

  - name: int__user_power_user
    description: >
      Whether each candidate is a power user: reached voters through the
      product at least once, and viewed their dashboard on at least as many
      days as the bar for their distance from the election. Both counts run up
      to the build date, capped at the election. One row per user with a
      candidacy. Moves with the build date.
    columns:
      - name: user_id
        description: gp-api user id. Primary key.
        data_tests:
          - unique
          - not_null
      - name: power_user_days_out
        description: Days from the build date to the anchor election, 0 once it has passed.
        data_tests:
          - not_null
      - name: power_user_view_days
        description: Days with a dashboard view, from first use up to the build date or the election, whichever is first.
        data_tests:
          - not_null
      - name: power_user_view_day_bar
        description: The bar for power_user_days_out, or for 365 when further out.
        data_tests:
          - not_null
      - name: power_user_has_sent
        description: Did something that counts toward is_activated by the same cutoff.
        data_tests:
          - not_null
      - name: is_power_user
        description: power_user_has_sent and power_user_view_days at or above the bar.
        data_tests:
          - not_null

  - name: int__user_first_touch_utm
    description: >
      First-touch UTM attribution per user, from Amplitude's SDK initial_utm_*
      family. One row per user who carries any.

      Amplitude holds three overlapping UTM families; never union this with
      the webapp's utm_* or utm_*_first properties. Source, medium and
      campaign come together from the user's earliest event carrying them, so
      they always describe one touch. Values are raw, typos included; the
      _normalized columns fold spellings of one channel together.
    columns:
      - name: user_id
        description: gp-api user id. Primary key.
        data_tests:
          - unique
          - not_null
      - name: utm_source_first
        description: First-touch UTM source.
        data_tests:
          - not_null
      - name: utm_medium_first
        description: First-touch UTM medium.
      - name: utm_campaign_first
        description: First-touch UTM campaign.
      - name: utm_source_first_normalized
        description: >
          utm_source_first lowercased, cut at the first '&', and mapped through
          the utm_source_normalization seed, so fb, facebook, meta and ig read
          as facebook and adwords as google. Unlisted sources pass through
          cleaned. Use this for grouping; keep the raw column for auditing.
        data_tests:
          - not_null
      - name: utm_medium_first_normalized
        description: utm_medium_first lowercased, so paid and Paid are one value.
