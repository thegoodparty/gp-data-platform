version: 2

models:
  - name: int__user_resolved_keys
    description: >
      The keys that reach each downstream source, at gp-api user grain. One row
      per user in the civics users mart.

      Grain: one row per user_id. Deliberately not person grain. Collapsing the
      about 1,120 humans who hold more than one account would cost an aggregation
      rule per activity column, one of which (distinct active days) cannot be
      summed at all, and would do nothing for team accounts, where several
      different humans work one campaign. The person key is carried instead, so
      an account-spanning view is a group by rather than a rebuild.

      Read this rather than the scalar gp_api_user_id and hs_contact_id columns
      on the people mart: both go null exactly when the person group holds more
      than one such record, so a scalar join drops the ambiguous rows without
      saying so.
    columns:
      - name: user_id
        description: gp-api user id. Primary key.
        data_tests:
          - unique
          - not_null
      - name: gp_person_id
        description: >
          Canonical person for this account, from the civics person graph.
          Null only for a user who signed up between the person-graph rebuild
          and this build, so a handful of the very newest accounts can lack one
          until the next run. Not a durable external identifier either: it
          retires when two person groups merge and the other group's minting
          record is earlier, and election-api's PersonMerge is the forwarding
          address.
        data_tests:
          - not_null:
              config:
                severity: error
                warn_if: ">0"
                error_if: ">100"
      - name: account_count
        description: >
          gp-api accounts in this row's person group. Greater than one means
          the same human signed up more than once. Counted over the accounts
          present in this table, which can be a strict subset of the person
          graph's gp-api membership.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 50
                inclusive: true
      - name: is_primary_account
        description: >
          Earliest gp-api record in the person group by first_seen_at, tie
          broken by user_id. Exactly one account per person carries it, so
          filtering on it yields one row per person. Deliberately not the
          record that minted the person id: only 61% of user persons are minted
          by a gp-api record, so a mint-based flag would be false for every
          account of the remainder.
        data_tests:
          - not_null
      - name: had_conflict
        description: >
          The person group was touched by a within-source vendor-key edge that
          spanned more than one BallotReady person, so its membership is less
          certain. The row is kept; ambiguity is a column, never a filter.
        data_tests:
          - not_null
      - name: hubspot_contact_id
        description: >
          The HubSpot contact for this user, resolved through the person graph.
          Null when the person group reaches no live contact, which is 11.7% of
          users. Never read the user row's own hubspot_contact_id instead: it is
          carried by more users but 5,241 of those ids point at a contact that
          no longer exists, so it resolves fewer live contacts than this does.
      - name: hubspot_contact_count
        description: >
          Live HubSpot contacts the person group reaches, floored at one whenever
          a contact was named, because a contact can resolve through the user's
          own id while the person graph does not hold that contact. Kept at the
          full count otherwise, so a consumer can see the fan-out. Greater than
          one for about 1,480 persons.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: hubspot_key_source
        description: >
          How the contact was reached. own_live_id means the user's own id
          pointed at a contact that still exists. person_group means it did not
          and the graph supplied one. none means no live contact was reachable,
          and hubspot_contact_id is null.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["own_live_id", "person_group", "none"]
      - name: stripe_customer_id
        description: >
          Stripe customer for this account, the user staging model's
          stripe_customer_id. A native foreign key our product writes at
          checkout, so this is a join rather than a match, and Stripe is
          deliberately not a person-graph source. Null for the large majority
          of users, who have never paid.
      - name: stripe_customer_count
        description: >
          User accounts carrying this row's Stripe customer id. Greater than one
          for about 41 ids, where one human paid from two accounts. Lifetime
          revenue must sum over distinct customer ids or it double counts those.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: owns_organization
        description: >
          The user owns at least one organization, Win or Serve. Carried partly
          so the size of the team-accounts problem stays measurable: a user who
          owns nothing is either an abandoned signup or an invited team member,
          and today those two cannot be told apart.
        data_tests:
          - not_null
      - name: team_member_count
        description: >
          Always null. Team membership is not ingested, so a staffer cannot be
          distinguished from an abandoned signup. Null rather than zero, because
          a zero meaning "unknown" cannot be told from a real zero. Populate it
          when the membership stream lands.
    # An empty build of this model passes every ratio-based test in this file,
    # coverage tests included: count(x) * 100.0 / count(*) is 0/0 -> null, and
    # a `where pct < N` filter on null is false, so zero rows means PASS. A row
    # count floor is what actually catches an empty build.
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 60000

  - name: int__key_resolution_exceptions
    description: >
      Source records that should reach a gp-api user and do not, so "resolves to
      nobody" is counted rather than dropped.

      Grain: one row per source record. Stripe only today; the shape allows more
      sources later.

      HubSpot contributes nothing here on purpose. A contact with no user is a
      prospect, not an exception, and at 362,299 contacts against about 72,200
      users those rows would bury the few hundred that matter. HubSpot
      non-coverage is counted from the user side, on hubspot_key_source.
    columns:
      - name: source_name
        description: Source system the unresolved record came from.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["stripe"]
      - name: source_id
        description: Native identifier within that source.
        data_tests:
          - not_null
      - name: reason_code
        description: Why the record did not resolve.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["stripe_customer_no_user"]
      - name: first_seen_at
        description: >
          Source-native created timestamp for the record. Converted from the
          Stripe epoch-seconds integer, which the connector lands unmodified and
          the staging layer passes through without casting.
      - name: has_subscription
        description: The customer holds any Stripe subscription.
        data_tests:
          - not_null
      - name: has_active_subscription
        description: >
          The customer holds an active, trialing or past_due subscription. True
          here means live revenue with no product account, which is the case
          worth acting on rather than merely counting.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_name, source_id]

  - name: int__user_hubspot_touches
    description: >
      Sales and marketing contact history at gp-api user grain. One row per
      user per HubSpot engagement, across calls, emails, meetings, SMS, tasks,
      notes and chat sessions.

      Grain: one row per user_id and touch_id. A single engagement appears
      more than once when it reaches two users, which is what happens when one
      human holds two accounts or when a thread names two people. It is
      deliberately not duplicated when two contacts in the same person group
      share it.

      Touch history follows every HubSpot contact the user's person group
      reaches, not only the contact named on user_resolved_keys. Following the
      named contact alone leaves 665 users with no history at all and drops
      13% of touches, while the extra contacts are overwhelmingly the same
      human under a second email address.

      Calls are read from int__hubspot_calls, which dedupes the call stream and
      attaches the disposition. The generic engagement stream carries the same
      call ids without it and is filtered to exclude them, so a call is never
      counted twice.
    columns:
      - name: user_id
        description: gp-api user this touch reaches.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int__user_resolved_keys')
                field: user_id
      - name: touch_id
        description: HubSpot engagement id.
        data_tests:
          - not_null
      - name: contact_id
        description: >
          The HubSpot contact the touch was reached through. Where two contacts
          in the person group share an engagement, the lower id is kept so the
          touch counts once.
        data_tests:
          - not_null
      - name: channel
        description: >
          Normalized engagement type. A HubSpot type we have not mapped lands
          as other rather than disappearing.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  [
                    "call",
                    "email",
                    "inbound_email",
                    "meeting",
                    "sms",
                    "task",
                    "note",
                    "conversation",
                    "other",
                  ]
      - name: is_outbound_touch
        description: >
          We reached out to the person: a call, email, meeting or SMS. Tasks,
          notes, inbound mail and chat sessions are carried as history and are
          never counted as contact made, which is what touch_count_total sums.
        data_tests:
          - not_null
      - name: is_connected_call
        description: >
          The call reached a human, from the disposition's outcome family. Null
          for every channel but calls.
      - name: touch_at
        description: >
          When the activity happened, not when HubSpot recorded it. Meetings
          and tasks can be in the future: a booked meeting and a task due date
          are both legitimate rows here.
        data_tests:
          - not_null
      - name: hubspot_owner_id
        description: >
          Owner on the engagement, which is the rep who made the touch. Null on
          activity logged without one.
      - name: call_outcome_family
        description: >
          Disposition family from the hubspot_call_dispositions seed. Null for
          every channel but calls.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, touch_id]

  - name: int__user_hubspot_profile
    description: >
      The HubSpot slice of the end-to-end user view: how we acquired a user and
      how much sales contact they have had, at gp-api user grain. One row per
      user whether or not they reach a HubSpot contact.

      Only facts HubSpot originates are read here. A field being present in
      HubSpot does not make HubSpot its system of record: the contact's
      utm_source is populated on 60 of 362k contacts while product telemetry
      carries the real thing for everyone, so UTMs are deliberately absent.

      Counts are zero where we can see HubSpot and nothing happened, and null
      where we cannot see it at all. Reading one as the other reports an
      unresolved user as an uncontacted one.
    columns:
      - name: user_id
        description: gp-api user id. Primary key.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int__user_resolved_keys')
                field: user_id
      - name: has_hubspot_contact
        description: >
          The user reaches a live HubSpot contact. False for about 8,400
          users, whose every other column here is null by construction rather
          than zero.
        data_tests:
          - not_null
      - name: hubspot_unmatched_reason
        description: >
          Why the user reaches no contact. Null when they do. A native id that
          no longer resolves is kept apart from never having had one, because
          the first is a broken link and the second is an absent record.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  ["dangling_contact_id", "email_match_unresolved", "no_contact_found"]
      - name: hubspot_email_match_available
        description: >
          An exact email edge would reach a live contact for this unmatched
          user, which is true for about 4,100 of them. Null for users who
          already resolve. Closing the gap is entity resolution work, not this
          model's.
      - name: hubspot_contact_count
        description: Live HubSpot contacts in the user's person group.
      - name: hs_owner_id
        description: HubSpot owner assigned to the contact, which is the salesperson.
      - name: hs_lifecycle_stage
        description: HubSpot's own lifecycle stage for the contact.
      - name: hs_win_lifecycle_stage
        description: Win-specific lifecycle stage, maintained separately in HubSpot.
      - name: hs_serve_lifecycle_stage
        description: Serve-specific lifecycle stage, maintained separately in HubSpot.
      - name: hs_analytics_source
        description: >
          HubSpot's account of how the contact arrived. OFFLINE means the
          contact was put into HubSpot by an import or integration rather than
          arriving through its own web session.
      - name: hs_analytics_source_detail
        description: >
          The drill-down under that source: the landing page for a web source,
          IMPORT or INTEGRATION for an offline one.
      - name: hs_conversion_source
        description: Source of the session in which the contact converted.
      - name: hs_contact_created_at
        description: When the HubSpot contact record was created.
      - name: hs_first_analytics_at
        description: First web session HubSpot attributes to the contact.
      - name: hs_last_contacted_at
        description: HubSpot's own last-contacted stamp, across channels.
      - name: first_touch_at
        description: >
          Earliest moment of contact we know of, from HubSpot contact creation,
          HubSpot's first analytics timestamp or signup, whichever is first.
          Falls back to signup for a user with no contact.
        data_tests:
          - not_null
      - name: first_touch_is_signup
        description: >
          The first touch is the signup itself, so there was no earlier
          marketing contact. True for roughly two thirds of the table, which
          is why no lead-time average should be computed without filtering on
          it: the population it means anything for is about 25,000, not the
          64,000 who reach a contact.
        data_tests:
          - not_null
      - name: acquisition_motion
        description: >
          Whether sales or marketing sourced the user. Sales-sourced is an
          OFFLINE analytics source, meaning we put the contact into HubSpot;
          all but a few hundred of those are list imports. Two independent
          signals agree with the split, and neither is an input to it: 91% of
          offline-sourced contacts predate signup by a day or more against 12%
          of web-sourced ones, and 93% of them have been contacted against
          29%. Owner assignment is deliberately not part of the rule, since
          91% of matched users carry an owner and it separates nothing.

          Unknown covers two states, and the second is defensive: a user who
          reaches no contact, and a resolved contact carrying no analytics
          source. No matched contact is in the second state today, so unknown
          is in practice the no-contact population. If that changes, the split
          is worth a fourth value rather than a silent merge.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["marketing_sourced", "sales_sourced", "unknown"]
      - name: call_count
        description: Calls logged against the user.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: connected_call_count
        description: Of those, the ones that reached a human.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: email_count
        description: Sales emails sent to the user. Inbound replies are counted separately.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: meeting_count
        description: >
          Meetings booked with the user, which includes meetings still in the
          future.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: sms_count
        description: SMS sent to the user.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: inbound_email_count
        description: >
          Emails the user sent us. A reply is engagement, not contact made, so
          this stays out of touch_count_total.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: task_count
        description: >
          Internal tasks logged against the contact. Work we planned rather
          than contact the person received, so it stays out of
          touch_count_total.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: note_count
        description: Internal notes on the contact. Also not contact made.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: touch_count_total
        description: Calls plus emails plus meetings plus SMS.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: first_call_at
        description: First logged call.
      - name: last_call_at
        description: Most recent logged call.
      - name: first_email_at
        description: First sales email.
      - name: last_email_at
        description: Most recent sales email.
      - name: first_meeting_at
        description: First meeting booked.
      - name: last_meeting_at
        description: Most recent meeting booked, which can be in the future.
      - name: first_sms_at
        description: First SMS.
      - name: last_sms_at
        description: Most recent SMS.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              touch_count_total = call_count + email_count + meeting_count
              + sms_count
          config:
            where: has_hubspot_contact
      - dbt_utils.expression_is_true:
          arguments:
            expression: connected_call_count <= call_count
          config:
            where: has_hubspot_contact
