version: 2

models:
  - name: int__ballotready_geofence
    description: >
      BallotReady geofences, transformed from the raw payloads the extract_ballotready DAG
      lands. Replaces the Python model that called the CivicEngine API directly; the
      output schema is unchanged, and the contract keeps its name and schema stable
      for consumers.
    config:
      contract:
        enforced: true
    columns:
      - name: created_at
        description: Timestamp the geofence was created in BallotReady.
        data_type: timestamp
      - name: database_id
        description: The BallotReady integer id for the geofence, echoed back from the requested id.
        data_type: int
      - name: geo_id
        description: >
          Geographic identifier for the geofence boundary. Shaped like a Census GEOID
          (short, numeric) for the ~70% of rows carrying a Census mtfcc code; for the
          remaining rows, which carry a BallotReady-specific mtfcc, it runs longer and
          less uniform (observed up to 29 characters, some non-numeric).
        data_type: string
      - name: id
        description: Base64 GraphQL global id for the geofence. The unique key this table exposes.
        data_type: string
      - name: mtfcc
        description: >
          Mostly a Census MAF/TIGER Feature Class Code identifying the type of geographic
          entity the geofence represents (roughly 70% of rows, 11 distinct `G`-prefixed
          codes as of this writing). The remaining rows carry a BallotReady-specific
          `X`-prefixed code outside the Census set (roughly 30%, 72 distinct codes), whose
          meaning is not documented by BallotReady.
        data_type: string
      - name: updated_at
        description: Timestamp the geofence was last updated in BallotReady.
        data_type: timestamp
      - name: valid_from
        description: Start date of this row's effective boundary version, as reported by BallotReady.
        data_type: date
      - name: valid_to
        description: >
          End date of this row's effective boundary version, as reported by BallotReady;
          null for roughly 80% of rows. Whether null means "still current" is not
          confirmed: many geo_ids carry more than one landed row, and a large share of
          those have more than one row with a null valid_to, which is inconsistent with a
          single current version per geofence. Treat the effective-dating semantics as
          unconfirmed rather than assume them.
        data_type: date

  - name: int__ballotready_filing_period
    description: >
      BallotReady filing periods, transformed from the raw payloads the extract_ballotready
      DAG lands. Replaces the Python model that called the CivicEngine API directly; the
      output schema is unchanged, and the contract keeps its name and schema stable for
      consumers.
    config:
      contract:
        enforced: true
    columns:
      - name: created_at
        description: Timestamp the filing period was created in BallotReady.
        data_type: timestamp
      - name: database_id
        description: >
          The BallotReady integer id for the filing period, echoed back from the
          requested id.
        data_type: int
      - name: end_on
        description: Last day of the filing window, i.e. the filing deadline.
        data_type: date
      - name: id
        description: Base64 GraphQL global id for the filing period.
        data_type: string
      - name: notes
        description: Freeform notes on the filing period; populated for roughly 2% of rows.
        data_type: string
      - name: start_on
        description: First day of the filing window.
        data_type: date
      - name: type
        description: BallotReady filing period type; not populated in any row landed so far.
        data_type: string
      - name: updated_at
        description: Timestamp the filing period was last updated in BallotReady.
        data_type: timestamp

  - name: int__ballotready_issue
    description: >
      BallotReady issues, transformed from the raw payloads the extract_ballotready DAG
      lands. Replaces the Python model that called the CivicEngine API directly; the
      output schema is unchanged, and the contract keeps its name and schema stable for
      consumers.
    config:
      contract:
        enforced: true
    columns:
      - name: database_id
        description: The BallotReady integer id for the issue, echoed back from the requested id.
        data_type: int
      - name: id
        description: Base64 GraphQL global id for the issue.
        data_type: string
      - name: key
        description: Short machine-readable key for the issue, e.g. "arts_culture".
        data_type: string
      - name: name
        description: Display name for the issue, e.g. "Arts / Culture".
        data_type: string
      - name: plugin_enabled
        description: Whether the issue is enabled in the stance-collection plugin.
        data_type: boolean
      - name: response_type
        description: >
          Response type BallotReady expects for a stance on this issue; not populated in
          any row landed so far.
        data_type: string
      - name: row_order
        description: Display order for the issue; not populated in any row landed so far.
        data_type: int
      - name: created_at
        description: >
          Ingestion timestamp, not a BallotReady source field: the issue payload carries
          no createdAt, so this is stamped at staging build time.
        data_type: timestamp
      - name: updated_at
        description: >
          Ingestion timestamp, not a BallotReady source field: the issue payload carries
          no updatedAt, so this is stamped at staging build time.
        data_type: timestamp

  - name: int__ballotready_normalized_position
    description: >
      BallotReady normalized positions, transformed from the raw payloads the extract_ballotready
      DAG lands. Replaces the Python model that called the CivicEngine API directly; the output
      schema is unchanged, and the contract keeps its name and schema stable for consumers.
    config:
      contract:
        enforced: true
    columns:
      - name: database_id
        description: >
          The BallotReady integer id for the normalized position, echoed back from the requested
          id.
        data_type: int
      - name: description
        description: Freeform description of the normalized position; populated for roughly 97% of rows.
        data_type: string
      - name: id
        description: Base64 GraphQL global id for the normalized position.
        data_type: string
      - name: issues
        description: The issues associated with this normalized position, as id-reference pairs.
        data_type: array<struct<databaseId:int,id:string>>
      - name: mtfcc
        description: >
          Census MAF/TIGER Feature Class Code for the normalized position; populated for roughly
          7% of rows.
        data_type: string
      - name: name
        description: Display name for the normalized position, e.g. "U.S. Senator".
        data_type: string
      - name: created_at
        description: >
          Ingestion timestamp, not a BallotReady source field: the normalized position payload
          carries no createdAt, so this is stamped at staging build time.
        data_type: timestamp
      - name: updated_at
        description: >
          Ingestion timestamp, not a BallotReady source field: the normalized position payload
          carries no updatedAt, so this is stamped at staging build time.
        data_type: timestamp

  - name: int__ballotready_position_election_frequency
    description: >
      BallotReady position election frequencies, transformed from the raw payloads the
      extract_ballotready DAG lands. See
      https://developers.civicengine.com/docs/api/graphql/reference/objects/position-election-frequency.
      Replaces the Python model that called the CivicEngine API directly; the output schema is
      unchanged, and the contract keeps its name and schema stable for consumers.
    config:
      contract:
        enforced: true
    columns:
      - name: database_id
        description: >
          The BallotReady integer id for the position election frequency, echoed back from the
          requested id.
        data_type: int
      - name: frequency
        description: Years, relative to reference_year, in which this position is up for election.
        data_type: array<int>
      - name: id
        description: Base64 GraphQL global id for the position election frequency.
        data_type: string
      - name: reference_year
        description: The reference year frequency is expressed relative to.
        data_type: int
      - name: seats
        description: >
          Number of seats up for election in each cycle; not populated in any row landed so far.
        data_type: array<int>
      - name: valid_from
        description: Start of this row's effective validity window, as reported by BallotReady.
        data_type: timestamp
      - name: valid_to
        description: >
          End of this row's effective validity window, as reported by BallotReady; populated for
          roughly 3% of rows.
        data_type: timestamp

  - name: int__ballotready_candidacy
    description: >
      BallotReady candidacies, transformed from the raw payloads the extract_ballotready DAG
      lands. Replaces the Python model that called the CivicEngine API directly; the output
      schema is unchanged, and the contract keeps its name and schema stable for consumers.
    config:
      contract:
        enforced: true
      meta:
        contains_pii: true
    columns:
      - name: candidate_database_id
        description: The BallotReady integer id of the candidate this candidacy belongs to.
        data_type: int
      - name: created_at
        description: Timestamp the candidacy was created in BallotReady.
        data_type: timestamp
      - name: database_id
        description: The BallotReady integer id for the candidacy, echoed back from the requested id.
        data_type: int
      - name: election_database_id
        description: The BallotReady integer id of the election this candidacy belongs to.
        data_type: int
      - name: endorsements
        description: The endorsements of this candidacy, as id-reference pairs.
        data_type: array<struct<databaseId:int,id:string>>
      - name: id
        description: Base64 GraphQL global id for the candidacy.
        data_type: string
      - name: is_certified
        description: Whether the candidacy's result has been certified by BallotReady.
        data_type: boolean
      - name: is_hidden
        description: Whether BallotReady flags this candidacy as hidden.
        data_type: boolean
      - name: parties
        description: The parties of this candidacy, as id-reference pairs.
        data_type: array<struct<databaseId:int,id:string>>
      - name: position_database_id
        description: The BallotReady integer id of the position this candidacy is running for.
        data_type: int
      - name: race_database_id
        description: The BallotReady integer id of the race this candidacy belongs to.
        data_type: int
      - name: result
        description: >
          The candidacy's result as reported by BallotReady (e.g. "WON", "LOST"); populated for
          roughly 88% of rows.
        data_type: string
      - name: stances
        description: The issue stances of this candidacy, as id-reference pairs.
        data_type: array<struct<databaseId:int,id:string>>
      - name: updated_at
        description: Timestamp the candidacy was last updated in BallotReady.
        data_type: timestamp
      - name: withdrawn
        description: Whether the candidate has withdrawn from this candidacy.
        data_type: boolean
      - name: feed_extracted_at
        description: >
          When our pipeline last obtained this candidacy; loaded_at from the landing table,
          carried through unchanged.
        data_type: timestamp
