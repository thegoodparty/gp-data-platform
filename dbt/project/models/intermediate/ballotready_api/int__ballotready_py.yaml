version: 2

models:

  - name: int__ballotready_upcoming_candidacy_ids
    description: >
      Candidacy ids for still-upcoming BallotReady races, read from the API race
      roster (race.candidacies). The S3 candidacies feed omits many upcoming
      general-stage rosters the API already carries; that gap is now covered by
      the extract_ballotready Airflow DAG's own worklist query, not by a dbt
      model reading this one.
    config:
      meta:
        dbt_environment: "{{ env_var('DBT_ENVIRONMENT') }}"
        owner: "Data Engineering Team"
        contains_pii: false
    columns:
      - name: br_candidacy_id
        description: "BallotReady candidacy database id from an upcoming race roster"
        tests:
          - not_null
          - unique
          # Every candidacy an upcoming race roster carries should be
          # ingested into int__ballotready_candidacy. Warn (not error)
          # because landing lag between a roster appearing here and the
          # extract_ballotready DAG picking up that candidacy, plus
          # API-dropped/withdrawn candidacies, can leave a small transient
          # gap that should surface for monitoring rather than fail the
          # build.
          - relationships:
              arguments:
                to: ref('int__ballotready_candidacy')
                field: database_id
              config:
                severity: warn
      - name: race_updated_at
        description: "updated_at of the race the candidacy belongs to; used to refetch changed rosters incrementally"
