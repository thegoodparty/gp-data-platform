version: 2

models:

  - name: int__ballotready_upcoming_candidacy_ids
    description: >
      Candidacy ids for still-upcoming BallotReady races, read from the API race
      roster (race.candidacies). The S3 candidacies feed omits many upcoming
      general-stage rosters the API already carries; int__ballotready_candidacy
      and int__ballotready_party union this source into their fetch worklist so
      those candidacies reach election-api instead of being dropped.
    config:
      meta:
        dbt_environment: "{{ env_var('DBT_ENVIRONMENT') }}"
        owner: "Data Engineering Team"
        contains_pii: false
    columns:
      - name: br_candidacy_id
        description: "BallotReady candidacy database id from an upcoming race roster"
        tests:
          - not_null
          - unique
          # The point of the fix: every candidacy an upcoming race roster
          # carries should be ingested into int__ballotready_candidacy. Warn
          # (not error) because incremental lag between a roster appearing and
          # the candidacy model's next run, and API-dropped/withdrawn
          # candidacies, can leave a small transient gap that should surface
          # for monitoring rather than fail the build.
          - relationships:
              arguments:
                to: ref('int__ballotready_candidacy')
                field: database_id
              config:
                severity: warn
      - name: race_updated_at
        description: "updated_at of the race the candidacy belongs to; used to refetch changed rosters incrementally"

  - name: int__ballotready_candidacy
    description: >
      This model retrieves and processes candidate data from the CivicEngine API since the source
      candidacies_v3 csv file does not contain all the fields needed.
    config:
      meta:
        dbt_environment: "{{ env_var('DBT_ENVIRONMENT') }}"
        owner: "Data Engineering Team"
        contains_pii: true
    columns:
      - name: database_id
        description: "Unique identifier for the candidacy in the CivicEngine database"
        tests:
          - not_null
          - unique
      - name: id
        description: "Encoded identifier for the candidacy in the CivicEngine system"
        tests:
          - not_null
          - unique

  - name: int__ballotready_endorsement
    description: >
      This model retrieves and processes candidate endorsement data from the CivicEngine API.
      It contains endorsement information for political candidates, including their endorsements
      from various organizations.
    config:
      meta:
        dbt_environment: "{{ env_var('DBT_ENVIRONMENT') }}"
        owner: "Data Engineering Team"
        contains_pii: false
    columns:
      - name: candidacy_id
        description: "Unique identifier for the candidacy in the CivicEngine database"
        tests:
          - not_null
          - unique

  - name: int__ballotready_filing_period
    description: >
      Filing period records (candidate filing window start and end dates) fetched by id
      from the CivicEngine API. Races reference filing periods by id only, so this table
      is the lookup that turns a race into a filing deadline.

      Each run fetches the ids referenced by recently updated races, then spends whatever
      is left of `max_ids_per_run` on the backlog of referenced ids that are not here yet,
      newest ids first since those carry the deadlines for current cycles. The recently
      updated races are never capped away, so the fetch set is always a superset of what
      the race watermark alone would have selected.

      Because an id that fails to resolve simply stays absent, the next run picks it up
      again and coverage converges over successive runs. Raise the bound with
      `--vars '{br_filing_period_max_ids_per_run: 250000}'` to close a large backlog
      faster, at the cost of a longer run on the shared cluster.
    config:
      meta:
        dbt_environment: "{{ env_var('DBT_ENVIRONMENT') }}"
        owner: "Data Engineering Team"
        contains_pii: false
        max_ids_per_run: "{{ var('br_filing_period_max_ids_per_run', 100000) }}"
    columns:
      - name: database_id
        description: "Unique identifier for the filing period in the CivicEngine database"
        tests:
          - not_null
          - unique
      - name: id
        description: "Encoded identifier for the filing period in the CivicEngine system"
        tests:
          - not_null
          - unique
      - name: start_on
        description: "First day of the filing window"
      - name: end_on
        description: "Last day of the filing window, i.e. the filing deadline"
      - name: type
        description: "CivicEngine filing period type"

  - name: int__ballotready_geofence
    description: >
      This model retrieves and processes geofence data from the CivicEngine API.
    config:
      meta:
        dbt_environment: "{{ env_var('DBT_ENVIRONMENT') }}"
        owner: "Data Engineering Team"
        contains_pii: false
    columns:
      - name: created_at
        description: "Timestamp when the geofence was created in the CivicEngine system"
        tests:
          - not_null
      - name: database_id
        description: "Unique identifier for the geofence in the CivicEngine database"
        tests:
          - not_null
          - unique
      - name: id
        description: "Encoded identifier for the geofence in the CivicEngine system"
        tests:
          - not_null
          - unique
      - name: updated_at
        description: "Timestamp when the geofence was last updated"
        tests:
          - not_null

  - name: int__ballotready_issue
    description: >
      This model retrieves and processes issue data from the CivicEngine API: https://developers.civicengine.com/docs/api/graphql/reference/objects/issue
      It is used to retrieve the issue data for the [`stance`](https://developers.civicengine.com/docs/api/graphql/reference/objects/stance) table.
    config:
      meta:
        dbt_environment: "{{ env_var('DBT_ENVIRONMENT') }}"
        owner: "Data Engineering Team"
        contains_pii: false
    columns:
      - name: database_id
        description: "Unique identifier for the issue in the CivicEngine database"
        tests:
          - not_null
          - unique
      - name: id
        description: "Encoded identifier for the issue in the CivicEngine system"
        tests:
          - not_null
          - unique
      # TODO: add relationship test once `parentIssue` is uncommented in the API response
      # - name: parent_issue.databaseId
        # description: "The database id of the parent issue"
        # tests:
        #   - relationships:
        #       arguments:
        #         to: ref('int__ballotready_issue')
        #         field: database_id

  - name: int__ballotready_normalized_position
    description: >
      This model retrieves normalized position data from the CivicEngine API. It uses the `position_id` from the position table
      to retrieve ids on which to query the normalized position data.
    config:
      meta:
        dbt_environment: "{{ env_var('DBT_ENVIRONMENT') }}"
        owner: "Data Engineering Team"
        contains_pii: false
    columns:
      - name: database_id
        description: "Unique identifier for the normalized position in the CivicEngine database"
        tests:
          - not_null
          - unique
      - name: id
        description: "Encoded identifier for the normalized position in the CivicEngine system"
        tests:
          - not_null
          - unique

  - name: int__ballotready_party
    description: >
      This model retrieves and processes candidate endorsement data from the CivicEngine API.
      It contains endorsement information for political candidates, including their endorsements
      from various organizations.
    config:
      meta:
        dbt_environment: "{{ env_var('DBT_ENVIRONMENT') }}"
        owner: "Data Engineering Team"
        contains_pii: false

  - name: int__ballotready_person
    description: >
      This model retrieves and processes person data from the CivicEngine API.
    config:
      meta:
        dbt_environment: "{{ env_var('DBT_ENVIRONMENT') }}"
        owner: "Data Engineering Team"
        contains_pii: false
    columns:
      - name: database_id
        description: "Unique identifier for the person in the CivicEngine database"
        tests:
          - not_null
          - unique
      - name: id
        description: "Encoded identifier for the person in the CivicEngine system"
        tests:
          - not_null
          - unique

  - name: int__ballotready_position_election_frequency
    description: >
      This model retrieves and processes position election frequency data from the CivicEngine API.
      See https://developers.civicengine.com/docs/api/graphql/reference/objects/position-election-frequency
    config:
      meta:
        dbt_environment: "{{ env_var('DBT_ENVIRONMENT') }}"
        owner: "Data Engineering Team"
        contains_pii: false
    columns:
      - name: database_id
        description: "Unique identifier for the position election frequency in the CivicEngine database"
        tests:
          - not_null
          - unique

  - name: int__ballotready_stance
    description: >
      This model retrieves and processes candidate stance data from the CivicEngine API.
      It contains stance information for political candidates, including their positions
      on various issues.
    config:
      meta:
        dbt_environment: "{{ env_var('DBT_ENVIRONMENT') }}"
        owner: "Data Engineering Team"
        contains_pii: false
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - candidacy_id
              - stances.databaseId
    columns:
      - name: candidacy_id
        description: "The id of the candidacy"
        tests:
          - not_null
          - unique
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: int
      - name: stances
        description: "The stances of the candidacy as a json with a list of json objects"
        tests:
          - not_null
      - name: created_at
        description: "Timestamp when the record was first created"
        tests:
          - not_null
      - name: updated_at
        description: "Timestamp when the record was last updated"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "'2020-01-01'"  # Adjust based on expected data range
                max_value: "{{ dbt.current_timestamp() }}"
