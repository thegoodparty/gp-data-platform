version: 2

models:
  - name: int__l2_district_aggregations
    description: Intermediate model that aggregates L2 district data for downstream use.
    columns:
      - name: id
        description: Internally generated unique identifier for the district aggregation.
        tests:
          - not_null
          - unique
          - is_uuid
      - name: state_postal_code
        description: "Uppercase two-letter state postal code"
        tests:
          - not_null
          - dbt_expectations.expect_column_distinct_values_to_equal_set:
              arguments:
                value_set: "{{ get_us_states_list(include_DC=true, include_US=false) }}"
      - name: district_type
        description: "Type of district (e.g., US_Congressional_District, State_Senate_District)"
        tests:
          - not_null
      - name: district_name
        description: "The actual district identifier/name"
        tests:
          - not_null
      - name: voter_count
        description: "Number of distinct voters in this district"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: BIGINT
      - name: unique_cellphones
        description: >-
          Distinct cellphone numbers
          (votertelephones_cellphoneformatted) appearing on L2 voters
          in this district. The collapse is on the phone-number value
          itself, so two voters sharing a household phone count as
          one — this matches per-channel send/dial costs downstream
          (SMS, robocall).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: BIGINT
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: unique_landlines
        description: >-
          Distinct landline numbers
          (votertelephones_landlineformatted) appearing on L2 voters
          in this district. Same collapse semantics as
          unique_cellphones.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: BIGINT
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: loaded_at
        description: "Timestamp from the source L2 uniform data"
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - state_postal_code
              - district_type
              - district_name
      # A district absent from the mart is never minted an id, so it binds no voters.
      - l2_district_tuple_exists:
          arguments:
            to: ref('m_election_api__district')
            state_column: state_postal_code
            district_type_column: district_type
            district_name_column: district_name

  - name: int__l2_district_universe
    description: >
      One row per district in each state's latest L2 delivery, plus 51
      synthetic statewide rows (district_type='State', district_name =
      state_postal_code) that give Governor and US Senate seats something
      to match to. This is the candidate menu the L2-to-BallotReady
      matcher reads; it carries no voter counts because a menu needs
      labels and types, not counts.
    columns:
      - name: state_postal_code
        description: "Uppercase two-letter state postal code"
        tests:
          # Excludes the synthetic rows deliberately. Those are emitted per
          # state unconditionally, so without the condition every state is
          # present whether or not it contributed a single real district, and
          # the test could never catch the state going missing from the menu.
          - dbt_expectations.expect_column_distinct_values_to_equal_set:
              arguments:
                value_set: "{{ get_us_states_list(include_DC=true, include_US=false) }}"
                row_condition: "district_type <> 'State'"
      - name: district_type
        description: "L2 district column name, or 'State' for the synthetic statewide row."
      - name: district_name
        description: "District identifier within district_type; state_postal_code again for the 'State' rows."
      - name: loaded_at
        description: >
          Timestamp of the L2 delivery this district is current as of; the
          join key used to filter to each state's latest delivery.
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - state_postal_code
              - district_type
              - district_name
      # Asserts the aggregation is CURRENT relative to this menu, not that the
      # two spell labels alike: both derive district_name from the same ltrim
      # in int__l2_nationwide_uniform, so a spelling cannot diverge between
      # them. What can diverge is freshness — this model is a plain table and
      # the aggregation is an incremental whose watermark only admits tuples
      # with a newer loaded_at. A menu district the aggregation lacks carries
      # no voter counts, which is the failure worth catching.
      # COUPLING with get_l2_district_types() edits: see that macro's docstring.
      - l2_district_tuple_exists:
          arguments:
            to: ref('int__l2_district_aggregations')
            state_column: state_postal_code
            district_type_column: district_type
            district_name_column: district_name
            to_state_column: state_postal_code
            to_district_type_column: district_type
            to_district_name_column: district_name

  - name: int__l2_br_match_served
    description: >
      The gold-match latest attempt per office as the publishing models see it.
      A match that fits a known wrong-answer shape is withheld: its district
      columns are null, is_matched is false, and withheld_reason names the shape.
      Guards apply to attempts on or after the l2_br_match_guards_from var (the
      daily loop's cutover); earlier attempts pass through unchanged. An override
      in l2_br_match_overrides still wins in every consumer. The pending selector
      reads the results table, so withholding a match does not re-queue its office.
    columns:
      - name: br_database_id
        description: BallotReady position database id.
        data_tests:
          - unique
          - not_null
      - name: l2_state
        description: The district's state; null on an abstain or a withheld match.
      - name: l2_district_type
        description: L2 district type; null on an abstain or a withheld match.
      - name: l2_district_name
        description: L2 district name; null on an abstain or a withheld match.
      - name: confidence
        description: The matcher's confidence, kept on withheld rows for audit.
      - name: attempted_at
        description: The run key of the attempt.
      - name: is_matched
        description: True when a district is served.
        data_tests:
          - not_null
      - name: withheld_reason
        description: >
          Why a match was not served. special_district_on_general_row: a special
          district on a same-named city, town, county, census place or state row.
          town_seat_on_parent_body: a seat elected by one member town (NJ, AR, MA)
          matched to the parent board. township_fire_on_county_pool: an NJ township
          fire commission on a county-numbered fire row that pools several towns.
          county_judge_off_county: a county judge off the county or county-court row.
          college_on_k12_row: a college board on a K-12 school district.
          census_place: a census-designated place, which elects no one.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - special_district_on_general_row
                  - town_seat_on_parent_body
                  - township_fire_on_county_pool
                  - county_judge_off_county
                  - college_on_k12_row
                  - census_place

  - name: int__l2_br_match_pending_offices
    description: >
      One row per BallotReady office needing an L2 district match attempt:
      never attempted, last attempt found nothing more than 30 days ago, or
      matched to a district int__l2_district_universe no longer carries. A
      label whose normalized spelling still resolves to exactly one universe
      row is NOT dead -- L2 respells districts routinely, serving resolves
      those spellings, and re-matching such an office risks erasing a working
      link; an ambiguous respelling stays dead so a re-match decides.
      Computed from llm_l2_br_match_results, a dbt source written only by the
      matcher. The matcher reads this list to build its next batch. Reads
      stg_airbyte_source__ballotready_api_position directly, not
      int__enhanced_position, to keep the geography fields (sub_area_name,
      sub_area_value, is_judicial, has_unknown_boundaries) that
      int__enhanced_position drops and the matcher's geography filters need.
      Every office (~286,000) until the matcher has run at least once --
      that is the expected starting state, not a defect.
    columns:
      - name: br_database_id
        description: "BallotReady office database id."
        tests:
          - not_null
          - unique
      - name: name
        description: "BallotReady office name."
      - name: mtfcc
        description: "Census MTFCC code for the office's geography; a menu-narrowing filter input for the matcher."
      - name: geo_id
        description: "Census geography id for the office; a menu-narrowing filter input for the matcher."
      - name: sub_area_name
        description: "BallotReady sub-area name. Dropped by int__enhanced_position; carried here for the matcher's geography filters."
      - name: sub_area_value
        description: "BallotReady sub-area value. Dropped by int__enhanced_position; carried here for the matcher's geography filters."
      - name: is_judicial
        description: "Whether the office is a judicial seat. Dropped by int__enhanced_position; carried here for the matcher's geography filters."
      - name: has_unknown_boundaries
        description: "Whether BallotReady flags the office's boundaries as unknown. Dropped by int__enhanced_position; carried here for the matcher's geography filters."
      - name: state
        description: "State postal code."

  - name: int__l2_nationwide_uniform_raw_districts
    description: "Combined uniform voter file data from all states"
    columns:
      - name: state_postal_code
        description: "Uppercase two-letter state postal code"
        tests:
          - dbt_expectations.expect_column_distinct_values_to_equal_set:
              arguments:
                value_set: "{{ get_us_states_list(include_DC=true, include_US=false, include_territories=false) }}"

  - name: int__l2_nationwide_uniform
    description: >
      The voter file, with l2_manual_district_assignments applied and, for each
      (state, district type) district_map_adoption puts on its proposed map, the
      proposed map in place of the current column.

  - name: int__voter_turnout_inference
    description: >
      Nationwide district-level voter-turnout projections from the registered
      turnout models. One row per (state, district_type, district_name,
      election_year, election_code). model_version records the model family
      that produced each row, so the underlying model can be swapped without
      renaming anything.
    config:
      meta:
        # Most recent year of L2 vote history present (drives the feature window).
        max_vote_history_year: "{{ var('max_vote_history_year', 2025) }}"
        # DEV-ONLY iteration knob: comma/space list like "AL" to score a subset.
        # NEVER set when building the wired int__model_prediction_voter_turnout
        # (the carve would suppress legacy rows nationwide for a partial run).
        l2_state_allowlist: "{{ var('l2_state_allowlist', '') }}"
        # Schema holding the @production registered models.
        voter_turnout_models_schema: "{{ var('voter_turnout_models_schema', 'model_predictions') }}"
        # Schema holding turnout_historical_precincts. PROD = model_predictions
        # (must be promoted there alongside the models; it currently exists only
        # in sandbox). Dev overrides to sandbox via the var.
        voter_turnout_precincts_schema: "{{ var('voter_turnout_precincts_schema', 'model_predictions') }}"
    columns:
      - name: election_year
        description: "Election year scored (current year + 0/1/2)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2024
                max_value: 2035
      - name: election_code
        description: "General, Local_or_Municipal, or Primary (the codes this model emits)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["General", "Local_or_Municipal", "Primary"]
      - name: state
        description: >
          State postal code. The full-nationwide set is asserted so a partial
          (allowlisted) build fails loudly.
        tests:
          - not_null
          - dbt_expectations.expect_column_distinct_values_to_equal_set:
              arguments:
                value_set: "{{ get_us_states_list(include_DC=true, include_US=false, include_territories=false) }}"
      - name: district_type
        description: "L2 district column name, or 'State' for the statewide row."
        tests:
          - not_null
      - name: district_name
        description: "District identifier within district_type."
        tests:
          - not_null
      - name: ballots_projected
        description: >
          Projected ballots = round(sum(p_hat * n_voters)) over the district's
          precincts, floored at 3 ballots (the serving floor; bounds share it).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 3
                inclusive: true
      - name: ballots_projected_lower
        description: >
          Lower prediction bound (p25). Applies the per-model residual
          quantile at the district's implied predicted rate:
          round(clip(pred_rate + q25 * w(pred_rate), 0, 1) * district_voters),
          floored at 3 with the point. w is sqrt(p*(1-p)) for 'binom' models
          and sqrt(1-p) for 'taper_top' (low-turnout local) models. Always
          populated: params are required at load and predictions are asserted
          finite at source.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 3
                inclusive: true
      - name: ballots_projected_upper
        description: >
          Upper prediction bound (p95), the risk-relevant band for win-number
          planning. Same construction as ballots_projected_lower with q95.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 3
                inclusive: true
      - name: model_slug
        description: >
          Registered-model slug that produced the row (provenance; the
          election_code is derived from it at prediction time).
        tests:
          - not_null
      - name: model_version
        description: "model_family value (load-bearing - part of the election-api projected_turnout id)."
        tests:
          - not_null
      - name: inference_at
        description: "Timestamp the projections were produced (dedup tiebreaker downstream)."
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - state
              - district_type
              - district_name
              - election_year
              - election_code
              - model_version
      - dbt_utils.expression_is_true:
          name: voter_turnout_inference_bounds_ordering
          arguments:
            expression: >
              ballots_projected_lower <= ballots_projected
              and ballots_projected <= ballots_projected_upper

  - name: int__voter_turnout_lgbm_voter_scores
    description: >
      Nationwide PER-VOTER turnout probabilities from the LightGBM turnout model,
      scoring each voter as a precinct-of-1. One row per LALVOTERID for the current
      year's November election; drives people-api Voter_Status. Incremental (merge on
      LALVOTERID): scheduled runs score only voters not already present, so they never
      rescore the full ~218M-row universe; a full refresh rescores everyone with the
      current @production model. The projection year, model, and lag window all derive
      automatically (current year and the most recent vote-history year in L2), so the
      table turns the page on Jan 1 given an annual full refresh. Per-voter
      probabilities skew low by construction (out-of-distribution vs the
      precinct-trained model) but aggregate back to the precinct projections.
    config:
      # Monthly, matching the L2 refresh cadence: a full build scores ~218M rows and
      # takes hours, and new registrations only arrive with an L2 load, so a shorter
      # cadence would burn cluster time without changing the output.
      tags: ["monthly"]
      meta:
        # Most recent year L2 has COMPLETE vote history. Manually maintained (the
        # same knob the district model uses); bump it when L2 gains a new complete
        # year. Not auto-detected: L2 pre-provisions empty future vote-history
        # columns, so column presence is not data presence.
        max_vote_history_year: "{{ var('max_vote_history_year', 2025) }}"
        # Derived at run time when left blank: inference_year = current calendar year;
        # model_slug / election_code = that year's November election. Overrides for backfills.
        voter_turnout_inference_year: "{{ var('voter_turnout_inference_year', '') }}"
        voter_turnout_model_slug: "{{ var('voter_turnout_model_slug', '') }}"
        voter_turnout_election_code: "{{ var('voter_turnout_election_code', '') }}"
        # Schema holding the @production registered models.
        voter_turnout_models_schema: "{{ var('voter_turnout_models_schema', 'model_predictions') }}"
        # Schema holding turnout_historical_precincts (promoted alongside the models).
        voter_turnout_precincts_schema: "{{ var('voter_turnout_precincts_schema', 'model_predictions') }}"
        # UC Volume the booster is staged to for executor-side reads (USER_ISOLATION
        # cluster: no sparkContext broadcast). PROD reuses the existing dbt.object_storage
        # scratch volume (dbt Cloud SP already has WRITE); it holds a transient booster, not data.
        voter_turnout_booster_volume: "{{ var('voter_turnout_booster_volume', '/Volumes/goodparty_data_catalog/dbt/object_storage') }}"
        # DEV-ONLY: comma/space list like "WY" to score a subset without a full run.
        l2_state_allowlist: "{{ var('l2_state_allowlist', '') }}"
    columns:
      - name: LALVOTERID
        description: "L2 voter id; join key to gp_api_voters. One row per voter."
        tests:
          - not_null
          - unique
      - name: prob_vote
        description: >
          Modeled turnout probability in [0, 1] for the November election of the
          year the table was last fully refreshed. Not pinned to a year: the
          inference year derives at run time, so a full refresh advances it.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: prediction
        description: "Binary vote/no-vote label = 1.0 when prob_vote >= 0.5, else 0.0."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: election_year
        description: >
          Election year scored. Constant across the table: incremental runs never
          rescore existing voters, so the year only advances on a full refresh.
        tests:
          - not_null
          # A mixed-year table means the annual full refresh has not happened yet:
          # the derived year advances on Jan 1, so any incremental run before that
          # refresh scores new voters a year ahead of everyone else. Warn rather than
          # error, because that transitional window is normal operation and erroring
          # would block the whole downstream chain every January; the scheduled
          # refresh, not this test, is what keeps the window short.
          - dbt_expectations.expect_column_unique_value_count_to_be_between:
              arguments:
                min_value: 1
                max_value: 1
              config:
                severity: warn
          # Separately, warn when the table has fallen behind the calendar: legal
          # during a deliberate backfill override, which is why this is not an error.
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= year(current_date())"
              config:
                severity: warn
      - name: election_code
        description: "Election stage scored (General for the shipped grain)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["General", "Local_or_Municipal", "Primary"]
      - name: model_version
        description: "model_family value read from the @production registered-model tag."
        tests:
          - not_null
      - name: mlflow_model_version
        description: >
          Numeric registry version the @production alias resolved to for this build.
          model_version names the family, not the booster, so this is the only column
          that identifies which artifact produced a row. Single-valued only right
          after a full refresh: an incremental run scores just the new voters, so a
          retrain leaves the table spanning two versions until the next full refresh.
        tests:
          - not_null
          # Warn for the same reason as election_year: an incremental run scores
          # only new voters, so a retrain between full refreshes legitimately leaves
          # the table spanning two boosters. Worth surfacing, not worth failing.
          - dbt_expectations.expect_column_unique_value_count_to_be_between:
              arguments:
                min_value: 1
                max_value: 1
              config:
                severity: warn
      - name: state
        description: >
          State postal code. The full-nationwide set is asserted so a partial
          (allowlisted) build fails loudly.
        tests:
          - not_null
          - dbt_expectations.expect_column_distinct_values_to_equal_set:
              arguments:
                value_set: "{{ get_us_states_list(include_DC=true, include_US=false, include_territories=false) }}"

  - name: int__indep_openness_voter_scores
    description: >
      Per-voter openness to an independent candidate, from the two ballot-caster
      state-leg independent models. Each voter is scored as a district of 1 under 10
      fixed race scenarios (field, seat count, incumbent or open seat) at the state's
      reference size, using the voter's own registration and partisanship. Each
      scenario has a raw score and a flag: true when the score is at or above the
      state's cut for that scenario. One row per LALVOTERID; gp_api_voters joins
      only the flags onto the voter row, and gp-api picks the campaign's scenario
      column at query time. The raw scores stay in the warehouse.
      The models follow a registry alias. Cut points come from a research notebook
      that scores the whole voter file, keyed by a fingerprint of everything that
      moves a score; this model reads only the cuts matching its own fingerprint.
      Incremental (merge on LALVOTERID): runs score only new voters until the
      fingerprint changes (a promoted model, a new seed or date), then rescore every
      voter. Each incremental run first deletes voters no longer in L2. With no
      cuts yet for a new fingerprint, an incremental run leaves the table
      unchanged and a first build or full refresh fails.
    config:
      # Monthly, with the L2 refresh: new registrants only arrive with an L2 load.
      tags: ["monthly"]
      meta:
        # A model reaches the product when the alias moves, so rank-compare a new
        # version against the current one and cut it in the notebook before promoting.
        # Models and cut points are developed in sandbox and copied here at promotion;
        # point the two vars at sandbox to test a candidate in dev.
        indep_openness_models_schema: "{{ var('indep_openness_models_schema', 'model_predictions') }}"
        indep_openness_model_alias: "{{ var('indep_openness_model_alias', 'production') }}"
        # Feature dates and the ballot-caster election. Part of the fingerprint, so a
        # change here waits for matching cuts and then rescores everyone.
        indep_openness_election_date: "{{ var('indep_openness_election_date', '2026-11-03') }}"
        indep_openness_reg_cutoff: "{{ var('indep_openness_reg_cutoff', '2026-11-15') }}"
        indep_openness_primary_end_year: "{{ var('indep_openness_primary_end_year', 2026) }}"
        indep_openness_caster_column: "{{ var('indep_openness_caster_column', 'General_2024') }}"
        indep_openness_cutpoints_table: "{{ var('indep_openness_cutpoints_table', 'goodparty_data_catalog.model_predictions.indep_openness_cutpoints') }}"
        # DEV-ONLY: comma/space list like "WV" to score a subset without a full run.
        l2_state_allowlist: "{{ var('l2_state_allowlist', '') }}"
    columns:
      - name: LALVOTERID
        description: "L2 voter id; join key to gp_api_voters. One row per voter."
        data_tests:
          - not_null
          - unique
      - name: state
        description: Two-letter state code. Cuts are per state.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('indep_openness_n_ref')
                field: state
      - name: indep_openness_single_inc
        description: "At or above the state cut. One seat, a Democrat and a Republican running, D or R incumbent in the field."
        data_tests: &indep_openness_not_null
          - not_null
      - name: indep_openness_single_open
        description: "At or above the state cut. One seat, a Democrat and a Republican running, no D or R incumbent."
        data_tests: *indep_openness_not_null
      - name: indep_openness_multi_inc
        description: "At or above the state cut. Two or more seats, full field (scored at 3 seats), incumbent in the field."
        data_tests: *indep_openness_not_null
      - name: indep_openness_multi_open
        description: "At or above the state cut. Two or more seats, full field (scored at 3 seats), open."
        data_tests: *indep_openness_not_null
      - name: indep_openness_donly_inc
        description: "At or above the state cut. One seat, a lone Democrat opponent, incumbent in the field."
        data_tests: *indep_openness_not_null
      - name: indep_openness_donly_open
        description: "At or above the state cut. One seat, a lone Democrat opponent, open."
        data_tests: *indep_openness_not_null
      - name: indep_openness_ronly_inc
        description: "At or above the state cut. One seat, a lone Republican opponent, incumbent in the field."
        data_tests: *indep_openness_not_null
      - name: indep_openness_ronly_open
        description: "At or above the state cut. One seat, a lone Republican opponent, open."
        data_tests: *indep_openness_not_null
      - name: indep_openness_donly_multi
        description: "At or above the state cut. Two or more seats, Democrats and no Republicans (incumbent seed only)."
        data_tests: *indep_openness_not_null
      - name: indep_openness_ronly_multi
        description: "At or above the state cut. Two or more seats, Republicans and no Democrats (incumbent seed only)."
        data_tests: *indep_openness_not_null
      - name: raw_single_inc
        description: Raw model score behind indep_openness_single_inc. Warehouse only.
        data_tests: *indep_openness_not_null
      - name: raw_single_open
        description: Raw model score behind indep_openness_single_open. Warehouse only.
        data_tests: *indep_openness_not_null
      - name: raw_multi_inc
        description: Raw model score behind indep_openness_multi_inc. Warehouse only.
        data_tests: *indep_openness_not_null
      - name: raw_multi_open
        description: Raw model score behind indep_openness_multi_open. Warehouse only.
        data_tests: *indep_openness_not_null
      - name: raw_donly_inc
        description: Raw model score behind indep_openness_donly_inc. Warehouse only.
        data_tests: *indep_openness_not_null
      - name: raw_donly_open
        description: Raw model score behind indep_openness_donly_open. Warehouse only.
        data_tests: *indep_openness_not_null
      - name: raw_ronly_inc
        description: Raw model score behind indep_openness_ronly_inc. Warehouse only.
        data_tests: *indep_openness_not_null
      - name: raw_ronly_open
        description: Raw model score behind indep_openness_ronly_open. Warehouse only.
        data_tests: *indep_openness_not_null
      - name: raw_donly_multi
        description: Raw model score behind indep_openness_donly_multi. Warehouse only.
        data_tests: *indep_openness_not_null
      - name: raw_ronly_multi
        description: Raw model score behind indep_openness_ronly_multi. Warehouse only.
        data_tests: *indep_openness_not_null
      # Version numbers can differ across rows without a rescore: copying a model
      # between registries renumbers it but leaves its content, and the fingerprint, alone.
      - name: model_version_2plus
        description: Registry version of stateleg_ind_2plusmajorparty_voted that scored the row.
        data_tests:
          - not_null
      - name: model_version_0or1
        description: Registry version of stateleg_ind_voted that scored the row.
        data_tests:
          - not_null
      - name: scoring_fingerprint
        description: >
          Hash of the boosters, n_ref seed, scenarios and feature SQL the row was
          scored with; the key its cut points were read under.
        data_tests:
          - not_null
          # More than one value means a rescore after a change did not complete.
          - dbt_expectations.expect_column_unique_value_count_to_be_between:
              arguments:
                min_value: 1
                max_value: 1
      - name: n_ref
        description: Reference size the voter's state was scored at (seed indep_openness_n_ref).
        data_tests:
          - not_null
      - name: scored_at
        description: When the row was scored.
        data_tests:
          - not_null

  - name: int__l2_nationwide_haystaq_flags
    description: "Combined Haystaq issue model flags from all states (loaded from per-state L2 Haystaq flags tables)"
    config:
      tags: ["monthly"]
      # A rebuild drops columns L2 has retired while
      # delta.dataSkippingStatsColumns still names them, which Delta rejects.
      # Clearing it first lets the rebuild through.
      pre_hook:
        - "{% if should_full_refresh() and load_relation(this) %}alter table {{ this }} unset tblproperties if exists ('delta.dataSkippingStatsColumns'){% endif %}"
      meta:
        dbt_environment: "{{ env_var('DBT_ENVIRONMENT') }}"
        # optional: comma/space-separated list like \"AK,AL\" for iterative runs
        l2_state_allowlist: "{{ var('l2_state_allowlist', '') }}"
    columns:
      - name: LALVOTERID
        description: "The ID of the voter"
        tests:
          - not_null
          - unique

  - name: int__l2_nationwide_haystaq_scores
    description: "Combined Haystaq issue model scores from all states (loaded from per-state L2 Haystaq scores tables)"
    config:
      tags: ["monthly"]
      # A rebuild drops columns L2 has retired while
      # delta.dataSkippingStatsColumns still names them, which Delta rejects.
      # Clearing it first lets the rebuild through.
      pre_hook:
        - "{% if should_full_refresh() and load_relation(this) %}alter table {{ this }} unset tblproperties if exists ('delta.dataSkippingStatsColumns'){% endif %}"
      meta:
        dbt_environment: "{{ env_var('DBT_ENVIRONMENT') }}"
        # optional: comma/space-separated list like \"AK,AL\" for iterative runs
        l2_state_allowlist: "{{ var('l2_state_allowlist', '') }}"
    columns:
      - name: LALVOTERID
        description: "The ID of the voter"
        tests:
          - not_null
          - unique

  - name: int__zip_code_to_br_office
    description: >
      Zip code to BR office mapping. Rows arrive by two paths: the LLM match,
      and the l2_br_match_overrides seed for positions the LLM placed at the
      wrong district or not at all. To see why a district was chosen, join
      int__l2_br_match_served on br_database_id; a position absent there, or
      carrying a different district than the row shows, was placed by the seed,
      and a non-null withheld_reason there says why a match was not served.
    columns:
      - name: zip_code
        description: "Zip code"
        tests:
          - not_null
      - name: state_postal_code
        description: "State postal code"
        tests:
          - dbt_expectations.expect_column_distinct_values_to_equal_set:
              arguments:
                value_set: "{{ get_us_states_list(include_DC=true, include_US=false) }}"
      - name: district_type
        description: "District type"
        tests:
          - not_null
      - name: district_name
        description: "District name"
        tests:
          - not_null
      - name: voters_in_zip_district
        description: >
          L2 voters in this (zip, district_type, district_name). Passes
          through unchanged from int__zip_code_to_l2_district at L2 grain.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: voters_in_zip
        description: >
          L2 voters in this zip across all district_names of this
          district_type. Invariant per (zip, state, district_type).
          Voters whose value for this district_type column is null are
          excluded from the denominator (matches int__zip_code_to_l2_district).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: br_database_id
        description: "BallotReady/CivicEngine database ID"
      - name: br_position_id
        description: "BallotReady/CivicEngine position ID"
        tests:
          - relationships:
              arguments:
                to: ref("stg_airbyte_source__ballotready_api_position")
                field: id
      - name: br_race_id
        description: "BR race ID"
        tests:
          - relationships:
              arguments:
                to: ref("stg_airbyte_source__ballotready_api_race")
                field: id
      - name: br_race_database_id
        description: "BR race database ID"
        tests:
          - relationships:
              arguments:
                to: ref("stg_airbyte_source__ballotready_api_race")
                field: database_id
    tests:
      # One row per (zip, office), full stop: m_election_api__zip_to_position
      # sums voters_in_zip_district per pair, so a second row -- e.g. one
      # office joining two spellings of one district -- silently double-counts
      # that district's voters in pct_districtzip_to_zip. Strictly tighter
      # than the previous (zip, type, name, office) key.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - zip_code
              - br_database_id
      - dbt_utils.expression_is_true:
          arguments:
            expression: "voters_in_zip_district <= voters_in_zip"

  - name: int__zip_code_to_l2_district
    description: >
      Zip code to L2 district mapping. One row per
      (zip_code, state_postal_code, district_type, district_name) with the
      L2 voter count in that intersection and the total L2 voter count for
      the zip. No threshold is applied; downstream consumers decide cutoffs.
    columns:
      - name: zip_code
        description: "5-digit zip code"
        tests:
          - not_null
      - name: state_postal_code
        description: "State postal code"
        tests:
          - dbt_expectations.expect_column_distinct_values_to_equal_set:
              arguments:
                value_set: "{{ get_us_states_list(include_DC=true, include_US=false) }}"
      - name: district_type
        description: >
          L2 district column name (e.g. City, US_Congressional_District), plus
          the synthetic value 'State' (one row per in-state zip, district_name =
          state_postal_code) used to give statewide positions zip coverage.
        tests:
          - not_null
      - name: district_name
        description: "L2 district value within district_type for this zip"
        tests:
          - not_null
      - name: voters_in_zip_district
        description: >
          Count of L2 voters whose residence is in this zip AND in this
          (district_type, district_name).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: voters_in_zip
        description: >
          Count of L2 voters whose residence is in this zip with a non-null
          value for this district_type column (summed across all district_names
          of this district_type). Voters whose value for the district_type
          column is null are excluded from the denominator. Invariant per
          (zip_code, state_postal_code, district_type).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - zip_code
              - state_postal_code
              - district_type
              - district_name
      - dbt_utils.expression_is_true:
          arguments:
            expression: "voters_in_zip_district <= voters_in_zip"

  - name: int__l2_nationwide_constituents_w_haystaq
    description: >
      int__l2_nationwide_uniform_w_haystaq plus the people in
      gp_api_consumer_only_people, under the voter table's raw L2 columns, so a
      reader of the voter table can switch to this one without changing a
      query. Consumer-only rows carry names, address, phones, districts and
      precinct (placed by area), census tract and block group, and the
      demographics the commercial file shares with the voter file; party,
      turnout, registration and Haystaq columns are null. Only Michigan has
      consumer-only rows today. A view, so it stores nothing beyond its inputs.
    columns:
      - name: is_registered_voter
        description: True when the row comes from the voter file.
      - name: district_source
        description: >
          voter_file for voter rows; for consumer-only rows, the area whose
          voters supplied the district columns, or null when none matched.
      - name: individual_id
        description: >
          The L2 commercial Individual_Id on consumer-only rows; null on voter
          rows.

  - name: int__l2_area_district_profiles
    description: >
      For each census block, block group, tract and ZIP+4 in a state with an L2
      commercial file, the most common complete set of L2 district values among
      the voters there. It places people who are not in the voter file. The whole
      set comes from one group of voters, so the columns stay consistent with
      each other, and values are the voter file's raw strings, so they match
      gp_api_voters. Carries every get_l2_district_types() column and Precinct.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [area_type, area_id]
    columns:
      - name: area_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - census_block
                  - census_block_group
                  - census_tract
                  - zip_plus_4
      - name: area_id
        description: >
          15-, 12- or 11-character census GEOID, or a ZIP+4 written as
          ZIP-PLUS4. The voter file's suffix is padded to 4 digits, so it
          matches the commercial file's even if a load drops leading zeros.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^[0-9]{5}-[0-9]{4}$"
              config:
                where: "area_type = 'zip_plus_4'"
      - name: voters_in_area
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: voters_with_profile
        description: Voters in the area whose district values are exactly this set.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: profile_share
        description: voters_with_profile / voters_in_area.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true

  - name: int__l2_block_district_map
    description: >
      One row per (census block, state, district_type, normalized
      district_name) with the L2 voter count in that intersection
      (voters_in_block_district) and the per-(block, district_type) voter total
      (voters_in_block). The block-grain map underlying the district population
      allocation; UNPIVOTs the curated allocated district
      columns. Block grain is the source of truth for overlap (do NOT count by
      joining the district-level int__l2_district_aggregations on the
      normalized name - its key is non-unique and would fan out).
    columns:
      - name: block_geoid
        description: "15-char zero-padded 2020 census block GEOID (state+county+tract+block)."
        tests:
          - not_null
      - name: state_postal_code
        description: >
          Uppercase two-letter state postal code, derived from the block's
          geoid FIPS prefix (block_geoid[:2]) via the fips_codes seed -- NOT
          L2's per-voter state (which is mislabeled for voters geocoded across
          a state line). not_null confirms every block FIPS mapped; the
          state-set test confirms the FIPS->postal mapping is correct.
        tests:
          - not_null
          - dbt_expectations.expect_column_distinct_values_to_equal_set:
              arguments:
                value_set: "{{ get_us_states_list(include_DC=true, include_US=false) }}"
      - name: district_type
        description: "L2 district column name; the curated allocated type set."
        tests:
          - not_null
          - accepted_values:
              name: int__l2_block_district_map_district_type_accepted_values
              arguments:
                values: "{{ get_l2_district_types(scope='allocated') }}"
      - name: district_name
        description: "Normalized L2 district name (normalize_l2_district_name): upper, trimmed, no ' (EST.)'."
        tests:
          - not_null
      - name: voters_in_block_district
        description: "Distinct L2 voters in this (block, district_type, district_name)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: voters_in_block
        description: >
          Distinct L2 voters in this block across all district_names of this
          district_type (the allocation's split denominator). Invariant per
          (block_geoid, district_type).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: loaded_at
        description: "Max loaded_at of the contributing L2 rows."
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [block_geoid, district_type, district_name]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "voters_in_block_district <= voters_in_block"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "length(block_geoid) = 15"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "length(trim(district_name)) > 0"

  - name: int__election_calendar_primary_ballotready
    description: >
      Live-recomputed per (state, election_year) Primary date, informed by
      BallotReady's scheduled-election data and treated as authoritative for
      Primary in the race build -- recomputes every run, so an edit to
      BallotReady's election table flows through automatically. Even years
      only. See the model file's header comment for the full rule
      (max-race-count winner, Wisconsin exception, Presidential fallback, the
      Louisiana general-day collision guard); validation writeup on the
      original branch PR.
    columns:
      - name: state
        description: State postal code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ get_us_states_list(include_DC=true, include_US=false, include_territories=false) }}"
      - name: election_date
        description: The Primary date for this state/year, per BallotReady
        data_tests:
          - not_null
      - name: election_code
        description: Always 'Primary' -- this model only ever emits Primary rows
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Primary"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - state
              - year(election_date)
      - dbt_utils.expression_is_true:
          name: election_calendar_even_years_only
          arguments:
            expression: "year(election_date) % 2 = 0"

unit_tests:
  # Each guard fires on the shape the run audits found wrong, and each exception holds:
  # a county-named district, a row named for the member town, a subdistrict zone, a
  # state outside the verified set, a county-court district, a K-12 board named College,
  # an attempt before the cutover, and a plain abstain.
  - name: l2_br_match_served_guards
    model: int__l2_br_match_served
    given:
      - input: ref('stg_model_predictions__llm_l2_br_match')
        rows:
          - {br_database_id: 1, l2_state: "FL", l2_district_type: "State", l2_district_name: "FL", confidence: 92, attempted_at: "2026-10-01 14:30:00", is_matched: true}
          - {br_database_id: 2, l2_state: "KS", l2_district_type: "County", l2_district_name: "RAWLINS", confidence: 92, attempted_at: "2026-10-01 14:30:00", is_matched: true}
          - {br_database_id: 3, l2_state: "NJ", l2_district_type: "High_School_District", l2_district_name: "KINGSWAY REGIONAL HS DIST (EST.)", confidence: 92, attempted_at: "2026-10-01 14:30:00", is_matched: true}
          - {br_database_id: 4, l2_state: "NJ", l2_district_type: "Elementary_School_District", l2_district_name: "NATIONAL PARK ELEM SD (EST.)", confidence: 92, attempted_at: "2026-10-01 14:30:00", is_matched: true}
          - {br_database_id: 5, l2_state: "NJ", l2_district_type: "Elementary_School_District", l2_district_name: "SUSSEX-WANTAGE REGIONAL ELEM SD (EST.)", confidence: 92, attempted_at: "2026-10-01 14:30:00", is_matched: true}
          - {br_database_id: 6, l2_state: "NJ", l2_district_type: "School_Board_District", l2_district_name: "EXAMPLE REGIONAL BOE DIST 2", confidence: 92, attempted_at: "2026-10-01 14:30:00", is_matched: true}
          - {br_database_id: 7, l2_state: "IN", l2_district_type: "School_District", l2_district_name: "WESTVIEW SD", confidence: 92, attempted_at: "2026-10-01 14:30:00", is_matched: true}
          - {br_database_id: 8, l2_state: "NJ", l2_district_type: "Fire_District", l2_district_name: "UNION CNTY FD", confidence: 92, attempted_at: "2026-10-01 14:30:00", is_matched: true}
          - {br_database_id: 9, l2_state: "NY", l2_district_type: "State", l2_district_name: "NY", confidence: 92, attempted_at: "2026-10-01 14:30:00", is_matched: true}
          - {br_database_id: 10, l2_state: "NE", l2_district_type: "Judicial_County_Court_District", l2_district_name: "COUNTY JUDGE DIST 09", confidence: 92, attempted_at: "2026-10-01 14:30:00", is_matched: true}
          - {br_database_id: 11, l2_state: "CA", l2_district_type: "County_Unified_School_District", l2_district_name: "EXAMPLE CNTY USD", confidence: 92, attempted_at: "2026-10-01 14:30:00", is_matched: true}
          - {br_database_id: 12, l2_state: "CA", l2_district_type: "School_District", l2_district_name: "COLLEGE SD", confidence: 92, attempted_at: "2026-10-01 14:30:00", is_matched: true}
          - {br_database_id: 13, l2_state: "SC", l2_district_type: "Hamlet_Community_Area", l2_district_name: "EDISTO ISLAND COMMUNITY", confidence: 92, attempted_at: "2026-10-01 14:30:00", is_matched: true}
          - {br_database_id: 14, l2_state: "FL", l2_district_type: "State", l2_district_name: "FL", confidence: 92, attempted_at: "2026-08-31 19:46:39", is_matched: true}
          - {br_database_id: 15, l2_state: null, l2_district_type: null, l2_district_name: null, confidence: 92, attempted_at: "2026-10-01 14:30:00", is_matched: false}
      - input: ref('stg_airbyte_source__ballotready_api_position')
        rows:
          - {database_id: 1, name: "Park Creek Community Development District Board - Seat 2", state: "FL", sub_area_name: "Seat", sub_area_value: "2"}
          - {database_id: 2, name: "Rawlins County Hospital District Board - Position 4", state: "KS", sub_area_name: "Position", sub_area_value: "4"}
          - {database_id: 3, name: "Kingsway Regional School Board - Swedesboro Borough", state: "NJ", sub_area_name: "", sub_area_value: "Swedesboro Borough"}
          - {database_id: 4, name: "Gateway Regional School Board - National Park Borough", state: "NJ", sub_area_name: "", sub_area_value: "National Park Borough"}
          - {database_id: 5, name: "Sussex-Wantage Regional School Board - Wantage Township", state: "NJ", sub_area_name: "", sub_area_value: "Wantage Township"}
          - {database_id: 6, name: "Example Regional School Board - Example Township", state: "NJ", sub_area_name: "", sub_area_value: "Example Township"}
          - {database_id: 7, name: "Westview School Board - Newbury Township", state: "IN", sub_area_name: "", sub_area_value: "Newbury Township"}
