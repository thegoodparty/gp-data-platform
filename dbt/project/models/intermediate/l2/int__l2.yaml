version: 2

models:
  - name: int__l2_district_aggregations
    description: Intermediate model that aggregates L2 district data for downstream use.
    columns:
      - name: id
        description: Internally generated unique identifier for the district aggregation.
        tests:
          - not_null
          - unique
          - is_uuid
      - name: state_postal_code
        description: "Uppercase two-letter state postal code"
        tests:
          - not_null
          - dbt_expectations.expect_column_distinct_values_to_equal_set:
              arguments:
                value_set: "{{ get_us_states_list(include_DC=true, include_US=false) }}"
      - name: district_type
        description: "Type of district (e.g., US_Congressional_District, State_Senate_District)"
        tests:
          - not_null
      - name: district_name
        description: "The actual district identifier/name"
        tests:
          - not_null
      - name: voter_count
        description: "Number of distinct voters in this district"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: BIGINT
      - name: unique_cellphones
        description: >-
          Distinct cellphone numbers
          (votertelephones_cellphoneformatted) appearing on L2 voters
          in this district. The collapse is on the phone-number value
          itself, so two voters sharing a household phone count as
          one — this matches per-channel send/dial costs downstream
          (SMS, robocall).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: BIGINT
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: unique_landlines
        description: >-
          Distinct landline numbers
          (votertelephones_landlineformatted) appearing on L2 voters
          in this district. Same collapse semantics as
          unique_cellphones.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: BIGINT
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: loaded_at
        description: "Timestamp from the source L2 uniform data"
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - state_postal_code
              - district_type
              - district_name
      # A district absent from the mart is never minted an id, so it binds no voters.
      - l2_district_tuple_exists:
          arguments:
            to: ref('m_election_api__district')
            state_column: state_postal_code
            district_type_column: district_type
            district_name_column: district_name

  - name: int__l2_district_universe
    description: >
      One row per district in each state's latest L2 delivery, plus 51
      synthetic statewide rows (district_type='State', district_name =
      state_postal_code) that give Governor and US Senate seats something
      to match to. This is the candidate menu the L2-to-BallotReady
      matcher reads; it carries no voter counts because a menu needs
      labels and types, not counts.
    columns:
      - name: state_postal_code
        description: "Uppercase two-letter state postal code"
        tests:
          - dbt_expectations.expect_column_distinct_values_to_equal_set:
              arguments:
                value_set: "{{ get_us_states_list(include_DC=true, include_US=false) }}"
      - name: district_type
        description: "L2 district column name, or 'State' for the synthetic statewide row."
      - name: district_name
        description: "District identifier within district_type; state_postal_code again for the 'State' rows."
        tests:
          - not_null
      - name: loaded_at
        description: >
          Timestamp of the L2 delivery this district is current as of; the
          join key used to filter to each state's latest delivery.
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - state_postal_code
              - district_type
              - district_name
      # Universe canonicalization check: a label spelled one way here must be
      # spelled the same way in the relation that carries the voter counts,
      # or the two never join.
      - l2_district_tuple_exists:
          arguments:
            to: ref('int__l2_district_aggregations')
            state_column: state_postal_code
            district_type_column: district_type
            district_name_column: district_name
            to_state_column: state_postal_code
            to_district_type_column: district_type
            to_district_name_column: district_name

  - name: int__l2_nationwide_uniform_raw_districts
    description: "Combined uniform voter file data from all states"
    columns:
      - name: state_postal_code
        description: "Uppercase two-letter state postal code"
        tests:
          - dbt_expectations.expect_column_distinct_values_to_equal_set:
              arguments:
                value_set: "{{ get_us_states_list(include_DC=true, include_US=false, include_territories=false) }}"

  - name: int__l2_nationwide_uniform
    description: "The voter file, with l2_manual_district_assignments applied"

  - name: int__voter_turnout_inference
    description: >
      Nationwide district-level voter-turnout projections from the registered
      turnout models. One row per (state, district_type, district_name,
      election_year, election_code). model_version records the model family
      that produced each row, so the underlying model can be swapped without
      renaming anything.
    config:
      meta:
        # Most recent year of L2 vote history present (drives the feature window).
        max_vote_history_year: "{{ var('max_vote_history_year', 2025) }}"
        # DEV-ONLY iteration knob: comma/space list like "AL" to score a subset.
        # NEVER set when building the wired int__model_prediction_voter_turnout
        # (the carve would suppress legacy rows nationwide for a partial run).
        l2_state_allowlist: "{{ var('l2_state_allowlist', '') }}"
        # Schema holding the @production registered models.
        voter_turnout_models_schema: "{{ var('voter_turnout_models_schema', 'model_predictions') }}"
        # Schema holding turnout_historical_precincts. PROD = model_predictions
        # (must be promoted there alongside the models; it currently exists only
        # in sandbox). Dev overrides to sandbox via the var.
        voter_turnout_precincts_schema: "{{ var('voter_turnout_precincts_schema', 'model_predictions') }}"
    columns:
      - name: election_year
        description: "Election year scored (current year + 0/1/2)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2024
                max_value: 2035
      - name: election_code
        description: "General, Local_or_Municipal, or Primary (the codes this model emits)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["General", "Local_or_Municipal", "Primary"]
      - name: state
        description: >
          State postal code. The full-nationwide set is asserted so a partial
          (allowlisted) build fails loudly.
        tests:
          - not_null
          - dbt_expectations.expect_column_distinct_values_to_equal_set:
              arguments:
                value_set: "{{ get_us_states_list(include_DC=true, include_US=false, include_territories=false) }}"
      - name: district_type
        description: "L2 district column name, or 'State' for the statewide row."
        tests:
          - not_null
      - name: district_name
        description: "District identifier within district_type."
        tests:
          - not_null
      - name: ballots_projected
        description: >
          Projected ballots = round(sum(p_hat * n_voters)) over the district's
          precincts, floored at 3 ballots (the serving floor; bounds share it).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 3
                inclusive: true
      - name: ballots_projected_lower
        description: >
          Lower prediction bound (p25). Applies the per-model residual
          quantile at the district's implied predicted rate:
          round(clip(pred_rate + q25 * w(pred_rate), 0, 1) * district_voters),
          floored at 3 with the point. w is sqrt(p*(1-p)) for 'binom' models
          and sqrt(1-p) for 'taper_top' (low-turnout local) models. Always
          populated: params are required at load and predictions are asserted
          finite at source.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 3
                inclusive: true
      - name: ballots_projected_upper
        description: >
          Upper prediction bound (p95), the risk-relevant band for win-number
          planning. Same construction as ballots_projected_lower with q95.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 3
                inclusive: true
      - name: model_slug
        description: >
          Registered-model slug that produced the row (provenance; the
          election_code is derived from it at prediction time).
        tests:
          - not_null
      - name: model_version
        description: "model_family value (load-bearing - part of the election-api projected_turnout id)."
        tests:
          - not_null
      - name: inference_at
        description: "Timestamp the projections were produced (dedup tiebreaker downstream)."
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - state
              - district_type
              - district_name
              - election_year
              - election_code
              - model_version
      - dbt_utils.expression_is_true:
          name: voter_turnout_inference_bounds_ordering
          arguments:
            expression: >
              ballots_projected_lower <= ballots_projected
              and ballots_projected <= ballots_projected_upper

  - name: int__l2_nationwide_haystaq_flags
    description: "Combined Haystaq issue model flags from all states (loaded from per-state L2 Haystaq flags tables)"
    config:
      tags: ["monthly"]
      meta:
        dbt_environment: "{{ env_var('DBT_ENVIRONMENT') }}"
        # optional: comma/space-separated list like \"AK,AL\" for iterative runs
        l2_state_allowlist: "{{ var('l2_state_allowlist', '') }}"
        # optional override if your user doesn't have permissions on the default source schema
        l2_haystaq_databricks_schema: "{{ var('l2_haystaq_databricks_schema', '') }}"
    columns:
      - name: LALVOTERID
        description: "The ID of the voter"
        tests:
          - not_null
          - unique

  - name: int__l2_nationwide_haystaq_scores
    description: "Combined Haystaq issue model scores from all states (loaded from per-state L2 Haystaq scores tables)"
    config:
      tags: ["monthly"]
      meta:
        dbt_environment: "{{ env_var('DBT_ENVIRONMENT') }}"
        # optional: comma/space-separated list like \"AK,AL\" for iterative runs
        l2_state_allowlist: "{{ var('l2_state_allowlist', '') }}"
        # optional override if your user doesn't have permissions on the default source schema
        l2_haystaq_databricks_schema: "{{ var('l2_haystaq_databricks_schema', '') }}"
    columns:
      - name: LALVOTERID
        description: "The ID of the voter"
        tests:
          - not_null
          - unique

  - name: int__zip_code_to_br_office
    description: >
      Zip code to BR office mapping. Rows arrive by two paths: the frozen LLM
      match, and the l2_br_match_overrides seed for positions the LLM placed
      at the wrong district or not at all. To see why a district was chosen,
      join stg_model_predictions__llm_l2_br_match_20260126 (a view) on
      br_database_id; a position absent there, or carrying a different
      district than the row shows, was placed by the seed.
    columns:
      - name: zip_code
        description: "Zip code"
        tests:
          - not_null
      - name: state_postal_code
        description: "State postal code"
        tests:
          - dbt_expectations.expect_column_distinct_values_to_equal_set:
              arguments:
                value_set: "{{ get_us_states_list(include_DC=true, include_US=false) }}"
      - name: district_type
        description: "District type"
        tests:
          - not_null
      - name: district_name
        description: "District name"
        tests:
          - not_null
      - name: voters_in_zip_district
        description: >
          L2 voters in this (zip, district_type, district_name). Passes
          through unchanged from int__zip_code_to_l2_district at L2 grain.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: voters_in_zip
        description: >
          L2 voters in this zip across all district_names of this
          district_type. Invariant per (zip, state, district_type).
          Voters whose value for this district_type column is null are
          excluded from the denominator (matches int__zip_code_to_l2_district).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: confidence
        description: "LLM confidence"
      - name: br_database_id
        description: "BallotReady/CivicEngine database ID"
      - name: br_position_id
        description: "BallotReady/CivicEngine position ID"
        tests:
          - relationships:
              arguments:
                to: ref("stg_airbyte_source__ballotready_api_position")
                field: id
      - name: br_race_id
        description: "BR race ID"
        tests:
          - relationships:
              arguments:
                to: ref("stg_airbyte_source__ballotready_api_race")
                field: id
      - name: br_race_database_id
        description: "BR race database ID"
        tests:
          - relationships:
              arguments:
                to: ref("stg_airbyte_source__ballotready_api_race")
                field: database_id
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - zip_code
              - district_type
              - district_name
              - br_database_id
      - dbt_utils.expression_is_true:
          arguments:
            expression: "voters_in_zip_district <= voters_in_zip"

  - name: int__zip_code_to_l2_district
    description: >
      Zip code to L2 district mapping. One row per
      (zip_code, state_postal_code, district_type, district_name) with the
      L2 voter count in that intersection and the total L2 voter count for
      the zip. No threshold is applied; downstream consumers decide cutoffs.
    columns:
      - name: zip_code
        description: "5-digit zip code"
        tests:
          - not_null
      - name: state_postal_code
        description: "State postal code"
        tests:
          - dbt_expectations.expect_column_distinct_values_to_equal_set:
              arguments:
                value_set: "{{ get_us_states_list(include_DC=true, include_US=false) }}"
      - name: district_type
        description: >
          L2 district column name (e.g. City, US_Congressional_District), plus
          the synthetic value 'State' (one row per in-state zip, district_name =
          state_postal_code) used to give statewide positions zip coverage.
        tests:
          - not_null
      - name: district_name
        description: "L2 district value within district_type for this zip"
        tests:
          - not_null
      - name: voters_in_zip_district
        description: >
          Count of L2 voters whose residence is in this zip AND in this
          (district_type, district_name).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: voters_in_zip
        description: >
          Count of L2 voters whose residence is in this zip with a non-null
          value for this district_type column (summed across all district_names
          of this district_type). Voters whose value for the district_type
          column is null are excluded from the denominator. Invariant per
          (zip_code, state_postal_code, district_type).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - zip_code
              - state_postal_code
              - district_type
              - district_name
      - dbt_utils.expression_is_true:
          arguments:
            expression: "voters_in_zip_district <= voters_in_zip"

  - name: int__l2_block_district_map
    description: >
      One row per (census block, state, district_type, normalized
      district_name) with the L2 voter count in that intersection
      (voters_in_block_district) and the per-(block, district_type) voter total
      (voters_in_block). The block-grain map underlying the district population
      allocation; UNPIVOTs the curated allocated district
      columns. Block grain is the source of truth for overlap (do NOT count by
      joining the district-level int__l2_district_aggregations on the
      normalized name - its key is non-unique and would fan out).
    columns:
      - name: block_geoid
        description: "15-char zero-padded 2020 census block GEOID (state+county+tract+block)."
        tests:
          - not_null
      - name: state_postal_code
        description: >
          Uppercase two-letter state postal code, derived from the block's
          geoid FIPS prefix (block_geoid[:2]) via the fips_codes seed -- NOT
          L2's per-voter state (which is mislabeled for voters geocoded across
          a state line). not_null confirms every block FIPS mapped; the
          state-set test confirms the FIPS->postal mapping is correct.
        tests:
          - not_null
          - dbt_expectations.expect_column_distinct_values_to_equal_set:
              arguments:
                value_set: "{{ get_us_states_list(include_DC=true, include_US=false) }}"
      - name: district_type
        description: "L2 district column name; the curated allocated type set."
        tests:
          - not_null
          - accepted_values:
              name: int__l2_block_district_map_district_type_accepted_values
              arguments:
                values: "{{ get_l2_district_types(scope='allocated') }}"
      - name: district_name
        description: "Normalized L2 district name (normalize_l2_district_name): upper, trimmed, no ' (EST.)'."
        tests:
          - not_null
      - name: voters_in_block_district
        description: "Distinct L2 voters in this (block, district_type, district_name)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: voters_in_block
        description: >
          Distinct L2 voters in this block across all district_names of this
          district_type (the allocation's split denominator). Invariant per
          (block_geoid, district_type).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: loaded_at
        description: "Max loaded_at of the contributing L2 rows."
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [block_geoid, district_type, district_name]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "voters_in_block_district <= voters_in_block"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "length(block_geoid) = 15"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "length(trim(district_name)) > 0"

  - name: int__election_calendar_primary_ballotready
    description: >
      Live-recomputed per (state, election_year) Primary date, informed by
      BallotReady's scheduled-election data and treated as authoritative for
      Primary in the race build -- recomputes every run, so an edit to
      BallotReady's election table flows through automatically. Even years
      only. See the model file's header comment for the full rule
      (max-race-count winner, Wisconsin exception, Presidential fallback, the
      Louisiana general-day collision guard); validation writeup on the
      original branch PR.
    columns:
      - name: state
        description: State postal code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ get_us_states_list(include_DC=true, include_US=false, include_territories=false) }}"
      - name: election_date
        description: The Primary date for this state/year, per BallotReady
        data_tests:
          - not_null
      - name: election_code
        description: Always 'Primary' -- this model only ever emits Primary rows
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Primary"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - state
              - year(election_date)
      - dbt_utils.expression_is_true:
          name: election_calendar_even_years_only
          arguments:
            expression: "year(election_date) % 2 = 0"
