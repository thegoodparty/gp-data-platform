          - {database_id: 11, name: "Example Community College Board", state: "CA", sub_area_name: "", sub_area_value: ""}
          - {database_id: 12, name: "College School Board", state: "CA", sub_area_name: "", sub_area_value: ""}
          - {database_id: 13, name: "Edisto Beach Town Mayor", state: "SC", sub_area_name: "", sub_area_value: ""}
          - {database_id: 14, name: "Park Creek Community Development District Board - Seat 3", state: "FL", sub_area_name: "Seat", sub_area_value: "3"}
          - {database_id: 15, name: "Example Village Council", state: "OH", sub_area_name: "", sub_area_value: ""}
    expect:
      rows:
        - {br_database_id: 1, withheld_reason: "special_district_on_general_row", is_matched: false, l2_district_name: null}
        - {br_database_id: 2, withheld_reason: null, is_matched: true, l2_district_name: "RAWLINS"}
        - {br_database_id: 3, withheld_reason: "town_seat_on_parent_body", is_matched: false, l2_district_name: null}
        - {br_database_id: 4, withheld_reason: null, is_matched: true, l2_district_name: "NATIONAL PARK ELEM SD (EST.)"}
        - {br_database_id: 5, withheld_reason: "town_seat_on_parent_body", is_matched: false, l2_district_name: null}
        - {br_database_id: 6, withheld_reason: null, is_matched: true, l2_district_name: "EXAMPLE REGIONAL BOE DIST 2"}
        - {br_database_id: 7, withheld_reason: null, is_matched: true, l2_district_name: "WESTVIEW SD"}
        - {br_database_id: 8, withheld_reason: "township_fire_on_county_pool", is_matched: false, l2_district_name: null}
        - {br_database_id: 9, withheld_reason: "county_judge_off_county", is_matched: false, l2_district_name: null}
        - {br_database_id: 10, withheld_reason: null, is_matched: true, l2_district_name: "COUNTY JUDGE DIST 09"}
        - {br_database_id: 11, withheld_reason: "college_on_k12_row", is_matched: false, l2_district_name: null}
        - {br_database_id: 12, withheld_reason: null, is_matched: true, l2_district_name: "COLLEGE SD"}
        - {br_database_id: 13, withheld_reason: "census_place", is_matched: false, l2_district_name: null}
        - {br_database_id: 14, withheld_reason: null, is_matched: true, l2_district_name: "FL"}
        - {br_database_id: 15, withheld_reason: null, is_matched: false, l2_district_name: null}
