version: 2

models:
  - name: int__amplitude_user_milestones
    description: >
      User-grain intermediate model that aggregates milestone events from
      stg_airbyte_source__amplitude_api_events into one row per user_id for
      analytics.users metrics. Supports Onboarding CVR, Activated,
      and Active Candidates from a single Amplitude scan.
    columns:
      - name: user_id
        description: >
          BIGINT user identifier parsed from Amplitude user_id (STRING).
          Primary key for this model; used to join to mart_civics.users.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('goodparty_data_catalog', 'users')
                field: user_id
              config:
                severity: warn

      - name: amplitude_registration_completed_at
        description: >
          Earliest timestamp for event_type = 'Onboarding - Registration Completed'.
          Denominator timestamp for onboarding conversion.

      - name: first_dashboard_viewed_at
        description: >
          Earliest dashboard view per user, over the dashboard-view union
          (page path '/dashboard' plus the named surface events). Numerator
          timestamp for onboarding conversion.

      - name: registration_country
        description: >
          Amplitude country value from the registration event
          ('Onboarding - Registration Completed'). Used for US-segment filtering
          in onboarding CVR.

      - name: onboarding_completed_at
        description: >
          Earliest timestamp for event_type = 'onboarding_complete'.
          Supplemental column for OKR-document alternative onboarding definition.

      - name: first_campaign_sent_at
        description: >
          Earliest outreach action through the product, over the whole leg
          union compiled by is_outreach_activation_event rather than any one
          event name: a campaign sent, or a door knocked or call logged.
          Lifetime and unwindowed. The election-anchored equivalent is
          outreach_first_sent_at on the user outreach intensity model, which is
          a different number on purpose.

      - name: first_activation_channel
        description: >
          The channel of the send that set first_campaign_sent_at, in the outreach
          sends vocabulary. 'events' only comes from a self-report; 'unattributed'
          is a send that named no channel. Null exactly when
          first_campaign_sent_at is.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  [
                    "texting",
                    "robocall",
                    "social",
                    "door_knocking",
                    "phone_banking",
                    "events",
                    "unattributed",
                  ]

      - name: first_activation_is_self_reported
        description: >
          The activating send was a legacy self-report (method 'unknown'), which
          the OKR still counts. Null when not activated.

      - name: total_campaigns_sent
        description: >
          Lifetime count of product-performed outreach sends per user, over the
          leg union compiled by is_outreach_activation_event, deduplicated per
          outreach id and with self-report excluded. Doors knocked and calls
          logged are not campaigns and are left out; they are
          total_outreach_contacts. Not a single event name:
          the outreach surface has been rebuilt twice and each rebuild retired
          the event the count had been reading.

          Amplitude-only, so it cannot see a texting send made before the v2
          terminal event began firing in late September 2026; the product
          database holds those. Unwindowed, so it is not comparable with
          outreach_sent_count on the user outreach intensity model.
        data_tests:
          - not_null

      - name: total_outreach_contacts
        description: >
          Lifetime count of doors knocked and calls logged: the activation legs
          declared `unit: contact`, which fire once per person reached and are
          dropped from total_campaigns_sent.
        data_tests:
          - not_null

      - name: total_recipient_count
        description: >
          Sum of recipient counts over the same leg union as
          total_campaigns_sent, excluding values above 100000 or below 0 as
          instrumentation errors.

          Caveat worth knowing before quoting it: the sum coalesces
          recipientCount with voterContacts, and the two do not mean the same
          thing. voterContacts is the size of the audience the candidate
          selected, not the number a send reached, and it is the only count the
          phone-banking event carries. A known follow-up.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: last_dashboard_viewed_at
        description: >
          Latest dashboard view per user, over the dashboard-view union
          (page path '/dashboard' plus the named surface events). Supports
          active-candidate recency logic.

      - name: dashboard_view_count
        description: >
          Deduped count of dashboard views per user, over the dashboard-view
          union. Legs that co-fire on one visit collapse to a single view.
          Supports active-candidate usage intensity logic. Prefer distinct
          view-days for any engagement threshold: this count is sensitive to
          in-page re-firing, which the 30s gap only partly removes.
        data_tests:
          - not_null

      - name: pro_upgrade_completed_at
        description: >
          Earliest timestamp for event_type = 'pro_upgrade_complete'.
          Supplemental milestone for future analyses.

      - name: first_sms_poll_sent_at
        description: >
          Earliest timestamp for event_type = 'Serve Onboarding - SMS Poll Sent'.
          Supplemental Serve milestone for future analyses.

      - name: first_serve_activated_at
        description: >
          Earliest event among the legs the activated_serve_users metric
          declares, compiled by is_serve_activation_event. When an elected
          official first reached constituents through the product.

      - name: serve_getting_started_at
        description: >
          Earliest timestamp for 'Serve Onboarding - Getting Started Viewed'.
          First step in the Serve onboarding funnel.

      - name: serve_constituency_profile_at
        description: >
          Earliest timestamp for 'Serve Onboarding - Constituency Profile Viewed'.
          Second step in the Serve onboarding funnel.

      - name: serve_poll_value_props_at
        description: >
          Earliest timestamp for 'Serve Onboarding - Poll Value Props Viewed'.
          Third step in the Serve onboarding funnel.

      - name: serve_poll_strategy_at
        description: >
          Earliest timestamp for 'Serve Onboarding - Poll Strategy Viewed'.
          Fourth step in the Serve onboarding funnel.

      - name: serve_add_image_at
        description: >
          Earliest timestamp for 'Serve Onboarding - Add Image Viewed'.
          Fifth step in the Serve onboarding funnel.

      - name: serve_poll_preview_at
        description: >
          Earliest timestamp for 'Serve Onboarding - Poll Preview Viewed'.
          Sixth step in the Serve onboarding funnel. Precedes SMS Poll Sent.

      - name: serve_onboarding_started_at
        description: >
          First Serve onboarding screen across both flows: 'Getting Started
          Viewed' (the poll flow) or 'Welcome Viewed' (the flow from 2026-06-24).

      - name: serve_onboarding_completed_at
        description: >
          End of Serve onboarding across both flows: 'SMS Poll Sent' (the poll
          flow) or 'Pledge Completed' (the flow from 2026-06-24, which has no
          poll step).
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "first_dashboard_viewed_at <= last_dashboard_viewed_at"
          config:
            where: "first_dashboard_viewed_at is not null and last_dashboard_viewed_at is not null"
      # At user grain the earliest dashboard event always has lag = null, so it
      # always counts as a new view. Any user with a dashboard view must have
      # dashboard_view_count >= 1; a value of 0 here would mean the co-fire
      # dedup logic zeroed out a real view.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "dashboard_view_count >= 1"
          config:
            where: "last_dashboard_viewed_at is not null"

  - name: int__amplitude_user_flow_steps
    description: >
      How far each user got through the Win onboarding, Pro upgrade and Serve
      onboarding flows: one row per step reached in order. A step counts only
      when every earlier step fired before it, so users per step never rise.
      Core steps of each flow's current version only, counted from its launch
      date (Win onboarding 2026-06-08, Pro upgrade 2026-06-17, Serve onboarding
      2026-06-24). Optional and retired screens are left out, because a step
      list spanning versions reads renames as drop-off. The exception is
      win_onboarding_core: office, party and pledge, the three steps every Win
      onboarding version has had (from 2025-05-28), each counted from that
      version's own events while it ran. It checks only that earlier steps
      happened, not their order, because party moved ahead of office in 2026.
    columns:
      - name: user_id
        description: gp-api user id.
        data_tests:
          - not_null
      - name: flow
        description: win_onboarding, pro_upgrade, serve_onboarding or win_onboarding_core.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  [win_onboarding, pro_upgrade, serve_onboarding, win_onboarding_core]
      - name: step_order
        description: Position in the flow, from 1.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 6
      - name: step
        description: The step in display words.
        data_tests:
          - not_null
      - name: step_at
        description: First time the user reached the step.
        data_tests:
          - not_null
      - name: seconds_from_previous_step
        description: >
          Seconds since the latest earlier step. Null on step 1, and on a
          win_onboarding_core step that came before the one listed above it, so
          never negative.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, flow, step_order]

  - name: int__amplitude_serve_activity
    description: >
      User x month intermediate aggregating Serve MAU activity from Amplitude.
      Filters to canonical Serve MAU definition: Viewed event on
      /dashboard/polls with Serve Activated = true, excluding @goodparty.org.

      Grain: One row per user_id x activity_month_year.

      Source: stg_airbyte_source__amplitude_api_events.
    columns:
      - name: user_id
        description: User identifier (BIGINT, cast from Amplitude string user_id).
        data_tests:
          - not_null

      - name: activity_month_year
        description: Calendar month of activity (first day of month, includes year).
        data_tests:
          - not_null

      - name: email
        description: User email from Amplitude user_properties. Used for internal exclusion.

      - name: first_activity_at
        description: Earliest poll dashboard view in this month.
        data_tests:
          - not_null

      - name: last_activity_at
        description: Latest poll dashboard view in this month.
        data_tests:
          - not_null

      - name: poll_view_count
        description: Total poll dashboard views in this month.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

      - name: activity_days
        description: Distinct days with poll dashboard views in this month.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - user_id
              - activity_month_year
      - dbt_utils.expression_is_true:
          arguments:
            expression: "activity_days <= day(last_day(activity_month_year))"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "poll_view_count >= activity_days"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "last_activity_at >= first_activity_at"

  - name: int__amplitude_win_activity
    description: >
      User x month intermediate aggregating Win product engagement from Amplitude.
      Captures campaign sends (the legs of win_activated_users, via
      is_outreach_activation_event), and dashboard views
      (unioning the legacy and current dashboard-view event names, deduped).

      Grain: One row per user_id x activity_month_year.

      Source: stg_airbyte_source__amplitude_api_events.
    columns:
      - name: user_id
        description: User identifier (BIGINT, cast from Amplitude string user_id).
        data_tests:
          - not_null

      - name: activity_month_year
        description: Calendar month of activity (first day of month).
        data_tests:
          - not_null

      - name: campaigns_sent
        description: >
          Count of outreach sends in this month: events matching a
          win_activated_users leg (is_outreach_activation_event), one per
          committed send.
          Zero if user had only dashboard views this month.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: recipient_count
        description: >
          Sum of outreach recipients in this month. Uses
          COALESCE(recipientCount, voterContacts) with 100k cap
          NULL if no valid campaign sends this month.

      - name: first_campaign_sent_at
        description: Earliest campaign send event in this month.

      - name: last_campaign_sent_at
        description: Latest campaign send event in this month.

      - name: first_dashboard_viewed_at
        description: Earliest dashboard view event in this month.

      - name: last_dashboard_viewed_at
        description: Latest dashboard view event in this month.

      - name: dashboard_views
        description: >
          Deduped count of dashboard views in this month, over the
          dashboard-view union (page path '/dashboard' plus the named surface
          events). Legs that co-fire on one visit collapse to a single view.
          Zero if user had only campaign events this month.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: dashboard_view_days
        description: Distinct days with dashboard views in this month.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: total_events
        description: >
          Total raw Win engagement events (campaigns + dashboard views) in
          this month, undeduped; can exceed campaigns_sent + dashboard_views
          when one visit fired several legs of the dashboard-view union.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

      - name: activity_days
        description: Distinct days with any Win engagement in this month.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

      - name: first_activity_at
        description: Earliest Win engagement event in this month.
        data_tests:
          - not_null

      - name: last_activity_at
        description: Latest Win engagement event in this month.
        data_tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - user_id
              - activity_month_year
      - dbt_utils.expression_is_true:
          arguments:
            expression: "activity_days <= day(last_day(activity_month_year))"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_events >= activity_days"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "last_activity_at >= first_activity_at"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "last_campaign_sent_at >= first_campaign_sent_at"
          config:
            where: "first_campaign_sent_at is not null and last_campaign_sent_at is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "last_dashboard_viewed_at >= first_dashboard_viewed_at"
          config:
            where: "first_dashboard_viewed_at is not null and last_dashboard_viewed_at is not null"
      - dbt_utils.expression_is_true:
          arguments:
            # dashboard_views is deduped; total_events is raw, so equality
            # only holds outside co-fire windows where both event names fired.
            expression: "campaigns_sent + dashboard_views <= total_events"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "dashboard_view_days <= activity_days"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "recipient_count >= 0"
          config:
            where: "recipient_count is not null"

  - name: int__amplitude_win_activity_weekly
    description: >
      User x week intermediate aggregating Win product engagement from Amplitude.
      Weekly analog of int__amplitude_win_activity (monthly). Substrate for
      retention modeling, cohort analysis, and point-in-time churn features
      where the ~12-week typical Win-account engagement window argues for a
      finer cadence than monthly.

      Grain: One row per user_id x week_start_date.

      Week boundaries follow date_trunc('week', ...): Monday-start, Sunday-end.
      week_end_date is exposed directly so downstream point-in-time features
      can use it as asof_date without further computation.

      Timezone semantics: event_time is in UTC; date_trunc('week', ...) is
      ISO-Monday-anchored. Activity at Sunday 23:30 UTC (Monday morning in
      many non-UTC locales) is bucketed into the week containing that Sunday,
      not the user's local Monday. Fine for retention modeling at weekly
      cadence; flagged so reviewers don't second-guess edge-of-week boundaries.

      Source: stg_airbyte_source__amplitude_api_events.
    columns:
      - name: user_id
        description: User identifier (BIGINT, cast from Amplitude string user_id).
        data_tests:
          - not_null

      - name: week_start_date
        description: First day of the ISO week containing the activity (Monday).
        data_tests:
          - not_null

      - name: week_end_date
        description: Last day of the ISO week (Sunday); week_start_date + 6 days.
        data_tests:
          - not_null

      - name: campaigns_sent
        description: >
          Count of outreach sends in this week: events matching a
          win_activated_users leg (is_outreach_activation_event), one per
          committed send.
          Zero if user had only dashboard views this week.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: recipient_count
        description: >
          Sum of outreach recipients in this week. Uses
          COALESCE(recipientCount, voterContacts) with 100k cap.
          NULL if no valid campaign sends this week.

      - name: first_campaign_sent_at
        description: Earliest campaign send event in this week.

      - name: last_campaign_sent_at
        description: Latest campaign send event in this week.

      - name: first_dashboard_viewed_at
        description: Earliest dashboard view event in this week.

      - name: last_dashboard_viewed_at
        description: Latest dashboard view event in this week.

      - name: dashboard_views
        description: >
          Deduped count of dashboard views in this week, over the
          dashboard-view union (page path '/dashboard' plus the named surface
          events). Legs that co-fire on one visit collapse to a single view.
          Zero if user had only campaign events this week.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: dashboard_view_days
        description: Distinct days with dashboard views in this week.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: total_events
        description: >
          Total raw Win engagement events (campaigns + dashboard views) in
          this week, undeduped; can exceed campaigns_sent + dashboard_views
          when one visit fired several legs of the dashboard-view union.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

      - name: activity_days
        description: Distinct days with any Win engagement in this week.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 7

      - name: first_activity_at
        description: Earliest Win engagement event in this week.
        data_tests:
          - not_null

      - name: last_activity_at
        description: Latest Win engagement event in this week.
        data_tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - user_id
              - week_start_date
      - dbt_utils.expression_is_true:
          arguments:
            expression: "week_end_date = date_add(week_start_date, 6)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "activity_days <= 7"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_events >= activity_days"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "last_activity_at >= first_activity_at"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "last_campaign_sent_at >= first_campaign_sent_at"
          config:
            where: "first_campaign_sent_at is not null and last_campaign_sent_at is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "last_dashboard_viewed_at >= first_dashboard_viewed_at"
          config:
            where: "first_dashboard_viewed_at is not null and last_dashboard_viewed_at is not null"
      - dbt_utils.expression_is_true:
          arguments:
            # dashboard_views is deduped; total_events is raw, so equality
            # only holds outside co-fire windows where both event names fired.
            expression: "campaigns_sent + dashboard_views <= total_events"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "dashboard_view_days <= activity_days"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "recipient_count >= 0"
          config:
            where: "recipient_count is not null"

  - name: int__amplitude_event_catalog
    description: >
      Read-only catalog of Amplitude events: macro-derived family classification
      plus volume/recency from the event stream, joined to Amplitude Govern
      metadata, one row per event_type. Renamed from int__amplitude_event_taxonomy.
      Pattern-based so new event_types in known families classify
      automatically. Does not compute a staleness verdict; code-presence provenance
      lives as a CSV in the omni repo
      (packages/runbooks/scripts/python/instrumentation_data/amplitude_event_provenance.csv)
      and the relevance / up-to-dateness judgment is made at check time by an agent
      or the health monitor reconciling that CSV with this table. family is
      authoritative for classification. The Govern `product:` and `surface:` tags
      fill gaps only: they place events the name rules leave in 'other' and never
      move one they already place. govern_category is descriptive metadata only.

      Grain: one row per distinct event_type. Sources:
      stg_airbyte_source__amplitude_api_events (behavior),
      stg_airbyte_source__amplitude_taxonomy_event_type (Govern metadata).
    columns:
      - name: event_type
        description: Distinct Amplitude event name. Primary key for this model.
        data_tests:
          - unique
          - not_null

      - name: name_rule_family
        description: >
          Family from the event-name rules alone (amplitude_event_family), before
          any Govern tag is applied. 'other' means the name rules do not know the event.
        data_tests:
          - not_null

      - name: govern_product
        description: >
          Value of the Govern `product:` tag ('win', 'serve' or 'shared'), lowercased
          and trimmed. Null when the event has no such tag, more than one, or a value
          outside those three.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - win
                  - serve
                  - shared

      - name: govern_surface
        description: >
          Value of the Govern `surface:` tag, lowercased and trimmed. Null unless
          exactly one tag carries the key.

      - name: family
        description: >
          Product-feature bucket. Win families are prefixed `win_`; non-Win
          buckets cover serve, shared, auth/settings, navigation, and anonymous
          noise. Equals name_rule_family unless that is 'other' and the Govern
          product tag places the event: win becomes 'win_declared', serve and
          shared keep their names. 'other' means unlabeled: no name rule matches
          and no Govern product tag sorts the event, so it surfaces for triage
          (see amplitude_unsorted_events).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - win_onboarding
                  - win_dashboard
                  - win_voter_outreach
                  - win_outreach_planning
                  - win_outreach_scheduling
                  - win_content_builder
                  - win_voter_data
                  - win_candidate_profile
                  - win_pro_upgrade
                  - win_p2p_upgrade
                  - win_candidate_website
                  - win_candidacy_self_report
                  - win_compliance_or_planning
                  - win_ai_assistant
                  - win_briefings
                  - win_contacts
                  - win_resources
                  - win_declared
                  - serve
                  - shared
                  - auth_or_settings
                  - navigation
                  - viewed_generic
                  - amplitude_autotrack
                  - experiment_assignment
                  - session_or_browser
                  - other

      - name: product_area
        description: >
          Feature area within a product. Win name-rule events carry their family.
          Serve events and tag-placed Win or shared events carry the Govern surface
          tag when the tag placed them, else the event-name prefix before ' - '.
          Null for everything else.

      - name: is_win
        description: >
          True for Win-product candidate-attributed families (family like 'win_%'),
          including win_declared. False for serve / shared / noise.
        data_tests:
          - not_null

      - name: is_serve
        description: >
          True for Serve-product events (family = 'serve'). Serve is a single
          flat family, hence the equality check rather than a prefix like is_win.
          Superset of Serve user actions: some Serve events are server-emitted
          (session_id = -1), so engagement filtering stays with the consumer.
        data_tests:
          - not_null

      - name: is_shared
        description: >
          True when the Govern product tag places the event as shared between Win
          and Serve (family = 'shared'). Never true for an event the name rules place.
        data_tests:
          - not_null

      - name: product_label_conflict
        description: >
          True when the Govern labelling disagrees with itself or with the name rules:
          more than one `product:` tag, or a win/serve tag on an event whose name
          rules give the other product. The name rules win; this flags the label for repair.
        data_tests:
          - not_null

      - name: is_recurrent
        description: >
          True for recurrent-activity events (vs one-off lifecycle milestones).
          Determines which events belong in the Win activity rollups. Event-level
          allowlist, not a pattern (see amplitude_event_is_recurrent macro).
        data_tests:
          - not_null

      - name: is_machine_emitted
        description: >
          True where the system emitted the event on its own behalf and no user
          acted at that moment: schedulers, broadcasts, status pollers,
          server-side generation with nobody in the loop, and instrumentation
          bookkeeping such as experiment assignment. Exclude these from any
          "was this user active" read; one weekly digest broadcast was inflating
          a month's active users by about a fifth.

          Not the same as server-emitted. Over half of
          'Candidate Website - Published' arrives with session_id = -1 and it is a
          real candidate action, so a session filter is the wrong instrument here.
          See the amplitude_event_is_machine_emitted macro for how the two are
          told apart.
        data_tests:
          - not_null

      - name: first_seen_date
        description: >
          Date of first appearance in the raw event stream. Use as a drift cutoff
          to exclude late-arriving event families from retrospective analyses.
        data_tests:
          - not_null

      - name: last_seen_date
        description: >
          Date of most recent appearance in the raw event stream. Powers recency
          checks (e.g. is the event still firing) at the consumer/agent layer.
        data_tests:
          - not_null

      - name: event_count
        description: Total occurrences of this event_type in the raw stream, all-time (volume context).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

      - name: event_count_30d
        description: Occurrences of this event_type in the trailing 30 days (recent volume).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: govern_category
        description: >
          Govern category name, flattened from the category JSON object. Descriptive
          metadata only, not used in any derived logic; largely uncurated today.

      - name: govern_description
        description: Govern human-curated description of the event (where populated).

      - name: govern_display_name
        description: Govern display name for the event.

      - name: govern_is_active
        description: Govern is_active flag for the event.

      - name: govern_is_hidden
        description: >
          True if the event is hidden from any Govern surface (OR of the four
          is_hidden_* flags).

      - name: govern_tags
        description: Govern tags for the event (array<string>; uncurated today).

      - name: govern_owner
        description: Govern-recorded owner of the event (uncurated today).

      - name: in_govern_taxonomy
        description: >
          Whether a Govern taxonomy row matched this event_type. Distinguishes
          "not in Govern" from "in Govern but uncurated".
        data_tests:
          - not_null
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_win or not is_recurrent"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not (is_win and is_serve)"

  - name: int__amplitude_events_classified
    description: >
      Event-grain view: every Amplitude event with its catalog classification
      (family, product_area, is_machine_emitted, is_recurrent) and the product it
      was used from. Shared features take the profile they were used from: an
      explicit product property, then activeProduct, then the user's only
      product, else Win (assumed_win, because Serve users are few). Win and Serve
      events take the catalog product. Non-product families carry null.
    columns:
      - name: event_product
        description: "win, serve, or null for events outside both products."
        data_tests:
          - accepted_values:
              arguments:
                values: ["win", "serve"]
      - name: product_source
        description: >
          How event_product was resolved: event_name (name rules), govern_tag,
          event_property, active_profile, user_product or assumed_win.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - event_name
                  - govern_tag
                  - event_property
                  - active_profile
                  - user_product
                  - assumed_win

unit_tests:
  # Shared features split by the profile they were used from; everything else
  # follows the catalog.
  - name: events_classified_resolves_shared_product
    model: int__amplitude_events_classified
    given:
      - input: ref('int__amplitude_event_catalog')
        format: sql
        rows: |
          select 'Dictation - Started' as event_type, 'shared' as name_rule_family, 'other' as family, cast(null as string) as product_area, false as is_win, false as is_serve, true as is_shared, false as is_machine_emitted, false as is_recurrent
          union all select 'Dashboard - Viewed', 'win_dashboard', 'win_dashboard', 'Dashboard', true, false, false, false, false
          union all select 'Win - Opponent Viewed', 'other', 'win_declared', 'know-your-opponent', true, false, false, false, false
          union all select 'Navigation - Clicked', 'navigation', 'navigation', null, false, false, false, false, false
      - input: ref('users')
        format: sql
        rows: |
          select 1 as user_id, true as is_win_user, false as is_serve_user
          union all select 2, false, true
          union all select 3, true, true
          union all select 4, false, false
      - input: ref('stg_airbyte_source__amplitude_api_events')
        format: sql
        rows: |
          select 1 as n, 'Dictation - Started' as event_type, '3' as user_id, '{"product":"serve","activeProduct":"win"}' as event_properties
          union all select 2, 'Dictation - Started', '3', '{"product":"both","activeProduct":"serve"}'
          union all select 3, 'Dictation - Started', '3', '{"activeProduct":"Win"}'
          union all select 4, 'Dictation - Started', '2', '{}'
          union all select 5, 'Dictation - Started', '1', '{}'
          union all select 6, 'Dictation - Started', '3', '{}'
          union all select 7, 'Dictation - Started', '4', '{}'
          union all select 8, 'Dictation - Started', cast(null as string), '{}'
          union all select 9, 'Dashboard - Viewed', '2', '{"activeProduct":"serve"}'
          union all select 10, 'Win - Opponent Viewed', '1', '{}'
          union all select 11, 'Navigation - Clicked', '1', '{}'
    expect:
      # Nulls last: dbt reorders null-valued keys per row, which breaks its positional union.
      rows:
        - {n: 1, event_product: "serve", product_source: "event_property"}
        - {n: 2, event_product: "serve", product_source: "active_profile"}
        - {n: 3, event_product: "win", product_source: "active_profile"}
        - {n: 4, event_product: "serve", product_source: "user_product"}
        - {n: 5, event_product: "win", product_source: "user_product"}
        - {n: 6, event_product: "win", product_source: "assumed_win"}
        - {n: 7, event_product: "win", product_source: "assumed_win"}
        - {n: 8, event_product: "win", product_source: "assumed_win"}
        - {n: 9, event_product: "win", product_source: "event_name"}
        - {n: 10, event_product: "win", product_source: "govern_tag"}
        - {n: 11, event_product: null, product_source: null}

  # The Govern tag fills gaps only: it never moves an event the name rules place.
  - name: event_catalog_tag_fills_gaps_only
    model: int__amplitude_event_catalog
    # The real macro reads graph.metrics, which a unit test's graph does not carry.
    overrides:
      macros:
        amplitude_event_is_recurrent: "false"
    given:
      - input: ref('stg_airbyte_source__amplitude_api_events')
        rows:
          - {event_type: "Win - Opponent Viewed", event_time: "2026-10-01 10:00:00"}
          - {event_type: "Priorities - Priority Added", event_time: "2026-10-01 10:00:00"}
          - {event_type: "Dictation - Started", event_time: "2026-10-01 10:00:00"}
          - {event_type: "Contacts - Contact Viewed", event_time: "2026-10-01 10:00:00"}
          - {event_type: "Org Switcher - Organization Switched", event_time: "2026-10-01 10:00:00"}
          - {event_type: "Team - Member Invited", event_time: "2026-10-01 10:00:00"}
          - {event_type: "Ghost - Fired", event_time: "2026-10-01 10:00:00"}
          - {event_type: "Dup - Tagged", event_time: "2026-10-01 10:00:00"}
          - {event_type: "Case - Tagged", event_time: "2026-10-01 10:00:00"}
      # format: sql because dict rows cannot express array<string>.
      - input: ref('stg_airbyte_source__amplitude_taxonomy_event_type')
        format: sql
        rows: |
          select
            'Win - Opponent Viewed' as event_type,
            array('product:win', 'surface:know-your-opponent') as tags,
            cast(null as string) as category_name,
            cast(null as string) as description,
            cast(null as string) as display_name,
            cast(null as boolean) as is_active,
            cast(null as boolean) as is_hidden_from_dropdowns,
            cast(null as boolean) as is_hidden_from_persona_results,
            cast(null as boolean) as is_hidden_from_pathfinder,
            cast(null as boolean) as is_hidden_from_timeline,
            cast(null as string) as owner
          union all select 'Priorities - Priority Added', array('product:serve'), null, null, null, null, null, null, null, null, null
          union all select 'Dictation - Started', array('product:shared'), null, null, null, null, null, null, null, null, null
          union all select 'Contacts - Contact Viewed', array('product:shared'), null, null, null, null, null, null, null, null, null
          union all select 'Org Switcher - Organization Switched', array('product:win'), null, null, null, null, null, null, null, null, null
          union all select 'Team - Member Invited', cast(array() as array<string>), null, null, null, null, null, null, null, null, null
          union all select 'Dup - Tagged', array('product:win', 'product:serve'), null, null, null, null, null, null, null, null, null
          union all select 'Case - Tagged', array(' Product:Win '), null, null, null, null, null, null, null, null, null
    expect:
      rows:
        - {event_type: "Win - Opponent Viewed", family: "win_declared", product_area: "know-your-opponent", is_win: true, is_serve: false, is_shared: false, product_label_conflict: false}
        - {event_type: "Priorities - Priority Added", family: "serve", product_area: "Priorities", is_win: false, is_serve: true, is_shared: false, product_label_conflict: false}
        - {event_type: "Dictation - Started", family: "shared", product_area: "Dictation", is_win: false, is_serve: false, is_shared: true, product_label_conflict: false}
        - {event_type: "Contacts - Contact Viewed", family: "win_contacts", product_area: "win_contacts", is_win: true, is_serve: false, is_shared: false, product_label_conflict: false}
        - {event_type: "Org Switcher - Organization Switched", family: "serve", product_area: "Org Switcher", is_win: false, is_serve: true, is_shared: false, product_label_conflict: true}
        - {event_type: "Team - Member Invited", family: "other", product_area: null, is_win: false, is_serve: false, is_shared: false, product_label_conflict: false}
        - {event_type: "Ghost - Fired", family: "other", product_area: null, is_win: false, is_serve: false, is_shared: false, product_label_conflict: false}
        - {event_type: "Dup - Tagged", family: "other", product_area: null, is_win: false, is_serve: false, is_shared: false, product_label_conflict: true}
        - {event_type: "Case - Tagged", family: "win_declared", product_area: "Case", is_win: true, is_serve: false, is_shared: false, product_label_conflict: false}

  # A product label outside win/serve/shared is a typo, so it places nothing.
  - name: event_catalog_out_of_set_product_tag_is_ignored
    model: int__amplitude_event_catalog
    overrides:
      macros:
        amplitude_event_is_recurrent: "false"
    given:
      - input: ref('stg_airbyte_source__amplitude_api_events')
        rows:
          - {event_type: "Bad - Tagged", event_time: "2026-10-01 10:00:00"}
          - {event_type: "Empty - Tagged", event_time: "2026-10-01 10:00:00"}
      - input: ref('stg_airbyte_source__amplitude_taxonomy_event_type')
        format: sql
        rows: |
          select
            'Bad - Tagged' as event_type,
            array('product:both') as tags,
            cast(null as string) as category_name,
            cast(null as string) as description,
            cast(null as string) as display_name,
            cast(null as boolean) as is_active,
            cast(null as boolean) as is_hidden_from_dropdowns,
            cast(null as boolean) as is_hidden_from_persona_results,
            cast(null as boolean) as is_hidden_from_pathfinder,
            cast(null as boolean) as is_hidden_from_timeline,
            cast(null as string) as owner
          union all select 'Empty - Tagged', array('product:'), null, null, null, null, null, null, null, null, null
    expect:
      rows:
        # Nulls last: dbt reorders null-valued keys per row, which breaks its positional union.
        - {event_type: "Bad - Tagged", family: "other", is_win: false, is_serve: false, is_shared: false, product_label_conflict: false, govern_product: null, product_area: null}
        - {event_type: "Empty - Tagged", family: "other", is_win: false, is_serve: false, is_shared: false, product_label_conflict: false, govern_product: null, product_area: null}
