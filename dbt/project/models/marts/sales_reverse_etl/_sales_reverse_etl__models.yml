version: 2

models:
  - name: candidacy_techspeed
    description: >
      Civics-sourced TechSpeed enrichment feed (reverse-ETL sendable mart). One row per
      gp_candidacy_id. Replaces m_ballotready_internal__records_sent_to_techspeed. Sends
      missing-contact, non-major-party, future-election candidacies not already in HubSpot and
      not already known to TechSpeed. The 42-column legacy shape is preserved (24
      BallotReady-only columns null-filled, partner-confirmed unused); appended are the 4-part
      match-back key (candidate_code), the reverse-ETL tracking-key inputs (election_year,
      election_stage), gp_candidacy_id / gp_candidate_id (internal forensic ids), is_keyable,
      and last_activity_at.
    columns:
      - name: gp_candidacy_id
        description: GoodParty candidacy id; the model grain and internal match-back backstop.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Candidate first name (TechSpeed researches missing contact from name + state + office).
        data_tests:
          - not_null
      - name: last_name
        data_tests:
          - not_null
      - name: state
        data_tests:
          - not_null
      - name: election_day
        description: Upcoming election date sent to TechSpeed (legacy prefer-general contract date).
        data_tests:
          - not_null
      - name: election_stage
        description: >
          Nearest-upcoming stage for the reverse-ETL dedup grain; deliberately distinct from
          election_day (which keeps the legacy prefer-general date).
        data_tests:
          - accepted_values:
              arguments:
                values: ["primary", "general"]
      - name: candidate_code
        description: 4-part deterministic match-back slug (first/last/state/office_type); no city.
      - name: is_keyable
        description: True when candidate_code is non-null; the reverse-ETL diff filters on this.
        data_tests:
          - not_null
      - name: last_activity_at
        description: >
          Basis of the 16-day rolling window, and the recency value ops sorts on. The
          greatest of every provider EVENT time available for the candidacy, taken
          simultaneously rather than in precedence order: the BallotReady intermediate's
          vendor_activity_at, and the canonical product timestamps where gp_api is the
          source. Falls back to the canonical timestamps only where no provider supplies
          one. Deliberately NOT the canonical created_at/updated_at, which for
          vendor-sourced rows are pipeline extract stamps -- a vendor re-delivering its
          whole file would otherwise re-stamp its entire universe as active today and
          flood this feed. The window is bounded above as well as below, so a
          future-dated product timestamp cannot park a row on every export forever.
          Resolution is uneven by source: TechSpeed captures a date rather than a time,
          so those rows land at midnight and sorting on this column ties within a day.
          This feed has no TechSpeed leg by construction; see the model header.
        data_tests:
          - not_null

  - name: candidacy_hubspot
    description: >
      Civics-sourced HubSpot lead feed (reverse-ETL sendable mart; ops runs it manually now).
      One row per gp_candidacy_id, provider-agnostic (BallotReady / TechSpeed / DDHQ / gp_api).
      Replaces both m_ballotready_internal__records_sent_to_hubspot and
      m_techspeed__candidate_to_hubspot. Output is the Title-Case HubSpot import contract
      (fuzzy-match diagnostics dropped; ER replaces them); Type and the owner columns are set
      for all rows (owner via env_var); the match-back key (candidate_code), gp ids,
      election_year/stage, and last_activity_at are appended.
    data_tests:
      # Fail-closed owner: a misconfigured prod (blank env var) fails this rather than
      # silently shipping unassigned leads. Red until DBT_CIVICS_HUBSPOT_* env vars are set.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "`Contact Owner` <> '' and `Owner Name` <> ''"
      # Routing fields are coalesced to '' for the Title-Case import contract, so a not_null
      # test is vacuous (blank passes). Assert not-blank instead so blank routing fields are
      # visible. Severity warn (not error like the owner): blanks here are single-row upstream
      # name-parsing edges, not a systemic misconfig, so they surface without blocking.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "trim(`First Name`) <> '' and trim(`Last Name`) <> '' and trim(`State/Region`) <> ''"
          config:
            severity: warn
    columns:
      - name: gp_candidacy_id
        description: GoodParty candidacy id; the model grain and internal match-back backstop.
        data_tests:
          - unique
          - not_null
      - name: First Name
      - name: Last Name
      - name: State/Region
      - name: candidate_code
        description: 4-part deterministic match-back slug (first/last/state/office_type); no city.
      - name: icp_win
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: icp_serve
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: icp_win_supersize
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: viability_rating_2_0
        description: Viability 2.0 score (0-5); null for the not-yet-scored provider expansion.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 5
              config:
                where: "viability_rating_2_0 is not null"
      - name: last_activity_at
        description: >
          Basis of the 30-day rolling window, and the recency value ops sorts on. The
          greatest of every provider EVENT time available for the candidacy, taken
          simultaneously rather than in precedence order: both vendor intermediates'
          vendor_activity_at, and the canonical product timestamps where gp_api is the
          source. Falls back to the canonical timestamps only where no provider supplies
          one. Deliberately NOT the canonical created_at/updated_at, which for
          vendor-sourced rows are pipeline extract stamps -- a vendor re-delivering its
          whole file would otherwise re-stamp its entire universe as active today and
          flood this feed. The window is bounded above as well as below, so a
          future-dated product timestamp cannot park a row on every export forever.
          Resolution is uneven by source: TechSpeed captures a date rather than a time,
          so those rows land at midnight and sorting on this column ties within a day.
        data_tests:
          - not_null

  - name: hubspot_contact_desired_state
    description: >
      What every HubSpot contact this reverse-ETL flow owns should look like. One row
      per eligible PERSON (survivor candidacy = latest feed_activity_at, gp_candidacy_id
      ascending as the tie-break), plus one row per eligible candidacy that has no
      gp_person_id and therefore cannot collapse to a person. Eligible means still in the
      race or won ('Won'/'Runoff', or an undetermined outcome with a stage still ahead),
      contactable, and non-major-party; there is no activity window and no
      not-already-in-HubSpot filter, because the flow is a full sync rather than a
      net-new lead list.

      Every payload column is named for the HubSpot INTERNAL property it writes
      (firstname, twitterhandle, zip), because the sending app maps column names onto
      properties with no rename layer. Values are NULL, never '', wherever unknown --
      HubSpot reads '' as "clear this property". Sales-owned fields (firstname, lastname,
      phone, hubspot_owner_id, type) carry a value only on create-shaped rows and are
      NULL once the contact exists, which is how an update omits them.

      The non-payload columns (contact_exists, is_sendable, hold_reason, the forensic
      ids, feed_activity_at, built_at) are diagnostics; the app reads
      hubspot_contact_desired_state_sendable, which drops them.
    data_tests:
      # The sendable view filters on is_sendable alone, so a NULL there would drop a
      # person from the sync silently, and a hold with no reason would leave the run
      # summary's counts uninterpretable. One invariant covers both directions.
      - dbt_utils.expression_is_true:
          name: hubspot_contact_desired_state_hold_reason_matches_sendable
          arguments:
            expression: "is_sendable = (hold_reason is null)"
    columns:
      - name: gp_person_id
        description: >
          Canonical person id and the flow's tracking key / HubSpot upsert idProperty.
          NULL only on held rows that could not resolve to a person.
        data_tests:
          # Sendable rows go to a batch upsert that rejects a duplicate idProperty and
          # to an app that raises on a null or duplicate key: both would fail the whole
          # run, so they are caught here instead.
          - unique:
              config:
                where: "is_sendable"
          - not_null:
              config:
                where: "is_sendable"
      - name: contact_exists
        description: >
          Evidence sufficient to omit sales-owned fields, not proof the contact exists
          right now: true when a contact carries this gp_person_id property OR this
          flow's log holds a confirmed send. Reads false for every row until the HubSpot
          property is created and backfilled.
      - name: is_sendable
        description: >
          False for rows held back from the sync: no person key, or our key disagrees
          with the one stamped on a linked contact. Held rows stay in the table so they
          stay countable, and the sendable view filters them out.
      - name: hold_reason
        description: >
          Why a row is not sendable ('no_person_key' or 'person_id_mismatch'); NULL when
          it is sendable.
      - name: built_at
        description: >
          Build clock. Deliberately excluded from the sendable view: it changes on every
          rebuild, so in a payload it would make the diff resend every row every day.

  - name: hubspot_contact_desired_state_sendable
    description: >
      The relation the reverse-ETL app reads: the desired state's sendable rows, key and
      HubSpot payload properties only. The app applies no row filter and raises on a
      null, blank, or duplicate key, and it maps every column name it sees onto a HubSpot
      property, so the held rows and the diagnostic columns are both removed here rather
      than in the app.
    data_tests:
      # A blank value is not a no-op: HubSpot reads '' as "clear this property", and a
      # large share of the cells that are blank on our side are populated on theirs.
      # Column-agnostic on purpose -- to_json drops nulls and renders a blank as
      # "col":"", so the assertion cannot drift as the payload's columns change.
      - dbt_utils.expression_is_true:
          name: hubspot_contact_desired_state_sendable_no_blank_payload_values
          arguments:
            expression: "to_json(struct(*)) not like '%:\"\"%'"

  - name: company_viability_hubspot
    description: >
      Viability 2.0 and race attributes synced onto EXISTING HubSpot companies
      (reverse-ETL sendable mart). One row per HubSpot company Record ID where any
      published value is blank or differs. Companion to candidacy_hubspot, which
      creates net-new contacts already carrying a score; this feed updates records
      that exist. Publishes viability_2_0, open_seat_, partisan_np and
      seats_available. is_incumbent and number_of_opponents are deliberately
      excluded: gp-api FETCHES both from HubSpot via its IncomingProperty enum, so
      writing them would make Databricks the source of values product reads.
    columns:
      - name: Record ID
        # Space in the name: dbt emits the identifier unquoted in generic tests
        # without this, which is a syntax error.
        quote: true
        description: HubSpot company id, the import match key and the model grain.
        data_tests:
          - unique
          - not_null
      - name: viability_2_0
        description: >
          Viability 2.0 score from candidacy_scored. Where one company id is carried by
          several candidacies (2025-archive id reuse), the nearest-upcoming election wins.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 5
      - name: open_seat_
        description: >
          HubSpot's open_seat_ enumeration. Null where unknown, which emits a blank cell
          the import skips -- never a negative, since 'No' would assert a closed seat for
          races we have no data on.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Yes", "No"]
      - name: partisan_np
        description: HubSpot's partisan_np enumeration. Null where unknown; see open_seat_.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Partisan", "Nonpartisan"]
      - name: seats_available
        description: >
          Seats in the race, from the election mart. Null where unknown, and also where
          the mart says 0 -- 11 such rows exist and a zero-seat race is a defect, not a
          fact worth syncing. HubSpot holds 9.4k stored zeros this feed corrects.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: hubspot_current_viability
        description: >
          Viability stored in HubSpot when the feed was built; null where unset. Kept so
          the diff is auditable after the import. Deliberately excluded from the import
          file: mapped by mistake it would write the stale score back.
