version: 2

models:
  - name: candidacy_techspeed
    description: >
      Civics-sourced TechSpeed enrichment feed (reverse-ETL sendable mart). One row per
      gp_candidacy_id. Replaces m_ballotready_internal__records_sent_to_techspeed. Sends
      missing-contact, non-major-party, future-election candidacies not already in HubSpot and
      not already known to TechSpeed. The 42-column legacy shape is preserved (24
      BallotReady-only columns null-filled, partner-confirmed unused); appended are the 4-part
      match-back key (candidate_code), the reverse-ETL tracking-key inputs (election_year,
      election_stage), gp_candidacy_id / gp_candidate_id (internal forensic ids), is_keyable,
      and last_activity_at.
    columns:
      - name: gp_candidacy_id
        description: GoodParty candidacy id; the model grain and internal match-back backstop.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Candidate first name (TechSpeed researches missing contact from name + state + office).
        data_tests:
          - not_null
      - name: last_name
        data_tests:
          - not_null
      - name: state
        data_tests:
          - not_null
      - name: election_day
        description: Upcoming election date sent to TechSpeed (legacy prefer-general contract date).
        data_tests:
          - not_null
      - name: election_stage
        description: >
          Nearest-upcoming stage for the reverse-ETL dedup grain; deliberately distinct from
          election_day (which keeps the legacy prefer-general date).
        data_tests:
          - accepted_values:
              arguments:
                values: ["primary", "general"]
      - name: candidate_code
        description: 4-part deterministic match-back slug (first/last/state/office_type); no city.
      - name: is_keyable
        description: True when candidate_code is non-null; the reverse-ETL diff filters on this.
        data_tests:
          - not_null
      - name: last_activity_at
        description: >
          Basis of the 16-day rolling window, and the recency value ops sorts on. The
          greatest of every provider EVENT time available for the candidacy, taken
          simultaneously rather than in precedence order: the BallotReady intermediate's
          vendor_activity_at, and the canonical product timestamps where gp_api is the
          source. Falls back to the canonical timestamps only where no provider supplies
          one. Deliberately NOT the canonical created_at/updated_at, which for
          vendor-sourced rows are pipeline extract stamps -- a vendor re-delivering its
          whole file would otherwise re-stamp its entire universe as active today and
          flood this feed. The window is bounded above as well as below, so a
          future-dated product timestamp cannot park a row on every export forever.
          Resolution is uneven by source: TechSpeed captures a date rather than a time,
          so those rows land at midnight and sorting on this column ties within a day.
          This feed has no TechSpeed leg by construction; see the model header.
        data_tests:
          - not_null

  - name: candidacy_hubspot
    description: >
      Civics-sourced HubSpot lead feed (reverse-ETL sendable mart; ops runs it manually now).
      One row per gp_candidate_id, and so also per gp_candidacy_id, provider-agnostic
      (BallotReady / TechSpeed / DDHQ / gp_api). Each row mints a HubSpot contact, so the
      feed is person-grained: candidacies whose person group already holds a HubSpot contact
      are suppressed, and a person with several live candidacies is sent once, on the most
      recent. Replaces both m_ballotready_internal__records_sent_to_hubspot and
      m_techspeed__candidate_to_hubspot. Output is the Title-Case HubSpot import contract
      (fuzzy-match diagnostics dropped; ER replaces them); Type and the owner columns are set
      for all rows (owner via env_var); the match-back key (candidate_code), gp ids,
      election_year/stage, and last_activity_at are appended.
    data_tests:
      # Fail-closed owner: a misconfigured prod (blank env var) fails this rather than
      # silently shipping unassigned leads. Red until DBT_CIVICS_HUBSPOT_* env vars are set.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "`Contact Owner` <> '' and `Owner Name` <> ''"
      # Routing fields are coalesced to '' for the Title-Case import contract, so a not_null
      # test is vacuous (blank passes). Assert not-blank instead so blank routing fields are
      # visible. Severity warn (not error like the owner): blanks here are single-row upstream
      # name-parsing edges, not a systemic misconfig, so they surface without blocking.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "trim(`First Name`) <> '' and trim(`Last Name`) <> '' and trim(`State/Region`) <> ''"
          config:
            severity: warn
    columns:
      - name: gp_candidacy_id
        description: GoodParty candidacy id; the model grain and internal match-back backstop.
        data_tests:
          - unique
          - not_null
      - name: First Name
      - name: Last Name
      - name: State/Region
      - name: candidate_code
        description: 4-part deterministic match-back slug (first/last/state/office_type); no city.
      - name: icp_win
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: icp_serve
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: icp_win_supersize
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: viability_rating_2_0
        description: Viability 2.0 score (0-5); null for the not-yet-scored provider expansion.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 5
              config:
                where: "viability_rating_2_0 is not null"
      - name: last_activity_at
        description: >
          Basis of the 30-day rolling window, and the recency value ops sorts on. The
          greatest of every provider EVENT time available for the candidacy, taken
          simultaneously rather than in precedence order: both vendor intermediates'
          vendor_activity_at, and the canonical product timestamps where gp_api is the
          source. Falls back to the canonical timestamps only where no provider supplies
          one. Deliberately NOT the canonical created_at/updated_at, which for
          vendor-sourced rows are pipeline extract stamps -- a vendor re-delivering its
          whole file would otherwise re-stamp its entire universe as active today and
          flood this feed. The window is bounded above as well as below, so a
          future-dated product timestamp cannot park a row on every export forever.
          Resolution is uneven by source: TechSpeed captures a date rather than a time,
          so those rows land at midnight and sorting on this column ties within a day.
        data_tests:
          - not_null

  - name: company_viability_hubspot
    description: >
      Viability 2.0 and race attributes synced onto EXISTING HubSpot companies
      (reverse-ETL sendable mart). One row per HubSpot company Record ID where any
      published value is blank or differs. Companion to candidacy_hubspot, which
      creates net-new contacts already carrying a score; this feed updates records
      that exist. Publishes viability_2_0, open_seat_, partisan_np and
      seats_available. is_incumbent and number_of_opponents are deliberately
      excluded: gp-api FETCHES both from HubSpot via its IncomingProperty enum, so
      writing them would make Databricks the source of values product reads.
    columns:
      - name: Record ID
        # Space in the name: dbt emits the identifier unquoted in generic tests
        # without this, which is a syntax error.
        quote: true
        description: HubSpot company id, the import match key and the model grain.
        data_tests:
          - unique
          - not_null
      - name: viability_2_0
        description: >
          Viability 2.0 score from candidacy_scored. Where one company id is carried by
          several candidacies (2025-archive id reuse), the nearest-upcoming election wins.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 5
      - name: open_seat_
        description: >
          HubSpot's open_seat_ enumeration. Null where unknown, which emits a blank cell
          the import skips -- never a negative, since 'No' would assert a closed seat for
          races we have no data on.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Yes", "No"]
      - name: partisan_np
        description: HubSpot's partisan_np enumeration. Null where unknown; see open_seat_.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Partisan", "Nonpartisan"]
      - name: seats_available
        description: >
          Seats in the race, from the election mart. Null where unknown, and also where
          the mart says 0 -- 11 such rows exist and a zero-seat race is a defect, not a
          fact worth syncing. HubSpot holds 9.4k stored zeros this feed corrects.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: hubspot_current_viability
        description: >
          Viability stored in HubSpot when the feed was built; null where unset. Kept so
          the diff is auditable after the import. Deliberately excluded from the import
          file: mapped by mistake it would write the stale score back.

  - name: hubspot_contact_merge_candidates
    description: >
      HubSpot contacts the person graph resolves to the same person, with the primary
      each should be merged into. One row per live contact in a person holding two or
      more. A contact already merged away in HubSpot (named in another contact's
      merged_object_ids) is excluded, as are staff and test persons. A HubSpot merge
      keeps the primary's value for every property the primary has set and fills the
      rest from the secondary, so the ranking puts first the contact whose values
      should survive: currently Pro, then linked from a gp_api account (most recently
      active account first), then furthest Win stage, then any sales activity, then
      most recent engagement, then oldest. Secondary rows are the merge operations.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(merge_role = 'primary') = (hs_contact_id = primary_hs_contact_id)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(merge_role = 'secondary') = (match_evidence is not null and matched_on is not null)"
    columns:
      - name: gp_person_id
        description: The person every contact in the group resolves to.
        data_tests:
          - not_null
      - name: hs_contact_id
        description: HubSpot contact id; the model grain.
        data_tests:
          - unique
          - not_null
      - name: merge_role
        description: primary for the contact the others merge into, else secondary.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["primary", "secondary"]
      - name: primary_hs_contact_id
        description: The person's primary contact; the merge target for a secondary row.
        data_tests:
          - not_null
      - name: contact_rank
        description: 1 for the primary; the order secondaries are merged in.
        data_tests:
          - not_null
      - name: primary_decided_by
        description: >
          The first ranking key on which the primary beat the second-ranked contact,
          for reviewing which rule made the call.
        data_tests:
          - not_null
      - name: live_contact_count
        description: Live contacts the person holds.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2
      - name: conflicting_properties
        description: >
          On a secondary, the properties set on both contacts with different values,
          which the merge resolves to the primary's. Null when nothing is lost.
          Lifecycle stage and email are not listed: HubSpot keeps the furthest
          lifecycle stage and adds the secondary's email as an additional address.
      - name: has_multiple_app_accounts
        description: >
          The person holds more than one gp_api account. After the merge both
          accounts write to the one contact.
      - name: has_shared_email
        description: >
          Two of the person's contacts carry the same email. HubSpot does not allow
          that on live contacts, so one was likely deleted or merged without the
          survivor showing it; confirm both exist before merging.
      - name: matched_on
        description: >
          On a secondary, native_ids when it shares the primary's deterministic
          identity (a native id such as a gp_api account or BallotReady candidacy
          connects them), splink when only the Splink person matcher joined them.
          Null on the primary.
        data_tests:
          - accepted_values:
              arguments:
                values: ["native_ids", "splink"]
      - name: match_evidence
        description: >
          On a secondary, the strongest thing it shares with the primary: same_phone
          (last ten digits), same_name_and_office, same_name_and_state_office_unknown,
          same_name_and_state_office_differs, same_name_state_unknown_or_differs,
          name_incomplete (first or last name missing on either, so no name comparison),
          or name_differs. Lets a merge run go in batches by strength and hold the
          weakest for review. Null on the primary.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - same_phone
                  - same_name_and_office
                  - same_name_and_state_office_unknown
                  - same_name_and_state_office_differs
                  - same_name_state_unknown_or_differs
                  - name_incomplete
                  - name_differs
      - name: linked_via
        description: The person-link types touching this contact.
      - name: is_app_linked
        description: A gp_api user's meta_data points at this contact.
      - name: app_user_last_active_at
        description: >
          Latest campaign creation, else signup, across the gp_api users pointing at
          this contact.
      - name: win_stage_rank
        description: >
          Win stage as a rank, 9 for Activated Pro down to 1 for Intake; a closed
          disposition ranks 2, above an untouched intake. 0 when unset.
      - name: last_engagement_at
        description: >
          Latest of last contacted, notes updated, last site visit, and last email
          open or click. Not updated_at, which imports and syncs touch on every
          contact.
