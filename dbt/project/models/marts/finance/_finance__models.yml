version: 2

models:
  - name: bifrost_daily_usage
    description: >
      Bifrost gateway model usage and cost, one row per UTC day, provider, model and person.
      Read the caveats below before comparing these numbers to anything else.

      1. **This is not invoiced cost.** It is the gateway's own computed number from its pricing
      catalog, which is what the gateway shows its own operators, not what a provider bills.

      2. **It does not overlap the Anthropic org reports.** The gateway routes only to Bedrock
      and Fireworks, and the `anthropic_analytics_*` reports cover the Anthropic org directly, so
      the two never bill the same traffic. They are different billers, and `ai_usage_daily` sums
      both arms without de-duplicating anything.

      3. **The newest `usage_date` is partial.** A request is re-exported for a week, so a day's
      newest export moves past that day only once an export after its midnight has covered it.
      A row is therefore complete when `usage_date < to_date(source_exported_at)`. Do not
      compare against `current_date()`: between midnight and the next export that passes
      yesterday, which is still partial.

      4. **History starts at the first export's window.** The monthly full export backfills the
      days before it, so an early day can be present and still be missing traffic that no
      export has re-emitted.

      5. **Inference requests only.** `request_count` counts model inference requests and
      excludes the gateway's model-list calls, which carry no tokens and no cost, so that a
      comparison against the gateway's own request counts compares like with like.

      6. **`unattributed` is a bucket, not a person.** A request that carried neither a gateway
      user nor a key becomes one `unattributed` row per day, provider and model, so those
      requests stay visible and the totals still reconcile.

      7. **`unpriced_request_count`** counts the requests that used tokens while carrying no
      gateway cost, usually because the model is missing from the gateway's pricing catalog.
      The cost columns understate by whatever those requests would have cost.

      8. **Person.** A row's `person_email` is the gateway user when the request named one,
      otherwise the email the gateway key name carries. No key, user or team id is exposed
      here.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - usage_date
              - provider
              - model
              - person_email
      # Model-level, because a column-level expression_is_true prepends the column name.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              person_email = 'unattributed'
              or person_email rlike '^[a-z0-9._%+-]+@goodparty[.]org$'
    columns:
      - name: usage_date
        description: UTC date of the request, not the local date of the person who made it.
        data_tests:
          - not_null
      - name: provider
        description: >
          The provider the gateway routed the requests to. Pinned to these two because the whole
          no-de-duplication rule in `ai_usage_daily` rests on it: the gateway routes only to
          Bedrock and Fireworks, so its traffic never reaches the Anthropic org that the other arm
          bills. A new gateway provider, Anthropic direct say, would break that premise and has to
          force a de-duplication decision before the page counts the same spend twice. Failing here
          skips `ai_usage_daily`, so the page goes stale rather than wrong.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bedrock, fireworks]
      - name: model
        description: The model the requests named. Never blank here.
        data_tests:
          - not_null
      - name: person_email
        description: >
          The person the requests belong to, or `unattributed` for requests that carried no
          identity at all.
        databricks_tags:
          sensitive: identifier
        data_tests:
          - not_null
      - name: request_count
        description: Inference requests in the group; model-list calls are excluded.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: error_count
        description: Requests in the group whose status is `error`.
      - name: unpriced_request_count
        description: >
          Requests that used tokens while carrying no gateway cost, usually a model missing
          from the gateway's pricing catalog. The cost columns understate by their share.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: prompt_tokens
        description: Input tokens across the group.
      - name: completion_tokens
        description: Output tokens across the group.
      - name: total_tokens
        description: Input plus output tokens across the group, as the gateway counted them.
      - name: cached_read_tokens
        description: Input tokens served from a provider-side prompt cache.
      - name: cost_usd
        description: >
          The gateway's own computed cost across the group. Not invoiced cost. Zero, not null,
          for a group of requests that were never priced.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: input_cost_usd
        description: The input-token component of `cost_usd`.
      - name: output_cost_usd
        description: The output-token component of `cost_usd`.
      - name: additional_cost_usd
        description: >
          Any further component of `cost_usd` the gateway adds, such as cached reads. Zero, not
          null, for a group where the gateway reported none.
      - name: source_exported_at
        description: >
          The newest export that observed any request in the group. Compare a day against it to
          tell a complete day from a partial one.

  - name: anthropic_daily_usage
    description: >
      Anthropic spend, one row per UTC day and person, plus one `unattributed` row per day.
      Named after the biller rather than the vendor's API, because the other source on the AI
      spend dashboard is named for where its money is billed.

      1. **`unattributed` is a bucket, not a person.** Its cost is the org-wide total for the day
      minus the seats that carry an email. Two things land there: spend that belongs to no seat
      at all, which is the bulk of it, and seat rows whose email is null, which is what the
      vendor leaves behind once it deletes an account. The residual is computed from the emails
      rather than from seat rows so that both fold into one bucket.

      2. **The daily total equals the org cost report's.** That follows from the residual, and it
      is the point: it means nothing is dropped. Do not read this beside
      `anthropic_analytics_org_cost_report`, which would count the residual a second time. That
      report keeps two jobs only, the reconciliation test and the residual arithmetic here.

      3. **The residual is computed at cent precision.** Both sides are rounded to cents before
      the subtraction, and a day whose difference is exactly zero gets no residual row. Over the
      full history the raw difference lands a few millionths of a dollar on the wrong side of
      zero on days that are otherwise equal.

      4. **`request_count` is null on the `unattributed` row.** The org report leaves `requests`
      null on every row, because the vendor does not attribute requests when it groups by cost
      type. The residual's count is therefore not computable, and a zero would be a claim a sum
      would hide.

      5. **There is no model column.** The vendor does not split its cost by model at the grain
      we ingest, so a per-model Claude figure would be invented. `ai_usage_daily` labels these
      rows `claude_all_models` for that reason.

      6. **`source_complete_through` needs both reports read after the day closed**, so it takes
      the earlier of the two read times. A day where only the org report has been re-read is a
      day whose residual sits against a stale seat half. Complete is not final: the vendor can
      revise amounts for up to 30 days without the day becoming incomplete again.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [usage_date, person_email]
    columns:
      - name: usage_date
        description: UTC day the spend falls in, from the report's bucket start.
        data_tests:
          - not_null
      - name: person_email
        description: >
          The seat user's address, lower-cased, or `unattributed` on the residual row. Lower-cased
          because the dashboard's person filter compares these strings across sources.
        databricks_tags:
          sensitive: identifier
        data_tests:
          - not_null
      - name: is_unattributed
        description: True on the residual row, so a reader can separate it from a person.
      - name: cost_usd
        description: >
          Spend in USD, post-discount and pre-credit. On the residual row, the org total minus
          the email-attributable seats, both at cents.
        data_tests:
          - not_null
      - name: request_count
        description: >
          Requests across the group. Null on the residual row, where the source reports none.
      - name: source_loaded_at
        description: >
          The earlier of the org report's and the seat report's newest read. Constant across the
          model, because it describes the feed rather than the day.
      - name: source_complete_through
        description: >
          The last UTC day both reports were read after it closed. Constant across the model.

  - name: ai_usage_daily
    description: >
      GoodParty's AI spend in one table, one row per UTC day, source, provider, model, attribution
      kind and attribution. It unions the source marts rather than joining them, so a source that
      cannot reconcile one day does not remove another source's rows.

      1. **`cost_basis` says who measured the number.** `gateway_computed` is the Bifrost
      gateway's own pricing catalog, `vendor_reported` is Anthropic's own report, and
      `self_reported` is the delegate swarm pricing its own sessions. They are not the same kind
      of number: one is a calculation, one is a bill, one is a system's own estimate.

      2. **The sources do not overlap.** Bifrost routes only to Bedrock and Fireworks and the
      Anthropic arm is the Anthropic org directly, so nothing is counted twice and nothing needs
      de-duplicating. The swarm calls Fireworks directly and never reaches the gateway at all, so
      it does not double count the Bifrost `fireworks` provider rows either: they are different
      traffic to the same provider. That is why summing across `source` is safe, and why a new
      Bifrost provider fails a test on `bifrost_daily_usage` rather than here.

      3. **`claude_all_models` is a label, not a model id.** The vendor does not split Claude cost
      by model at the grain we ingest, so the Anthropic arm carries one fixed label. Never add it
      to a per-model figure for a real model of that name.

      4. **Nulls mean the source has no such measure, not zero.** `session_count` and
      `total_tokens` are null on the Anthropic arm, and `request_count` is null on an Anthropic
      residual row and across the whole delegate swarm arm, which has no request to count.

      5. **`source_loaded_at` and `source_complete_through` are per source, not per row.** Both
      describe a feed, so a reader can tell a stalled feed from a quiet week, which the
      completeness date alone cannot.

      6. **The completeness rules differ by source.** Bifrost is complete when
      `usage_date < to_date(source_exported_at)`, since that is when an export has passed the
      day's midnight. Anthropic needs both of its reports read after the day closed. The swarm is
      complete through the day before its exporter's own newest stamp, since one run reads the
      whole ledger. None is ever compared against `current_date()`.

      7. **A delegate swarm row is attributed to an agent, never to a person.** The swarm has no
      person in it, so `attribution_kind = 'agent'` and `attribution` is the agent's operator-set
      label, or `unknown_agent` where the ledger's agent row was gone. Never a synthesised email.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - usage_date
              - source
              - provider
              - model
              - attribution_kind
              - attribution
    columns:
      - name: usage_date
        description: UTC day of the spend.
        data_tests:
          - not_null
      - name: source
        description: >
          Where the money is billed. `bifrost` is the gateway, `anthropic` the Anthropic org, and
          `delegate_swarm` the swarm host's own ledger.
        data_tests:
          - not_null
      - name: provider
        description: >
          The provider behind that source. `bedrock` and `fireworks` under Bifrost, `anthropic`
          on the Anthropic arm, and `fireworks` on the delegate swarm arm, which calls it
          directly rather than through the gateway.
        data_tests:
          - not_null
      - name: model
        description: >
          The model the spend names, or `claude_all_models` on the Anthropic arm, which cannot
          split its cost by model. Never null.
        data_tests:
          - not_null
      - name: attribution_kind
        description: >
          `person` when the spend belongs to a person, `agent` for a non-human actor, and
          `unattributed` for spend that belongs to nobody. Present so that an unattributed bucket
          is never mistaken for a person in a list. The delegate swarm arm is the source of
          `agent`; no other source produces it.
        data_tests:
          - not_null
      - name: attribution
        description: >
          A lower-case email, an agent name, or the literal `unattributed`. Never null: spend with
          no bucket at all would vanish from the total silently.
        databricks_tags:
          sensitive: identifier
        data_tests:
          - not_null
      - name: cost_usd
        description: Spend in USD, in the source's own basis. See `cost_basis`.
        data_tests:
          - not_null
      - name: request_count
        description: >
          Requests in the group. Null where the source does not report them, including an
          Anthropic residual row.
      - name: session_count
        description: >
          Sessions in the group. Null on the Bifrost and Anthropic arms, which report requests
          rather than sessions, and populated by the delegate swarm arm.
      - name: total_tokens
        description: >
          Input plus output tokens. Null on the Anthropic arm, which reports cost rather than
          tokens at this grain, and populated by the Bifrost and delegate swarm arms.
      - name: cost_basis
        description: >
          Who measured `cost_usd`. `gateway_computed` is the gateway's pricing catalog,
          `vendor_reported` the vendor's own report, `self_reported` a system pricing its own
          usage.
        data_tests:
          - not_null
      - name: source_loaded_at
        description: >
          When the source's feed last loaded. Constant per source, so read beside
          `source_complete_through`: the pair is what shows a stalled feed.
      - name: source_complete_through
        description: >
          The last UTC day the source is complete through. Constant per source. Complete is not
          final, since a vendor can still revise a complete day.

  - name: delegate_swarm_daily_usage
    description: >
      The delegate swarm's model spend, one row per UTC day, agent, agent id and model. The swarm
      calls Fireworks directly and never reaches the Bifrost gateway, so this is the only place its
      spend is visible.

      1. **It has no person.** The swarm's work is done by named agents, so `agent_name` is the
      attribution and `ai_usage_daily` carries these rows as `attribution_kind = 'agent'`. Nothing
      here is ever mapped to an email.

      2. **`cost_basis` is `self_reported`.** The swarm's price book has no entry for the route it
      uses, so pi prices its own sessions. That is a weaker number than a gateway's computation or
      a vendor's bill, and `unpriced_cost_usd` is the part of `cost_usd` that rests on it.

      3. **A missing agent does not drop the row.** The export left-joins its `agents` table and
      writes `unknown_agent` where the agent is gone, so this keeps the placeholder instead of
      filtering. Dropping it would make the totals smaller than the ledger with no test able to see
      it.

      4. **`task_count` is distinct rollup tasks, not sessions.** It uses the same root walk as
      `delegate_swarm_task_spend`, so the two marts agree on the denominator.

      5. **A session with no `task_id` counts here.** It has no task to roll up to and so is absent
      from the task mart, but its cost is real and belongs in the day.

      6. **`source_complete_through` is the day before the newest export's own UTC date.** The
      exporter reads the whole ledger at 09:15, so its run on day D has everything up to D's
      midnight. Derived from the anchor rather than from the newest day carrying a row, so a quiet
      stretch does not look like a stalled feed.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [usage_date, agent_name, agent_id, model]
    columns:
      - name: usage_date
        description: UTC day the session's cost row was written, not the local day of anyone involved.
        data_tests:
          - not_null
      - name: agent_name
        description: >
          The agent's operator-set label, or `unknown_agent` where the export's agent row was gone.
          This is the attribution `ai_usage_daily` publishes for the swarm.
        databricks_tags:
          sensitive: identifier
        data_tests:
          - not_null
      - name: agent_id
        description: The agent's id. Part of the grain so two agents sharing a label stay apart.
        data_tests:
          - not_null
      - name: model
        description: The model the swarm resolved for the day's sessions. Never blank.
        data_tests:
          - not_null
      - name: session_count
        description: Sessions in the group.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: task_count
        description: >
          Distinct rollup tasks the group's sessions belong to, on the same root walk as
          `delegate_swarm_task_spend`. Sessions with no task contribute nothing.
      - name: error_session_count
        description: Sessions in the group the ledger marked failed. They still count toward cost.
      - name: unpriced_session_count
        description: >
          Sessions the swarm could not price from its own book, where pi self-reported the cost.
      - name: total_tokens
        description: Input plus output tokens over the group.
      - name: cost_usd
        description: >
          The swarm's own recorded cost over the group. Not invoiced spend, and not comparable with
          a gateway or vendor figure without reading `cost_basis`.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: unpriced_cost_usd
        description: >
          The part of `cost_usd` whose session the swarm could not price from its own book, so pi
          self-reported it. Read beside `cost_usd` as the share that is less certain.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: source_exported_at
        description: The newest export that observed any session in the group.
      - name: source_loaded_at
        description: >
          The newest export over the whole model, so the same value on every row. Read beside
          `source_complete_through`: the pair is what shows a stalled exporter.
      - name: source_complete_through
        description: >
          The last UTC day the export has fully seen: the day before its own newest stamp. Constant
          across the model.

  - name: delegate_swarm_task_spend
    description: >
      The delegate swarm's spend per rollup task, one row per task, and the single place the
      cost-per-task definition lives. A change to what counts toward a task is a change to this
      model and nothing else, which is why the unit tests below pin the current behaviour.

      1. **A task's spend is its whole subtree's.** Every session whose `task_id` rolls up to the
      task, itself included, where the rollup edge is
      `coalesce(dispatched_by_task_id, parent_task_id)` walked to its root.

      2. **Failed attempts count.** A session with `is_error` and a task in a failed state are both
      real spend. Excluding them would make a retried task look cheaper than one that succeeded
      first time.

      3. **`kind = 'system-one'` counts.** Upstream's own task totals sum every row, so this does
      too rather than presenting a subtotal as the task's cost.

      4. **`unpriced` dollars count in `cost_usd`, with `unpriced_cost_usd` beside them.** The share
      is published rather than subtracted, so the total still equals what the ledger says.

      5. **A session with a null `task_id` is absent here.** It has no task to roll up to. It stays
      in `delegate_swarm_daily_usage`, so no spend disappears from the overall picture.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [rollup_task_id]
    columns:
      - name: rollup_task_id
        description: The task whose subtree this row totals, which is a task with no rolled-up edge.
        data_tests:
          - not_null
      - name: session_count
        description: Sessions across the subtree.
        data_tests:
          - not_null
      - name: child_task_count
        description: >
          Tasks in the subtree, the rollup task included, so a leaf is 1. A broken chain shows up
          as a smaller number here rather than as missing spend.
        data_tests:
          - not_null
      - name: cost_usd
        description: The subtree's recorded cost, failed attempts and `system-one` rows included.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: unpriced_cost_usd
        description: The part of `cost_usd` that pi self-reported rather than the swarm's own book.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: first_session_at
        description: When the subtree's earliest session cost row was written. Null for a task with no sessions.
      - name: last_session_at
        description: When the subtree's latest session cost row was written. Null for a task with no sessions.

  - name: quickbooks_accounts
    description: >
      Pass-through of the QuickBooks accounts stream for the first cut of the finance mart. The
      chart of accounts: every ledger account with its type, classification and current balance.
      The spine most other finance questions join back to.
    columns:
      - name: account_id
        description: QuickBooks Online identifier for the account, unique within the company file.
        data_tests:
          - not_null
          - unique
      - name: _airbyte_extracted_at
        description: When Airbyte last pulled the record from the QuickBooks API; the freshness signal for readers of this table.

  - name: quickbooks_bills
    description: >
      Pass-through of the QuickBooks bills stream for the first cut of the finance mart. Vendor
      bills, the accounts-payable side of the ledger. Line detail arrives as a JSON string in
      `line`.
    columns:
      - name: bill_id
        description: QuickBooks Online identifier for the bill, unique within the company file.
        data_tests:
          - not_null
          - unique
      - name: _airbyte_extracted_at
        description: When Airbyte last pulled the record from the QuickBooks API; the freshness signal for readers of this table.

  - name: quickbooks_classes
    description: >
      Pass-through of the QuickBooks classes stream for the first cut of the finance mart.
      Classes, the QuickBooks dimension used for cost allocation alongside departments.
    columns:
      - name: class_id
        description: QuickBooks Online identifier for the class, unique within the company file.
        data_tests:
          - not_null
          - unique
      - name: _airbyte_extracted_at
        description: When Airbyte last pulled the record from the QuickBooks API; the freshness signal for readers of this table.

  - name: quickbooks_credit_memos
    description: >
      Pass-through of the QuickBooks credit memos stream for the first cut of the finance mart.
      Customer credit memos. This stream synced empty, so its tests hold vacuously until rows
      arrive.
    columns:
      - name: credit_memo_id
        description: QuickBooks Online identifier for the credit memo, unique within the company file.
        data_tests:
          - not_null
          - unique
      - name: _airbyte_extracted_at
        description: When Airbyte last pulled the record from the QuickBooks API; the freshness signal for readers of this table.

  - name: quickbooks_customers
    description: >
      Pass-through of the QuickBooks customers stream for the first cut of the finance mart.
      Carries contact PII: names, `primary_email_addr`, `primary_phone`, `mobile`, `fax` and the
      billing and shipping addresses.
    columns:
      - name: customer_id
        description: QuickBooks Online identifier for the customer, unique within the company file.
        data_tests:
          - not_null
          - unique
      - name: _airbyte_extracted_at
        description: When Airbyte last pulled the record from the QuickBooks API; the freshness signal for readers of this table.

  - name: quickbooks_departments
    description: >
      Pass-through of the QuickBooks departments stream for the first cut of the finance mart.
      Departments, the QuickBooks dimension BFO uses for department-level cost allocation.
    columns:
      - name: department_id
        description: QuickBooks Online identifier for the department, unique within the company file.
        data_tests:
          - not_null
          - unique
      - name: _airbyte_extracted_at
        description: When Airbyte last pulled the record from the QuickBooks API; the freshness signal for readers of this table.

  - name: quickbooks_deposits
    description: >
      Pass-through of the QuickBooks deposits stream for the first cut of the finance mart. Bank
      deposits.
    columns:
      - name: deposit_id
        description: QuickBooks Online identifier for the deposit, unique within the company file.
        data_tests:
          - not_null
          - unique
      - name: _airbyte_extracted_at
        description: When Airbyte last pulled the record from the QuickBooks API; the freshness signal for readers of this table.

  - name: quickbooks_items
    description: >
      Pass-through of the QuickBooks items stream for the first cut of the finance mart.
      Products and services.
    columns:
      - name: item_id
        description: QuickBooks Online identifier for the item, unique within the company file.
        data_tests:
          - not_null
          - unique
      - name: _airbyte_extracted_at
        description: When Airbyte last pulled the record from the QuickBooks API; the freshness signal for readers of this table.

  - name: quickbooks_journal_entries
    description: >
      Pass-through of the QuickBooks journal entries stream for the first cut of the finance
      mart. The general ledger itself. The debit and credit lines arrive as a JSON string in
      `line` and are not parsed here.
    columns:
      - name: journal_entry_id
        description: QuickBooks Online identifier for the journal entry, unique within the company file.
        data_tests:
          - not_null
          - unique
      - name: _airbyte_extracted_at
        description: When Airbyte last pulled the record from the QuickBooks API; the freshness signal for readers of this table.

  - name: quickbooks_payment_methods
    description: >
      Pass-through of the QuickBooks payment methods stream for the first cut of the finance
      mart. Payment methods.
    columns:
      - name: payment_method_id
        description: QuickBooks Online identifier for the payment method, unique within the company file.
        data_tests:
          - not_null
          - unique
      - name: _airbyte_extracted_at
        description: When Airbyte last pulled the record from the QuickBooks API; the freshness signal for readers of this table.

  - name: quickbooks_payments
    description: >
      Pass-through of the QuickBooks payments stream for the first cut of the finance mart.
      Customer payments received.
    columns:
      - name: payment_id
        description: QuickBooks Online identifier for the payment, unique within the company file.
        data_tests:
          - not_null
          - unique
      - name: _airbyte_extracted_at
        description: When Airbyte last pulled the record from the QuickBooks API; the freshness signal for readers of this table.

  - name: quickbooks_purchases
    description: >
      Pass-through of the QuickBooks purchases stream for the first cut of the finance mart.
      Purchases, the expense side of the ledger.
    columns:
      - name: purchase_id
