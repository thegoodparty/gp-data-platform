    columns:
      - name: vendor_credit_id
        description: QuickBooks Online identifier for the vendor credit, unique within the company file.
        data_tests:
          - not_null
          - unique
      - name: _airbyte_extracted_at
        description: When Airbyte last pulled the record from the QuickBooks API; the freshness signal for readers of this table.

  - name: quickbooks_vendors
    description: >
      Pass-through of the QuickBooks vendors stream for the first cut of the finance mart.
      Carries contact PII: names, `primary_email_addr`, `primary_phone`, `mobile`, `fax` and the
      billing address. `tax_identifier` is deliberately not passed through, since for a 1099
      sole proprietor it is an SSN.
    columns:
      - name: vendor_id
        description: QuickBooks Online identifier for the vendor, unique within the company file.
        data_tests:
          - not_null
