      - name: _airbyte_extracted_at
        description: When Airbyte last pulled the record from the QuickBooks API; the freshness signal for readers of this table.

  - name: quickbooks_purchases
    description: >
      Pass-through of the QuickBooks purchases stream for the first cut of the finance mart.
      Purchases, the expense side of the ledger.
    columns:
      - name: purchase_id
        description: QuickBooks Online identifier for the purchase, unique within the company file.
