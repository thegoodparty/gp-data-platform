    columns:
      - name: transfer_id
        description: QuickBooks Online identifier for the transfer, unique within the company file.
        data_tests:
          - not_null
          - unique
      - name: _airbyte_extracted_at
        description: When Airbyte last pulled the record from the QuickBooks API; the freshness signal for readers of this table.

  - name: quickbooks_vendor_credits
    description: >
      Pass-through of the QuickBooks vendor credits stream for the first cut of the finance
