unit_tests:
  # The population rule and the two buckets that keep the totals reconcilable. Staging is
  # mocked with SQL rather than rows because it is ephemeral, so this exercises the mart's own
  # filter and aggregation, not the dedupe underneath it.
  - name: bifrost_daily_usage_excludes_model_lists_and_buckets_the_rest
    model: bifrost_daily_usage
    given:
      - input: ref('stg_airflow_source__bifrost_request_log')
        format: sql
        rows: |
          select
              'r1' as request_id,
              timestamp '2026-11-17 10:00:00' as request_at,
              timestamp '2026-11-18 09:00:00' as exported_at,
              'bedrock' as provider,
              cast(null as string) as model,
              'list_models' as object_type,
              'success' as status,
              cast(0 as bigint) as prompt_tokens,
              cast(0 as bigint) as completion_tokens,
              cast(0 as bigint) as total_tokens,
              cast(0 as bigint) as cached_read_tokens,
              cast(null as decimal(20, 6)) as cost_usd,
              cast(null as decimal(20, 6)) as input_cost_usd,
              cast(null as decimal(20, 6)) as output_cost_usd,
              cast(null as decimal(20, 6)) as additional_cost_usd,
              'test.user@goodparty.org' as person_email
          union all
          select
              'r2', timestamp '2026-11-17 11:00:00', timestamp '2026-11-18 09:00:00',
              'bedrock', 'model-a', 'chat_completion_stream', 'success',
              cast(40 as bigint), cast(60 as bigint), cast(100 as bigint), cast(0 as bigint),
              cast(0 as decimal(20, 6)), cast(0 as decimal(20, 6)),
              cast(0 as decimal(20, 6)), cast(0 as decimal(20, 6)),
              'test.user@goodparty.org'
          union all
          select
              'r3', timestamp '2026-11-17 12:00:00', timestamp '2026-11-18 09:00:00',
              'bedrock', 'model-b', 'chat_completion_stream', 'error',
              cast(0 as bigint), cast(0 as bigint), cast(0 as bigint), cast(0 as bigint),
              cast(null as decimal(20, 6)), cast(null as decimal(20, 6)),
              cast(null as decimal(20, 6)), cast(null as decimal(20, 6)),
              'test.user@goodparty.org'
          union all
          select
              'r4', timestamp '2026-11-17 12:30:00', timestamp '2026-11-18 09:00:00',
              'bedrock', 'model-b', 'responses_stream', 'error',
              cast(0 as bigint), cast(0 as bigint), cast(0 as bigint), cast(0 as bigint),
              cast(null as decimal(20, 6)), cast(null as decimal(20, 6)),
              cast(null as decimal(20, 6)), cast(null as decimal(20, 6)),
              'test.user@goodparty.org'
          union all
          select
              'r5', timestamp '2026-11-17 13:00:00', timestamp '2026-11-18 09:00:00',
              'bedrock', 'model-c', 'chat_completion_stream', 'success',
              cast(4 as bigint), cast(6 as bigint), cast(10 as bigint), cast(0 as bigint),
              cast(0.5 as decimal(20, 6)), cast(0.25 as decimal(20, 6)),
              cast(0.25 as decimal(20, 6)), cast(0 as decimal(20, 6)),
              cast(null as string)
    expect:
      rows:
        # The model-list call is gone, so no blank-model group exists.
        - {usage_date: "2026-11-17", model: model-a, person_email: "test.user@goodparty.org", request_count: 1, error_count: 0, unpriced_request_count: 1, total_tokens: 100, cost_usd: 0}
        # Zero-token failures sum to zero cost rather than to null.
        - {usage_date: "2026-11-17", model: model-b, person_email: "test.user@goodparty.org", request_count: 2, error_count: 2, unpriced_request_count: 0, total_tokens: 0, cost_usd: 0}
        # A request with no identity at all lands here instead of being dropped.
        - {usage_date: "2026-11-17", model: model-c, person_email: unattributed, request_count: 1, error_count: 0, unpriced_request_count: 0, total_tokens: 10, cost_usd: 0.5}

  # The arm has no read time when a report has never loaded. least() skips a null
  # argument, so a bare least() would hand an empty seat report the org report's
  # stamp and publish a completeness date the arm has not earned. Both freshness
  # columns must be null here.
  - name: anthropic_daily_usage_has_no_anchor_when_the_seat_report_is_empty
    model: anthropic_daily_usage
    given:
      - input: ref('stg_airbyte_source__anthropic_api_cost_report')
        format: sql
        rows: |
          select
              timestamp '2026-11-15 00:00:00' as bucket_start,
              timestamp '2026-11-16 00:00:00' as bucket_end,
              cast(10.00 as decimal(20, 6)) as amount,
              cast(null as bigint) as requests,
              timestamp '2026-11-16 20:25:00' as _airbyte_extracted_at
      - input: ref('stg_airbyte_source__anthropic_api_user_cost_report')
        format: sql
        rows: |
          select
              timestamp '2026-11-15 00:00:00' as bucket_start,
              timestamp '2026-11-16 00:00:00' as bucket_end,
              'u1' as user_id,
              cast('test.user@goodparty.org' as string) as user_email,
              cast(10.00 as decimal(20, 6)) as amount,
              cast(null as bigint) as requests,
              timestamp '2026-11-16 20:25:00' as _airbyte_extracted_at
          where false
    expect:
      rows:
        # The whole org total falls to unattributed, and neither freshness column
        # is claimed.
        - {usage_date: "2026-11-15", person_email: unattributed, is_unattributed: true, cost_usd: 10, request_count: null, source_loaded_at: null, source_complete_through: null}

  # The residual arithmetic is the core of the model, and a daily-total comparison
  # cannot see a wrong split between a person row and the residual. This pins the
  # whole shape: two seat ids sharing one mixed-case email sum into one lower-cased
  # row, a null-email seat folds into the residual instead of becoming a blank
  # person, and a day whose difference rounds to exactly zero emits no residual
  # row at all.
  - name: anthropic_daily_usage_person_split_and_residual
    model: anthropic_daily_usage
    given:
      - input: ref('stg_airbyte_source__anthropic_api_cost_report')
        format: sql
        rows: |
          select
              timestamp '2026-11-15 00:00:00' as bucket_start,
              cast(10.000000 as decimal(20, 6)) as amount,
              timestamp '2026-11-17 20:25:00' as _airbyte_extracted_at
          union all
          -- rounds to the same cent as the seat row below, so the day has no residual
          select
              timestamp '2026-11-16 00:00:00',
              cast(1.004000 as decimal(20, 6)),
              timestamp '2026-11-17 20:25:00'
      - input: ref('stg_airbyte_source__anthropic_api_user_cost_report')
        format: sql
        rows: |
          select
              timestamp '2026-11-15 00:00:00' as bucket_start,
              'u1' as user_id,
              cast('Alice@GoodParty.org' as string) as user_email,
              cast(2.500000 as decimal(20, 6)) as amount,
              cast(10 as bigint) as requests,
              timestamp '2026-11-17 20:25:00' as _airbyte_extracted_at
          union all
          -- same person under a second vendor id and different casing
          select
              timestamp '2026-11-15 00:00:00', 'u5', 'alice@goodparty.org',
              cast(0.500000 as decimal(20, 6)), cast(5 as bigint),
              timestamp '2026-11-17 20:25:00'
          union all
          select
              timestamp '2026-11-15 00:00:00', 'u2', 'bob@goodparty.org',
              cast(3.000000 as decimal(20, 6)), cast(20 as bigint),
              timestamp '2026-11-17 20:25:00'
          union all
          -- a deleted seat: no email, so its cost belongs to nobody
          select
              timestamp '2026-11-15 00:00:00', 'u3', cast(null as string),
              cast(1.000000 as decimal(20, 6)), cast(3 as bigint),
              timestamp '2026-11-17 20:25:00'
          union all
          select
              timestamp '2026-11-16 00:00:00', 'u4', 'carol@goodparty.org',
              cast(1.001000 as decimal(20, 6)), cast(7 as bigint),
              timestamp '2026-11-17 20:25:00'
    expect:
      rows:
        # Two vendor ids, one email, summed and lower-cased.
        - {usage_date: "2026-11-15", person_email: "alice@goodparty.org", is_unattributed: false, cost_usd: 3, request_count: 15, source_complete_through: "2026-11-16"}
        - {usage_date: "2026-11-15", person_email: "bob@goodparty.org", is_unattributed: false, cost_usd: 3, request_count: 20, source_complete_through: "2026-11-16"}
        # Org total less the email-attributable seats, so it carries the deleted
        # seat's cost as well as the non-seat share.
        - {usage_date: "2026-11-15", person_email: unattributed, is_unattributed: true, cost_usd: 4, request_count: null, source_complete_through: "2026-11-16"}
        # No residual row for the day whose rounded difference is zero.
        - {usage_date: "2026-11-16", person_email: "carol@goodparty.org", is_unattributed: false, cost_usd: 1.001, request_count: 7, source_complete_through: "2026-11-16"}

  # The arm mapping and the Bifrost completeness rule, which nothing else reaches.
  # The point of the data is the partial newest day: the last export ran on the
  # 20th, so the 20th itself is not complete and only earlier days are. `<=` in
  # place of `<` here would publish a partial day as complete.
  - name: ai_usage_daily_arm_mapping_and_bifrost_completeness
    model: ai_usage_daily
    given:
      - input: ref('bifrost_daily_usage')
        format: sql
        rows: |
          select
              to_date('2026-11-18') as usage_date,
              'bedrock' as provider,
              'model-a' as model,
              'test.user@goodparty.org' as person_email,
              cast(1.500000 as decimal(20, 6)) as cost_usd,
              cast(4 as bigint) as request_count,
              cast(100 as bigint) as total_tokens,
              timestamp '2026-11-20 09:00:00' as source_exported_at
          union all
          select
              to_date('2026-11-19'), 'bedrock', 'model-a', 'unattributed',
              cast(0.500000 as decimal(20, 6)), cast(1 as bigint),
              cast(10 as bigint), timestamp '2026-11-20 09:00:00'
          union all
          select
              to_date('2026-11-20'), 'fireworks', 'model-b', 'unattributed',
              cast(2.500000 as decimal(20, 6)), cast(6 as bigint),
              cast(200 as bigint), timestamp '2026-11-20 09:00:00'
      - input: ref('anthropic_daily_usage')
        format: sql
        rows: |
          select
              to_date('2026-11-01') as usage_date,
              'someone@goodparty.org' as person_email,
              false as is_unattributed,
              cast(7.000000 as decimal(20, 6)) as cost_usd,
              cast(11 as bigint) as request_count,
              timestamp '2026-11-16 20:25:00' as source_loaded_at,
              to_date('2026-11-15') as source_complete_through
          union all
          select
              to_date('2026-11-01'), 'unattributed', true,
              cast(3.000000 as decimal(20, 6)), cast(null as bigint),
              timestamp '2026-11-16 20:25:00', to_date('2026-11-15')
      # Empty, but typed: this test is about the Bifrost boundary, so the swarm arm
      # contributes no rows. Without the fixture the model cannot resolve its third
      # input and the test fails before it checks anything.
      - input: ref('delegate_swarm_daily_usage')
        format: sql
        rows: |
          select
              cast(null as date) as usage_date,
              cast(null as string) as agent_name,
              cast(null as string) as agent_id,
              cast(null as string) as model,
              cast(null as bigint) as session_count,
              cast(null as bigint) as task_count,
              cast(null as bigint) as error_session_count,
              cast(null as bigint) as unpriced_session_count,
              cast(null as bigint) as total_tokens,
              cast(null as decimal(20, 6)) as cost_usd,
              cast(null as decimal(20, 6)) as unpriced_cost_usd,
              cast(null as timestamp) as source_exported_at,
              cast(null as timestamp) as source_loaded_at,
              cast(null as date) as source_complete_through
          where false
    expect:
      rows:
        # Bifrost: cost basis, populated tokens, null sessions, and a completeness
        # date one day back because the 20th is still partial.
        - {usage_date: "2026-11-18", source: bifrost, provider: bedrock, model: model-a, attribution_kind: person, attribution: "test.user@goodparty.org", cost_usd: 1.5, request_count: 4, session_count: null, total_tokens: 100, cost_basis: gateway_computed, source_loaded_at: "2026-11-20 09:00:00", source_complete_through: "2026-11-19"}
        # The last complete day: the export ran on the 20th, so the 20th itself is
        # not complete. `<=` in place of `<` would say 2026-11-20 here.
        - {usage_date: "2026-11-19", source: bifrost, provider: bedrock, model: model-a, attribution_kind: unattributed, attribution: unattributed, cost_usd: 0.5, request_count: 1, session_count: null, total_tokens: 10, cost_basis: gateway_computed, source_loaded_at: "2026-11-20 09:00:00", source_complete_through: "2026-11-19"}
        # An identity-less request is its own kind, not a person.
        - {usage_date: "2026-11-20", source: bifrost, provider: fireworks, model: model-b, attribution_kind: unattributed, attribution: unattributed, cost_usd: 2.5, request_count: 6, session_count: null, total_tokens: 200, cost_basis: gateway_computed, source_loaded_at: "2026-11-20 09:00:00", source_complete_through: "2026-11-19"}
        # Anthropic: the fixed model label, the vendor basis, and no tokens.
        - {usage_date: "2026-11-01", source: anthropic, provider: anthropic, model: claude_all_models, attribution_kind: person, attribution: "someone@goodparty.org", cost_usd: 7, request_count: 11, session_count: null, total_tokens: null, cost_basis: vendor_reported, source_loaded_at: "2026-11-16 20:25:00", source_complete_through: "2026-11-15"}
        - {usage_date: "2026-11-01", source: anthropic, provider: anthropic, model: claude_all_models, attribution_kind: unattributed, attribution: unattributed, cost_usd: 3, request_count: null, session_count: null, total_tokens: null, cost_basis: vendor_reported, source_loaded_at: "2026-11-16 20:25:00", source_complete_through: "2026-11-15"}

  # The rollup is the one definition of cost per task, so it is pinned here rather
  # than left to a reader of the SQL. Each case below is a clause of section 4 of
  # the contract: a chain, a chain whose parent earned nothing, a failed attempt,
  # an `unpriced` session, and a session with no task at all.
  #
  # The root model is mocked with SQL rather than rows because it is ephemeral and
  # because its own walk is unit tested through the mart below it: this test pins
  # what the task mart does with a resolved root, which is the arithmetic the
  # definition is about.

  # A two-level chain and a parent that never earned anything. The session on the
  # child rolls up to the grandparent, so both the parent and the grandparent show
  # the same spend, and a rollup whose own sessions are empty still gets a row.
  - name: delegate_swarm_task_spend_rolls_a_chain_to_its_root
    model: delegate_swarm_task_spend
    given:
      - input: ref('int__delegate_swarm_task_root')
        format: sql
        rows: |
          select 'r1' as task_id, 'r1' as root_task_id, 0 as depth
          union all select 'c1', 'r1', 1
          union all select 'c2', 'r1', 1
          union all select 'g1', 'r1', 2
      - input: ref('stg_airflow_source__delegate_swarm_session_cost')
        format: sql
        rows: |
          select
              'r1' as task_id, 'harness' as cost_source,
              cast(1.000000 as decimal(20, 6)) as cost_usd,
              timestamp '2026-11-17 10:00:00' as created_at
          union all
          select 'c1', 'harness', cast(2.000000 as decimal(20, 6)),
              timestamp '2026-11-17 11:00:00'
          union all
          select 'g1', 'harness', cast(4.000000 as decimal(20, 6)),
              timestamp '2026-11-17 12:00:00'
    expect:
      rows:
        # The root's own session plus everything under it.
        - {rollup_task_id: r1, session_count: 3, child_task_count: 4, cost_usd: 7, unpriced_cost_usd: 0, first_session_at: "2026-11-17 10:00:00", last_session_at: "2026-11-17 12:00:00"}
        # A child is not itself a rollup, so it has no row: the subtree hangs off
        # the root. Only tasks that are their own root appear.

  # A produced row for every rollup in the tree, including one with no sessions at
  # all, so the task list is the tree's rather than the traffic's. Every session
  # counts whatever its state, which is why the failing one below is included
  # rather than filtered: the model never reads `is_error` or `kind`, so there is no
  # clause that could exclude them.
  - name: delegate_swarm_task_spend_keeps_a_rollup_with_no_sessions
    model: delegate_swarm_task_spend
    given:
      - input: ref('int__delegate_swarm_task_root')
        format: sql
        rows: |
          select 'r1' as task_id, 'r1' as root_task_id, 0 as depth
          union all select 'c1', 'r1', 1
          union all select 'r2', 'r2', 0
      - input: ref('stg_airflow_source__delegate_swarm_session_cost')
        format: sql
        rows: |
          select
              'r1' as task_id, 'harness' as cost_source,
              cast(1.000000 as decimal(20, 6)) as cost_usd,
              timestamp '2026-11-17 10:00:00' as created_at
          union all
          -- a failed attempt on the child: still real spend, because nothing here
          -- reads the flag
          select 'c1', 'harness', cast(2.000000 as decimal(20, 6)),
              timestamp '2026-11-17 11:00:00'
          union all
          -- the swarm's own overhead, likewise counted
          select 'r1', 'harness', cast(0.500000 as decimal(20, 6)),
              timestamp '2026-11-17 12:00:00'
    expect:
      rows:
        - {rollup_task_id: r1, session_count: 3, child_task_count: 2, cost_usd: 3.5, unpriced_cost_usd: 0, first_session_at: "2026-11-17 10:00:00", last_session_at: "2026-11-17 12:00:00"}
        # A task with no sessions at all is still a row, with zeros and null clocks.
        - {rollup_task_id: r2, session_count: 0, child_task_count: 1, cost_usd: 0, unpriced_cost_usd: 0, first_session_at: null, last_session_at: null}

  # An `unpriced` session's dollars count in the total and are also published as
  # the share beside it. Subtracting them would make the total disagree with the
  # ledger.
  - name: delegate_swarm_task_spend_publishes_the_unpriced_share
    model: delegate_swarm_task_spend
    given:
      - input: ref('int__delegate_swarm_task_root')
        format: sql
        rows: |
          select 'r1' as task_id, 'r1' as root_task_id, 0 as depth
      - input: ref('stg_airflow_source__delegate_swarm_session_cost')
        format: sql
        rows: |
          select
              'r1' as task_id, 'harness' as cost_source,
              cast(3.000000 as decimal(20, 6)) as cost_usd,
              timestamp '2026-11-17 10:00:00' as created_at
          union all
          select 'r1', 'unpriced', cast(1.250000 as decimal(20, 6)),
              timestamp '2026-11-17 11:00:00'
    expect:
      rows:
        - {rollup_task_id: r1, session_count: 2, cost_usd: 4.25, unpriced_cost_usd: 1.25}

  # A session with no task is excluded from the task grain, because it has nothing
  # to roll up to. It stays in the daily mart, which is where its cost is still
  # counted.
  - name: delegate_swarm_task_spend_excludes_sessions_with_no_task
    model: delegate_swarm_task_spend
    given:
      - input: ref('int__delegate_swarm_task_root')
        format: sql
        rows: |
          select 'r1' as task_id, 'r1' as root_task_id, 0 as depth
      - input: ref('stg_airflow_source__delegate_swarm_session_cost')
        format: sql
        rows: |
          select
              'r1' as task_id, 'harness' as cost_source,
              cast(1.000000 as decimal(20, 6)) as cost_usd,
              timestamp '2026-11-17 10:00:00' as created_at
          union all
          select cast(null as string), 'harness', cast(9.000000 as decimal(20, 6)),
              timestamp '2026-11-17 11:00:00'
    expect:
      rows:
        - {rollup_task_id: r1, session_count: 1, cost_usd: 1, unpriced_cost_usd: 0}

  # The daily grain, and the partial publication the contract accepts rather than
  # designing away: a cost file that lands without its edge file. The cost rows
  # still count in full, and `task_count` is 0 for them until the next run's window
  # brings the edges in. This pins what a reader sees while it is happening rather
  # than pretending the two objects are atomic.
  #
  # It also covers the `unknown_agent` placeholder surviving to the mart, which is
  # the only way the `not_null` test on `agent_name` can be honest.
  - name: delegate_swarm_daily_usage_counts_a_cost_file_with_no_edge_file
    model: delegate_swarm_daily_usage
    given:
      - input: ref('int__delegate_swarm_task_root')
        format: sql
        # No rows: the edge file has not landed, so no task has a root.
        rows: |
          select
              cast(null as string) as task_id,
              cast(null as string) as root_task_id,
              cast(0 as int) as depth
          where false
      - input: ref('stg_airflow_source__delegate_swarm_session_cost')
        format: sql
        rows: |
          select
              timestamp '2026-11-17 10:00:00' as created_at,
              'builder' as agent_name,
              'a1' as agent_id,
              'model-a' as model,
              false as is_error,
              'harness' as cost_source,
              cast(1.500000 as decimal(20, 6)) as cost_usd,
              cast(100 as bigint) as input_tokens,
              cast(50 as bigint) as output_tokens,
              't1' as task_id,
              timestamp '2026-11-18 09:15:00' as exported_at
          union all
          -- the agent row is gone upstream, and the row still counts
          select
              timestamp '2026-11-17 11:00:00', 'unknown_agent', 'a9', 'model-a',
              true, 'unpriced', cast(0.250000 as decimal(20, 6)),
              cast(10 as bigint), cast(5 as bigint), 't2',
              timestamp '2026-11-18 09:15:00'
    expect:
      rows:
        # Cost is complete and `task_count` is 0 because no edges landed yet. The
        # export ran on the 18th, so the 17th is the last complete day.
        - {usage_date: "2026-11-17", agent_name: builder, agent_id: a1, model: model-a, session_count: 1, task_count: 0, error_session_count: 0, unpriced_session_count: 0, total_tokens: 150, cost_usd: 1.5, unpriced_cost_usd: 0, source_exported_at: "2026-11-18 09:15:00", source_loaded_at: "2026-11-18 09:15:00", source_complete_through: "2026-11-17"}
        # A failed, unpriced session under the placeholder agent is kept, counted
        # in both failure and unpriced columns, and its dollars are the unpriced share.
        - {usage_date: "2026-11-17", agent_name: unknown_agent, agent_id: a9, model: model-a, session_count: 1, task_count: 0, error_session_count: 1, unpriced_session_count: 1, total_tokens: 15, cost_usd: 0.25, unpriced_cost_usd: 0.25, source_exported_at: "2026-11-18 09:15:00", source_loaded_at: "2026-11-18 09:15:00", source_complete_through: "2026-11-17"}

  # With the edges present, `task_count` counts distinct rollup tasks rather than
  # sessions, so it agrees with the task mart's denominator. Two sessions on one
  # task is one task, and a session with no task adds nothing.
  - name: delegate_swarm_daily_usage_counts_distinct_rollup_tasks
    model: delegate_swarm_daily_usage
    given:
      - input: ref('int__delegate_swarm_task_root')
        format: sql
        rows: |
          select 't1' as task_id, 'r1' as root_task_id, 0 as depth
          union all select 't2', 'r1', 1
      - input: ref('stg_airflow_source__delegate_swarm_session_cost')
        format: sql
        rows: |
          select
              timestamp '2026-11-17 10:00:00' as created_at,
              'builder' as agent_name, 'a1' as agent_id, 'model-a' as model,
              false as is_error, 'harness' as cost_source,
              cast(1.000000 as decimal(20, 6)) as cost_usd,
              cast(10 as bigint) as input_tokens, cast(10 as bigint) as output_tokens,
              't1' as task_id, timestamp '2026-11-18 09:15:00' as exported_at
          union all
          select
              timestamp '2026-11-17 11:00:00', 'builder', 'a1', 'model-a',
              false, 'harness', cast(1.000000 as decimal(20, 6)),
              cast(10 as bigint), cast(10 as bigint), 't2',
              timestamp '2026-11-18 09:15:00'
          union all
          -- no task at all: it counts as a session and toward no task
          select
              timestamp '2026-11-17 12:00:00', 'builder', 'a1', 'model-a',
              false, 'harness', cast(1.000000 as decimal(20, 6)),
              cast(10 as bigint), cast(10 as bigint), cast(null as string),
              timestamp '2026-11-18 09:15:00'
    expect:
      rows:
        - {usage_date: "2026-11-17", agent_name: builder, session_count: 3, task_count: 1, total_tokens: 60, cost_usd: 3}

  # The swarm arm's mapping, which is the whole of its contribution to the combined
  # model: the source and provider literals, `self_reported` as the basis, the agent
  # as the attribution, and the null `request_count` that says this arm has no
  # request to count. A synthesised email here would put one person's name on a
  # machine's spend.
  - name: ai_usage_daily_maps_the_delegate_swarm_arm
    model: ai_usage_daily
    given:
      - input: ref('bifrost_daily_usage')
        format: sql
        rows: |
          select
              to_date('2026-11-17') as usage_date,
              'bedrock' as provider,
              'model-a' as model,
              'test.user@goodparty.org' as person_email,
              cast(1.500000 as decimal(20, 6)) as cost_usd,
              cast(4 as bigint) as request_count,
              cast(100 as bigint) as total_tokens,
              timestamp '2026-11-18 09:00:00' as source_exported_at
      - input: ref('anthropic_daily_usage')
        format: sql
        rows: |
          select
              to_date('2026-11-17') as usage_date,
              'someone@goodparty.org' as person_email,
              false as is_unattributed,
              cast(2.000000 as decimal(20, 6)) as cost_usd,
              cast(3 as bigint) as request_count,
              timestamp '2026-11-16 20:25:00' as source_loaded_at,
              to_date('2026-11-15') as source_complete_through
      - input: ref('delegate_swarm_daily_usage')
        format: sql
        rows: |
          select
              to_date('2026-11-17') as usage_date,
              'builder' as agent_name,
              'a1' as agent_id,
              'model-a' as model,
              cast(2 as bigint) as session_count,
              cast(1 as bigint) as task_count,
              cast(1 as bigint) as error_session_count,
              cast(0 as bigint) as unpriced_session_count,
              cast(300 as bigint) as total_tokens,
              cast(4.000000 as decimal(20, 6)) as cost_usd,
              cast(0.000000 as decimal(20, 6)) as unpriced_cost_usd,
              timestamp '2026-11-18 09:15:00' as source_exported_at,
              timestamp '2026-11-18 09:15:00' as source_loaded_at,
              to_date('2026-11-17') as source_complete_through
          union all
          -- A second agent id under the same label. The source mart is keyed on
          -- the id too, so this model has to fold the two or it lands two rows on
          -- one grain key.
          select
              to_date('2026-11-17'), 'builder', 'a2', 'model-a',
              cast(1 as bigint), cast(0 as bigint), cast(0 as bigint),
              cast(1 as bigint), cast(50 as bigint),
              cast(1.000000 as decimal(20, 6)),
              cast(1.000000 as decimal(20, 6)),
              timestamp '2026-11-18 09:15:00', timestamp '2026-11-18 09:15:00',
              to_date('2026-11-17')
    expect:
      rows:
        # Bifrost: its completeness date is the newest day an export has passed,
        # which is the 17th because the export ran on the 18th.
        - {usage_date: "2026-11-17", source: bifrost, provider: bedrock, model: model-a, attribution_kind: person, attribution: "test.user@goodparty.org", cost_usd: 1.5, request_count: 4, session_count: null, total_tokens: 100, cost_basis: gateway_computed, source_loaded_at: "2026-11-18 09:00:00", source_complete_through: "2026-11-17"}
        - {usage_date: "2026-11-17", source: anthropic, provider: anthropic, model: claude_all_models, attribution_kind: person, attribution: "someone@goodparty.org", cost_usd: 2, request_count: 3, session_count: null, total_tokens: null, cost_basis: vendor_reported, source_loaded_at: "2026-11-16 20:25:00", source_complete_through: "2026-11-15"}
        # The agent is the attribution, there is no request count, and the tokens
        # and sessions are populated. The two agent ids under one label are folded
        # into one row, because this model's grain is the label.
        - {usage_date: "2026-11-17", source: delegate_swarm, provider: fireworks, model: model-a, attribution_kind: agent, attribution: builder, cost_usd: 5, request_count: null, session_count: 3, total_tokens: 350, cost_basis: self_reported, source_loaded_at: "2026-11-18 09:15:00", source_complete_through: "2026-11-17"}
