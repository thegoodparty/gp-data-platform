version: 2

# Besides the column tests on gp_api_voters, the singular tests
# assert_gp_api_voters_rowcount_and_state_coverage (error) and
# assert_gp_api_voters_affinity_and_ideology_rates (warn, since a new Haystaq
# vintage can legitimately move it) gate the voter table.
models:
  - name: gp_api_voters
    config:
      tags: ["monthly"]
    description: >
      The L2 voter file served to gp-api, one row per LALVOTERID, with
      turnout and independent-affinity scores. Holds the full L2 record,
      including PII, so read access is limited to mart_gp_api_readers.
    columns:
      - name: id
        description: Unique identifier for a voter
        data_type: uuid
        tests:
          - not_null
          - unique
      - name: LALVOTERID
        description: Unique identifier for a voter
        data_type: varchar
        tests:
          - not_null
          - unique
      - name: State
        description: Two-letter state postal code
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ get_us_states_list(include_DC=true, include_US=true) }}"
      - name: Voter_Status
        description: >
          Turnout-propensity bucket for the 2026 General, derived from the
          in-house model probability: Unlikely (<0.25), Unreliable (<0.50),
          Likely (<0.75), Super (>=0.75), Unknown (no score).
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Unlikely
                  - Unreliable
                  - Likely
                  - Super
                  - Unknown
      - name: Voter_Turnout_Probability
        description: >
          In-house modeled turnout probability in [0,1] for the 2026 General;
          null when the voter has no score.
        data_type: double
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
              config:
                where: "Voter_Turnout_Probability is not null"
      - name: Voter_Independent_Affinity
        description: >
          True when the voter shows any signal of independent-leaning behaviour:
          a registration party change within ~4 years, frequent ticket
          splitting, a third-party or crossover primary ballot in 2020/2022/2024,
          a Haystaq score at or above the double-dislike or moderate-third-party
          cut (both cuts are project vars), or a 'Non-Partisan' registration. A
          union of signals, so a voter with no data on a given signal is simply
          not flagged on it and the column is never null. Set membership, not a
          ranking: it carries ~70% of the file, so it filters but cannot order.
        data_type: boolean
        tests:
          - not_null
      - name: Indep_Openness_Registration
        description: >
          Control-arm flag for the openness-to-an-independent experiment, built
          only from official records and L2's own party model, with no Haystaq
          scores. True when the voter is registered as neither Democratic nor
          Republican, changed party registration within ~4 years, lives in a
          household that includes an Independent, or pulled both a Democratic
          and a Republican primary ballot between 2012 and 2024. In states without
          party registration the party is L2's model. Never null; ~45% of the file.
        data_type: boolean
        tests:
          - not_null
      - name: Indep_Openness_Haystaq
        description: >
          Haystaq-arm flag for the openness-to-an-independent experiment: true when
          hs_partisanship_moderate_third_party_support is at or above the voter's
          state cutoff (seed indep_openness_haystaq_cutoff), the top 40-41% of voters
          with a score. Voters with no score are false, so never null; ~37% of the file.
        data_type: boolean
        tests:
          - not_null
      - name: Indep_Openness_Single_Inc
        description: >
          State-leg-arm flag for the openness-to-an-independent experiment, scenario:
          one seat, a Democrat and a Republican running, D or R incumbent in the field. True when the voter is in the top 40% of their state on the
          state-leg model's score for this scenario (int__indep_openness_voter_scores).
          Voters with no score are false, so never null.
        data_type: boolean
        tests:
          - not_null
      - name: Indep_Openness_Single_Open
        description: >
          State-leg-arm flag for the openness-to-an-independent experiment, scenario:
          one seat, a Democrat and a Republican running, no D or R incumbent. True when the voter is in the top 40% of their state on the
          state-leg model's score for this scenario (int__indep_openness_voter_scores).
          Voters with no score are false, so never null.
        data_type: boolean
        tests:
          - not_null
      - name: Indep_Openness_Multi_Inc
        description: >
          State-leg-arm flag for the openness-to-an-independent experiment, scenario:
          two or more seats, full field (scored at 3 seats), incumbent in the field. True when the voter is in the top 40% of their state on the
          state-leg model's score for this scenario (int__indep_openness_voter_scores).
          Voters with no score are false, so never null.
        data_type: boolean
        tests:
          - not_null
      - name: Indep_Openness_Multi_Open
        description: >
          State-leg-arm flag for the openness-to-an-independent experiment, scenario:
          two or more seats, full field (scored at 3 seats), open. True when the voter is in the top 40% of their state on the
          state-leg model's score for this scenario (int__indep_openness_voter_scores).
          Voters with no score are false, so never null.
        data_type: boolean
        tests:
          - not_null
      - name: Indep_Openness_DOnly_Inc
        description: >
          State-leg-arm flag for the openness-to-an-independent experiment, scenario:
          one seat, a lone Democrat opponent, incumbent in the field. True when the voter is in the top 40% of their state on the
          state-leg model's score for this scenario (int__indep_openness_voter_scores).
          Voters with no score are false, so never null.
        data_type: boolean
        tests:
          - not_null
      - name: Indep_Openness_DOnly_Open
        description: >
          State-leg-arm flag for the openness-to-an-independent experiment, scenario:
          one seat, a lone Democrat opponent, open. True when the voter is in the top 40% of their state on the
          state-leg model's score for this scenario (int__indep_openness_voter_scores).
          Voters with no score are false, so never null.
        data_type: boolean
        tests:
          - not_null
      - name: Indep_Openness_ROnly_Inc
        description: >
          State-leg-arm flag for the openness-to-an-independent experiment, scenario:
          one seat, a lone Republican opponent, incumbent in the field. True when the voter is in the top 40% of their state on the
          state-leg model's score for this scenario (int__indep_openness_voter_scores).
          Voters with no score are false, so never null.
        data_type: boolean
        tests:
          - not_null
      - name: Indep_Openness_ROnly_Open
        description: >
          State-leg-arm flag for the openness-to-an-independent experiment, scenario:
          one seat, a lone Republican opponent, open. True when the voter is in the top 40% of their state on the
          state-leg model's score for this scenario (int__indep_openness_voter_scores).
          Voters with no score are false, so never null.
        data_type: boolean
        tests:
          - not_null
      - name: Indep_Openness_DOnly_Multi
        description: >
          State-leg-arm flag for the openness-to-an-independent experiment, scenario:
          two or more seats, Democrats and no Republicans. True when the voter is in the top 40% of their state on the
          state-leg model's score for this scenario (int__indep_openness_voter_scores).
          Voters with no score are false, so never null.
        data_type: boolean
        tests:
          - not_null
      - name: Indep_Openness_ROnly_Multi
        description: >
          State-leg-arm flag for the openness-to-an-independent experiment, scenario:
          two or more seats, Republicans and no Democrats. True when the voter is in the top 40% of their state on the
          state-leg model's score for this scenario (int__indep_openness_voter_scores).
          Voters with no score are false, so never null.
        data_type: boolean
        tests:
          - not_null
      - name: Census_Block_Group_Geoid
        description: >
          The 12-character ACS block group of the voter's residence, the key of
          gp_api_block_group_census_demographics. Taken from L2's complete census
          block geocode; Connecticut's legacy-county blocks map to their
          planning-region block group, as the ACS keys them. Null when L2 has no
          geocode for the voter (about 4% of the file).
        data_type: string
        tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^[0-9]{12}$"
      - name: hf_ideology_general
        description: >
          Haystaq general-ideology label, passed through from the L2/Haystaq
          source under its source name and with its source values: Conservative,
          Liberal, or Moderate, and null (~40% of voters) where the model is
          undecided. These are the source's own labels and are kept as they
          are, here and downstream; nothing relabels them.
        data_type: string
        tests:
          - accepted_values:
              arguments:
                values:
                  - Conservative
                  - Liberal
                  - Moderate

  - name: gp_api_commercial_people
    description: >
      Michigan adults from the L2 commercial file, shaped like gp_api_voters. A
      column that shares a name with gp_api_voters has the same type and format,
      and coded values carry the voter file's labels. Voter-only columns (party,
      turnout history, registration) are absent; join to gp_api_voters on
      LALVOTERID for registered people. Commercial-only columns follow, in lower
      case, typed as in the commercial staging model.
    columns:
      - name: id
        data_tests:
          - unique
          - not_null
      - name: individual_id
        data_tests:
          - not_null
      - name: LALVOTERID
        data_tests:
          - unique
      - name: Age_Int
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 18

  - name: gp_api_consumer_only_people
    description: >
      People in the L2 commercial file who are not in gp_api_voters, in the
      gp_api_voters column contract so gp_api_constituents can union the two.
      Voter-file columns (party, turnout history, registration, scores) are
      null. District columns and Precinct come as one set from the most common
      values among voters in the person's ZIP+4, else census block, block group
      or tract (int__l2_area_district_profiles). Where no area matches, County
      and the state legislative and congressional districts fall back to the
      commercial file's own values. The commercial-only columns of
      gp_api_commercial_people follow.
    columns:
      - name: id
        description: >
          The voter-file id (salted hash of LALVOTERID, as in gp_api_voters)
          when the person has a LALVOTERID that is no longer in the voter file,
          otherwise a salted hash of individual_id.
        data_tests:
          - unique
          - not_null
          - is_uuid
      - name: individual_id
        data_tests:
          - unique
          - not_null
      - name: LALVOTERID
        data_tests:
          - unique
      - name: Registered_Voter
        description: Always false; the row is not in the voter file.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [false]
      - name: District_Source
        description: >
          The area whose voters supplied the district columns. Null when no area
          matched.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - zip_plus_4
                  - census_block
                  - census_block_group
                  - census_tract
      - name: Census_Block_Group_Geoid
        description: >
          The ACS block group of the person's commercial-file block
          (geocode_full), keyed like gp_api_voters.Census_Block_Group_Geoid.
      - name: geocode_full
        description: >
          The commercial file's 15-digit census block GEOID, joined as-is to the
          area profiles' zero-padded ids. The file arrives as text, so leading
          zeros survive, unlike the voter file's numeric geocode. The test fails
          the build if a file ever drops them, rather than padding silently.
        data_tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^[0-9]{15}$"
      - name: Residence_Addresses_ZipPlus4
        description: >
          Joined with Residence_Addresses_Zip to the area profiles' ZIP+4 ids,
          so it must keep its leading zeros.
        data_tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^[0-9]{4}$"

  - name: gp_api_constituents
    description: >
      Everyone the app can reach: every gp_api_voters row plus the people in
      gp_api_consumer_only_people. Columns are those of gp_api_voters, then
      Registered_Voter and District_Source, then the commercial-only columns,
      which are null on voter rows. The commercial file holds everyone L2 links
      to the state through transactions, including people who also transact
      elsewhere, so the total exceeds the state's adult population.
      ids do not collide across the two halves, which
      assert_gp_api_consumer_only_people_ids_not_voter_ids checks on the table
      rather than on this large view.
    columns:
      - name: Registered_Voter
        description: True when the row comes from the voter file.
      - name: District_Source
        description: >
          voter_file for voter rows; for consumer-only rows, the area whose
          voters supplied the district columns, or null when none matched.

  - name: gp_api_district_census_stats
    description: Pass-through of district_census_stats

  - name: gp_api_district_census_demographics
    description: >
      Pass-through of int__district_acs_estimates: ACS 2020-2024 5-year counts per
      district, on the same (state_postal_code, district_type, district_name) key
      as gp_api_district_census_stats, with the same count columns as
      gp_api_block_group_census_demographics. Local rows are block-group
      estimates allocated through the district population allocation and are
      fractional; statewide rows are the published state estimates. Counts only:
      no medians and no margins of error. Read one district_type at a time.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [state_postal_code, district_type, district_name]

  - name: gp_api_block_group_census_demographics
    description: >
      ACS 2020-2024 5-year estimates for every census block group, one row per
      block_group_geoid, with the columns, margins of error and medians of
      stg_census_acs__geo_estimates. Join a person through
      gp_api_voters.Census_Block_Group_Geoid. Null where the Census suppressed a
      value; there is no sex or gender breakdown.
    columns:
      - name: block_group_geoid
        description: >
          12-character block group geoid (state, county, tract, block group);
          Connecticut uses planning-region county codes
        data_tests:
          - unique
          - not_null
      - name: total_population
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: households
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
