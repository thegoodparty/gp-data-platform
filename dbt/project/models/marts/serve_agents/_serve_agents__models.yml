version: 2

models:
  - name: serve_agent_people
    description: >
      Person-grain HubSpot crosswalk for the Serve product's AI agents.
      Pass-through of the identifier columns of the civics person mart, so the
      Serve credential resolves a contact from its own schema; the person
      mart's name, email and phone columns are deliberately not exposed here.
      One row per gp_person_id, inherited from people.
    columns:
      - name: gp_person_id
        description: "Canonical GoodParty person identifier."
        data_tests:
          - unique
          - not_null
      - name: hs_contact_id
        description: >
          HubSpot contact id, scalar only where the person group carries
          exactly one; null for a group with zero or more than one, so an
          ambiguous person resolves to nothing rather than an arbitrary
          contact.

  - name: serve_agent_constituents
    description: >
      serve_agent_voters plus the people in gp_api_consumer_only_people, under
      the same de-identified, non-partisan columns, read from
      int__l2_nationwide_constituents_w_haystaq, so a Serve agent can reach
      residents who are not registered voters. Consumer-only rows carry
      districts and precinct (placed by area), city, ZIP, census tract and
      block group, and the demographics the commercial file shares with the
      voter file; turnout, registration and Haystaq columns are null. Only
      Michigan has consumer-only rows today.
    columns:
      - name: voter_key
        description: >
          sha2 of LALVOTERID, as in serve_agent_voters. A consumer-only person
          whose LALVOTERID has left the voter file keeps that key; one with no
          LALVOTERID gets the sha2 of 'commercial:' followed by the commercial
          Individual_Id; the prefix keeps it from ever equalling a voter's key.
      - name: is_registered_voter
        description: True when the row comes from the voter file.
      - name: district_source
        description: >
          voter_file for voter rows; for consumer-only rows, the area whose
          voters supplied the district columns (zip_plus_4, census_block,
          census_block_group, census_tract), or null when none matched.

  - name: serve_agent_contact_overlay
    description: >
      The people each Serve organization has uploaded as contacts, from
      gp_api_contact_overlay, keyed by voter_key so an agent can join them to
      serve_agent_constituents. No names, emails or phones.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [organization_slug, voter_key]
    columns:
      - name: organization_slug
        description: The Serve organization that uploaded the contacts.
        data_tests:
          - not_null
      - name: voter_key
        description: >
          serve_agent_constituents' voter_key for a person in
          gp_api_constituents (sha2 of LALVOTERID, else of 'commercial:' and
          the commercial individual_id). For a new person, the sha2 of
          'upload:' followed by the gp-api person id, which no constituent key
          can equal.
        data_tests:
          - not_null
      - name: is_new
        description: >
          True when the person exists only through uploads; they have no row in
          serve_agent_constituents.
      - name: on_uploaded_list
        description: Always true; present so the flag reads clearly where joined.
      - name: has_email
        description: True when an upload supplied an email for the person.

  - name: serve_agent_contact_overlay_dev
    description: >
      serve_agent_contact_overlay over gp_api_contact_overlay_dev (gp-api dev
      Postgres).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [organization_slug, voter_key]
    columns:
      - name: organization_slug
        description: The Serve organization that uploaded the contacts.
        data_tests:
          - not_null
      - name: voter_key
        description: >
          serve_agent_constituents' voter_key for a person in
          gp_api_constituents (sha2 of LALVOTERID, else of 'commercial:' and
          the commercial individual_id). For a new person, the sha2 of
          'upload:' followed by the gp-api person id, which no constituent key
          can equal.
        data_tests:
          - not_null
      - name: is_new
        description: >
          True when the person exists only through uploads; they have no row in
          serve_agent_constituents.
      - name: on_uploaded_list
        description: Always true; present so the flag reads clearly where joined.
      - name: has_email
        description: True when an upload supplied an email for the person.
