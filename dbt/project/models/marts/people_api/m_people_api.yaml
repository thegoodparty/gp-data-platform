version: 2

# Quality gate for the marts gp-api reads through mart_gp_api. Covers the column
# tests below plus the singular row-count/state-coverage test in
# tests/assert_people_api_voter_rowcount_and_state_coverage.sql. Everything is
# severity=error except assert_people_api_voter_affinity_and_ideology_rates,
# which warns: it tracks a modelled distribution that may legitimately move with
# a new Haystaq vintage.
models:
  - name: m_people_api__district
    description: >
      This model creates the district table in the mart layer using the election_api district table.
    columns:
      - name: id
        description: Unique identifier for a district
        data_type: uuid
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('m_election_api__district')
                field: id
      - name: name
        description: Name of the district
        data_type: string
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('m_election_api__district')
                field: l2_district_name
      - name: type
        description: Type of district
        data_type: string
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('m_election_api__district')
                field: l2_district_type

  - name: m_people_api__districtvoter
    config:
      tags: ["monthly"]
    description: >
      This model creates the district voter table in the mart layer using the voter table.
    columns:
      - name: voter_id
        description: Unique identifier for a district voter
        data_type: uuid
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('m_people_api__voter')
                field: id
      - name: district_id
        description: Unique identifier for a district
        data_type: uuid
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('m_people_api__district')
                field: id
      - name: type
        description: Type of district
        data_type: string
        tests:
          - not_null
    data_tests:
      - unique_combination_sampled:
          arguments:
            combination_of_columns:
              - voter_id
              - district_id
            sample_size: 100000
          config:
            severity: error
      - unique_combination_sampled:
          arguments:
            combination_of_columns:
              - voter_id
              - type
            sample_size: 100000
          config:
            severity: error

  - name: m_people_api__voter
    config:
      tags: ["monthly"]
    description: >
      This model creates the voter table in the mart layer using the hubspot data
    columns:
      - name: id
        description: Unique identifier for a voter
        data_type: uuid
        tests:
          - not_null
          - unique
      - name: LALVOTERID
        description: Unique identifier for a voter
        data_type: varchar
        tests:
          - not_null
          - unique
      - name: State
        description: Two-letter state postal code
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ get_us_states_list(include_DC=true, include_US=true) }}"
      - name: Voter_Status
        description: >
          Turnout-propensity bucket for the 2026 General, derived from the
          in-house model probability: Unlikely (<0.25), Unreliable (<0.50),
          Likely (<0.75), Super (>=0.75), Unknown (no score).
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Unlikely
                  - Unreliable
                  - Likely
                  - Super
                  - Unknown
      - name: Voter_Turnout_Probability
        description: >
          In-house modeled turnout probability in [0,1] for the 2026 General;
          null when the voter has no score.
        data_type: double
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
              config:
                where: "Voter_Turnout_Probability is not null"
      - name: Voter_Independent_Affinity
        description: >
          True when the voter shows any signal of independent-leaning behaviour:
          a registration party change within ~4 years, frequent ticket
          splitting, a third-party or crossover primary ballot in 2020/2022/2024,
          a Haystaq score at or above the double-dislike or moderate-third-party
          cut (both cuts are project vars), or a 'Non-Partisan' registration. A
          union of signals, so a voter with no data on a given signal is simply
          not flagged on it and the column is never null. Set membership, not a
          ranking: it carries ~70% of the file, so it filters but cannot order.
        data_type: boolean
        tests:
          - not_null
      - name: hf_ideology_general
        description: >
          Haystaq general-ideology label, passed through from the L2/Haystaq
          source under its source name and with its source values: Conservative,
          Liberal, or Moderate, and null (~40% of voters) where the model is
          undecided. These are the source's own labels and are kept as they
          are, here and downstream; nothing relabels them.
        data_type: string
        tests:
          - accepted_values:
              arguments:
                values:
                  - Conservative
                  - Liberal
                  - Moderate

  - name: m_people_api__district_voter_density
    description: >
      Aggregated, K-anonymized, H3-binned voter residence density per district,
      loaded to election-api Postgres by the sync_election_api DAG. Each row is an H3 cell
      with a voter count and the deterministic H3 cell centroid — never a voter,
      address, or the mean of voter positions. See
      packages/people-api/docs/voter-density-heatmap-handoff.md §3.2 / §7.
    columns:
      - name: district_id
        # No relationships test: district_id comes straight from the bridge, which
        # already asserts this FK, and re-checking it here is a full join of this
        # table against a view that re-executes m_election_api__district.
        description: Unique identifier for a district (== District.id, salted-uuid)
        data_type: uuid
        data_tests:
          - not_null
      - name: resolution
        # No not_null: the value is a literal from the resolution fan-out.
        description: H3 resolution of this row
        data_type: integer
      - name: h3_index
        description: H3 cell index as an opaque string (h3_h3tostring)
        data_type: string
        data_tests:
          - not_null
      - name: lat
        description: H3 cell centroid latitude (deterministic; never a voter position)
        data_type: double
        data_tests:
          - not_null
      - name: lng
        description: H3 cell centroid longitude (deterministic; never a voter position)
        data_type: double
        data_tests:
          - not_null
      - name: voter_count
        description: Number of voters whose residence falls in this cell; always >= K
        data_type: integer
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "{{ var('voter_density_k') }}"
                inclusive: true
      - name: state
        description: Two-letter state postal code (loaded into the "State" USState enum)
        data_type: string
        data_tests:
          - not_null
      - name: updated_at
        # No not_null: the value is current_timestamp().
        description: Mart run time
        data_type: timestamp
    data_tests:
      - unique_combination_sampled:
          arguments:
            combination_of_columns:
              - district_id
              - resolution
              - h3_index
            sample_size: 100000
          config:
            severity: error

  - name: m_people_api__district_voter_density_meta
    description: >
      Voter-density coverage bookkeeping per (district_id, resolution), loaded to
      election-api Postgres by the sync_election_api DAG. The app uses coverage to decide
      whether to render the map and to draw the legend. See handoff §3.3 / §7.
    columns:
      - name: district_id
        # No relationships test: see the density mart's district_id note.
        description: Unique identifier for a district (== District.id)
        data_type: uuid
        data_tests:
          - not_null
      - name: resolution
        # No not_null: the value is a literal from the resolution fan-out.
        description: H3 resolution of this row
        data_type: integer
      - name: coverage
        description: rendered_voters / total_voters ∈ [0, 1]
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      # AUDIT-ONLY from here down. The serve query selects `coverage` and nothing else, so
      # these columns exist to explain a coverage number without a warehouse
      # query. Do not assume the app depends on them.
      - name: min_cell_count
        description: >
          AUDIT. The K (voter_density_k) applied to this build, published so the
          disclosed threshold travels with the data.
        data_type: integer
        data_tests:
          - not_null
      - name: total_voters
        description: >
          AUDIT. The district's voters, the coverage denominator. Identical across
          resolutions: a voter's H3 cell exists at every resolution or at none.
        data_type: integer
        data_tests:
          - not_null
      - name: geocoded_voters
        description: >
          AUDIT. Voters with a usable H3. Also resolution-invariant, since the
          binning filter does not vary by resolution.
        data_type: integer
        data_tests:
          - not_null
      - name: rendered_voters
        description: AUDIT. Sum of voter_count over non-suppressed cells.
        data_type: integer
        data_tests:
          - not_null
      - name: suppressed_cells
        description: AUDIT. Cells dropped by K-anonymity suppression.
        data_type: integer
        data_tests:
          - not_null
      - name: state
        description: Two-letter state postal code (loaded into the "State" USState enum)
        data_type: string
        data_tests:
          - not_null
      - name: updated_at
        # No not_null: the value is current_timestamp().
        description: Mart run time
        data_type: timestamp
    data_tests:
      - unique_combination_sampled:
          arguments:
            combination_of_columns:
              - district_id
              - resolution
            sample_size: 100000
          config:
            severity: error
      # Suppression accounting. Rendered voters come from cells that survived K,
      # which are a subset of the geocoded voters, which are a subset of the
      # district's voters. Pure arithmetic, so it cannot false-positive, and it is
      # the check that catches a coverage numerator and denominator drifting onto
      # different populations.
      - dbt_utils.expression_is_true:
          arguments:
            expression: rendered_voters <= geocoded_voters
      - dbt_utils.expression_is_true:
          arguments:
            expression: geocoded_voters <= total_voters
