version: 2

# DATA-1906 pre-unload gate: run `dbt test --select m_people_api__voter m_people_api__district`
# (all severity=error) before the loader `unload` step. Covers the column tests below plus the
# singular row-count/state-coverage test in
# tests/assert_people_api_voter_rowcount_and_state_coverage.sql. The Airflow DAG (DATA-1913) and
# runbook (DATA-1914) sequence this selection ahead of unload.
models:
  - name: m_people_api__district
    description: >
      This model creates the district table in the mart layer using the election_api district table.
    columns:
      - name: id
        description: Unique identifier for a district
        data_type: uuid
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('m_election_api__district')
                field: id
      - name: name
        description: Name of the district
        data_type: string
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('m_election_api__district')
                field: l2_district_name
      - name: type
        description: Type of district
        data_type: string
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('m_election_api__district')
                field: l2_district_type

  - name: m_people_api__districtvoter
    config:
      tags: ["monthly"]
    description: >
      This model creates the district voter table in the mart layer using the voter table.
    columns:
      - name: voter_id
        description: Unique identifier for a district voter
        data_type: uuid
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('m_people_api__voter')
                field: id
      - name: district_id
        description: Unique identifier for a district
        data_type: uuid
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('m_people_api__district')
                field: id
      - name: type
        description: Type of district
        data_type: string
        tests:
          - not_null
    data_tests:
      - unique_combination_sampled:
          arguments:
            combination_of_columns:
              - voter_id
              - district_id
            sample_size: 100000
          config:
            severity: error
      - unique_combination_sampled:
          arguments:
            combination_of_columns:
              - voter_id
              - type
            sample_size: 100000
          config:
            severity: error

  - name: m_people_api__voter
    config:
      tags: ["monthly"]
    description: >
      This model creates the voter table in the mart layer using the hubspot data
    columns:
      - name: id
        description: Unique identifier for a voter
        data_type: uuid
        tests:
          - not_null
          - unique
      - name: LALVOTERID
        description: Unique identifier for a voter
        data_type: varchar
        tests:
          - not_null
          - unique
      - name: State
        description: Two-letter state postal code
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ get_us_states_list(include_DC=true, include_US=true) }}"
      - name: Voter_Status
        description: >
          Turnout-propensity bucket for the 2026 General, derived from the
          in-house model probability: Unlikely (<0.25), Unreliable (<0.50),
          Likely (<0.75), Super (>=0.75), Unknown (no score).
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Unlikely
                  - Unreliable
                  - Likely
                  - Super
                  - Unknown
      - name: Voter_Turnout_Probability
        description: >
          In-house modeled turnout probability in [0,1] for the 2026 General;
          null when the voter has no score.
        data_type: double
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
              config:
                where: "Voter_Turnout_Probability is not null"

  - name: m_people_api__districtstats
    config:
      tags: ["monthly"]
    description: >
      District statistics aggregating voter demographic data per district.
      Computes bucket distributions for age, homeowner status, education,
      presence of children, and estimated income range for each district.
    columns:
      - name: district_id
        description: Unique identifier for a district (primary key)
        data_type: string
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('m_people_api__district')
                field: id
      - name: updated_at
        description: Timestamp when the statistics were computed
        data_type: timestamp
        data_tests:
          - not_null
      - name: total_constituents
        description: Total number of constituents in the district
        data_type: bigint
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_constituents_with_cell_phone
        description: Number of constituents with a cell phone on file
        data_type: bigint
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: buckets
        description: >
          Struct containing demographic bucket distributions (age, homeowner,
          education, presenceOfChildren, estimatedIncomeRange). Each bucket
          contains arrays of {label, count, percent} structs.
        data_type: struct
        data_tests:
          - not_null
    data_tests:
      - bucket_labels_accepted_values:
          bucket_path: buckets.age
          arguments:
            accepted_values:
              - "18-25"
              - "26-35"
              - "36-50"
              - "51+"
              - "Unknown"
      - bucket_labels_accepted_values:
          bucket_path: buckets.estimatedIncomeRange
          arguments:
            accepted_values:
            - "1k–15k"
            - "15k–25k"
            - "25k–35k"
            - "35k–50k"
            - "50k–75k"
            - "75k–100k"
            - "100k–125k"
            - "125k–150k"
            - "150k–175k"
            - "175k–200k"
            - "200k–250k"
            - "250k+"
            - "Unknown"
      - bucket_labels_accepted_values:
          bucket_path: buckets.education
          arguments:
            accepted_values:
              - "None"
              - "High School Diploma"
              - "Technical School"
              - "Some College"
              - "College Degree"
              - "Graduate Degree"
              - "Unknown"
      - bucket_labels_accepted_values:
          bucket_path: buckets.homeowner
          arguments:
            accepted_values:
              - "Yes"
              - "No"
              - "Unknown"
      - bucket_labels_accepted_values:
          bucket_path: buckets.presenceOfChildren
          arguments:
            accepted_values:
              - "Yes"
              - "No"
              - "Unknown"
      # Verify state-level district stats exist for statewide positions (Governor, US Senate, etc.)
      - state_level_districts_exist:
          arguments:
            district_type: "State"

  - name: m_people_api__districtstats_py
    config:
      tags: ["monthly"]
    tests:
      - dbt_utils.equality:
          arguments:
            compare_model: ref('m_people_api__districtstats')

  - name: m_people_api__district_voter_density
    description: >
      Aggregated, K-anonymized, H3-binned voter residence density per district,
      loaded to people-api green."DistrictVoterDensity". Each row is an H3 cell
      with a voter count and the deterministic H3 cell centroid — never a voter,
      address, or the mean of voter positions. See
      packages/people-api/docs/voter-density-heatmap-handoff.md §3.2 / §7.
    columns:
      - name: district_id
        # No relationships test: district_id comes straight from the bridge, which
        # already asserts this FK, and re-checking it here is a full join of this
        # table against a view that re-executes m_election_api__district.
        description: Unique identifier for a district (== District.id, salted-uuid)
        data_type: uuid
        data_tests:
          - not_null
      - name: resolution
        # No not_null: the value is a literal from the resolution fan-out.
        description: H3 resolution of this row
        data_type: integer
      - name: h3_index
        description: H3 cell index as an opaque string (h3_h3tostring)
        data_type: string
        data_tests:
          - not_null
      - name: lat
        description: H3 cell centroid latitude (deterministic; never a voter position)
        data_type: double
        data_tests:
          - not_null
      - name: lng
        description: H3 cell centroid longitude (deterministic; never a voter position)
        data_type: double
        data_tests:
          - not_null
      - name: voter_count
        description: Number of voters whose residence falls in this cell; always >= K
        data_type: integer
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "{{ var('voter_density_k') }}"
                inclusive: true
      - name: state
        description: Two-letter state postal code (loaded into the "State" USState enum)
        data_type: string
        data_tests:
          - not_null
      - name: updated_at
        # No not_null: the value is current_timestamp().
        description: Mart run time
        data_type: timestamp
    data_tests:
      - unique_combination_sampled:
          arguments:
            combination_of_columns:
              - district_id
              - resolution
              - h3_index
            sample_size: 100000
          config:
            severity: error

  - name: m_people_api__district_voter_density_meta
    description: >
      Voter-density coverage bookkeeping per (district_id, resolution), loaded to
      people-api green."DistrictVoterDensityMeta". The app uses coverage to decide
      whether to render the map and to draw the legend. See handoff §3.3 / §7.
    columns:
      - name: district_id
        # No relationships test: see the density mart's district_id note.
        description: Unique identifier for a district (== District.id)
        data_type: uuid
        data_tests:
          - not_null
      - name: resolution
        # No not_null: the value is a literal from the resolution fan-out.
        description: H3 resolution of this row
        data_type: integer
      - name: coverage
        description: rendered_voters / total_voters ∈ [0, 1]
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: min_cell_count
        description: The K (voter_density_k) used for this build
        data_type: integer
        data_tests:
          - not_null
      - name: total_voters
        description: >
          The district's voters. Identical across resolutions (a voter's H3 cell
          exists at every resolution or at none); published per resolution because
          the app reads it keyed by (district, resolution) alongside coverage.
        data_type: integer
        data_tests:
          - not_null
      - name: geocoded_voters
        description: Voters with a usable H3 at this resolution
        data_type: integer
        data_tests:
          - not_null
      - name: rendered_voters
        description: Sum of voter_count over non-suppressed cells
        data_type: integer
        data_tests:
          - not_null
      - name: suppressed_cells
        description: Cells dropped by K-anonymity suppression
        data_type: integer
        data_tests:
          - not_null
      - name: state
        description: Two-letter state postal code (loaded into the "State" USState enum)
        data_type: string
        data_tests:
          - not_null
      - name: updated_at
        description: Mart run time
        data_type: timestamp
        data_tests:
          - not_null
    data_tests:
      - unique_combination_sampled:
          arguments:
            combination_of_columns:
              - district_id
              - resolution
            sample_size: 100000
          config:
            severity: error
