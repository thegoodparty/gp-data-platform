[project]
name = "dbt-goodparty"
version = "0.1.0"
description = "Data warehouse for GoodParty.org"
authors = [
    { name = "Data Engineering at GoodParty" },
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.5,<4.0.0",
    "requests>=2.34.2,<3.0.0",
    "pyspark>=4.2.0,<5.0.0",
    "paramiko>=5.0.0,<6.0.0",
    "boto3>=1.43.72,<2.0.0",
    "apache-airflow==3.3.1",
    "google-genai>=2.16.0,<3.0.0",
    "tqdm>=4.70.0,<5.0.0",
    "databricks-sql-connector>=4.4.0,<5.0.0",
    "databricks-sdk>=0.128.0,<0.129.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "mypy>=2.3.0",
    # The serialization layer pandas UDFs actually cross. Lets tests assert that a
    # normalized record survives the conversion to its declared Spark schema.
    "pyarrow>=21.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF002", "RUF001"]

[tool.ruff.lint.per-file-ignores]
# dbt model scripts run on Databricks where `dbutils` is an injected runtime global.
"project/models/**/*.py" = ["F821"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
# mypy only type-checks the files passed on the command line (tests/). The model
# scripts under project/models/ are Databricks runtime scripts (pyspark + the
# injected `dbutils` global), not locally type-checkable; they get pulled in only
# as followed imports, so silence errors from followed modules.
follow_imports = "silent"
