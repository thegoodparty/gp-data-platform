version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/dbt"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "18:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    labels:
      - "dependabot"
      - "security"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 2
      semver-patch-days: 2
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "uv"
    directory: "/airflow"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "18:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    labels:
      - "dependabot"
      - "security"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 2
      semver-patch-days: 2
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "pip"
    directory: "/airflow/astro"
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "18:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    labels:
      - "dependabot"
      - "security"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 2
      semver-patch-days: 2
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "uv"
    directory: "/analytics"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "18:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    labels:
      - "dependabot"
      - "security"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 2
      semver-patch-days: 2
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "uv"
    directory: "/matcha"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "18:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    labels:
      - "dependabot"
      - "security"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 2
      semver-patch-days: 2
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "uv"
    directory: "/reverse-etl"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "18:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    labels:
      - "dependabot"
      - "security"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 2
      semver-patch-days: 2
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        patterns:
          - "*"
        update-types:
          - "major"

  # Minor and patch only: gold-match/pyproject.toml holds its ceilings on purpose
  # (relaxing them is client-PR work), and the two eval-critical SDKs stay on
  # omni's exact minors. update-types ignores apply to version updates only, so
  # security fixes still come through.
  - package-ecosystem: "uv"
    directory: "/gold-match"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "18:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    labels:
      - "dependabot"
      - "security"
    cooldown:
      semver-minor-days: 2
      semver-patch-days: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "google-genai"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "braintrust"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
