    branches: [main]
    paths: ['reverse-etl/**', '.github/workflows/reverse-etl.yml', '.github/workflows/uv-subproject.yml']
jobs:
  test:
    uses: ./.github/workflows/uv-subproject.yml
    with:
      directory: reverse-etl
      mypy-targets: src
