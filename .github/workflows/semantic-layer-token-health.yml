name: semantic-layer-token-health
# The governance gate's accountability rests on two secrets: ORG_READ_TOKEN (the
# composition check reads team membership with it) and SLACK_APP_BOT_TOKEN (the
# publish job announces every governed merge to #data-alignment). Both workflows
# skip cleanly when their token is missing, so a revoked or expired token, or a
# bot removed from the channel, would silently disable the gate's visibility with
# no error anywhere. This heartbeat exercises both tokens on a schedule and shouts
# if either is unhealthy or nearing expiry, so a dead integration cannot rot
# unnoticed. It fails the run on a hard problem (so GitHub notifies watchers even
# when Slack itself is the dead integration and cannot self-report).
on:
  schedule:
    - cron: '0 15 * * 1'   # Mondays 15:00 UTC (~7-8am PT)
  workflow_dispatch: {}

permissions:
  contents: read

env:
  SLACK_CHANNEL: C08K22X9ZNH   # #data-alignment
  SLACK_OWNER_DM: U085CFQ96BG  # the semantic-layer owner, for warnings-only runs
  EXPIRY_WARN_DAYS: '7'        # warn when a token expires within this many days

jobs:
  token-health:
    runs-on: ubuntu-latest
    steps:
      - name: Exercise governance tokens
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          SLACK_APP_BOT_TOKEN: ${{ secrets.SLACK_APP_BOT_TOKEN }}
        run: |
          # No `set -e`: collect every problem in one run rather than exit on the
          # first. pipefail still surfaces failures inside pipes.
          set -o pipefail
          problems=()
          warnings=()

          # --- ORG_READ_TOKEN: make the exact team-membership call the gate uses ---
          if [ -z "${GH_TOKEN:-}" ]; then
            problems+=("ORG_READ_TOKEN is not set. The composition check cannot read team membership, so approval coverage is always reported as incomplete.")
          else
            hdrs="$(mktemp)"
            if gh api -i "orgs/thegoodparty/teams/semantic-layer-data/members" >"$hdrs" 2>/dev/null; then
              # Fine-grained / expiring PATs return this header; a classic
              # never-expiring token omits it, in which case there is nothing to
              # warn about.
              exp="$(grep -i '^github-authentication-token-expiration:' "$hdrs" | sed -E 's/^[^:]+:[[:space:]]*//' | tr -d '\r')"
              if [ -n "$exp" ]; then
                # GNU date on the ubuntu runner parses the header timestamp
                # ("YYYY-MM-DD HH:MM:SS UTC" or "... +0000") directly.
                exp_epoch="$(date -d "$exp" +%s 2>/dev/null || true)"
                if [ -n "$exp_epoch" ]; then
                  days=$(( (exp_epoch - $(date -u +%s)) / 86400 ))
                  if [ "$days" -le "${EXPIRY_WARN_DAYS}" ]; then
                    warnings+=("ORG_READ_TOKEN expires in ${days} day(s) (on ${exp}). Rotate it before it lapses or the composition check goes dark.")
                  fi
                fi
              fi
            else
              problems+=("ORG_READ_TOKEN cannot read team membership (revoked, expired, or missing the org read scope).")
            fi
            rm -f "$hdrs"
          fi

          # --- SLACK_APP_BOT_TOKEN: validate the token, then confirm the bot is
          # still in the announcement channel (a valid token alone does not prove
          # it can post there). ---
          if [ -z "${SLACK_APP_BOT_TOKEN:-}" ]; then
            problems+=("SLACK_APP_BOT_TOKEN is not set. Governed merges cannot be announced in #data-alignment, which is the gate's only enforcement.")
          else
            auth="$(curl -sS -X POST https://slack.com/api/auth.test -H "Authorization: Bearer $SLACK_APP_BOT_TOKEN")"
            if ! echo "$auth" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("ok") else 1)'; then
              err="$(echo "$auth" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("error","unknown"))')"
              problems+=("SLACK_APP_BOT_TOKEN failed auth.test (error: ${err}). Merge announcements will not post.")
            else
              # Three outcomes, not two. The probe used to collapse "the API call
              # failed" into "the bot is not a member", which is a different claim
              # and was the wrong one: this check reported the bot missing from
              # #data-alignment every Monday from 2026-08-24 onward while that same
              # bot posted the announcements for #1046, #1067 and #1073 there, and
              # posted this very alert into the channel it called itself absent
              # from. Five weeks of a false alarm is how a monitor stops being read.
              info="$(curl -sS "https://slack.com/api/conversations.info?channel=${SLACK_CHANNEL}" -H "Authorization: Bearer $SLACK_APP_BOT_TOKEN")"
              # `is_member` present and False is the only confirmed-absent signal.
              # Testing it for truthiness alone would read an omitted field as a
              # removal, which is this check's original bug on a different input.
              member="$(echo "$info" | python3 -c 'import json,sys; im=json.load(sys.stdin).get("channel",{}).get("is_member"); print("yes" if im else "no" if im is False else "unknown")')"
              case "$member" in
                yes) ;;
                no)
                  # Definitive: the API answered and said the bot is not in there.
                  problems+=("The Slack bot is not a member of #data-alignment (${SLACK_CHANNEL}). Re-invite it or announcements will silently fail.")
                  ;;
                *)
                  info_err="$(echo "$info" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("error") or "ok, but no is_member field in the response")' 2>/dev/null || echo "unparseable response")"
                  if [ "$info_err" = "channel_not_found" ]; then
                    # Not an ambiguous failure. A private channel reports a bot it
                    # has lost as channel_not_found rather than is_member: false,
                    # so downgrading this to a warning would hide the very removal
                    # this check exists for. A wrong channel id lands here too, and
                    # is equally worth failing on.
                    problems+=("The Slack bot cannot see #data-alignment (${SLACK_CHANNEL}): conversations.info returned channel_not_found. Either it was removed from a private channel or the channel id is wrong. Announcements will silently fail.")
                  else
                    # Could not determine. A failed read is not evidence of a failed
                    # integration, so this warns rather than failing the run — the
                    # token itself is exercised by auth.test above, and the posting
                    # path by every governed merge. Names the Slack error so the
                    # usual cause, a missing channels:read / groups:read scope on
                    # the bot token, is actionable rather than guesswork.
                    warnings+=("Cannot read #data-alignment (${SLACK_CHANNEL}) membership: conversations.info returned '${info_err}'. Membership is unverified — this does NOT mean the bot was removed. If the error is missing_scope, grant the bot groups:read (#data-alignment is a private channel) so this check can do its job.")
                  fi
                  ;;
              esac
            fi
          fi

          # --- report ---
          if [ ${#problems[@]} -eq 0 ] && [ ${#warnings[@]} -eq 0 ]; then
            echo "Governance tokens healthy."
            exit 0
          fi

          msg="Semantic-layer governance token health check found issues:"
          for p in "${problems[@]}"; do msg="${msg}"$'\n'"- [PROBLEM] ${p}"; done
          for w in "${warnings[@]}"; do msg="${msg}"$'\n'"- [WARNING] ${w}"; done
          echo "$msg"

          # Route by severity. A PROBLEM goes to the channel, where the review
          # groups can see it. A warnings-only run goes to the owner's DM instead:
          # this check posted the same warning into #data-alignment every week for
          # over a month, and a channel that cries wolf weekly is one where the
          # next real PROBLEM gets scrolled past too. Quieting the routine case is
          # what keeps the loud case loud.
          if [ ${#problems[@]} -gt 0 ]; then
            alert_target="$SLACK_CHANNEL"
          else
            alert_target="$SLACK_OWNER_DM"
          fi

          # Best-effort Slack alert. Only lands if the Slack token itself is
          # healthy; when Slack is the broken integration, the job failure below
          # is the signal instead.
          if [ -n "${SLACK_APP_BOT_TOKEN:-}" ]; then
            posted="$(curl -sS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_APP_BOT_TOKEN" \
              -H "Content-type: application/json; charset=utf-8" \
              --data "$(MSG="$msg" CH="$alert_target" python3 -c 'import json,os; print(json.dumps({"channel": os.environ["CH"], "text": os.environ["MSG"]}))')" || true)"
            delivered="$(echo "$posted" | python3 -c 'import json,sys; print("yes" if json.load(sys.stdin).get("ok") else "no")' 2>/dev/null || echo "no")"
            # A DM can be refused for a reason the channel post would not hit — a
            # missing im:write being the obvious one, which is the same class of
            # gap this check exists to report. Fall back rather than lose the
            # alert, and say why it was rerouted.
            if [ "$delivered" != "yes" ] && [ "$alert_target" != "$SLACK_CHANNEL" ]; then
              fallback="$(curl -sS -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer $SLACK_APP_BOT_TOKEN" \
                -H "Content-type: application/json; charset=utf-8" \
                --data "$(MSG="${msg}"$'\n'"(DM to the owner was refused, so this went to the channel instead.)" CH="$SLACK_CHANNEL" python3 -c 'import json,os; print(json.dumps({"channel": os.environ["CH"], "text": os.environ["MSG"]}))')" || true)"
              delivered="$(echo "$fallback" | python3 -c 'import json,sys; print("yes" if json.load(sys.stdin).get("ok") else "no")' 2>/dev/null || echo "no")"
              if [ "$delivered" != "yes" ]; then
                echo "Slack rejected both the owner DM and the channel fallback. Response: ${fallback}"
              fi
            fi
          else
            delivered="no"
          fi

          # Hard problems fail the run so GitHub notifies watchers regardless of
          # Slack. Warnings-only (e.g. impending expiry) surface without failing —
          # but only when they actually reached someone.
          [ ${#problems[@]} -gt 0 ] && exit 1

          # An alert nobody received is not a passing run. Routing warnings to a DM
          # removed the safety net the hard-problem path has, so an undeliverable
          # warning would otherwise vanish weekly behind a green check, which is the
          # precise failure this whole workflow exists to prevent. Failing here puts
          # it back on GitHub, the one channel that still works when Slack does not.
          if [ "${delivered:-no}" != "yes" ]; then
            echo "Could not deliver the warning to Slack; failing so GitHub notifies instead."
            exit 1
          fi
          exit 0
