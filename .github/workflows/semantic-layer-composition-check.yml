name: semantic-layer-composition-check
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # The ratification sidecar is included for the catalog-freshness job below:
    # since DATA-2249 a sidecar-only PR moves the Ratified column in both
    # canonical_metrics.md projections, and that blocking gate has to run or the
    # projection can go stale unchecked. The composition job then also runs on
    # bookkeeping PRs; it only prints coverage, so this costs nothing.
    paths:
      - 'dbt/project/models/**/sem_*.yml'
      - 'analytics/diagnostics/semantic_catalog/config/ratifications.yml'

permissions:
  contents: read
  # write, because the routing job requests the review teams the diff needs.
  # This is what replaced the CODEOWNERS line: CODEOWNERS matches a path, and a
  # sem_*.yml holds all three layers plus display prose in one file.
  pull-requests: write

jobs:
  routing:
    runs-on: ubuntu-latest
    # Advisory, exactly as the CODEOWNERS line it replaces was: it requests
    # review, it never blocks merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The classifier compares the PR's records against the base branch's,
          # so the base commit has to be in the checkout.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: analytics/uv.lock
      - name: Install analytics env
        working-directory: analytics
        run: uv sync --frozen
      - name: Classify the diff into review lanes
        id: lanes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/base "$BASE_SHA"
          LANES=$(cd analytics && PYTHONPATH=diagnostics \
            uv run python -m semantic_catalog.cli --classify-lanes --base-dir /tmp/base)
          echo "lanes=$LANES" >> "$GITHUB_OUTPUT"
          echo "$LANES" | jq -r '.summary // .reason'
      - name: Request the review teams that lane needs
        env:
          # ORG_READ_TOKEN first: the default GITHUB_TOKEN is repo-scoped and
          # cannot always resolve an org team, which comes back as a 422 on a
          # team id rather than as a permission error. Falls back to the default
          # token so the step still runs before that secret is provisioned.
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          LANES: ${{ steps.lanes.outputs.lanes }}
        run: |
          set -euo pipefail
          WANT=$(echo "$LANES" | jq -c '.teams')
          if [ "$WANT" = "[]" ]; then
            echo "No governed layer moved; requesting no review team."
            exit 0
          fi
          # Re-requesting a team that is already a requested reviewer is a 422,
          # so ask only for the ones that are missing. Until this PR's own
          # CODEOWNERS removal reaches main, the base branch's rule still
          # requests both groups on every sem file, and every request here would
          # otherwise fail on that alone.
          HAVE=$(gh api "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" \
                   --jq '[.teams[].slug]' || echo '[]')
          TEAMS=$(jq -cn --argjson want "$WANT" --argjson have "$HAVE" '$want - $have')
          if [ "$TEAMS" = "[]" ]; then
            echo "Already requested: $WANT"
            exit 0
          fi
          # Only ADDS reviewers. A team already requested stays requested and a
          # human who added a reviewer by hand is never removed: the lane says
          # who MUST look, not who may.
          # No `|| echo` here, deliberately. Swallowing the failure would keep
          # this step green, so `failure()` below would be false and the
          # fail-safe would never fire — leaving a governed PR with no reviewer
          # at all, which is the exact gap the fail-safe exists to close. The
          # job's continue-on-error keeps the PR green either way.
          echo "{\"team_reviewers\": $TEAMS}" \
            | gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" --input -
      - name: Fail-safe, request both teams when routing could not classify
        # CODEOWNERS was the unconditional fallback and this job replaced it, so
        # without this a transient runner failure — a network blip on uv sync, a
        # base sha that will not check out, or the request POST itself failing —
        # leaves a governed PR with nobody requested, and `continue-on-error`
        # hides it by reporting the job green. Falling back to both teams is
        # exactly what the removed line did.
        if: failure() || steps.lanes.outputs.lanes == ''
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          echo "::warning::lane routing could not classify this diff; requesting both review teams as the fallback."
          HAVE=$(gh api "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" \
                   --jq '[.teams[].slug]' || echo '[]')
          TEAMS=$(jq -cn --argjson have "$HAVE" \
                    '["semantic-layer-data","semantic-layer-business"] - $have')
          if [ "$TEAMS" = "[]" ]; then
            echo "Both teams already requested."
            exit 0
          fi
          echo "{\"team_reviewers\": $TEAMS}" \
            | gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" --input - \
            || echo "::warning::could not request fallback reviewers; request them by hand."
      - name: Clean up base tree
        if: always()
        run: git worktree remove --force /tmp/base || true

  composition:
    runs-on: ubuntu-latest
    # Soft gate: report, never block. The job always succeeds.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: analytics/uv.lock
      - name: Install analytics env
        working-directory: analytics
        run: uv sync --frozen
      - name: Evaluate approval composition
        id: eval
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Until ORG_READ_TOKEN is provisioned, GH_TOKEN is empty and gh would
          # exit non-zero under set -e. Report conservative coverage and skip,
          # same as the publish workflow's coverage step.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ORG_READ_TOKEN not provisioned; skipping composition check."
            echo 'coverage={"data":false,"business":false}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Count only each reviewer's LATEST review, so a superseded or
          # dismissed approval no longer counts as current coverage.
          APPROVERS=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            --jq 'group_by(.user.login) | map(max_by(.submitted_at)) | map(select(.state=="APPROVED").user.login) | join(",")')
          DATA=$(gh api "orgs/thegoodparty/teams/semantic-layer-data/members" --jq '[.[].login] | join(",")')
          BIZ=$(gh api "orgs/thegoodparty/teams/semantic-layer-business/members" --jq '[.[].login] | join(",")')
          COV=$(cd analytics && APPROVERS="$APPROVERS" DATA="$DATA" BIZ="$BIZ" PYTHONPATH="diagnostics" \
            uv run python -m semantic_catalog.composition)
          echo "coverage=$COV" >> "$GITHUB_OUTPUT"
          echo "Approval coverage: $COV"

  catalog-freshness:
    runs-on: ubuntu-latest
    # Blocking gate: the generated canonical_metrics.md region must be
    # regenerated and committed in the SAME PR that changes a sem_*.yml, so the
    # projection is reviewed in the diff (and main never needs a bot push). A
    # stale region fails the PR. This is a data-consistency check, separate from
    # the soft human-approval signal above.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: analytics/uv.lock
      - name: Install analytics env
        working-directory: analytics
        run: uv sync --frozen
      - name: Check canonical_metrics.md is regenerated
        working-directory: analytics
        env:
          PYTHONPATH: diagnostics
        run: |
          if ! uv run python -m semantic_catalog.cli --check; then
            echo "::error::canonical_metrics.md is out of date. From analytics/, run 'uv run python -m semantic_catalog.cli --write' and commit the result in this PR." >&2
            exit 1
          fi
