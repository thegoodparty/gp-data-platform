name: semantic-layer-composition-check
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # The ratification sidecar is included for the catalog-freshness job below:
    # since DATA-2249 a sidecar-only PR moves the Ratified column in both
    # canonical_metrics.md projections, and that blocking gate has to run or the
    # projection can go stale unchecked. The composition job then also runs on
    # bookkeeping PRs; it only prints coverage, so this costs nothing.
    paths:
      - 'dbt/project/models/**/sem_*.yml'
      - 'analytics/diagnostics/semantic_catalog/config/ratifications.yml'

permissions:
  contents: read
  # write, because the routing job requests the review teams the diff needs.
  # This is what replaced the CODEOWNERS line: CODEOWNERS matches a path, and a
  # sem_*.yml holds all three layers plus display prose in one file.
  pull-requests: write

jobs:
  routing:
    runs-on: ubuntu-latest
    # Advisory, exactly as the CODEOWNERS line it replaces was: it requests
    # review, it never blocks merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The classifier compares the PR's records against the base branch's,
          # so the base commit has to be in the checkout.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: analytics/uv.lock
      - name: Install analytics env
        working-directory: analytics
        run: uv sync --frozen
      - name: Classify the diff into review lanes
        id: lanes
        # A classifier failure must not skip the request: the next step falls
        # back to both teams instead.
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/base "$BASE_SHA"
          LANES=$(cd analytics && PYTHONPATH=diagnostics \
            uv run python -m semantic_catalog.cli --classify-lanes --base-dir /tmp/base)
          echo "lanes=$LANES" >> "$GITHUB_OUTPUT"
          echo "$LANES" | jq -r '.summary // .reason'
      - name: Decide which review teams to request
        id: teams
        # always(): CODEOWNERS was the unconditional fallback and this job
        # replaced it, so a runner failure earlier in the job (a uv sync blip, a
        # base sha that will not check out) must still end in a request.
        if: always()
        env:
          LANES: ${{ steps.lanes.outputs.lanes }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          # The SOP promises a draft asks no review group; ready_for_review
          # re-runs this job, which is when the request belongs.
          if [ "$IS_DRAFT" = "true" ]; then
            echo "Draft PR; requesting no review team until it is marked ready."
            echo 'want=[]' >> "$GITHUB_OUTPUT"
          elif [ -z "$LANES" ]; then
            echo "::warning::lane routing could not classify this diff; requesting both review teams as the fallback."
            echo 'want=["semantic-layer-data","semantic-layer-business"]' >> "$GITHUB_OUTPUT"
          else
            echo "want=$(echo "$LANES" | jq -c '.teams')" >> "$GITHUB_OUTPUT"
          fi
      - name: Request the review teams
        id: request
        if: always() && steps.teams.outcome == 'success'
        env:
          ORG_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          REPO_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          WANT: ${{ steps.teams.outputs.want }}
        run: |
          set -euo pipefail
          if [ "$WANT" = "[]" ]; then
            echo "No governed layer moved; requesting no review team."
            exit 0
          fi
          # Re-requesting a team that is already requested is a 422, so ask only
          # for the missing ones. Only ever ADDS: a reviewer a human added stays.
          HAVE=$(GH_TOKEN="${ORG_TOKEN:-$REPO_TOKEN}" gh api \
                   "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" \
                   --jq '[.teams[].slug]' || echo '[]')
          TEAMS=$(jq -cn --argjson want "$WANT" --argjson have "$HAVE" '$want - $have')
          if [ "$TEAMS" = "[]" ]; then
            echo "Already requested: $WANT"
            exit 0
          fi
          echo "teams=$TEAMS" >> "$GITHUB_OUTPUT"
          request() {
            echo "{\"team_reviewers\": $TEAMS}" \
              | GH_TOKEN="$1" gh api --method POST \
                  "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" --input - >/dev/null
          }
          # ORG_READ_TOKEN can resolve org teams; a 404 from it means the token
          # lacks Pull requests: write on this repo (DATA-2593). The workflow
          # token is the second try: it can write, but may not resolve a team.
          if [ -n "${ORG_TOKEN:-}" ]; then
            if request "$ORG_TOKEN"; then
              echo "Requested $TEAMS."
              exit 0
            fi
            echo "::warning::ORG_READ_TOKEN could not request $TEAMS (a 404 means it lacks Pull requests: write); retrying with the workflow token."
          fi
          if request "$REPO_TOKEN"; then
            echo "Requested $TEAMS with the workflow token."
            exit 0
          fi
          echo "::error::Could not request $TEAMS with either token. Add them as reviewers by hand."
          exit 1
      - name: Say on the PR which teams to add by hand
        # The job is continue-on-error, so a failed request shows as a green
        # check. Without this note the PR simply has no reviewer and nobody
        # notices, which is how the request failed unseen from 10-01 to 11-02.
        if: always() && steps.request.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TEAMS: ${{ steps.request.outputs.teams || steps.teams.outputs.want }}
        run: |
          set -euo pipefail
          MARKER='<!-- semantic-layer-routing -->'
          # One note per PR, not one per push.
          if gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
               --jq '.[].body' | grep -qF "$MARKER"; then
            echo "Note already on the PR."
            exit 0
          fi
          LIST=$(echo "$TEAMS" | jq -r 'map("`" + . + "`") | join(" and ")')
          printf '%s\nReview routing could not request %s automatically. Add them as reviewers by hand when this PR is ready for review.\n' \
            "$MARKER" "$LIST" > /tmp/note.md
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/note.md
      - name: Clean up base tree
        if: always()
        run: git worktree remove --force /tmp/base || true

  composition:
    runs-on: ubuntu-latest
    # Soft gate: report, never block. The job always succeeds.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: analytics/uv.lock
      - name: Install analytics env
        working-directory: analytics
        run: uv sync --frozen
      - name: Evaluate approval composition
        id: eval
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Until ORG_READ_TOKEN is provisioned, GH_TOKEN is empty and gh would
          # exit non-zero under set -e. Report conservative coverage and skip,
          # same as the publish workflow's coverage step.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ORG_READ_TOKEN not provisioned; skipping composition check."
            echo 'coverage={"data":false,"business":false}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Count only each reviewer's LATEST review, so a superseded or
          # dismissed approval no longer counts as current coverage.
          APPROVERS=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            --jq 'group_by(.user.login) | map(max_by(.submitted_at)) | map(select(.state=="APPROVED").user.login) | join(",")')
          DATA=$(gh api "orgs/thegoodparty/teams/semantic-layer-data/members" --jq '[.[].login] | join(",")')
          BIZ=$(gh api "orgs/thegoodparty/teams/semantic-layer-business/members" --jq '[.[].login] | join(",")')
          COV=$(cd analytics && APPROVERS="$APPROVERS" DATA="$DATA" BIZ="$BIZ" PYTHONPATH="diagnostics" \
            uv run python -m semantic_catalog.composition)
          echo "coverage=$COV" >> "$GITHUB_OUTPUT"
          echo "Approval coverage: $COV"

  catalog-freshness:
    runs-on: ubuntu-latest
    # Blocking gate: the generated canonical_metrics.md region must be
    # regenerated and committed in the SAME PR that changes a sem_*.yml, so the
    # projection is reviewed in the diff (and main never needs a bot push). A
    # stale region fails the PR. This is a data-consistency check, separate from
    # the soft human-approval signal above.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: analytics/uv.lock
      - name: Install analytics env
        working-directory: analytics
        run: uv sync --frozen
      - name: Check canonical_metrics.md is regenerated
        working-directory: analytics
        env:
          PYTHONPATH: diagnostics
        run: |
          if ! uv run python -m semantic_catalog.cli --check; then
            echo "::error::canonical_metrics.md is out of date. From analytics/, run 'uv run python -m semantic_catalog.cli --write' and commit the result in this PR." >&2
            exit 1
          fi
