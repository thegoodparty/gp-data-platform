name: semantic-layer-publish
# On merge to main touching a governed sem_*.yml, post a change summary to
# #data-alignment. The ClickUp reference page is refreshed out-of-band via the
# ClickUp MCP (no CI token), matching the omni analytics-governance pattern; the
# in-repo canonical_metrics.md is the source of truth, kept fresh by the
# blocking catalog-freshness PR check.
# DATA-2218: when the governance thread exists (semantic-layer-thread.yml), the
# summary posts as a threaded reply under its anchor.
on:
  push:
    branches: [main]
    # The ratification sidecar is included: since DATA-2249 a sign-off is
    # recorded there, not in the sem_*.yml, so a sem-only filter would let the
    # pending-to-dated edge merge unannounced.
    paths:
      - 'dbt/project/models/**/sem_*.yml'
      - 'analytics/diagnostics/semantic_catalog/config/ratifications.yml'

permissions:
  contents: write        # open the ratification PR branch (never pushes to main)
  pull-requests: write   # DATA-2218: update the thread marker's merged flag

jobs:
  publish:
    runs-on: ubuntu-latest
    # Single source of truth for the #data-alignment channel. The summary post
    # and its thread replies both read this, so they can never target different
    # channels (which would break threading).
    env:
      SLACK_CHANNEL_ID: C08K22X9ZNH
      # DATA-2558: where a summary goes when it is mechanics rather than metric
      # news. Same owner the token-health check DMs its routine warnings to, and
      # where DATA-2422 sends a degrade notice the channel cannot act on.
      SLACK_OWNER_DM: U085CFQ96BG
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: analytics/uv.lock
      - name: Install analytics env
        working-directory: analytics
        run: uv sync --frozen
      - name: Re-derive review coverage for the merged PR
        id: coverage
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Until ORG_READ_TOKEN is provisioned, GH_TOKEN is empty and the gh
          # calls below would fail the job. Record conservative coverage and
          # skip cleanly instead of red-failing the first governed merge.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ORG_READ_TOKEN not provisioned; recording conservative coverage."
            {
              echo 'COV={"data":false,"business":false}'
              echo 'PR_URL=(coverage unavailable until ORG_READ_TOKEN is provisioned)'
            } >> "$GITHUB_ENV"
            exit 0
          fi
          # Cross-run outputs from the composition-check workflow are not
          # available here, so re-derive coverage from the live GitHub API
          # against the PR that introduced this merge commit.
          PR=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // ""')
          if [ -n "$PR" ]; then
            # Count only each reviewer's LATEST review, so a superseded or
            # dismissed approval no longer counts as current coverage.
            # Every call here paginates, and every aggregation happens AFTER the
            # pages are collapsed. Grouping inside --jq would group per page, so
            # "latest review per reviewer" would silently become "latest per
            # reviewer per page" once a PR passes 30 reviews.
            APPROVERS=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
              --jq '.[] | {login: .user.login, state: .state, submitted_at: .submitted_at}' \
              | jq -rs 'group_by(.login) | map(max_by(.submitted_at)) | map(select(.state=="APPROVED").login) | join(",")')
            DATA=$(gh api --paginate "orgs/thegoodparty/teams/semantic-layer-data/members" --jq '.[].login' | paste -sd, -)
            BIZ=$(gh api --paginate "orgs/thegoodparty/teams/semantic-layer-business/members" --jq '.[].login' | paste -sd, -)
            COV=$(cd analytics && APPROVERS="$APPROVERS" DATA="$DATA" BIZ="$BIZ" PYTHONPATH="diagnostics" \
              uv run python -m semantic_catalog.composition)
            PR_URL="https://github.com/$REPO/pull/$PR"
            echo "PR_NUM=$PR" >> "$GITHUB_ENV"
          else
            # No PR found for this commit (e.g. a direct push to main): fall
            # back to the conservative "incomplete" default rather than
            # guessing at approval state.
            COV='{"data":false,"business":false}'
            PR_URL="(direct push to main — no PR)"
          fi
          echo "COV=$COV" >> "$GITHUB_ENV"
          echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"
      - name: Prepare base tree for diffing
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git worktree add --detach /tmp/base "$BEFORE"
          fi
      - name: Build Slack change summary
        working-directory: analytics
        env:
          PYTHONPATH: diagnostics
          # Lets the summary say when a metric is merging while its declared
          # instrument is dormant. ORG_READ_TOKEN is the fallback and, verified
          # 2026-09-28, already carries contents read on omni — so no dedicated
          # OMNI_READ_TOKEN is needed. The named secret stays first so one can
          # be provisioned later (a narrower token, or after a rotation) without
          # touching this file. If both fail, the read degrades to the owner DM.
          OMNI_READ_TOKEN: ${{ secrets.OMNI_READ_TOKEN || secrets.ORG_READ_TOKEN }}
          # The gh fallback is for a laptop run. In Actions gh is authed to this
          # repo only, so attempting it would fail slower and report a murkier
          # reason than "the token is not set".
          OMNI_EVIDENCE_NO_GH: '1'
          # When that read cannot run, the summary stays silent about it and the
          # owner is DM'd instead (SLACK_OWNER_DM, job env). The channel is for
          # metric news; a token the review groups cannot provision is not that.
          SLACK_APP_BOT_TOKEN: ${{ secrets.SLACK_APP_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -d /tmp/base ]; then
            uv run python -m semantic_catalog.cli --emit-slack /tmp/slack.txt --base-dir /tmp/base --pr-url "$PR_URL" --coverage "$COV"
          else
            uv run python -m semantic_catalog.cli --emit-slack /tmp/slack.txt --pr-url "$PR_URL" --coverage "$COV"
          fi
      - name: Decide who hears about this merge
        # DATA-2558: mechanics merges (seals, sidecar schema, routing, the
        # catalog generator) posted summaries shaped like metric news, which
        # teaches the channel it is noise. Route by what actually moved.
        id: route
        working-directory: analytics
        env:
          PYTHONPATH: diagnostics
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Only a real classification can justify suppressing a post, so with
          # no base tree LANES stays empty and the route falls back to the
          # channel rather than reading "cannot tell" as "nothing moved".
          LANES=""
          if [ -d /tmp/base ]; then
            LANES=$(uv run python -m semantic_catalog.cli --classify-lanes --base-dir /tmp/base)
          fi
          # PR_NUM is only exported when ORG_READ_TOKEN is provisioned, so
          # re-derive it here off the workflow's own token; the label read must
          # not depend on a secret that may be absent.
          PR="${PR_NUM:-$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // ""')}"
          MECHANICS_LABEL=false
          if [ -n "$PR" ] && gh api "repos/$REPO/pulls/$PR" --jq '.labels[].name' | grep -qx 'governance:mechanics'; then
            MECHANICS_LABEL=true
          fi
          ROUTE=$(LANES="$LANES" MECHANICS_LABEL="$MECHANICS_LABEL" uv run python -m semantic_catalog.notices)
          echo "route: $ROUTE"
          {
            echo "target=$(echo "$ROUTE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["target"])')"
            echo "reason=$(echo "$ROUTE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reason"])')"
          } >> "$GITHUB_OUTPUT"
      - name: Read governance thread marker
        # DATA-2218: recover the anchor ts written at PR-open so the merge
        # summary lands as a threaded reply. Empty marker => top-level post
        # (the pre-thread behavior is the permanent fallback).
        if: ${{ env.PR_NUM != '' }}
        working-directory: analytics
        env:
          PYTHONPATH: diagnostics
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run python -m semantic_catalog.thread --emit-marker /tmp/marker.json --pr "$PR_NUM"
          {
            echo "SLACK_THREAD_TS=$(python3 -c 'import json;print(json.load(open("/tmp/marker.json")).get("ts",""))')"
            echo "MARKER_MERGED=$(python3 -c 'import json;print(str(json.load(open("/tmp/marker.json")).get("merged",False)).lower())')"
          } >> "$GITHUB_ENV"
          # The marker pins the channel the anchor was posted to. Honor it here
          # (overriding the job-level SLACK_CHANNEL_ID default for the
          # remaining steps) so a mid-PR #data-alignment channel change never
          # splits the merge-summary reply from its anchor thread.
          MARKER_CHANNEL=$(python3 -c 'import json;print(json.load(open("/tmp/marker.json")).get("channel",""))')
          if [ -n "$MARKER_CHANNEL" ]; then
            echo "SLACK_CHANNEL_ID=$MARKER_CHANNEL" >> "$GITHUB_ENV"
          fi
      - name: Post Slack change summary
        # DATA-2558: `skip` means the merge moved no metric's rule and no
        # metric's build, so there is nothing to tell anyone.
        if: ${{ steps.route.outputs.target != 'skip' }}
        env:
          SLACK_APP_BOT_TOKEN: ${{ secrets.SLACK_APP_BOT_TOKEN }}
          ROUTE_TARGET: ${{ steps.route.outputs.target }}
          ROUTE_REASON: ${{ steps.route.outputs.reason }}
        run: |
          set -euo pipefail
          # SLACK_APP_BOT_TOKEN was provisioned and live-verified 2026-07-28.
          # The empty-token guard below is a deliberate graceful-degrade seam
          # (e.g. fork PRs, which don't get repo secrets), not a provisioning
          # gap — keep it so a missing secret skips cleanly instead of
          # red-failing the job.
          if [ -z "${SLACK_APP_BOT_TOKEN:-}" ]; then
            echo "SLACK_APP_BOT_TOKEN not provisioned; skipping Slack notification."
            exit 0
          fi
          if [ "${MARKER_MERGED:-false}" = "true" ]; then
            echo "Thread already marked merged; skipping duplicate merge post."
            exit 0
          fi
          RESP=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_APP_BOT_TOKEN" \
            -H "Content-type: application/json; charset=utf-8" \
            --data "$(python3 -c '
          import json, os
          text = open("/tmp/slack.txt").read()
          if os.environ.get("ROUTE_TARGET") == "owner":
              # DATA-2558: the label downgrades the summary to a DM rather than
              # deleting it, so a mechanics claim stays checkable. No thread_ts:
              # the anchor ts belongs to the channel, not to this DM.
              p = {
                  "channel": os.environ["SLACK_OWNER_DM"],
                  "text": "(Not posted to the channel: %s.)\n\n%s" % (os.environ["ROUTE_REASON"], text),
              }
          else:
              p = {"channel": os.environ["SLACK_CHANNEL_ID"], "text": text}
              t = os.environ.get("SLACK_THREAD_TS")
              if t:
                  p["thread_ts"] = t  # DATA-2218: merge summary is a reply under the anchor
          print(json.dumps(p))')")
          # chat.postMessage returns HTTP 200 with {"ok":false} on errors (bad
          # channel, missing scope, auth), so check the body, not just status.
          TS=$(echo "$RESP" | python3 -c 'import json,sys; d=json.load(sys.stdin); d.get("ok") or sys.exit("Slack API error: %s" % d.get("error","unknown")); print(d["ts"])')
          # The merged marker reads this: the anchor's ts when a thread exists,
          # else this post's (pre-thread behavior).
          echo "SLACK_TS=${SLACK_THREAD_TS:-$TS}" >> "$GITHUB_ENV"
      - name: Mark governance thread merged
        # SLACK_TS is only exported once "Post Slack change summary" actually
        # posts (threaded or fallback), so gating on it here guards against
        # publish re-runs double-posting the merge summary, and also skips
        # cleanly when the bot token is absent. Deliberately NOT gated on
        # SLACK_THREAD_TS: when no anchor thread exists, --mark-merged
        # bootstraps a merged marker from this run's post (SLACK_TS /
        # SLACK_CHANNEL_ID env), so even fallback top-level posts are re-run
        # idempotent.
        if: ${{ env.PR_NUM != '' && env.SLACK_TS != '' }}
        working-directory: analytics
        env:
          PYTHONPATH: diagnostics
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run python -m semantic_catalog.thread --mark-merged --pr "$PR_NUM"
      - name: Record the ratifications this merge earned
        # Writes the sidecar + regenerated catalog into the WORKING TREE only.
        # Placed after the thread marker update, not straight after the Slack
        # post: this step exits 1 on a self-verification failure, and between
        # those two steps that would leave the thread unmarked and make a re-run
        # double-post the merge summary.
        if: ${{ env.PR_NUM != '' }}
        working-directory: analytics
        env:
          PYTHONPATH: diagnostics
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
            set -euo pipefail
            if [ -z "${GH_TOKEN:-}" ]; then
              echo "ORG_READ_TOKEN not provisioned; skipping ratification recording."
              exit 0
            fi
            # --paginate emits ONE ARRAY PER PAGE, so a PR with more than 30
            # reviews would write `[...]\n[...]` and break json.loads. Emit one
            # object per line and slurp them into a single array instead.
            # (`gh --slurp` is not usable here: it is rejected with --jq.)
            gh api "repos/$REPO/pulls/$PR_NUM/reviews" --paginate \
              --jq '.[] | {login: .user.login, state: .state, submitted_at: .submitted_at}' \
              | jq -s '.' > /tmp/reviews.json
            # Paginated for the same reason as the reviews call above: a member
            # past position 30 would be missing from the list, could never match
            # an approver, and coverage would read as incomplete forever.
            DATA=$(gh api --paginate orgs/thegoodparty/teams/semantic-layer-data/members --jq '.[].login' | paste -sd, -)
            BIZ=$(gh api --paginate orgs/thegoodparty/teams/semantic-layer-business/members --jq '.[].login' | paste -sd, -)
            # The PR body is where a build sign-off's value_at_signing comes
            # from. CI cannot compute a metric's value, so the author declares
            # it in the body and the recorder reads it back out; a build half
            # with no declared value is skipped and says so.
            gh api "repos/$REPO/pulls/$PR_NUM" --jq '.body // ""' > /tmp/pr-body.md
            ARGS=(--record-ratifications --reviews /tmp/reviews.json \
                  --data-members "$DATA" --business-members "$BIZ" \
                  --pr-number "$PR_NUM" --pr-body /tmp/pr-body.md \
                  --emit-recorded /tmp/recorded.json --emit-pr-body /tmp/ratify-body.md)
            if [ -d /tmp/base ]; then ARGS+=(--base-dir /tmp/base); fi
            uv run python -m semantic_catalog.cli "${ARGS[@]}"
      - name: Open the ratification PR
        # Branch is keyed on the source PR so a workflow re-run updates the same
        # branch in place instead of opening a rival PR. Never pushes to main.
        if: ${{ env.PR_NUM != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
            if [ ! -s /tmp/recorded.json ]; then
              echo "nothing recorded; no PR to open."
              exit 0
            fi
            COUNT=$(python3 -c 'import json;print(len(json.load(open("/tmp/recorded.json"))["metrics"]))')
            if [ "$COUNT" = "0" ]; then
              echo "nothing recorded; no PR to open."
              exit 0
            fi
            BRANCH="auto/ratify-pr-${PR_NUM}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"
            git add analytics/diagnostics/semantic_catalog/config/ratifications.yml \
                    '.claude/skills/*/references/canonical_metrics.md'
            git commit -m "Record the ratifications earned by #${PR_NUM}"
            git fetch origin "$BRANCH" || true
            git push --force-with-lease origin "$BRANCH"
            if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // ""')" ]; then
              gh pr create --base main --head "$BRANCH" \
                --title "Record the ratifications earned by #${PR_NUM}" \
                --body-file /tmp/ratify-body.md
            else
              echo "PR for $BRANCH already open; branch updated in place."
            fi
      - name: Clean up base tree
        if: always()
        run: git worktree remove --force /tmp/base || true
