name: gold-match

# Lint/format for gold-match/ is handled repo-wide by pre-commit.yml (ruff).
# This workflow only runs the gold-match unit tests, scoped so it fires solely
# on changes under gold-match/. No mypy step (matcha precedent): the matcher
# and shared/ modules are byte-frozen copies from omni.
on:
  pull_request:
    paths: ['gold-match/**', '.github/workflows/gold-match.yml', '.github/workflows/uv-subproject.yml']
  push:
    branches: [main]
    paths: ['gold-match/**', '.github/workflows/gold-match.yml', '.github/workflows/uv-subproject.yml']
jobs:
  test:
    uses: ./.github/workflows/uv-subproject.yml
    with:
      directory: gold-match
