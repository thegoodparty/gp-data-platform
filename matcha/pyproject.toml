[project]
name = "gp-data-matcha"
version = "0.1.0"
description = "Entity resolution pipeline for multi-source candidacy matching"
requires-python = ">=3.14"
dependencies = [
    "click",
    # Splink 4 drives this DuckDB connection and its own requirement carries no
    # upper bound, so the cap here is what holds off duckdb 2.0 (ENG-11616).
    "duckdb>=1.5.4,<2.0.0",
    "nameparser",
    "pandas>=2.3.1,<4.0.0",
    "pyarrow",
    "splink>=4.0.15,<5.0.0",
    "vl-convert-python>=1.9.0.post1",
    "databricks-sql-connector>=4.4.0,<5.0.0",
    "databricks-sdk>=0.128.0,<1.0.0",
    "rapidfuzz>=3.14.5",
]

[dependency-groups]
dev = [
    "jupyter",
    "matplotlib",
    "pytest",
]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests that require a live Databricks connection",
]
# Suppress harmless warning from altair (transitive dep via splink) about
# deduplicated selection parameters — not actionable in our code.
filterwarnings = [
    "ignore:Automatically deduplicated selection parameter:UserWarning:altair",
]
