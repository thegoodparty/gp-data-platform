# Ratification sign-offs for governed semantic-layer metrics (DATA-2249).
#
# One entry per RATIFIED metric, keyed by its `name` in the sem_*.yml. A metric
# with no entry here is pending; absence is the only way to say pending.
#
# Why this file is not the sem_*.yml: CODEOWNERS covers those, so writing the
# date there re-requests the very reviewers whose approval it records, and forces
# you to write the date before the approval exists. This file is outside that
# glob, so the recorded date can be the real one.
#
# Fields:
#   ratified        UTC date the SECOND review group approved, i.e. the date
#                   coverage completed. Not the date this line was typed.
#   definition_sha  Fingerprint of the definition at sign-off. Get it from
#                   `uv run python -m semantic_catalog.cli --fingerprints`
#                   (run from analytics/ with PYTHONPATH=diagnostics). Copy it
#                   deliberately when recording the sign-off; never restamp it
#                   to silence a stale warning, because that is the warning
#                   doing its job.
#   approved_by_pr  The PR whose approvals this records. Human provenance.
#
# If the definition later changes without a new sign-off, the fingerprint stops
# matching and every projection renders the date as stale.

activated_serve_users:
  # Both groups approved #765, which contained the restatement to the 1,026
  # definition, so the restated definition is what is ratified here. The prior
  # 2026-07-28 date came from #706 and certified the superseded definition.
  ratified: 2026-08-05
  definition_sha: '5e87555'
  approved_by_pr: 765

serve_users:
  # Ratified on #801, which exists to carry this sign-off: the definition merged
  # in #764 with only a bot approval, so neither review group had ever signed it
  # off, and the auto-ratification hook cannot record it (it earns a sign-off
  # only where a definition MOVED in the merge, and this one is unchanged).
  #
  # VERIFY THIS DATE BEFORE MERGING. It was written on 2026-08-11, when #801 was
  # prepared, which is authorship and not approval. If the second group's
  # approval lands on a later day this line is wrong by that much. Run, from
  # analytics/ with PYTHONPATH=diagnostics, to get the real date from the review
  # record:
  #
  #   gh api repos/thegoodparty/gp-data-platform/pulls/801/reviews --paginate \
  #     --jq '.[] | {login: .user.login, state: .state, submitted_at: .submitted_at}' \
  #     | jq -s '.' > /tmp/r801.json
  #   uv run python -c "import json;from semantic_catalog import composition as c;\
  #   print(c.completion_date(json.load(open('/tmp/r801.json')),\
  #   'danpelota,datawithtristan,swain,hhkarimi,sanjayr1'.split(','),\
  #   'swain,amanda847,audrey-gp,JoeGoodParty2'.split(',')))"
  #
  # It prints None while coverage is incomplete, which is itself the signal that
  # this must not merge yet.
  ratified: 2026-08-11
  definition_sha: '0b06710'
  approved_by_pr: 801

win_activated_users:
  # The definition CHANGED on #1073: the outreach terminal union dropped the
  # robocall draft-create event and took on the shared pay-commit event, which
  # moved the metric 1,265 -> 1,260 users. That is a change to what the number
  # counts, so the previous sign-off does not carry over and the fingerprint
  # below is the post-#1073 one.
  #
  # Hand-authored rather than auto-recorded. The publish hook only records a
  # sign-off it can see, and on #1073 it correctly saw none: that PR merged on
  # bot approval alone, with review coverage {data: false, business: false}.
  # This entry exists so the approval can land on something.
  #
  # The `ratified` date below is a PLACEHOLDER. It must be corrected to the day
  # the SECOND group's approval actually lands before this merges, which is the
  # rule every other entry in this file follows.
  #
  # Earlier history, unchanged: coverage first completed across two PRs. The
  # business group approved #708 on 2026-07-29 with no data-group approval, so
  # DATA-2249 dropped that unbacked date to pending; the data group approved
  # #776 on 2026-08-07, which is what the prior record carried.
  ratified: 2026-09-25
  definition_sha: 'c322964'
  approved_by_pr: 1073

win_active_candidates_30d:
  # Re-fingerprinted for a prose edit, not a definition change. #1046 replaced a
  # stale description — it said "2-event dashboard-view union" when the union had
  # had four legs since the era-3 repair — with a pointer to config.meta.anchored_on.
  # The metric's meaning did not move, and neither did any value it produces: the
  # anchored_on block #1046 added declares exactly the four legs the macro already
  # applied. `description` is a fingerprint field, so the sha moved anyway and the
  # catalog has read this metric stale since 2026-09-21.
  #
  # The data group's sign-off is #1046's, given by a member of semantic-layer-data
  # on the PR that made the change. The business group was not asked, deliberately:
  # what the number counts did not change, so there is nothing for that lane to
  # rule on. Recording it here rather than re-collecting an approval for an edit
  # that corrected a document.
  #
  # Original coverage: approved by both groups on #760 and merged but never
  # recorded, which is the failure that prompted DATA-2249.
  ratified: 2026-09-21
  definition_sha: '1213bea'
  approved_by_pr: 1046

win_users:
  # Was recorded as 2026-08-03, the date the line was typed. Coverage actually
