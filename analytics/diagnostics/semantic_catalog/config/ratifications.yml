# Ratification sign-offs for governed semantic-layer metrics (DATA-2249).
#
# One entry per metric with at least one half signed off, keyed by its `name` in
# the sem_*.yml. A metric with no entry here is pending on both halves; absence
# is the only way to say pending.
#
# Why this file is not the sem_*.yml: review routing covers those, so writing the
# date there re-requests the very reviewers whose approval it records, and forces
# you to write the date before the approval exists. This file is outside that
# scope, so the recorded date can be the real one.
#
# TWO HALVES, because a definition has two owners and they go stale separately.
#
#   business:               what the number MEANS. The business group rules on it.
#     approved              UTC date that group's first approval landed.
#     rule_sha              Fingerprint of config.meta.business_rule at sign-off.
#
#   data:                   how the number is COMPUTED, and which events satisfy
#                           the rule. The data group and product analytics own it.
#     approved              UTC date that group's first approval landed.
#     build_sha             Fingerprint of anchored_on + filter + measure + type
#                           + source at sign-off.
#     value_at_signing      What the metric counted that day. REQUIRED. A date
#                           with no number cannot be checked by anyone later, so
#                           the loader refuses the entry without one. It proves
#                           someone looked; it never proves the number is right.
#                           Read it as a snapshot carrying the date it sits with.
#
#   approved_by_pr          The PR whose approvals this records. Human provenance.
#
# Get both fingerprints from `uv run python -m semantic_catalog.cli --fingerprints`
# (run from analytics/ with PYTHONPATH=diagnostics). Copy one deliberately when
# recording a sign-off; never restamp it to silence a stale warning, because that
# is the warning doing its job.
#
# What the seals do NOT cover, stated so nobody reads them as stronger than they
# are: dimensions (declared once per file, so sealing them would expire every
# metric in a file whenever one dimension was added anywhere), and anything
# UPSTREAM of the sem file. A change to how a mart column is computed moves no
# seal at all. The evidence link — a dormant declared event marking a build
# approval as needing re-verification — is the answer to the second one and is
# not built yet.

activated_serve_users:
  # Both groups approved #765, which contained the restatement to the 1,026
  # definition, so the restated definition is what is ratified here. The prior
  # 2026-07-28 date came from #706 and certified the superseded definition.
  #
  # Re-sealed under the two-seal scheme: the build_sha below is a recomputation
  # of the same build over the same fields, NOT a new approval. The rule half is
  # absent because `business_rule` did not exist when this was signed; the words
  # now in the sem file have never been ruled on.
  #
  # value_at_signing was measured 2026-09-25, when the seal changed, not on the
  # approval date above. No number was recorded then, because nothing required
  # one. Every later entry's number will carry its own date.
  data:
    approved: 2026-08-05
    build_sha: '33429b6'
    value_at_signing: 1026
  approved_by_pr: 765

serve_users:
  # Ratified on #801, which exists to carry this sign-off: the definition merged
  # in #764 with only a bot approval, so neither review group had ever signed it
  # off, and the auto-ratification hook cannot record it (it earns a sign-off
  # only where a definition MOVED in the merge, and this one is unchanged).
  #
  # Re-sealed under the two-seal scheme; recomputation, not a new approval. Rule
  # half absent for the same reason as above. value_at_signing measured
  # 2026-09-25.
  data:
    approved: 2026-08-11
    build_sha: 'ea39ab1'
    value_at_signing: 1878
  approved_by_pr: 801

win_activated_users:
  # The build CHANGED on #1073: the outreach terminal union dropped the robocall
  # draft-create event and took on the shared pay-commit event, which moved the
  # metric 1,265 -> 1,260 users. That is a change to what the number counts, so
  # the previous sign-off did not carry over.
  #
  # Hand-authored rather than auto-recorded. The publish hook only records a
  # sign-off it can see, and on #1073 it correctly saw none: that PR merged on
  # bot approval alone, with review coverage {data: false, business: false}.
  #
  # Accepted by the metric owner directly, on the date below. Under the single
  # seal this was an anomaly worth flagging, because the business group was not
  # consulted about a change to what the number counts. Under two seals it is
  # simply a data-half sign-off: which events implement the rule is product
  # analytics and data's lane, and the rule itself did not move.
  #
  # Re-sealed; recomputation, not a new approval. value_at_signing measured
  # 2026-09-25, and it reads 1,264 rather than the 1,260 #1073 measured the same
  # day, which is what a population drifting on its own looks like.
  #
  # Earlier history, unchanged: coverage first completed across two PRs. The
  # business group approved #708 on 2026-07-29 with no data-group approval, so
  # DATA-2249 dropped that unbacked date to pending; the data group approved
  # #776 on 2026-08-07, which is what the prior record carried.
  data:
    approved: 2026-09-25
    build_sha: 'c60317a'
    value_at_signing: 1264
  approved_by_pr: 1073

win_active_candidates_30d:
  # Re-fingerprinted for a prose edit, not a build change. #1046 replaced a
  # stale description — it said "2-event dashboard-view union" when the union had
  # had four legs since the era-3 repair — with a pointer to config.meta.anchored_on.
  # The metric's meaning did not move, and neither did any value it produces.
  #
  # That false staleness is exactly what the two seals fix: `description` is in
  # NEITHER seal now, so the same edit today would move nothing and the catalog
  # would not have read this metric stale for four days.
  #
  # The data group's sign-off is #1046's, given by a member of semantic-layer-data
  # on the PR that made the change.
  #
  # Re-sealed; recomputation, not a new approval. value_at_signing measured
  # 2026-09-25 and reads 919. This is a trailing-30-day window evaluated at build
  # time, so it moves every day on its own; the number below is evidence someone
  # looked at the metric, and is not comparable to a number from another date.
  #
  # Original coverage: approved by both groups on #760 and merged but never
  # recorded, which is the failure that prompted DATA-2249.
  data:
    approved: 2026-09-21
    build_sha: '1eedc0c'
    value_at_signing: 919
  approved_by_pr: 1046

win_users:
  # Was recorded as 2026-08-03, the date the line was typed. Coverage actually
  # completed 2026-08-04 when the data group approved #749.
  #
  # Re-sealed; recomputation, not a new approval. value_at_signing measured
  # 2026-09-25.
  data:
    approved: 2026-08-04
    build_sha: '7d5c217'
    value_at_signing: 63744
  approved_by_pr: 749

# Every rule half is deliberately absent. `business_rule` is drafted for the five
# metrics above in the same change that introduced this scheme, so the words have
# been written but never ruled on. Drafting is not approval, and backdating a
# rule half to the date the old single seal was signed would assert that someone
# approved text that did not exist. They read pending until the business group
# rules on them, which is what that column is for.
#
# goodparty_win_rate and goodparty_cumulative_wins are absent for the older
# reason: both were added pre-epic in #471 with a data-group approval only, and
# no business-group approval exists for either definition.
